"Installing Thimsy": "Instalowanie Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Zachowuje Twoje dane. Tylko gdy na RG Cube działa już GammaOS Next 1.2 lub kompilacja Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Zachowuje Twoje dane. Tylko gdy na urządzeniu działa już zgodna kompilacja Thimsy lub GammaOS."
