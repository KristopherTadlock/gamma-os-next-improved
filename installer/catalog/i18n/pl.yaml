"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "Przy pierwszym uruchomieniu ekran może pozostać pusty nawet przez minutę. To normalne; poczekaj, aż pojawi się ekran uruchamiania."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "Na urządzeniu {device} otwórz Ustawienia, Informacje i dotknij siedem razy Numeru kompilacji. Następnie w Ustawieniach, Opcjach programisty włącz Debugowanie USB i Odblokowanie OEM. Podłącz {device} do tego komputera, gdy jest włączone; uruchomi się ponownie w trybie fastboot na czas instalacji."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "Na urządzeniu {device} otwórz Ustawienia, Informacje i dotknij siedem razy Numeru kompilacji. Następnie w Ustawieniach, Opcjach programisty włącz Debugowanie USB i Odblokowanie OEM. Podłącz {device} do tego komputera, gdy jest włączone; uruchomi się ponownie w trybie fastboot na czas odblokowania."
