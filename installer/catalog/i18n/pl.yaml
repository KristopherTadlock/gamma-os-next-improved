# Polish translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Czysta instalacja usuwa zawartość pamięci wewnętrznej. Skopiuj ROMs, zapisy gier, zrzuty ekranu i wszystko inne, co chcesz zachować, na komputer lub kartę microSD. Gry na karcie microSD pozostaną nietknięte."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Zaakceptuj prośbę o uprawnienia w systemie Windows lub zainstaluj WinUSB za pomocą Zadig."
"Already unlocked: install new firmware": "Już odblokowane: zainstaluj nowe oprogramowanie"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Zrównoważony: RetroArch dla klasycznych systemów oraz emulatory N64, Dreamcast, PSP i DS, ekran główny ES-DE i Brave."
"Building Thimsy for your device": "Tworzenie Thimsy dla Twojego urządzenia"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Utworzono z oficjalnego wydania GammaOS Next 1.2 dla RG Cube, pobranego ze strony GammaOS w serwisie GitHub."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Przed rozpoczęciem naładuj urządzenie do co najmniej 50% i miej pod ręką dołączony kabel."
"Charge the RG Cube": "Naładuj RG Cube"
"Check it's unlocked": "Sprawdź, czy jest odblokowane"
"Check the basics": "Sprawdź podstawy"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Sprawdź przyciski, ekran dotykowy, dźwięk i Wi-Fi, a następnie uruchom grę."
"Check the cable and that the device is still in its flashing mode, then try again.": "Sprawdź kabel i czy urządzenie nadal jest w trybie flashowania, a następnie spróbuj ponownie."
"Checking the USB driver": "Sprawdzanie sterownika USB"
"Checking the build": "Sprawdzanie kompilacji"
"Checking the plan": "Sprawdzanie planu"
"Checking the result": "Sprawdzanie wyniku"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Wybierz obszar roboczy na dysku z większą ilością wolnego miejsca (nie FAT32) lub zwolnij miejsce."
"Confirm on the device": "Potwierdź na urządzeniu"
"Connect the device in download mode": "Podłącz urządzenie w trybie pobierania"
"Copy your games and saves": "Skopiuj gry i zapisy"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Usuń folder „jobs” z obszaru roboczego i utwórz kompilację ponownie; jeśli problem się powtarza, zgłoś go."
"Don't install on units made in March 2026 or later.": "Nie instaluj na urządzeniach wyprodukowanych w marcu 2026 lub później."
"Don't install on units whose stock firmware is v1.26.": "Nie instaluj na urządzeniach z fabrycznym oprogramowaniem w wersji v1.26."
"Downloading": "Pobieranie"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Wszystko: Średni oraz emulatory GameCube/Wii, 3DS, PS2, Xbox i PS Vita i rdzenie o wysokiej dokładności. Pełny zestaw Thimsy 1.0a."
"Finishing": "Kończenie"
"First time installing custom firmware": "Pierwsza instalacja niestandardowego oprogramowania"
"Follow the unlock steps shown in the installer, then continue.": "Wykonaj kroki odblokowania pokazane w instalatorze, a następnie kontynuuj."
"Heavy": "Pełny"
"Hold Volume Down and plug in the cable": "Przytrzymaj przycisk zmniejszania głośności i podłącz kabel"
"Installing Thimsy": "Instalowanie Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Zachowuje Twoje dane. Tylko gdy na RG Cube działa już GammaOS Next 1.2 lub kompilacja Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Zachowuje Twoje dane. Tylko gdy na urządzeniu działa już zgodna kompilacja Thimsy lub GammaOS."
"Light": "Lekki"
"Medium": "Średni"
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Planowane: instalacja przez Qualcomm EDL na każdym komputerze. Jeszcze niedostępne."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Planowane: SP Flash Tool w systemach Windows i Linux. Jeszcze niedostępne."
"Planned: Windows only. Not buildable yet.": "Planowane: tylko Windows. Jeszcze niedostępne."
"Planned: fastboot install on every computer. Not buildable yet.": "Planowane: instalacja przez fastboot na każdym komputerze. Jeszcze niedostępne."
"Planned: microSD card install on every computer. Not buildable yet.": "Planowane: instalacja z karty microSD na każdym komputerze. Jeszcze niedostępne."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Planowane: ta sama metoda flashowania co w RG Cube. Jeszcze niedostępne."
"Preparing the partitions": "Przygotowywanie partycji"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Zainstaluj ponownie Thimsy Installer lub ustaw THIMSY_TOOLS_DIR na folder, który go zawiera."
"Required before flashing; skipping it can brick the device.": "Wymagane przed flashowaniem; pominięcie tego kroku może trwale uszkodzić urządzenie."
"Restarting the device": "Ponowne uruchamianie urządzenia"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Mały pakiet dla klasycznych systemów aż do PlayStation: jeden szybki rdzeń RetroArch na system, ekran główny Minima, bez shaderów."
"The RG Cube is unlocked once, with the steps from GammaOS Next's installation guide (the Unisoc T820 section). The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "RG Cube odblokowuje się jeden raz, zgodnie z krokami z przewodnika instalacji GammaOS Next (sekcja Unisoc T820). Instalator sam nie uruchamia tego narzędzia. Postępuj zgodnie z przewodnikiem, a potem wróć i kontynuuj."
"The file is damaged or a different version. Delete it and download again.": "Plik jest uszkodzony lub pochodzi z innej wersji. Usuń go i pobierz ponownie."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Pierwsze uruchomienie trwa kilka minut, ponieważ Thimsy konfiguruje emulatory. Nie wyłączaj urządzenia."
"The installer sends the unlock command; confirm it on the device with Volume Up.": "Instalator wysyła polecenie odblokowania; potwierdź je na urządzeniu przyciskiem zwiększania głośności."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Profil {profile} nie został jeszcze opublikowany. Wybierz profil oznaczony jako dostępny."
"Turn the RG Cube off. Hold Volume Down and connect the USB cable to this computer. Keep holding until installation starts. The screen stays black; that's normal.": "Wyłącz RG Cube. Przytrzymaj przycisk zmniejszania głośności i podłącz kabel USB do tego komputera. Trzymaj, aż rozpocznie się instalacja. Ekran pozostaje czarny; to normalne."
"Unlock in fastboot": "Odblokuj w trybie fastboot"
"Unlock with GammaOS's own steps": "Odblokuj według instrukcji GammaOS"
"Unpacking the firmware": "Rozpakowywanie oprogramowania"
"Use a Windows PC": "Użyj komputera z systemem Windows"
"Use the firmware version the catalog lists for this device.": "Użyj wersji oprogramowania podanej w katalogu dla tego urządzenia."
"Use the volume keys to choose Unlock, then press Power.": "Przyciskami głośności wybierz „Unlock”, a następnie naciśnij przycisk zasilania."
"Wait for the first boot": "Poczekaj na pierwsze uruchomienie"
"When the device shows LOCK FLAG IS: UNLOCK, it's unlocked. Turn it off and continue.": "Gdy urządzenie wyświetli LOCK FLAG IS: UNLOCK, jest odblokowane. Wyłącz je i kontynuuj."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Twoje urządzenie {device} ma już niestandardowe oprogramowanie (było wcześniej odblokowane). Odblokowanie zostanie pominięte."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Twoje urządzenie {device} ma oryginalne oprogramowanie. Instalator wykona czystą instalację, która wymaże urządzenie."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Twoje urządzenie {device} nadal ma oryginalne oprogramowanie. Instalator przeprowadzi Cię przez odblokowanie, a następnie wykona czystą instalację, która wymaże urządzenie."
"needs Android API {n}": "wymaga Android API {n}"
"needs Vulkan": "wymaga Vulkan"
"needs an ARMv8.2 CPU": "wymaga procesora ARMv8.2"
"needs {n} GB RAM": "wymaga {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "Nie można zainstalować {device} z systemu {host}. Uruchom Thimsy Installer na komputerze z systemem Windows, aby go zainstalować."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} instaluje się za pomocą PhoenixSuit firmy Allwinner, który działa tylko w systemie Windows. Uruchom Thimsy Installer na komputerze z systemem Windows, aby go zainstalować."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} instaluje się za pomocą SP Flash Tool firmy MediaTek, który nie działa w systemie {host}. Uruchom Thimsy Installer na komputerze z systemem Windows, aby go zainstalować."
"{device} isn't supported by this version of the installer yet.": "{device} nie jest jeszcze obsługiwane przez tę wersję instalatora."
