"Preparing partitions": "Przygotowywanie partycji"
"Preparing the partitions": "Przygotowywanie partycji"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Włóż kartę do urządzenia {device} i włącz je. Thimsy działa z karty i nie narusza pamięci wewnętrznej urządzenia {device}: aby wrócić do oryginalnego systemu, wyłącz je i wyjmij kartę."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Zainstaluj ponownie Thimsy Installer: jego narzędzie do flashowania nie jest w oczekiwanej wersji."
"Reinstall Thimsy Installer: one of its tools is missing.": "Zainstaluj ponownie Thimsy Installer: brakuje jednego z jego narzędzi."
"Repeat the download-mode steps and keep holding the button until installing starts, then try again.": "Powtórz kroki trybu pobierania i trzymaj przycisk, aż rozpocznie się instalacja, a następnie spróbuj ponownie."
"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "Powtórz kroki trybu pobierania, a następnie spróbuj ponownie. Jeśli urządzenie nadal nie zostanie znalezione, sprawdź w Menedżerze urządzeń, czy Unisoc download mode używa sterownika WinUSB."
"Repeat the download-mode steps, then try again. If it still isn't found, unplug the cable, plug it into another USB port and try again.": "Powtórz kroki trybu pobierania, a następnie spróbuj ponownie. Jeśli urządzenie nadal nie zostanie znalezione, odłącz kabel, podłącz go do innego portu USB i spróbuj ponownie."
"Restart into fastbootd": "Uruchom ponownie w trybie fastbootd"
"Restart with Power": "Uruchom ponownie przyciskiem zasilania"
"Restarting the device": "Ponowne uruchamianie urządzenia"
