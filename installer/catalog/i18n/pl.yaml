"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "Instrukcja GammaOS ostrzega, że wgranie oprogramowania na urządzenie {device} bez wcześniejszego odblokowania trwale je uszkodzi. Po odblokowaniu {device} uruchomi się ponownie w swoim oryginalnym Androidzie. Poczekaj, aż Android się uruchomi, a następnie kontynuuj."
"Heavy": "Pełny"
"Hold Back and plug in the cable": "Przytrzymaj Wstecz i podłącz kabel"
"Hold Back and the Anbernic button, then plug in": "Przytrzymaj Wstecz i przycisk Anbernic, a potem podłącz"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Przytrzymaj przycisk zasilania, aby wyłączyć {device}. Przytrzymaj oba przyciski głośności i, nadal je trzymając, podłącz kabel USB. Następnie, wciąż trzymając przyciski głośności, naciskaj raz po raz przycisk zasilania, aż rozpocznie się instalacja."
"Hold both volume buttons and plug in the cable": "Przytrzymaj oba przyciski głośności i podłącz kabel"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Przytrzymaj jednocześnie przycisk Wstecz, przycisk zmniejszania głośności i przycisk zasilania, aż instalacja rozpocznie się ponownie."
