"Importing {file}": "Importowanie pliku {file}"
"In Android Settings, Storage, check whether the {device} has 128 GB or 256 GB. Each size needs its own layout, and installing the wrong one can brick the {device}.": "W Androidzie, w Ustawieniach, Pamięci, sprawdź, czy {device} ma 128 GB czy 256 GB. Każda pojemność wymaga własnego układu, a zainstalowanie niewłaściwego może trwale uszkodzić {device}."
"In Settings, Handheld Settings, About Device, Device Information, note the first four characters of the SN (MQ65 or MQ66). Each hardware revision needs its own firmware.": "W Ustawieniach, Ustawieniach konsoli, Informacjach o urządzeniu, Danych urządzenia zapisz pierwsze cztery znaki numeru SN (MQ65 lub MQ66). Każda wersja sprzętu wymaga własnego oprogramowania."
"Inside the device pack.": "Wewnątrz pakietu urządzenia."
