"Saturn": "Saturn"
"Saturn (accurate)": "Saturn (dokładny)"
"ScummVM": "ScummVM"
"Shattered Pixel Dungeon (pack-in game)": "Shattered Pixel Dungeon (gra w zestawie)"
"Slide it open, hold Back and plug in": "Rozsuń urządzenie, przytrzymaj Wstecz i podłącz"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Mały pakiet dla klasycznych systemów aż do PlayStation: jeden szybki rdzeń RetroArch na system, ekran główny Minima, bez shaderów."
"Start from the microSD card": "Uruchom z karty microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Wyjmij z urządzenia {device} wszystkie inne karty microSD, włóż kartę Thimsy i włącz je. Thimsy działa z karty i nie narusza pamięci wewnętrznej: aby wrócić do oryginalnego systemu, wyłącz urządzenie i wyjmij kartę."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Wyjmij kartę SD, jeśli jest włożona, a następnie przytrzymaj przycisk zmniejszania głośności i przycisk zasilania, aż {device} uruchomi się ponownie."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Wyjmij kartę microSD i włącz Debugowanie USB w Opcjach programisty. Podłącz {device} do tego komputera, gdy jest włączone. Uruchomi się ponownie w trybie fastbootd: na ekranie pojawi się duży czerwony napis fastbootd."
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "Dysk, na którym znajduje się obszar roboczy, może ulegać awarii. Wybierz obszar roboczy na innym dysku i utwórz kompilację ponownie."
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "Instalator sterownika nie jest dołączony do tej kompilacji. Zainstaluj WinUSB dla trybu pobierania urządzenia za pomocą Zadig."
"The file is damaged or a different version. Delete it and download again.": "Plik jest uszkodzony lub pochodzi z innej wersji. Usuń go i pobierz ponownie."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Pierwsze uruchomienie może potrwać od 1 do 3 minut i może się wydawać, że zawiesiło się na logo Anbernic. To normalne."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Pierwsze uruchomienie trwa od 1 do 3 minut i może się wydawać, że ekran zawiesił się na logo uruchamiania. To normalne."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Pierwsze uruchomienie trwa kilka minut, ponieważ Thimsy konfiguruje emulatory. Nie wyłączaj urządzenia."
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "Nie udało się sprawdzić wolnego miejsca na tym dysku. Wybierz inny folder na obszar roboczy."
"The installer does a fresh install that erases your {device}, whatever it runs now.": "Instalator wykona czystą instalację, która wymaże Twoje urządzenie {device}, bez względu na to, jakie oprogramowanie ma teraz."
"The installer runs as root, so it can open the device": "Instalator działa jako root, więc może otworzyć urządzenie"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} odblokowuje się jeden raz, na komputerze z systemem Windows: narzędzie UnlockBootloader z instrukcji instalacji GammaOS Next (Unisoc T820, kroki 1 i 2) działa tylko w systemie Windows. Najpierw zainstaluj sterownik USB Unisoc z UnisocTools podanych w instrukcji. Następnie wyłącz {device} i odłącz kabel, uruchom UnlockBootloader.bat i w ciągu 30 sekund przytrzymaj przycisk Wstecz (przycisk po prawej stronie ekranu) i, nadal go trzymając, podłącz kabel USB. Puść przycisk, gdy na ekranie pojawi się tekst. Odblokowanie wymazuje {device}. Instalator sam nie uruchamia tego narzędzia. Wykonaj instrukcję, a potem wróć i kontynuuj."
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} odblokowuje się jeden raz, na komputerze z systemem Windows: narzędzie UnlockBootloader z instrukcji instalacji GammaOS Next (Unisoc T820, kroki 1 i 2) działa tylko w systemie Windows. Najpierw zainstaluj sterownik USB Unisoc z UnisocTools podanych w instrukcji. Następnie wyłącz {device} i odłącz kabel, uruchom UnlockBootloader.bat i w ciągu 30 sekund przytrzymaj przycisk Wstecz i, nadal go trzymając, podłącz kabel USB. Puść przycisk, gdy na ekranie pojawi się tekst. Odblokowanie wymazuje {device}. Instalator sam nie uruchamia tego narzędzia. Wykonaj instrukcję, a potem wróć i kontynuuj."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "{device} odblokowuje się jeden raz, internetowym narzędziem do odblokowania z instrukcji instalacji GammaOS Next (Anbernic RG405M / RG405V / RG505, krok 2). Wyjmij kartę microSD, włącz Debugowanie USB w Opcjach programisty i uruchom {device} ponownie w trybie fastboot poleceniem adb reboot bootloader: na ekranie obok logo Anbernic pojawi się napis fastboot mode. Otwórz narzędzie w Google Chrome, kliknij „Connect”, wybierz urządzenie, a potem kliknij „Unlock”. Na urządzeniu {device} nie naciskaj przycisku zmniejszania głośności: naciśnij przycisk Home / Wstecz, aby potwierdzić. W systemie Linux lub macOS to samo robi narzędzie unisoc-unlock z instrukcji. Odblokowanie wymazuje {device}. Instalator sam nie uruchamia tych narzędzi. Wykonaj instrukcję, a potem wróć i kontynuuj."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Profil {profile} nie został jeszcze opublikowany. Wybierz profil oznaczony jako dostępny."
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "Na tym urządzeniu nie działa pasująca kompilacja Thimsy ani GammaOS, więc nie można go zaktualizować. Zamiast tego wykonaj pełną instalację (wymaże ona urządzenie)."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "Układ partycji tego urządzenia nie pasuje do tego oprogramowania: to inny model albo nadal działa na nim oryginalne oprogramowanie, które wymaga ponownego podziału na partycje, czego ta wersja jeszcze nie potrafi."
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "Ten dysk jest sformatowany w systemie FAT32, który nie obsługuje plików większych niż 4 GB. Wybierz obszar roboczy na innym dysku (NTFS, exFAT, APFS lub ext4)."
"This version of the installer expects a different build. Build again, then install.": "Ta wersja instalatora oczekuje innej kompilacji. Utwórz kompilację ponownie, a potem zainstaluj."
"Turn it on": "Włącz urządzenie"
"Turn on OEM unlocking": "Włącz Odblokowanie OEM"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Wyłącz {device} i odłącz kabel. Przytrzymaj przycisk Wstecz i przycisk Anbernic obok niego i, nadal trzymając oba, podłącz kabel USB do tego komputera. Trzymaj, aż rozpocznie się instalacja."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Wyłącz {device} i odłącz kabel. Przytrzymaj przycisk Wstecz i, nadal go trzymając, podłącz kabel USB do tego komputera. Trzymaj, aż rozpocznie się instalacja."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Wyłącz {device} i odłącz kabel. Przytrzymaj przycisk Wstecz, czyli przycisk po prawej stronie ekranu, i, nadal go trzymając, podłącz kabel USB do tego komputera. Trzymaj, aż rozpocznie się instalacja."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Całkowicie wyłącz {device} i odłącz kabel. Przytrzymaj jednocześnie przyciski zmniejszania i zwiększania głośności i, nadal trzymając oba, podłącz kabel USB do tego komputera. Trzymaj, aż rozpocznie się instalacja."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "Całkowicie wyłącz {device}. Gdy instalator o to poprosi, podłącz kabel USB do tego komputera i nie odłączaj go, aż instalacja się zakończy."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "Wyłącz {device}, włóż kartę i włącz urządzenie. Samo zainstaluje system z karty w pamięci wewnętrznej, co zajmie kilka minut. Nie dotykaj go, aż samo się wyłączy lub uruchomi ponownie, a potem wyjmij kartę."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Wyłącz {device}, włóż kartę i włącz urządzenie. Samo zainstaluje system z karty w pamięci wewnętrznej. Nie dotykaj go, aż skończy, a potem wyłącz je i wyjmij kartę."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Wyłącz {device}, odłącz kabel i wyjmij wszystkie karty SD. Rozsuń urządzenie, a następnie przytrzymaj przycisk Wstecz na środku krzyżaka i, nadal go trzymając, podłącz kabel USB do tego komputera. Trzymaj, aż rozpocznie się instalacja."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Włącz {device}, z nadal włączonym Debugowaniem USB w Opcjach programisty, i podłącz je do tego komputera. Uruchomi się ponownie samo i rozpocznie się instalacja."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Włącz {device}, z nadal włączonym Debugowaniem USB w Opcjach programisty, i podłącz je do tego komputera. Uruchomi się ponownie w trybie fastboot na czas instalacji."
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "Dostęp USB dla {ids} nie jest jeszcze skonfigurowany. Konfiguracja raz poprosi o hasło."
"USB access is set up for {ids}": "Dostęp USB dla {ids} jest skonfigurowany"
"Unlock before flashing": "Odblokuj przed wgraniem oprogramowania"
"Unlock with GammaOS's own steps": "Odblokuj według instrukcji GammaOS"
"Unpacking the firmware": "Rozpakowywanie oprogramowania"
"Unpacking {file}": "Rozpakowywanie pliku {file}"
"Unplug it and turn it on": "Odłącz kabel i włącz urządzenie"
"Unplug the cable when it restarts": "Odłącz kabel, gdy urządzenie uruchomi się ponownie"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Odłącz kabel. Przytrzymaj przycisk zasilania i przycisk zmniejszania głośności przez co najmniej 60 sekund, a następnie, nadal je trzymając, podłącz kabel USB. Trzymaj, aż rozpocznie się instalacja; wykrycie urządzenia {device} może potrwać 30 sekund lub dłużej."
"Updating checksums": "Aktualizowanie sum kontrolnych"
"Use a Windows PC": "Użyj komputera z systemem Windows"
"Use the firmware version the catalog lists for this device.": "Użyj wersji oprogramowania podanej w katalogu dla tego urządzenia."
"Use the volume keys to choose Unlock, then press Power.": "Przyciskami głośności wybierz „Unlock”, a następnie naciśnij przycisk zasilania."
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "Poczekaj na pierwsze uruchomienie"
"Wait on the Anbernic logo": "Poczekaj na logo Anbernic"
"Wait through a blank screen": "Przeczekaj pusty ekran"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Po zakończeniu instalacji naciśnij raz przycisk zasilania, jeśli {device} nie uruchomi się ponownie samo."
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "Po zakończeniu instalacji {device} samo uruchomi się ponownie i skonfiguruje swoją pamięć. Wtedy odłącz kabel."
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "Po zakończeniu instalacji odłącz kabel i naciśnij przycisk zasilania, aby włączyć {device}."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "Gdy na ekranie pojawi się INFO: LOCK FLAG IS: UNLOCK!!!, urządzenie jest odblokowane. Odłącz kabel i upewnij się, że {device} jest wyłączone (jeśli uruchomi się ponownie, przytrzymaj przycisk zasilania, aż się wyłączy), a następnie kontynuuj."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Gdy na ekranie pojawi się Unlock bootloader success!, urządzenie jest odblokowane. Jeśli {device} już przy uruchamianiu na chwilę wyświetla INFO: LOCK FLAG IS : UNLOCK!!!, zostało odblokowane wcześniej i możesz pominąć odblokowanie."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Gdy {device} o to poprosi, w ciągu 3 sekund naciśnij przycisk zwiększania głośności, aby potwierdzić odblokowanie."
"WinUSB is installed for {ids}": "WinUSB jest zainstalowany dla {ids}"
"WinUSB will be installed for {ids} the first time you flash": "WinUSB zostanie zainstalowany dla {ids} przy pierwszym flashowaniu"
"Windows asks for permission next. Click Yes so the installer can give your device the USB driver it needs as soon as you connect it. Don't connect it yet.": "Za chwilę system Windows poprosi o zgodę. Kliknij Tak, aby instalator mógł przypisać urządzeniu potrzebny sterownik USB, gdy tylko je podłączysz. Jeszcze go nie podłączaj."
"Windows now gives the device the driver the installer needs. Unplug the cable and turn the device off, then repeat the download-mode steps with the same USB port.": "Windows przypisuje teraz urządzeniu sterownik, którego potrzebuje instalator. Odłącz kabel i wyłącz urządzenie, a następnie powtórz kroki trybu pobierania, używając tego samego portu USB."
"WonderSwan": "WonderSwan"
"Writing {partition}": "Zapisywanie partycji {partition}"
"Wrote {partition}": "Zapisano partycję {partition}"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "Twoje urządzenie {device} ma już GammaOS lub Thimsy. Wybierz sposób instalacji nowego oprogramowania."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Twoje urządzenie {device} ma już niestandardowe oprogramowanie (było wcześniej odblokowane). Odblokowanie zostanie pominięte."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Twoje urządzenie {device} nadal ma oryginalne oprogramowanie. Instalator przeprowadzi Cię przez odblokowanie, a następnie wykona czystą instalację, która wymaże urządzenie."
"hakuX": "hakuX"
"needs Android API {n}": "wymaga Android API {n}"
"needs Vulkan": "wymaga Vulkan"
"needs an ARMv8.2 CPU": "wymaga procesora ARMv8.2"
"needs {n} GB RAM": "wymaga {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "Nie można zainstalować {device} z systemu {host}. Uruchom Thimsy Installer na komputerze z systemem Windows, aby go zainstalować."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} instaluje się za pomocą PhoenixSuit firmy Allwinner, który działa tylko w systemie Windows. Uruchom Thimsy Installer na komputerze z systemem Windows, aby go zainstalować."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} instaluje się za pomocą SP Flash Tool firmy MediaTek, który nie działa w systemie {host}. Uruchom Thimsy Installer na komputerze z systemem Windows, aby go zainstalować."
"{device} isn't supported by this version of the installer yet.": "{device} nie jest jeszcze obsługiwane przez tę wersję instalatora."
"{host} needs no driver": "{host} nie wymaga sterownika"
