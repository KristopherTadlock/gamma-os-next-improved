"needs Vulkan": "Vulkan gerekir"
"needs an ARMv8.2 CPU": "ARMv8.2 işlemci gerekir"
"needs {n} GB RAM": "{n} GB RAM gerekir"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device}, {host} üzerinden yüklenemez. Yüklemek için Thimsy Installer'ı bir Windows PC'de çalıştırın."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device}, Allwinner'ın yalnızca Windows'ta çalışan PhoenixSuit aracıyla yüklenir. Yüklemek için Thimsy Installer'ı bir Windows PC'de çalıştırın."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device}, MediaTek'in {host} üzerinde çalışmayan SP Flash Tool aracıyla yüklenir. Yüklemek için Thimsy Installer'ı bir Windows PC'de çalıştırın."
"{device} isn't supported by this version of the installer yet.": "{device}, yükleyicinin bu sürümünde henüz desteklenmiyor."
"{host} needs no driver": "{host} için sürücü gerekmez"
