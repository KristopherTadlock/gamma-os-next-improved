"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "Çalışma alanının bulunduğu sürücü arızalanıyor olabilir. Başka bir sürücüde çalışma alanı seçip yeniden derleyin."
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "Sürücü yükleyicisi bu derlemeye dahil değil. Cihazın indirme modu için WinUSB'yi Zadig ile yükleyin."
"The file is damaged or a different version. Delete it and download again.": "Dosya hasarlı veya farklı bir sürüm. Dosyayı silip yeniden indirin."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "İlk açılış 1 ila 3 dakika sürebilir ve Anbernic logosunda takılmış gibi görünebilir. Bu normaldir."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "İlk açılış 1 ila 3 dakika sürer ve ekran açılış logosunda takılmış gibi görünebilir. Bu normaldir."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "İlk açılış, Thimsy emülatörlerinizi kurarken birkaç dakika sürer. Cihazı kapatmayın."
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "Bu sürücüdeki boş alan kontrol edilemedi. Çalışma alanı için başka bir klasör seçin."
"The installer does a fresh install that erases your {device}, whatever it runs now.": "Yükleyici, şu anda ne çalıştırıyor olursa olsun {device} cihazınızı silen temiz bir kurulum yapar."
"The installer runs as root, so it can open the device": "Yükleyici root olarak çalıştığı için cihazı açabilir"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} cihazının kilidi bir kez, bir Windows bilgisayarda açılır: GammaOS Next kurulum kılavuzundaki UnlockBootloader aracı (Unisoc T820, Adım 1 ve 2) yalnızca Windows'ta çalışır. Önce kılavuzdaki UnisocTools içinden Unisoc USB sürücüsünü kurun. Ardından {device} cihazını kapatıp kablosunu çıkarın, UnlockBootloader.bat dosyasını başlatın ve 30 saniye içinde Geri tuşunu (ekranın sağındaki tuş) basılı tutun ve bırakmadan USB kablosunu takın. Ekranda yazı belirdiğinde bırakın. Kilit açma {device} cihazını siler. Yükleyici bu aracı kendisi çalıştırmaz. Kılavuzu izleyin, sonra geri gelip devam edin."
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} cihazının kilidi bir kez, bir Windows bilgisayarda açılır: GammaOS Next kurulum kılavuzundaki UnlockBootloader aracı (Unisoc T820, Adım 1 ve 2) yalnızca Windows'ta çalışır. Önce kılavuzdaki UnisocTools içinden Unisoc USB sürücüsünü kurun. Ardından {device} cihazını kapatıp kablosunu çıkarın, UnlockBootloader.bat dosyasını başlatın ve 30 saniye içinde Geri tuşunu basılı tutun ve bırakmadan USB kablosunu takın. Ekranda yazı belirdiğinde bırakın. Kilit açma {device} cihazını siler. Yükleyici bu aracı kendisi çalıştırmaz. Kılavuzu izleyin, sonra geri gelip devam edin."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "{device} cihazının kilidi bir kez, GammaOS Next kurulum kılavuzundaki web kilit açma aracıyla açılır (Anbernic RG405M / RG405V / RG505, Adım 2). microSD kartı çıkarın, Geliştirici seçenekleri'nde USB hata ayıklamayı açın ve {device} cihazını adb reboot bootloader komutuyla fastboot moduna yeniden başlatın: ekranda Anbernic logosunun yanında fastboot mode yazar. Aracı Google Chrome'da açın, \"Connect\" düğmesine tıklayın, cihazı seçin, ardından \"Unlock\" düğmesine tıklayın. {device} üzerinde Sesi Kısma tuşuna basmayın: onaylamak için Ana Ekran / Geri tuşuna basın. Linux veya macOS'te kılavuzdaki unisoc-unlock aracı aynı işi yapar. Kilit açma {device} cihazını siler. Yükleyici bu araçları kendisi çalıştırmaz. Kılavuzu izleyin, sonra geri gelip devam edin."
"The {profile} profile isn't published yet. Choose a profile marked available.": "{profile} profili henüz yayımlanmadı. Kullanılabilir olarak işaretlenmiş bir profil seçin."
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "Bu cihazda eşleşen bir Thimsy veya GammaOS derlemesi çalışmadığı için güncellenemez. Bunun yerine tam kurulum kullanın (cihazı siler)."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "Bu cihazın bölüm düzeni bu yazılımla eşleşmiyor: farklı bir model ya da hâlâ yeniden bölümlendirilmesi gereken orijinal yazılımı çalıştırıyor; bu sürüm bunu henüz yapamıyor."
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "Bu sürücü FAT32 olarak biçimlendirilmiş ve FAT32 4 GB'tan büyük dosyaları tutamaz. Başka bir sürücüde çalışma alanı seçin (NTFS, exFAT, APFS veya ext4)."
"This version of the installer expects a different build. Build again, then install.": "Yükleyicinin bu sürümü farklı bir derleme bekliyor. Yeniden derleyin, ardından yükleyin."
"Turn it on": "Cihazı açın"
"Turn on OEM unlocking": "OEM kilit açmayı etkinleştirin"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "{device} cihazını kapatın ve kablosunu çıkarın. Geri tuşunu ve yanındaki Anbernic tuşunu basılı tutun ve ikisini de bırakmadan USB kablosunu bu bilgisayara takın. Kurulum başlayana kadar basılı tutmaya devam edin."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device} cihazını kapatın ve kablosunu çıkarın. Geri tuşunu basılı tutun ve bırakmadan USB kablosunu bu bilgisayara takın. Kurulum başlayana kadar basılı tutmaya devam edin."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device} cihazını kapatın ve kablosunu çıkarın. Ekranın sağındaki tuş olan Geri tuşunu basılı tutun ve bırakmadan USB kablosunu bu bilgisayara takın. Kurulum başlayana kadar basılı tutmaya devam edin."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "{device} cihazını tamamen kapatın ve kablosunu çıkarın. Sesi Kısma ve Sesi Açma tuşlarını birlikte basılı tutun ve ikisini de bırakmadan USB kablosunu bu bilgisayara takın. Kurulum başlayana kadar basılı tutmaya devam edin."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "{device} cihazını tamamen kapatın. Yükleyici istediğinde USB kablosunu bu bilgisayara takın ve kurulum bitene kadar takılı bırakın."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "{device} cihazını kapatın, kartı takın ve cihazı açın. Cihaz karttan dahili depolamasına kendiliğinden kurulur; bu birkaç dakika sürer. Kendiliğinden kapanana veya yeniden başlayana kadar ona dokunmayın, ardından kartı çıkarın."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "{device} cihazını kapatın, kartı takın ve cihazı açın. Cihaz karttan dahili depolamasına kendiliğinden kurulur. İşlem bitene kadar ona dokunmayın, ardından cihazı kapatıp kartı çıkarın."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device} cihazını kapatın, kablosunu çıkarın ve tüm SD kartları çıkarın. Kaydırarak açın, ardından yön tuşlarının ortasındaki Geri tuşunu basılı tutun ve bırakmadan USB kablosunu bu bilgisayara takın. Kurulum başlayana kadar basılı tutmaya devam edin."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "{device} cihazını, Geliştirici seçenekleri'nde USB hata ayıklama hâlâ açıkken açın ve bu bilgisayara bağlayın. Cihaz kendiliğinden yeniden başlar ve kurulum başlar."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "{device} cihazını, Geliştirici seçenekleri'nde USB hata ayıklama hâlâ açıkken açın ve bu bilgisayara bağlayın. Kurulum için fastboot moduna yeniden başlar."
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "{ids} için USB erişimi henüz ayarlanmadı. Ayarlarken parolanız bir kez sorulur."
"USB access is set up for {ids}": "{ids} için USB erişimi ayarlandı"
"Unlock before flashing": "Flaşlamadan önce kilidi açın"
"Unlock with GammaOS's own steps": "GammaOS'un kendi adımlarıyla kilidi açın"
"Unpacking the firmware": "Yazılım paketi açılıyor"
"Unpacking {file}": "{file} ayıklanıyor"
"Unplug it and turn it on": "Kabloyu çıkarın ve cihazı açın"
"Unplug the cable when it restarts": "Yeniden başladığında kabloyu çıkarın"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Kabloyu çıkarın. Güç ve Sesi Kısma tuşlarını en az 60 saniye basılı tutun, ardından bırakmadan USB kablosunu takın. Kurulum başlayana kadar basılı tutmaya devam edin; {device} cihazının bulunması 30 saniye veya daha uzun sürebilir."
"Updating checksums": "Sağlama toplamları güncelleniyor"
"Use a Windows PC": "Windows PC kullanın"
"Use the firmware version the catalog lists for this device.": "Katalogda bu cihaz için belirtilen yazılım sürümünü kullanın."
"Use the volume keys to choose Unlock, then press Power.": "Ses tuşlarıyla \"Unlock\" seçeneğini seçin, ardından Güç tuşuna basın."
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "İlk açılışı bekleyin"
"Wait on the Anbernic logo": "Anbernic logosunda bekleyin"
"Wait through a blank screen": "Boş ekranda bekleyin"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Kurulum bittiğinde, {device} kendiliğinden yeniden başlamadıysa Güç tuşuna bir kez basın."
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "Kurulum bittiğinde {device} kendiliğinden yeniden başlar ve depolamasını hazırlar. O zaman kabloyu çıkarın."
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "Kurulum bittiğinde kabloyu çıkarın ve {device} cihazını açmak için Güç tuşuna basın."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "Ekranda INFO: LOCK FLAG IS: UNLOCK!!! göründüğünde kilit açılmıştır. Kabloyu çıkarın ve {device} cihazının kapalı olduğundan emin olun (yeniden başlarsa kapanana kadar Güç tuşunu basılı tutun), ardından devam edin."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Ekranda Unlock bootloader success! göründüğünde kilit açılmıştır. {device} açılırken zaten kısa süreliğine INFO: LOCK FLAG IS : UNLOCK!!! gösteriyorsa kilidi daha önce açılmıştır ve kilit açmayı atlayabilirsiniz."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "{device} sorduğunda, kilit açmayı onaylamak için 3 saniye içinde Sesi Açma tuşuna basın."
"WinUSB is installed for {ids}": "{ids} için WinUSB yüklü"
"WinUSB will be installed for {ids} the first time you flash": "WinUSB, ilk yazma işleminde {ids} için yüklenecek"
"Windows asks for permission next. Click Yes so the installer can give your device the USB driver it needs as soon as you connect it. Don't connect it yet.": "Windows birazdan izin isteyecek. Cihazı bağladığınız anda yükleyicinin ona ihtiyaç duyduğu USB sürücüsünü verebilmesi için Evet'e tıklayın. Henüz bağlamayın."
"Windows now gives the device the driver the installer needs. Unplug the cable and turn the device off, then repeat the download-mode steps with the same USB port.": "Windows artık cihaza yükleyicinin ihtiyaç duyduğu sürücüyü veriyor. Kabloyu çıkarın ve cihazı kapatın, ardından aynı USB bağlantı noktasıyla indirme modu adımlarını tekrarlayın."
"WonderSwan": "WonderSwan"
"Writing {partition}": "{partition} yazılıyor"
"Wrote {partition}": "{partition} yazıldı"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "{device} cihazınızda zaten GammaOS veya Thimsy çalışıyor. Yeni yazılımı nasıl yükleyeceğinizi seçin."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "{device} cihazınızda zaten özel yazılım çalışıyor (kilidi daha önce açılmış). Kilit açma atlanıyor."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "{device} cihazınızda hâlâ orijinal yazılımı çalışıyor. Yükleyici kilit açma adımlarında size yol gösterir, ardından cihazı silen temiz bir kurulum yapar."
"hakuX": "hakuX"
