# Turkish translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Temiz kurulum dahili depolamayı siler. ROMs, kayıtlar, ekran görüntüleri ve saklamak istediğiniz her şeyi bilgisayarınıza veya microSD karta kopyalayın. microSD karttaki oyunlara dokunulmaz."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Windows izin isteğini kabul edin veya Zadig ile WinUSB'yi yükleyin."
"Already unlocked: install new firmware": "Kilidi zaten açık: yeni yazılımı yükle"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Dengeli: Klasik sistemler için RetroArch, ayrıca N64, Dreamcast, PSP ve DS emülatörleri, ES-DE ana ekranı ve Brave."
"Building Thimsy for your device": "Thimsy cihazınız için oluşturuluyor"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "RG Cube için resmi GammaOS Next 1.2 sürümünden oluşturuldu; GammaOS'un GitHub sayfasından indirildi."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Başlamadan önce en az %50 şarj edin ve kutudan çıkan kabloyu yanınızda bulundurun."
"Charge the RG Cube": "RG Cube'u şarj edin"
"Check it's unlocked": "Kilidin açık olduğunu kontrol edin"
"Check the basics": "Temel işlevleri kontrol edin"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Düğmeleri, dokunmatik ekranı, sesi ve Wi-Fi'ı kontrol edin ve bir oyun başlatın."
"Check the cable and that the device is still in its flashing mode, then try again.": "Kabloyu ve cihazın hâlâ yükleme modunda olduğunu kontrol edip tekrar deneyin."
"Checking the USB driver": "USB sürücüsü kontrol ediliyor"
"Checking the build": "Derleme kontrol ediliyor"
"Checking the plan": "Plan kontrol ediliyor"
"Checking the result": "Sonuç kontrol ediliyor"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Daha fazla boş alanı olan bir sürücüde (FAT32 olmayan) çalışma alanı seçin veya yer açın."
"Confirm on the device": "Cihazda onaylayın"
"Connect the device in download mode": "Cihazı indirme modunda bağlayın"
"Copy your games and saves": "Oyunlarınızı ve kayıtlarınızı kopyalayın"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Çalışma alanındaki \"jobs\" klasörünü silip yeniden derleyin; sorun devam ederse bildirin."
"Don't install on units whose stock firmware is v1.26.": "Orijinal yazılımı v1.26 olan cihazlara yüklemeyin."
"Downloading": "İndiriliyor"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Her şey: Orta profile ek olarak GameCube/Wii, 3DS, PS2, Xbox ve PS Vita emülatörleri ve yüksek doğruluklu çekirdekler. Eksiksiz Thimsy 1.0a seti."
"Finishing": "Tamamlanıyor"
"First time installing custom firmware": "İlk kez özel yazılım yüklüyorum"
"Follow the unlock steps shown in the installer, then continue.": "Yükleyicide gösterilen kilit açma adımlarını uygulayın ve devam edin."
"Heavy": "Kapsamlı"
"Hold Volume Down and plug in the cable": "Sesi Kısma tuşunu basılı tutun ve kabloyu takın"
"Installing Thimsy": "Thimsy yükleniyor"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Verilerinizi korur. Yalnızca RG Cube'da zaten GammaOS Next 1.2 veya bir Thimsy derlemesi çalışıyorsa."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Verilerinizi korur. Yalnızca cihazda zaten uyumlu bir Thimsy veya GammaOS derlemesi çalışıyorsa."
"Light": "Hafif"
"Medium": "Orta"
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Planlanan: Windows ve Linux'ta SP Flash Tool. Henüz derlenemiyor."
"Planned: Windows only. Not buildable yet.": "Planlanan: Yalnızca Windows. Henüz derlenemiyor."
"Planned: fastboot install on every computer. Not buildable yet.": "Planlanan: Her bilgisayarda fastboot ile kurulum. Henüz derlenemiyor."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Planlanan: RG Cube ile aynı yükleme yöntemi. Henüz derlenemiyor."
"Preparing the partitions": "Bölümler hazırlanıyor"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Thimsy Installer'ı yeniden yükleyin veya THIMSY_TOOLS_DIR değişkenini onu içeren bir klasöre ayarlayın."
"Required before flashing; skipping it can brick the device.": "Yazılım yüklemeden önce gereklidir; atlanması cihazı kullanılamaz hale getirebilir."
"Restarting the device": "Cihaz yeniden başlatılıyor"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "PlayStation'a kadar klasik sistemler için küçük indirme: Sistem başına bir hızlı RetroArch çekirdeği, Minima ana ekranı, gölgelendirici yok."
"The RG Cube is unlocked once, with the steps from GammaOS Next's installation guide (the Unisoc T820 section). The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "RG Cube'un kilidi, GammaOS Next kurulum kılavuzundaki adımlarla (Unisoc T820 bölümü) bir kez açılır. Yükleyici bu aracı kendisi çalıştırmaz. Kılavuzu izleyin, ardından buraya dönüp devam edin."
"The file is damaged or a different version. Delete it and download again.": "Dosya hasarlı veya farklı bir sürüm. Dosyayı silip yeniden indirin."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "İlk açılış, Thimsy emülatörlerinizi kurarken birkaç dakika sürer. Cihazı kapatmayın."
"The installer sends the unlock command; confirm it on the device with Volume Up.": "Yükleyici kilit açma komutunu gönderir; cihazda Sesi Açma tuşuyla onaylayın."
"The {profile} profile isn't published yet. Choose a profile marked available.": "{profile} profili henüz yayımlanmadı. Kullanılabilir olarak işaretlenmiş bir profil seçin."
"Turn the RG Cube off. Hold Volume Down and connect the USB cable to this computer. Keep holding until installation starts. The screen stays black; that's normal.": "RG Cube'u kapatın. Sesi Kısma tuşunu basılı tutun ve USB kablosunu bu bilgisayara takın. Kurulum başlayana kadar basılı tutmaya devam edin. Ekran siyah kalır; bu normaldir."
"Unlock in fastboot": "fastboot'ta kilidi açın"
"Unlock with GammaOS's own steps": "GammaOS'un kendi adımlarıyla kilidi açın"
"Unpacking the firmware": "Yazılım paketi açılıyor"
"Use a Windows PC": "Windows PC kullanın"
"Use the firmware version the catalog lists for this device.": "Katalogda bu cihaz için belirtilen yazılım sürümünü kullanın."
"Use the volume keys to choose Unlock, then press Power.": "Ses tuşlarıyla \"Unlock\" seçeneğini seçin, ardından Güç tuşuna basın."
"Wait for the first boot": "İlk açılışı bekleyin"
"When the device shows LOCK FLAG IS: UNLOCK, it's unlocked. Turn it off and continue.": "Cihazda LOCK FLAG IS: UNLOCK yazısı göründüğünde kilit açılmıştır. Cihazı kapatıp devam edin."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "{device} cihazınızda zaten özel yazılım çalışıyor (kilidi daha önce açılmış). Kilit açma atlanıyor."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "{device} cihazınızda orijinal yazılımı çalışıyor. Yükleyici, cihazı silen temiz bir kurulum yapar."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "{device} cihazınızda hâlâ orijinal yazılımı çalışıyor. Yükleyici kilit açma adımlarında size yol gösterir, ardından cihazı silen temiz bir kurulum yapar."
"needs Android API {n}": "Android API {n} gerekir"
"needs Vulkan": "Vulkan gerekir"
"needs an ARMv8.2 CPU": "ARMv8.2 işlemci gerekir"
"needs {n} GB RAM": "{n} GB RAM gerekir"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device}, {host} üzerinden yüklenemez. Yüklemek için Thimsy Installer'ı bir Windows PC'de çalıştırın."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device}, Allwinner'ın yalnızca Windows'ta çalışan PhoenixSuit aracıyla yüklenir. Yüklemek için Thimsy Installer'ı bir Windows PC'de çalıştırın."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device}, MediaTek'in {host} üzerinde çalışmayan SP Flash Tool aracıyla yüklenir. Yüklemek için Thimsy Installer'ı bir Windows PC'de çalıştırın."
"{device} isn't supported by this version of the installer yet.": "{device}, yükleyicinin bu sürümünde henüz desteklenmiyor."
