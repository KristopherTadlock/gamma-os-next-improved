# Turkish translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Temiz kurulum dahili depolamayı siler. ROMs, kayıtlar, ekran görüntüleri ve saklamak istediğiniz her şeyi bilgisayarınıza veya microSD karta kopyalayın. microSD karttaki oyunlara dokunulmaz."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Windows izin isteğini kabul edin veya Zadig ile WinUSB'yi yükleyin."
"Already unlocked: install new firmware": "Kilidi zaten açık: yeni yazılımı yükle"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Dengeli: Klasik sistemler için RetroArch, ayrıca N64, Dreamcast, PSP ve DS emülatörleri, ES-DE ana ekranı ve Brave."
"Building Thimsy for your device": "Thimsy cihazınız için oluşturuluyor"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "RG Cube için resmi GammaOS Next 1.2 sürümünden oluşturuldu; GammaOS'un GitHub sayfasından indirildi."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Başlamadan önce en az %50 şarj edin ve kutudan çıkan kabloyu yanınızda bulundurun."
"Charge the RG Cube": "RG Cube'u şarj edin"
"Check it's unlocked": "Kilidin açık olduğunu kontrol edin"
"Check the basics": "Temel işlevleri kontrol edin"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Düğmeleri, dokunmatik ekranı, sesi ve Wi-Fi'ı kontrol edin ve bir oyun başlatın."
"Check the cable and that the device is still in its flashing mode, then try again.": "Kabloyu ve cihazın hâlâ yükleme modunda olduğunu kontrol edip tekrar deneyin."
"Checking the USB driver": "USB sürücüsü kontrol ediliyor"
"Checking the build": "Derleme kontrol ediliyor"
"Checking the plan": "Plan kontrol ediliyor"
"Checking the result": "Sonuç kontrol ediliyor"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Daha fazla boş alanı olan bir sürücüde (FAT32 olmayan) çalışma alanı seçin veya yer açın."
"Confirm on the device": "Cihazda onaylayın"
"Confirm with Volume Up": "Sesi Açma tuşuyla onaylayın"
"Connect it with USB debugging on": "USB hata ayıklama açıkken bağlayın"
"Connect the device in download mode": "Cihazı indirme modunda bağlayın"
"Copy games without a card reader": "Oyunları kart okuyucu olmadan kopyalayın"
"Copy your games and saves": "Oyunlarınızı ve kayıtlarınızı kopyalayın"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Çalışma alanındaki \"jobs\" klasörünü silip yeniden derleyin; sorun devam ederse bildirin."
"Don't install on units made in March 2026 or later.": "Mart 2026 veya sonrasında üretilmiş cihazlara yüklemeyin."
"Don't install on units whose stock firmware is v1.26.": "Orijinal yazılımı v1.26 olan cihazlara yüklemeyin."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "Oyun kopyalamak için kartı yeniden bir bilgisayara takmayın: kartta şifreli bir Android düzeni bulunur, bu yüzden bilgisayar depolama alanınızı göstermez. Oyunları bunun yerine USB dosya aktarımı (MTP) ile, ADB Explorer ile veya bir ağ paylaşımından kopyalayın."
"Downloading": "İndiriliyor"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Her şey: Orta profile ek olarak GameCube/Wii, 3DS, PS2, Xbox ve PS Vita emülatörleri ve yüksek doğruluklu çekirdekler. Eksiksiz Thimsy 1.0a seti."
"Finishing": "Tamamlanıyor"
"First time installing custom firmware": "İlk kez özel yazılım yüklüyorum"
"Follow the unlock steps shown in the installer, then continue.": "Yükleyicide gösterilen kilit açma adımlarını uygulayın ve devam edin."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "GammaOS'un kılavuzu, kilidi açılmamış bir {device} cihazını flaşlamanın onu kullanılamaz hale getireceği konusunda uyarır. Kilit açıldıktan sonra {device} kendi orijinal Android'ine yeniden başlar. Android açılana kadar bekleyin, ardından devam edin."
"Heavy": "Kapsamlı"
"Hold Back and plug in the cable": "Geri tuşunu basılı tutun ve kabloyu takın"
"Hold Back and the Anbernic button, then plug in": "Geri ve Anbernic tuşlarını basılı tutup kabloyu takın"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "{device} cihazını kapatmak için Güç tuşunu basılı tutun. İki ses tuşunu birden basılı tutun ve bırakmadan USB kablosunu takın. Ardından ses tuşlarını hâlâ basılı tutarken, kurulum başlayana kadar Güç tuşuna art arda basın."
"Hold both volume buttons and plug in the cable": "İki ses tuşunu basılı tutun ve kabloyu takın"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Kurulum yeniden başlayana kadar Geri tuşunu, Sesi Kısma ve Güç tuşlarını birlikte basılı tutun."
"If installation doesn't start": "Kurulum başlamazsa"
"If installation stalls": "Kurulum takılırsa"
"If it isn't found": "Cihaz bulunamazsa"
"If the screen stays black": "Ekran siyah kalırsa"
"Install from the microSD card": "microSD karttan kurun"
"Installing Thimsy": "Thimsy yükleniyor"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Verilerinizi korur. Yalnızca RG Cube'da zaten GammaOS Next 1.2 veya bir Thimsy derlemesi çalışıyorsa."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Verilerinizi korur. Yalnızca cihazda zaten uyumlu bir Thimsy veya GammaOS derlemesi çalışıyorsa."
"Light": "Hafif"
"Medium": "Orta"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "İlk açılışta ekran bir dakikaya kadar boş kalabilir. Bu normaldir; açılış ekranının görünmesini bekleyin."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "{device} cihazında Ayarlar, Hakkında'yı açın ve Derleme numarasına yedi kez dokunun. Ardından Ayarlar, Geliştirici seçenekleri'nde USB hata ayıklama ve OEM kilit açma seçeneklerini açın. {device} açıkken bu bilgisayara bağlayın; kurulum için fastboot moduna yeniden başlar."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "{device} cihazında Ayarlar, Hakkında'yı açın ve Derleme numarasına yedi kez dokunun. Ardından Ayarlar, Geliştirici seçenekleri'nde USB hata ayıklama ve OEM kilit açma seçeneklerini açın. {device} açıkken bu bilgisayara bağlayın; kilit açma için fastboot moduna yeniden başlar."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Planlanan: Her bilgisayarda Qualcomm EDL ile kurulum. Henüz derlenemiyor."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Planlanan: Windows ve Linux'ta SP Flash Tool. Henüz derlenemiyor."
"Planned: Windows only. Not buildable yet.": "Planlanan: Yalnızca Windows. Henüz derlenemiyor."
"Planned: fastboot install on every computer. Not buildable yet.": "Planlanan: Her bilgisayarda fastboot ile kurulum. Henüz derlenemiyor."
"Planned: microSD card install on every computer. Not buildable yet.": "Planlanan: Her bilgisayarda microSD kart ile kurulum. Henüz derlenemiyor."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Planlanan: RG Cube ile aynı yükleme yöntemi. Henüz derlenemiyor."
"Plug in the cable with the device off": "Kabloyu cihaz kapalıyken takın"
"Preparing the partitions": "Bölümler hazırlanıyor"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Kartı {device} cihazına takın ve cihazı açın. Thimsy karttan çalışır ve {device} cihazının dahili depolamasına dokunmaz: orijinal sisteme dönmek için cihazı kapatıp kartı çıkarın."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Thimsy Installer'ı yeniden yükleyin veya THIMSY_TOOLS_DIR değişkenini onu içeren bir klasöre ayarlayın."
"Restart into fastbootd": "fastbootd moduna yeniden başlatın"
"Restart with Power": "Güç tuşuyla yeniden başlatın"
"Restarting the device": "Cihaz yeniden başlatılıyor"
"Slide it open, hold Back and plug in": "Kaydırarak açın, Geri tuşunu basılı tutun ve kabloyu takın"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "PlayStation'a kadar klasik sistemler için küçük indirme: Sistem başına bir hızlı RetroArch çekirdeği, Minima ana ekranı, gölgelendirici yok."
"Start from the microSD card": "microSD karttan başlatın"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "{device} cihazındaki diğer microSD kartları çıkarın, Thimsy kartını takın ve cihazı açın. Thimsy karttan çalışır ve dahili depolamaya dokunmaz: orijinal sisteme dönmek için cihazı kapatıp kartı çıkarın."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Takılı SD kartları çıkarın, ardından {device} yeniden başlayana kadar Sesi Kısma ve Güç tuşlarını basılı tutun."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "microSD kartı çıkarın ve Geliştirici seçenekleri'nde USB hata ayıklamayı açın. {device} açıkken bu bilgisayara bağlayın. Cihaz fastbootd moduna yeniden başlar: ekranda büyük kırmızı harflerle fastbootd yazar."
"The file is damaged or a different version. Delete it and download again.": "Dosya hasarlı veya farklı bir sürüm. Dosyayı silip yeniden indirin."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "İlk açılış 1 ila 3 dakika sürebilir ve Anbernic logosunda takılmış gibi görünebilir. Bu normaldir."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "İlk açılış 1 ila 3 dakika sürer ve ekran açılış logosunda takılmış gibi görünebilir. Bu normaldir."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "İlk açılış, Thimsy emülatörlerinizi kurarken birkaç dakika sürer. Cihazı kapatmayın."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} cihazının kilidi bir kez, GammaOS Next kurulum kılavuzundaki UnlockBootloader aracıyla açılır (Unisoc T820, Adım 2): {device} cihazını kapatın, aracı başlatın, ardından USB kablosunu takarken Geri tuşunu basılı tutun. Yükleyici bu aracı kendisi çalıştırmaz. Kılavuzu izleyin, sonra geri gelip devam edin."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} cihazının kilidi bir kez, GammaOS Next kurulum kılavuzundaki UnlockBootloader aracıyla açılır (Unisoc T820, Adım 2): {device} cihazını kapatın, aracı başlatın, ardından USB kablosunu takarken ekranın sağındaki tuş olan Geri tuşunu basılı tutun. Yükleyici bu aracı kendisi çalıştırmaz. Kılavuzu izleyin, sonra geri gelip devam edin."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} cihazının kilidi bir kez, GammaOS Next kurulum kılavuzundaki web kilit açma aracıyla açılır (Anbernic RG405M / RG405V / RG505, Adım 2). {device} cihazını fastboot moduna yeniden başlatın, aracı Google Chrome'da açın, \"Connect\" ve ardından \"Unlock\" düğmesine tıklayın. {device} üzerinde Sesi Kısma tuşuna basmayın: onaylamak için Ana Ekran / Geri tuşuna basın. Yükleyici bu aracı kendisi çalıştırmaz. Kılavuzu izleyin, sonra geri gelip devam edin."
"The {profile} profile isn't published yet. Choose a profile marked available.": "{profile} profili henüz yayımlanmadı. Kullanılabilir olarak işaretlenmiş bir profil seçin."
"Turn on OEM unlocking": "OEM kilit açmayı etkinleştirin"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "{device} cihazını kapatın ve kablosunu çıkarın. Geri tuşunu ve yanındaki Anbernic tuşunu basılı tutun ve ikisini de bırakmadan USB kablosunu bu bilgisayara takın. Kurulum başlayana kadar basılı tutmaya devam edin."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device} cihazını kapatın ve kablosunu çıkarın. Geri tuşunu basılı tutun ve bırakmadan USB kablosunu bu bilgisayara takın. Kurulum başlayana kadar basılı tutmaya devam edin."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device} cihazını kapatın ve kablosunu çıkarın. Ekranın sağındaki tuş olan Geri tuşunu basılı tutun ve bırakmadan USB kablosunu bu bilgisayara takın. Kurulum başlayana kadar basılı tutmaya devam edin."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "{device} cihazını tamamen kapatın ve kablosunu çıkarın. Sesi Kısma ve Sesi Açma tuşlarını birlikte basılı tutun ve ikisini de bırakmadan USB kablosunu bu bilgisayara takın. Kurulum başlayana kadar basılı tutmaya devam edin."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "{device} cihazını tamamen kapatın. Yükleyici istediğinde USB kablosunu bu bilgisayara takın."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "{device} cihazını kapatın, kartı takın ve cihazı açın. Cihaz karttan dahili depolamasına kendiliğinden kurulur. İşlem bitene kadar ona dokunmayın, ardından cihazı kapatıp kartı çıkarın."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device} cihazını kapatın, kablosunu çıkarın ve tüm SD kartları çıkarın. Kaydırarak açın, ardından yön tuşlarının ortasındaki Geri tuşunu basılı tutun ve bırakmadan USB kablosunu bu bilgisayara takın. Kurulum başlayana kadar basılı tutmaya devam edin."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "{device} cihazını, Geliştirici seçenekleri'nde USB hata ayıklama hâlâ açıkken açın ve bu bilgisayara bağlayın. Cihaz kendiliğinden yeniden başlar ve kurulum başlar."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "{device} cihazını, Geliştirici seçenekleri'nde USB hata ayıklama hâlâ açıkken açın ve bu bilgisayara bağlayın. Kurulum için fastboot moduna yeniden başlar."
"Unlock before flashing": "Flaşlamadan önce kilidi açın"
"Unlock with GammaOS's own steps": "GammaOS'un kendi adımlarıyla kilidi açın"
"Unpacking the firmware": "Yazılım paketi açılıyor"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Kabloyu çıkarın. Güç ve Sesi Kısma tuşlarını en az 60 saniye basılı tutun, ardından bırakmadan USB kablosunu takın. Kurulum başlayana kadar basılı tutmaya devam edin; {device} cihazının bulunması 30 saniye veya daha uzun sürebilir."
"Use a Windows PC": "Windows PC kullanın"
"Use the firmware version the catalog lists for this device.": "Katalogda bu cihaz için belirtilen yazılım sürümünü kullanın."
"Use the volume keys to choose Unlock, then press Power.": "Ses tuşlarıyla \"Unlock\" seçeneğini seçin, ardından Güç tuşuna basın."
"Wait for the first boot": "İlk açılışı bekleyin"
"Wait on the Anbernic logo": "Anbernic logosunda bekleyin"
"Wait through a blank screen": "Boş ekranda bekleyin"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Kurulum bittiğinde, {device} kendiliğinden yeniden başlamadıysa Güç tuşuna bir kez basın."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "Ekranda INFO: LOCK FLAG IS: UNLOCK!!! göründüğünde kilit açılmıştır. Kabloyu çıkarın, {device} cihazının kapalı olduğundan emin olun ve devam edin."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Ekranda Unlock bootloader success! göründüğünde kilit açılmıştır. {device} açılırken zaten kısa süreliğine INFO: LOCK FLAG IS : UNLOCK!!! gösteriyorsa kilidi daha önce açılmıştır ve kilit açmayı atlayabilirsiniz."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "{device} sorduğunda, kilit açmayı onaylamak için 3 saniye içinde Sesi Açma tuşuna basın."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "{device} cihazınızda zaten özel yazılım çalışıyor (kilidi daha önce açılmış). Kilit açma atlanıyor."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "{device} cihazınızda orijinal yazılımı çalışıyor. Yükleyici, cihazı silen temiz bir kurulum yapar."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "{device} cihazınızda hâlâ orijinal yazılımı çalışıyor. Yükleyici kilit açma adımlarında size yol gösterir, ardından cihazı silen temiz bir kurulum yapar."
"needs Android API {n}": "Android API {n} gerekir"
"needs Vulkan": "Vulkan gerekir"
"needs an ARMv8.2 CPU": "ARMv8.2 işlemci gerekir"
"needs {n} GB RAM": "{n} GB RAM gerekir"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device}, {host} üzerinden yüklenemez. Yüklemek için Thimsy Installer'ı bir Windows PC'de çalıştırın."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device}, Allwinner'ın yalnızca Windows'ta çalışan PhoenixSuit aracıyla yüklenir. Yüklemek için Thimsy Installer'ı bir Windows PC'de çalıştırın."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device}, MediaTek'in {host} üzerinde çalışmayan SP Flash Tool aracıyla yüklenir. Yüklemek için Thimsy Installer'ı bir Windows PC'de çalıştırın."
"{device} isn't supported by this version of the installer yet.": "{device}, yükleyicinin bu sürümünde henüz desteklenmiyor."
