"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "取出 microSD 卡，并在“开发者选项”中开启“USB 调试”。在开机状态下将 {device} 连接到这台电脑。它会重启进入 fastbootd：屏幕上会以红色大字显示 fastbootd。"
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "工作区所在的驱动器可能出现故障。请在其他驱动器上选择工作区，然后重新构建。"
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "此版本未附带驱动安装程序。请使用 Zadig 为设备的下载模式安装 WinUSB。"
"The file is damaged or a different version. Delete it and download again.": "文件已损坏或版本不同。请删除后重新下载。"
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "首次启动可能需要 1 到 3 分钟，并可能看起来停在 Anbernic 标志上。这是正常的。"
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "首次启动需要 1 到 3 分钟，屏幕可能看起来停在启动标志上。这是正常的。"
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "首次启动需要几分钟，Thimsy 正在设置模拟器。请勿关机。"
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "无法检查此驱动器的可用空间。请为工作区选择其他文件夹。"
"The installer does a fresh install that erases your {device}, whatever it runs now.": "无论你的 {device} 当前运行什么系统，安装程序都会进行全新安装并清除其数据。"
"The installer runs as root, so it can open the device": "安装程序以 root 身份运行，因此可以打开设备"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} 只需解锁一次，且需在 Windows 电脑上进行：GammaOS Next 安装指南中的 UnlockBootloader 工具（Unisoc T820，第 1 步和第 2 步）只能在 Windows 上运行。请先安装指南的 UnisocTools 中的 Unisoc USB 驱动。然后关闭 {device} 并拔掉数据线，启动 UnlockBootloader.bat，并在 30 秒内按住返回键（屏幕右侧的那个按键），在不松开的情况下插入 USB 数据线。屏幕上出现文字时松开。解锁会清除 {device} 的数据。安装程序不会自己运行该工具。请按照指南操作，然后回来继续。"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} 只需解锁一次，且需在 Windows 电脑上进行：GammaOS Next 安装指南中的 UnlockBootloader 工具（Unisoc T820，第 1 步和第 2 步）只能在 Windows 上运行。请先安装指南的 UnisocTools 中的 Unisoc USB 驱动。然后关闭 {device} 并拔掉数据线，启动 UnlockBootloader.bat，并在 30 秒内按住返回键，在不松开的情况下插入 USB 数据线。屏幕上出现文字时松开。解锁会清除 {device} 的数据。安装程序不会自己运行该工具。请按照指南操作，然后回来继续。"
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "{device} 只需解锁一次，使用 GammaOS Next 安装指南中的网页解锁工具（Anbernic RG405M / RG405V / RG505，第 2 步）。取出 microSD 卡，在“开发者选项”中开启“USB 调试”，然后用 adb reboot bootloader 将 {device} 重启进入 fastboot 模式：屏幕上会在 Anbernic 标志旁显示 fastboot mode。在 Google Chrome 中打开该工具，点击“Connect”，选择设备，然后点击“Unlock”。在 {device} 上不要按音量减键：按主页键 / 返回键确认。在 Linux 或 macOS 上，可以用指南中的 unisoc-unlock 工具完成同样的操作。解锁会清除 {device} 的数据。安装程序不会自己运行这些工具。请按照指南操作，然后回来继续。"
"The {profile} profile isn't published yet. Choose a profile marked available.": "{profile} 配置尚未发布。请选择标记为可用的配置。"
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "此设备运行的不是匹配的 Thimsy 或 GammaOS 版本，因此无法更新。请改用完整安装（会清除设备数据）。"
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "此设备的分区布局与该固件不匹配：可能是其他型号，或者仍在运行需要重新分区的原厂固件，而当前版本还无法重新分区。"
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "此驱动器格式为 FAT32，无法存放超过 4 GB 的文件。请在其他驱动器（NTFS、exFAT、APFS 或 ext4）上选择工作区。"
"This version of the installer expects a different build. Build again, then install.": "此版本的安装程序需要不同的构建。请重新构建，然后安装。"
"Turn it on": "开机"
"Turn on OEM unlocking": "开启 OEM 解锁"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "关闭 {device} 并拔掉数据线。按住返回键和旁边的 Anbernic 键，在不松开的情况下将 USB 数据线连接到这台电脑。一直按住，直到安装开始。"
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "关闭 {device} 并拔掉数据线。按住返回键，在不松开的情况下将 USB 数据线连接到这台电脑。一直按住，直到安装开始。"
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "关闭 {device} 并拔掉数据线。按住返回键（屏幕右侧的那个按键），在不松开的情况下将 USB 数据线连接到这台电脑。一直按住，直到安装开始。"
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "将 {device} 完全关机并拔掉数据线。同时按住音量减键和音量加键，在不松开的情况下将 USB 数据线连接到这台电脑。一直按住，直到安装开始。"
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "将 {device} 完全关机。当安装程序提示时，将 USB 数据线连接到这台电脑，并保持连接直到安装完成。"
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "关闭 {device}，插入存储卡后开机。它会自动从存储卡安装到内部存储，需要几分钟。在它自动关机或重启之前不要操作，之后取出存储卡。"
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "关闭 {device}，插入存储卡后开机。它会自动从存储卡安装到内部存储。安装完成前不要操作，完成后关机并取出存储卡。"
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "关闭 {device}，拔掉数据线并取出所有 SD 卡。滑开机身，然后按住方向键中间的返回键，在不松开的情况下将 USB 数据线连接到这台电脑。一直按住，直到安装开始。"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "在“开发者选项”中保持“USB 调试”开启，打开 {device} 并将其连接到这台电脑。它会自动重启并开始安装。"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "在“开发者选项”中保持“USB 调试”开启，打开 {device} 并将其连接到这台电脑。它会重启进入 fastboot 模式进行安装。"
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "尚未为 {ids} 设置 USB 访问权限。设置时需要输入一次密码。"
"USB access is set up for {ids}": "已为 {ids} 设置 USB 访问权限"
"Unlock before flashing": "刷机前先解锁"
"Unlock with GammaOS's own steps": "按 GammaOS 自己的步骤解锁"
"Unpacking the firmware": "正在解压固件"
"Unpacking {file}": "正在解压 {file}"
"Unplug it and turn it on": "拔掉数据线并开机"
"Unplug the cable when it restarts": "重启时拔掉数据线"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "拔掉数据线。按住电源键和音量减键至少 60 秒，然后在不松开的情况下插入 USB 数据线。一直按住，直到安装开始；找到 {device} 可能需要 30 秒或更久。"
"Updating checksums": "正在更新校验和"
"Use a Windows PC": "使用 Windows 电脑"
"Use the firmware version the catalog lists for this device.": "请使用目录中为此设备列出的固件版本。"
"Use the volume keys to choose Unlock, then press Power.": "用音量键选择“Unlock”，然后按电源键。"
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "等待首次启动"
"Wait on the Anbernic logo": "在 Anbernic 标志处等待"
"Wait through a blank screen": "黑屏时请等待"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "安装完成后，如果 {device} 没有自动重启，请按一次电源键。"
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "安装完成后，{device} 会自动重启并设置存储。此时拔掉数据线。"
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "安装完成后，拔掉数据线并按电源键开启 {device}。"
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "屏幕显示 INFO: LOCK FLAG IS: UNLOCK!!! 时即已解锁。拔掉数据线并确认 {device} 已关机（如果它重启了，请按住电源键直到关机），然后继续。"
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "屏幕显示 Unlock bootloader success! 时即已解锁。如果 {device} 开机时已经短暂显示 INFO: LOCK FLAG IS : UNLOCK!!!，说明之前已经解锁，可以跳过解锁。"
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "当 {device} 询问时，在 3 秒内按音量加键确认解锁。"
"WinUSB is installed for {ids}": "已为 {ids} 安装 WinUSB"
"WinUSB will be installed for {ids} the first time you flash": "首次刷机时将为 {ids} 安装 WinUSB"
"Windows now gives the device the driver the installer needs. Unplug the cable and turn the device off, then repeat the download-mode steps with the same USB port.": "Windows 现在已为设备分配安装程序所需的驱动程序。请拔下数据线并关闭设备，然后使用同一个 USB 端口重复进入下载模式的步骤。"
"WonderSwan": "WonderSwan"
"Writing {partition}": "正在写入 {partition}"
"Wrote {partition}": "已写入 {partition}"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "你的 {device} 已在运行 GammaOS 或 Thimsy。请选择新固件的安装方式。"
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "你的 {device} 已在运行自定义固件（之前已解锁）。将跳过解锁。"
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "你的 {device} 仍在运行原厂固件。安装程序会引导你完成解锁，然后进行全新安装并清除设备数据。"
"hakuX": "hakuX"
"needs Android API {n}": "需要 Android API {n}"
"needs Vulkan": "需要 Vulkan"
"needs an ARMv8.2 CPU": "需要 ARMv8.2 CPU"
"needs {n} GB RAM": "需要 {n} GB 内存"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "无法从 {host} 安装 {device}。请在 Windows 电脑上运行 Thimsy Installer 进行安装。"
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} 需使用 Allwinner 的 PhoenixSuit 安装，该工具仅能在 Windows 上运行。请在 Windows 电脑上运行 Thimsy Installer 进行安装。"
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} 需使用 MediaTek 的 SP Flash Tool 安装，该工具无法在 {host} 上运行。请在 Windows 电脑上运行 Thimsy Installer 进行安装。"
"{device} isn't supported by this version of the installer yet.": "此版本的安装程序尚不支持 {device}。"
"{host} needs no driver": "{host} 无需驱动"
