# Simplified Chinese translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "全新安装会清除内部存储。请将 ROMs、存档、截图以及其他想保留的内容复制到电脑或 microSD 卡。microSD 卡上的游戏不受影响。"
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "请接受 Windows 的权限提示，或使用 Zadig 安装 WinUSB。"
"Already unlocked: install new firmware": "已解锁：安装新固件"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "均衡：经典主机的 RetroArch，外加 N64、Dreamcast、PSP 和 DS 模拟器、ES-DE 主界面和 Brave。"
"Building Thimsy for your device": "正在为你的设备构建 Thimsy"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "基于 RG Cube 的官方 GammaOS Next 1.2 版本构建，下载自 GammaOS 的 GitHub 页面。"
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "开始前请充电至至少 50%，并准备好随机附带的数据线。"
"Charge the RG Cube": "为 RG Cube 充电"
"Check it's unlocked": "确认已解锁"
"Check the basics": "检查基本功能"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "检查按键、触摸屏、声音和 Wi-Fi，并启动一个游戏。"
"Check the cable and that the device is still in its flashing mode, then try again.": "请检查数据线，并确认设备仍处于刷机模式，然后重试。"
"Checking the USB driver": "正在检查 USB 驱动"
"Checking the build": "正在检查构建"
"Checking the plan": "正在检查方案"
"Checking the result": "正在检查结果"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "请在可用空间更大的驱动器（非 FAT32）上选择工作区，或释放一些空间。"
"Confirm on the device": "在设备上确认"
"Confirm with Volume Up": "按音量加键确认"
"Connect it with USB debugging on": "在开启 USB 调试的情况下连接"
"Connect the device in download mode": "以下载模式连接设备"
"Copy games without a card reader": "不用读卡器复制游戏"
"Copy your games and saves": "复制你的游戏和存档"
"Delete the workspace's jobs folder and build again; report it if it persists.": "请删除工作区中的“jobs”文件夹并重新构建；如果问题仍然存在，请报告。"
"Don't install on units made in March 2026 or later.": "请勿在 2026 年 3 月或之后生产的设备上安装。"
"Don't install on units whose stock firmware is v1.26.": "请勿在原厂固件为 v1.26 的设备上安装。"
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "不要把存储卡放回电脑里复制游戏：卡上是加密的 Android 分区布局，电脑不会显示你的存储空间。请改用 USB 文件传输（MTP）、ADB Explorer 或网络共享来复制游戏。"
"Downloading": "正在下载"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "全部：在“标准”基础上增加 GameCube/Wii、3DS、PS2、Xbox 和 PS Vita 模拟器以及高精度核心。完整的 Thimsy 1.0a 套件。"
"Finishing": "正在完成"
"First time installing custom firmware": "首次安装自定义固件"
"Follow the unlock steps shown in the installer, then continue.": "按照安装程序中显示的解锁步骤操作，然后继续。"
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "GammaOS 的指南提醒：刷写未解锁的 {device} 会导致设备变砖。解锁后，{device} 会重启进入原厂 Android。等待 Android 启动完成，然后继续。"
"Heavy": "完整"
"Hold Back and plug in the cable": "按住返回键并插入数据线"
"Hold Back and the Anbernic button, then plug in": "按住返回键和 Anbernic 键，然后插入数据线"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "按住电源键关闭 {device}。按住两个音量键，在不松开的情况下插入 USB 数据线。然后继续按住音量键，同时反复按电源键，直到安装开始。"
"Hold both volume buttons and plug in the cable": "按住两个音量键并插入数据线"
"Hold the Back button, Volume Down and Power together until installation starts again.": "同时按住返回键、音量减键和电源键，直到安装重新开始。"
"If installation doesn't start": "如果安装没有开始"
"If installation stalls": "如果安装卡住"
"If it isn't found": "如果找不到设备"
"If the screen stays black": "如果屏幕一直是黑的"
"Install from the microSD card": "从 microSD 卡安装"
"Installing Thimsy": "正在安装 Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "保留你的数据。仅适用于 RG Cube 已在运行 GammaOS Next 1.2 或 Thimsy 版本的情况。"
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "保留你的数据。仅适用于设备已在运行兼容的 Thimsy 或 GammaOS 版本的情况。"
"Light": "轻量"
"Medium": "标准"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "首次启动时，屏幕可能会黑屏长达一分钟。这是正常的，请等待启动画面出现。"
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "在 {device} 上打开“设置”>“关于”，连续点按“版本号”七次。然后在“设置”>“开发者选项”中开启“USB 调试”和“OEM 解锁”。在开机状态下将 {device} 连接到这台电脑；它会重启进入 fastboot 模式进行安装。"
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "在 {device} 上打开“设置”>“关于”，连续点按“版本号”七次。然后在“设置”>“开发者选项”中开启“USB 调试”和“OEM 解锁”。在开机状态下将 {device} 连接到这台电脑；它会重启进入 fastboot 模式进行解锁。"
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "计划中：在任意电脑上通过 Qualcomm EDL 安装。暂不可构建。"
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "计划中：在 Windows 和 Linux 上使用 SP Flash Tool。暂不可构建。"
"Planned: Windows only. Not buildable yet.": "计划中：仅限 Windows。暂不可构建。"
"Planned: fastboot install on every computer. Not buildable yet.": "计划中：在任意电脑上通过 fastboot 安装。暂不可构建。"
"Planned: microSD card install on every computer. Not buildable yet.": "计划中：在任意电脑上通过 microSD 卡安装。暂不可构建。"
"Planned: same flashing route as the RG Cube. Not buildable yet.": "计划中：与 RG Cube 相同的刷机方式。暂不可构建。"
"Plug in the cable with the device off": "在设备关机时插入数据线"
"Preparing the partitions": "正在准备分区"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "将存储卡插入 {device} 并开机。Thimsy 从存储卡运行，不会改动 {device} 的内部存储：要回到原来的系统，关机并取出存储卡即可。"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "请重新安装 Thimsy Installer，或将 THIMSY_TOOLS_DIR 设置为包含它的文件夹。"
"Restart into fastbootd": "重启进入 fastbootd"
"Restart with Power": "用电源键重启"
"Restarting the device": "正在重启设备"
"Slide it open, hold Back and plug in": "滑开机身，按住返回键并插入数据线"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "适合 PlayStation 及更早经典主机的小型下载：每个主机一个快速 RetroArch 核心、Minima 主界面、无着色器。"
"Start from the microSD card": "从 microSD 卡启动"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "取出 {device} 中的其他 microSD 卡，插入 Thimsy 存储卡并开机。Thimsy 从存储卡运行，不会改动内部存储：要回到原来的系统，关机并取出存储卡即可。"
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "取出所有 SD 卡，然后按住音量减键和电源键，直到 {device} 重启。"
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "取出 microSD 卡，并在“开发者选项”中开启“USB 调试”。在开机状态下将 {device} 连接到这台电脑。它会重启进入 fastbootd：屏幕上会以红色大字显示 fastbootd。"
"The file is damaged or a different version. Delete it and download again.": "文件已损坏或版本不同。请删除后重新下载。"
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "首次启动可能需要 1 到 3 分钟，并可能看起来停在 Anbernic 标志上。这是正常的。"
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "首次启动需要 1 到 3 分钟，屏幕可能看起来停在启动标志上。这是正常的。"
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "首次启动需要几分钟，Thimsy 正在设置模拟器。请勿关机。"
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} 只需解锁一次，使用 GammaOS Next 安装指南中的 UnlockBootloader 工具（Unisoc T820，第 2 步）：关闭 {device}，启动该工具，然后在插入 USB 数据线时按住返回键。安装程序不会自己运行该工具。请按照指南操作，然后回来继续。"
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} 只需解锁一次，使用 GammaOS Next 安装指南中的 UnlockBootloader 工具（Unisoc T820，第 2 步）：关闭 {device}，启动该工具，然后在插入 USB 数据线时按住返回键（屏幕右侧的那个按键）。安装程序不会自己运行该工具。请按照指南操作，然后回来继续。"
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} 只需解锁一次，使用 GammaOS Next 安装指南中的网页解锁工具（Anbernic RG405M / RG405V / RG505，第 2 步）。将 {device} 重启进入 fastboot 模式，在 Google Chrome 中打开该工具，点击“Connect”，然后点击“Unlock”。在 {device} 上不要按音量减键：按主页键 / 返回键确认。安装程序不会自己运行该工具。请按照指南操作，然后回来继续。"
"The {profile} profile isn't published yet. Choose a profile marked available.": "{profile} 配置尚未发布。请选择标记为可用的配置。"
"Turn on OEM unlocking": "开启 OEM 解锁"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "关闭 {device} 并拔掉数据线。按住返回键和旁边的 Anbernic 键，在不松开的情况下将 USB 数据线连接到这台电脑。一直按住，直到安装开始。"
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "关闭 {device} 并拔掉数据线。按住返回键，在不松开的情况下将 USB 数据线连接到这台电脑。一直按住，直到安装开始。"
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "关闭 {device} 并拔掉数据线。按住返回键（屏幕右侧的那个按键），在不松开的情况下将 USB 数据线连接到这台电脑。一直按住，直到安装开始。"
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "将 {device} 完全关机并拔掉数据线。同时按住音量减键和音量加键，在不松开的情况下将 USB 数据线连接到这台电脑。一直按住，直到安装开始。"
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "将 {device} 完全关机。当安装程序提示时，将 USB 数据线连接到这台电脑。"
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "关闭 {device}，插入存储卡后开机。它会自动从存储卡安装到内部存储。安装完成前不要操作，完成后关机并取出存储卡。"
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "关闭 {device}，拔掉数据线并取出所有 SD 卡。滑开机身，然后按住方向键中间的返回键，在不松开的情况下将 USB 数据线连接到这台电脑。一直按住，直到安装开始。"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "在“开发者选项”中保持“USB 调试”开启，打开 {device} 并将其连接到这台电脑。它会自动重启并开始安装。"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "在“开发者选项”中保持“USB 调试”开启，打开 {device} 并将其连接到这台电脑。它会重启进入 fastboot 模式进行安装。"
"Unlock before flashing": "刷机前先解锁"
"Unlock with GammaOS's own steps": "按 GammaOS 自己的步骤解锁"
"Unpacking the firmware": "正在解压固件"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "拔掉数据线。按住电源键和音量减键至少 60 秒，然后在不松开的情况下插入 USB 数据线。一直按住，直到安装开始；找到 {device} 可能需要 30 秒或更久。"
"Use a Windows PC": "使用 Windows 电脑"
"Use the firmware version the catalog lists for this device.": "请使用目录中为此设备列出的固件版本。"
"Use the volume keys to choose Unlock, then press Power.": "用音量键选择“Unlock”，然后按电源键。"
"Wait for the first boot": "等待首次启动"
"Wait on the Anbernic logo": "在 Anbernic 标志处等待"
"Wait through a blank screen": "黑屏时请等待"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "安装完成后，如果 {device} 没有自动重启，请按一次电源键。"
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "屏幕显示 INFO: LOCK FLAG IS: UNLOCK!!! 时即已解锁。拔掉数据线，确认 {device} 已关机，然后继续。"
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "屏幕显示 Unlock bootloader success! 时即已解锁。如果 {device} 开机时已经短暂显示 INFO: LOCK FLAG IS : UNLOCK!!!，说明之前已经解锁，可以跳过解锁。"
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "当 {device} 询问时，在 3 秒内按音量加键确认解锁。"
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "你的 {device} 已在运行自定义固件（之前已解锁）。将跳过解锁。"
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "你的 {device} 正在运行原厂固件。安装程序将进行全新安装，并清除设备数据。"
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "你的 {device} 仍在运行原厂固件。安装程序会引导你完成解锁，然后进行全新安装并清除设备数据。"
"needs Android API {n}": "需要 Android API {n}"
"needs Vulkan": "需要 Vulkan"
"needs an ARMv8.2 CPU": "需要 ARMv8.2 CPU"
"needs {n} GB RAM": "需要 {n} GB 内存"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "无法从 {host} 安装 {device}。请在 Windows 电脑上运行 Thimsy Installer 进行安装。"
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} 需使用 Allwinner 的 PhoenixSuit 安装，该工具仅能在 Windows 上运行。请在 Windows 电脑上运行 Thimsy Installer 进行安装。"
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} 需使用 MediaTek 的 SP Flash Tool 安装，该工具无法在 {host} 上运行。请在 Windows 电脑上运行 Thimsy Installer 进行安装。"
"{device} isn't supported by this version of the installer yet.": "此版本的安装程序尚不支持 {device}。"
