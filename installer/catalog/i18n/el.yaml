"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Τοποθετήστε την κάρτα στο {device} και ενεργοποιήστε το. Το Thimsy εκτελείται από την κάρτα και αφήνει ανέγγιχτο τον εσωτερικό χώρο αποθήκευσης του {device}: για να επιστρέψετε στο αρχικό σύστημα, απενεργοποιήστε το και αφαιρέστε την κάρτα."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Εγκαταστήστε ξανά το Thimsy Installer: το εργαλείο εγγραφής του δεν είναι η έκδοση που αναμένει."
"Reinstall Thimsy Installer: one of its tools is missing.": "Εγκαταστήστε ξανά το Thimsy Installer: λείπει ένα από τα εργαλεία του."
"Repeat the download-mode steps and keep holding the button until installing starts, then try again.": "Επαναλάβετε τα βήματα για τη λειτουργία λήψης, κρατήστε πατημένο το πλήκτρο μέχρι να ξεκινήσει η εγκατάσταση και, στη συνέχεια, δοκιμάστε ξανά."
"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "Επαναλάβετε τα βήματα για τη λειτουργία λήψης και δοκιμάστε ξανά. Αν η συσκευή εξακολουθεί να μην εντοπίζεται, ελέγξτε στη Διαχείριση Συσκευών ότι το Unisoc download mode χρησιμοποιεί το πρόγραμμα οδήγησης WinUSB."
