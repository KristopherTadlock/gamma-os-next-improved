"Slide it open, hold Back and plug in": "Ανοίξτε τη σύροντας, κρατήστε πατημένο το πλήκτρο Πίσω και συνδέστε το καλώδιο"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Μικρή λήψη για κλασικά συστήματα έως το PlayStation: ένας γρήγορος πυρήνας RetroArch ανά σύστημα, η αρχική οθόνη Minima, χωρίς shaders."
"Start from the microSD card": "Εκκίνηση από την κάρτα microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Αφαιρέστε οποιαδήποτε άλλη κάρτα microSD από το {device}, τοποθετήστε την κάρτα του Thimsy και ενεργοποιήστε το. Το Thimsy εκτελείται από την κάρτα και αφήνει ανέγγιχτο τον εσωτερικό χώρο αποθήκευσης: για να επιστρέψετε στο αρχικό σύστημα, απενεργοποιήστε το και αφαιρέστε την κάρτα."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Αφαιρέστε τυχόν κάρτα SD και κρατήστε πατημένα το πλήκτρο μείωσης έντασης και το πλήκτρο λειτουργίας μέχρι να επανεκκινήσει το {device}."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Αφαιρέστε την κάρτα microSD και ενεργοποιήστε τον Εντοπισμό σφαλμάτων USB στις Επιλογές για προγραμματιστές. Συνδέστε το {device} σε αυτόν τον υπολογιστή ενώ είναι ενεργοποιημένο. Επανεκκινεί σε fastbootd: η οθόνη δείχνει fastbootd με μεγάλα κόκκινα γράμματα."
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "Η μονάδα δίσκου όπου βρίσκεται ο χώρος εργασίας ίσως παρουσιάζει βλάβη. Επιλέξτε χώρο εργασίας σε άλλη μονάδα δίσκου και δημιουργήστε ξανά την έκδοση."
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "Το πρόγραμμα εγκατάστασης του προγράμματος οδήγησης δεν περιλαμβάνεται σε αυτή την έκδοση. Εγκαταστήστε το WinUSB για τη λειτουργία λήψης της συσκευής με το Zadig."
"The file is damaged or a different version. Delete it and download again.": "Το αρχείο είναι κατεστραμμένο ή διαφορετικής έκδοσης. Διαγράψτε το και κατεβάστε το ξανά."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Η πρώτη εκκίνηση μπορεί να διαρκέσει 1 έως 3 λεπτά και να φαίνεται κολλημένη στο λογότυπο της Anbernic. Αυτό είναι φυσιολογικό."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Η πρώτη εκκίνηση διαρκεί 1 έως 3 λεπτά και η οθόνη μπορεί να φαίνεται κολλημένη στο λογότυπο εκκίνησης. Αυτό είναι φυσιολογικό."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Η πρώτη εκκίνηση διαρκεί λίγα λεπτά, όσο το Thimsy ρυθμίζει τους εξομοιωτές σας. Μην την απενεργοποιήσετε."
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "Δεν ήταν δυνατός ο έλεγχος του ελεύθερου χώρου σε αυτή τη μονάδα δίσκου. Επιλέξτε άλλον φάκελο για τον χώρο εργασίας."
"The installer does a fresh install that erases your {device}, whatever it runs now.": "Το πρόγραμμα εγκατάστασης κάνει καθαρή εγκατάσταση, η οποία διαγράφει το {device} σας, ό,τι κι αν εκτελεί τώρα."
"The installer runs as root, so it can open the device": "Το πρόγραμμα εγκατάστασης εκτελείται ως root, οπότε μπορεί να ανοίξει τη συσκευή"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Το {device} ξεκλειδώνεται μία φορά, σε υπολογιστή με Windows: το εργαλείο UnlockBootloader από τον οδηγό εγκατάστασης του GammaOS Next (Unisoc T820, Βήματα 1 και 2) λειτουργεί μόνο σε Windows. Εγκαταστήστε πρώτα το πρόγραμμα οδήγησης USB της Unisoc από τα UnisocTools του οδηγού. Έπειτα απενεργοποιήστε το {device} και αποσυνδέστε το, ξεκινήστε το UnlockBootloader.bat και, μέσα σε 30 δευτερόλεπτα, κρατήστε πατημένο το πλήκτρο Πίσω (το πλήκτρο στη δεξιά πλευρά της οθόνης) και, χωρίς να το αφήσετε, συνδέστε το καλώδιο USB. Αφήστε το όταν εμφανιστεί κείμενο στην οθόνη. Το ξεκλείδωμα διαγράφει το {device}. Το πρόγραμμα εγκατάστασης δεν εκτελεί το ίδιο αυτό το εργαλείο. Ακολουθήστε τον οδηγό, έπειτα επιστρέψτε και συνεχίστε."
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Το {device} ξεκλειδώνεται μία φορά, σε υπολογιστή με Windows: το εργαλείο UnlockBootloader από τον οδηγό εγκατάστασης του GammaOS Next (Unisoc T820, Βήματα 1 και 2) λειτουργεί μόνο σε Windows. Εγκαταστήστε πρώτα το πρόγραμμα οδήγησης USB της Unisoc από τα UnisocTools του οδηγού. Έπειτα απενεργοποιήστε το {device} και αποσυνδέστε το, ξεκινήστε το UnlockBootloader.bat και, μέσα σε 30 δευτερόλεπτα, κρατήστε πατημένο το πλήκτρο Πίσω και, χωρίς να το αφήσετε, συνδέστε το καλώδιο USB. Αφήστε το όταν εμφανιστεί κείμενο στην οθόνη. Το ξεκλείδωμα διαγράφει το {device}. Το πρόγραμμα εγκατάστασης δεν εκτελεί το ίδιο αυτό το εργαλείο. Ακολουθήστε τον οδηγό, έπειτα επιστρέψτε και συνεχίστε."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "Το {device} ξεκλειδώνεται μία φορά, με το διαδικτυακό εργαλείο ξεκλειδώματος από τον οδηγό εγκατάστασης του GammaOS Next (Anbernic RG405M / RG405V / RG505, Βήμα 2). Αφαιρέστε την κάρτα microSD, ενεργοποιήστε τον Εντοπισμό σφαλμάτων USB στις Επιλογές για προγραμματιστές και επανεκκινήστε το {device} σε λειτουργία fastboot με την εντολή adb reboot bootloader: η οθόνη δείχνει fastboot mode δίπλα στο λογότυπο της Anbernic. Ανοίξτε το εργαλείο στο Google Chrome, πατήστε «Connect», επιλέξτε τη συσκευή και έπειτα πατήστε «Unlock». Στο {device}, μην πατήσετε το πλήκτρο μείωσης έντασης: πατήστε το πλήκτρο Αρχική / Πίσω για επιβεβαίωση. Σε Linux ή macOS, το εργαλείο unisoc-unlock του οδηγού κάνει το ίδιο. Το ξεκλείδωμα διαγράφει το {device}. Το πρόγραμμα εγκατάστασης δεν εκτελεί το ίδιο αυτά τα εργαλεία. Ακολουθήστε τον οδηγό, έπειτα επιστρέψτε και συνεχίστε."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Το προφίλ {profile} δεν έχει δημοσιευτεί ακόμα. Επιλέξτε ένα προφίλ που επισημαίνεται ως διαθέσιμο."
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "Αυτή η συσκευή δεν εκτελεί αντίστοιχη έκδοση Thimsy ή GammaOS, οπότε δεν μπορεί να ενημερωθεί. Χρησιμοποιήστε αντί γι' αυτό πλήρη εγκατάσταση (διαγράφει τη συσκευή)."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "Η διάταξη διαμερισμάτων αυτής της συσκευής δεν ταιριάζει με αυτό το υλικολογισμικό: είναι διαφορετικό μοντέλο ή εξακολουθεί να έχει το αρχικό υλικολογισμικό, που χρειάζεται νέα διαμέριση, κάτι που αυτή η έκδοση δεν μπορεί να κάνει ακόμη."
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "Αυτή η μονάδα δίσκου είναι μορφοποιημένη ως FAT32, που δεν μπορεί να αποθηκεύσει αρχεία άνω των 4 GB. Επιλέξτε χώρο εργασίας σε άλλη μονάδα δίσκου (NTFS, exFAT, APFS ή ext4)."
"This version of the installer expects a different build. Build again, then install.": "Αυτή η έκδοση του προγράμματος εγκατάστασης αναμένει διαφορετική έκδοση. Δημιουργήστε την ξανά και μετά εγκαταστήστε."
"Turn it on": "Ενεργοποιήστε τη συσκευή"
"Turn on OEM unlocking": "Ενεργοποιήστε το Ξεκλείδωμα OEM"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Απενεργοποιήστε το {device} και αποσυνδέστε το. Κρατήστε πατημένα το πλήκτρο Πίσω και το πλήκτρο Anbernic δίπλα του και, χωρίς να τα αφήσετε, συνδέστε το καλώδιο USB σε αυτόν τον υπολογιστή. Κρατήστε τα πατημένα μέχρι να ξεκινήσει η εγκατάσταση."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Απενεργοποιήστε το {device} και αποσυνδέστε το. Κρατήστε πατημένο το πλήκτρο Πίσω και, χωρίς να το αφήσετε, συνδέστε το καλώδιο USB σε αυτόν τον υπολογιστή. Κρατήστε το πατημένο μέχρι να ξεκινήσει η εγκατάσταση."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Απενεργοποιήστε το {device} και αποσυνδέστε το. Κρατήστε πατημένο το πλήκτρο Πίσω, το πλήκτρο στη δεξιά πλευρά της οθόνης, και, χωρίς να το αφήσετε, συνδέστε το καλώδιο USB σε αυτόν τον υπολογιστή. Κρατήστε το πατημένο μέχρι να ξεκινήσει η εγκατάσταση."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Απενεργοποιήστε εντελώς το {device} και αποσυνδέστε το. Κρατήστε πατημένα μαζί τα πλήκτρα μείωσης και αύξησης έντασης και, χωρίς να τα αφήσετε, συνδέστε το καλώδιο USB σε αυτόν τον υπολογιστή. Κρατήστε τα πατημένα μέχρι να ξεκινήσει η εγκατάσταση."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "Απενεργοποιήστε εντελώς το {device}. Όταν σας το ζητήσει το πρόγραμμα εγκατάστασης, συνδέστε το καλώδιο USB σε αυτόν τον υπολογιστή και αφήστε το συνδεδεμένο μέχρι να ολοκληρωθεί η εγκατάσταση."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "Απενεργοποιήστε το {device}, τοποθετήστε την κάρτα και ενεργοποιήστε το. Εγκαθίσταται μόνο του στον εσωτερικό χώρο αποθήκευσης από την κάρτα, κάτι που διαρκεί λίγα λεπτά. Μην το αγγίξετε μέχρι να απενεργοποιηθεί ή να επανεκκινήσει μόνο του και έπειτα αφαιρέστε την κάρτα."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Απενεργοποιήστε το {device}, τοποθετήστε την κάρτα και ενεργοποιήστε το. Εγκαθίσταται μόνο του στον εσωτερικό χώρο αποθήκευσης από την κάρτα. Μην το αγγίξετε μέχρι να τελειώσει, έπειτα απενεργοποιήστε το και αφαιρέστε την κάρτα."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Απενεργοποιήστε το {device}, αποσυνδέστε το και αφαιρέστε όλες τις κάρτες SD. Ανοίξτε το σύροντάς το, έπειτα κρατήστε πατημένο το πλήκτρο Πίσω στη μέση του joypad και, χωρίς να το αφήσετε, συνδέστε το καλώδιο USB σε αυτόν τον υπολογιστή. Κρατήστε το πατημένο μέχρι να ξεκινήσει η εγκατάσταση."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Ενεργοποιήστε το {device}, με τον Εντοπισμό σφαλμάτων USB ακόμη ενεργό στις Επιλογές για προγραμματιστές, και συνδέστε το σε αυτόν τον υπολογιστή. Επανεκκινεί μόνο του και η εγκατάσταση ξεκινά."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Ενεργοποιήστε το {device}, με τον Εντοπισμό σφαλμάτων USB ακόμη ενεργό στις Επιλογές για προγραμματιστές, και συνδέστε το σε αυτόν τον υπολογιστή. Επανεκκινεί σε λειτουργία fastboot για την εγκατάσταση."
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "Η πρόσβαση USB για {ids} δεν έχει ρυθμιστεί ακόμα. Η ρύθμισή της ζητά τον κωδικό πρόσβασής σας μία φορά."
"USB access is set up for {ids}": "Η πρόσβαση USB έχει ρυθμιστεί για {ids}"
"Unlock before flashing": "Ξεκλειδώστε πριν από την εγγραφή"
"Unlock with GammaOS's own steps": "Ξεκλείδωμα με τα βήματα του GammaOS"
"Unpacking the firmware": "Αποσυμπίεση του υλικολογισμικού"
"Unpacking {file}": "Αποσυμπίεση {file}"
"Unplug it and turn it on": "Αποσυνδέστε το καλώδιο και ενεργοποιήστε τη συσκευή"
"Unplug the cable when it restarts": "Αποσυνδέστε το καλώδιο όταν επανεκκινήσει"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Αποσυνδέστε το καλώδιο. Κρατήστε πατημένα το πλήκτρο λειτουργίας και το πλήκτρο μείωσης έντασης για τουλάχιστον 60 δευτερόλεπτα και, χωρίς να τα αφήσετε, συνδέστε το καλώδιο USB. Κρατήστε τα πατημένα μέχρι να ξεκινήσει η εγκατάσταση· ο εντοπισμός του {device} μπορεί να διαρκέσει 30 δευτερόλεπτα ή περισσότερο."
"Updating checksums": "Ενημέρωση αθροισμάτων ελέγχου"
"Use a Windows PC": "Χρησιμοποιήστε υπολογιστή με Windows"
"Use the firmware version the catalog lists for this device.": "Χρησιμοποιήστε την έκδοση υλικολογισμικού που αναφέρει ο κατάλογος για αυτή τη συσκευή."
"Use the volume keys to choose Unlock, then press Power.": "Επιλέξτε «Unlock» με τα πλήκτρα έντασης και πατήστε το πλήκτρο λειτουργίας."
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "Περιμένετε την πρώτη εκκίνηση"
"Wait on the Anbernic logo": "Περιμένετε στο λογότυπο της Anbernic"
"Wait through a blank screen": "Περιμένετε ακόμη κι αν η οθόνη είναι κενή"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Όταν ολοκληρωθεί η εγκατάσταση, πατήστε μία φορά το πλήκτρο λειτουργίας αν το {device} δεν έχει επανεκκινήσει μόνο του."
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "Όταν ολοκληρωθεί η εγκατάσταση, το {device} επανεκκινεί μόνο του και ρυθμίζει τον αποθηκευτικό του χώρο. Τότε αποσυνδέστε το καλώδιο."
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "Όταν ολοκληρωθεί η εγκατάσταση, αποσυνδέστε το καλώδιο και πατήστε το πλήκτρο λειτουργίας για να ενεργοποιήσετε το {device}."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "Όταν η οθόνη εμφανίσει INFO: LOCK FLAG IS: UNLOCK!!!, είναι ξεκλείδωτο. Αποσυνδέστε το καλώδιο και βεβαιωθείτε ότι το {device} είναι απενεργοποιημένο (αν επανεκκινήσει, κρατήστε πατημένο το πλήκτρο λειτουργίας μέχρι να απενεργοποιηθεί) και έπειτα συνεχίστε."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Όταν η οθόνη εμφανίσει Unlock bootloader success!, είναι ξεκλείδωτο. Αν το {device} εμφανίζει ήδη για λίγο INFO: LOCK FLAG IS : UNLOCK!!! κατά την εκκίνηση, είχε ξεκλειδωθεί από πριν και μπορείτε να παραλείψετε το ξεκλείδωμα."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Όταν το ζητήσει το {device}, πατήστε το πλήκτρο αύξησης έντασης μέσα σε 3 δευτερόλεπτα για να επιβεβαιώσετε το ξεκλείδωμα."
"WinUSB is installed for {ids}": "Το WinUSB έχει εγκατασταθεί για {ids}"
"WinUSB will be installed for {ids} the first time you flash": "Το WinUSB θα εγκατασταθεί για {ids} την πρώτη φορά που θα κάνετε flash"
"WonderSwan": "WonderSwan"
"Writing {partition}": "Εγγραφή {partition}"
"Wrote {partition}": "Εγγράφηκε το {partition}"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "Το {device} σας εκτελεί ήδη GammaOS ή Thimsy. Επιλέξτε πώς θα εγκατασταθεί το νέο υλικολογισμικό."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Το {device} σας εκτελεί ήδη προσαρμοσμένο υλικολογισμικό (έχει ξεκλειδωθεί στο παρελθόν). Το ξεκλείδωμα παραλείπεται."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Το {device} σας εκτελεί ακόμα το αρχικό του υλικολογισμικό. Το πρόγραμμα εγκατάστασης σας καθοδηγεί στο ξεκλείδωμα και μετά κάνει καθαρή εγκατάσταση, η οποία διαγράφει τη συσκευή."
"hakuX": "hakuX"
"needs Android API {n}": "απαιτεί Android API {n}"
"needs Vulkan": "απαιτεί Vulkan"
"needs an ARMv8.2 CPU": "απαιτεί επεξεργαστή ARMv8.2"
"needs {n} GB RAM": "απαιτεί {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "Το {device} δεν μπορεί να εγκατασταθεί από {host}. Εκτελέστε το Thimsy Installer σε υπολογιστή με Windows για να το εγκαταστήσετε."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "Το {device} εγκαθίσταται με το PhoenixSuit της Allwinner, που λειτουργεί μόνο σε Windows. Εκτελέστε το Thimsy Installer σε υπολογιστή με Windows για να το εγκαταστήσετε."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "Το {device} εγκαθίσταται με το SP Flash Tool της MediaTek, που δεν λειτουργεί σε {host}. Εκτελέστε το Thimsy Installer σε υπολογιστή με Windows για να το εγκαταστήσετε."
"{device} isn't supported by this version of the installer yet.": "Το {device} δεν υποστηρίζεται ακόμα από αυτή την έκδοση του προγράμματος εγκατάστασης."
"{host} needs no driver": "Το {host} δεν χρειάζεται πρόγραμμα οδήγησης"
