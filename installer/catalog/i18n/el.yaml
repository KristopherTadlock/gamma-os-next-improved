"Hold both volume buttons and plug in the cable": "Κρατήστε πατημένα και τα δύο πλήκτρα έντασης και συνδέστε το καλώδιο"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Κρατήστε πατημένα μαζί το πλήκτρο Πίσω, το πλήκτρο μείωσης έντασης και το πλήκτρο λειτουργίας μέχρι να ξεκινήσει ξανά η εγκατάσταση."
