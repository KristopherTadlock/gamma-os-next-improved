# Greek translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Μια καθαρή εγκατάσταση διαγράφει τον εσωτερικό χώρο αποθήκευσης. Αντιγράψτε τα ROMs, τα αποθηκευμένα παιχνίδια, τα στιγμιότυπα οθόνης και ό,τι άλλο θέλετε να κρατήσετε στον υπολογιστή σας ή στην κάρτα microSD. Τα παιχνίδια στην κάρτα microSD δεν επηρεάζονται."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Αποδεχτείτε το αίτημα άδειας των Windows ή εγκαταστήστε το WinUSB με το Zadig."
"Already unlocked: install new firmware": "Ήδη ξεκλείδωτη: εγκατάσταση νέου υλικολογισμικού"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Ισορροπημένο: RetroArch για κλασικά συστήματα, καθώς και εξομοιωτές N64, Dreamcast, PSP και DS, η αρχική οθόνη ES-DE και το Brave."
"Building Thimsy for your device": "Δημιουργία του Thimsy για τη συσκευή σας"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Δημιουργήθηκε από την επίσημη έκδοση GammaOS Next 1.2 για το RG Cube, που λήφθηκε από τη σελίδα του GammaOS στο GitHub."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Φορτίστε τη συσκευή τουλάχιστον στο 50% πριν ξεκινήσετε και έχετε πρόχειρο το καλώδιο που τη συνόδευε."
"Charge the RG Cube": "Φορτίστε το RG Cube"
"Check it's unlocked": "Ελέγξτε ότι είναι ξεκλείδωτη"
"Check the basics": "Ελέγξτε τα βασικά"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Ελέγξτε τα κουμπιά, την οθόνη αφής, τον ήχο και το Wi-Fi και ξεκινήστε ένα παιχνίδι."
"Check the cable and that the device is still in its flashing mode, then try again.": "Ελέγξτε το καλώδιο και ότι η συσκευή βρίσκεται ακόμα σε λειτουργία flash και δοκιμάστε ξανά."
"Checking the USB driver": "Έλεγχος του προγράμματος οδήγησης USB"
"Checking the build": "Έλεγχος της έκδοσης"
"Checking the plan": "Έλεγχος του σχεδίου"
"Checking the result": "Έλεγχος του αποτελέσματος"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Επιλέξτε χώρο εργασίας σε μονάδα δίσκου με περισσότερο ελεύθερο χώρο (όχι FAT32) ή ελευθερώστε χώρο."
"Confirm on the device": "Επιβεβαιώστε στη συσκευή"
"Confirm with Volume Up": "Επιβεβαιώστε με το πλήκτρο αύξησης έντασης"
"Connect it with USB debugging on": "Συνδέστε τη με ενεργό τον εντοπισμό σφαλμάτων USB"
"Connect the device in download mode": "Συνδέστε τη συσκευή σε λειτουργία λήψης"
"Copy games without a card reader": "Αντιγράψτε παιχνίδια χωρίς αναγνώστη καρτών"
"Copy your games and saves": "Αντιγράψτε τα παιχνίδια και τα αποθηκευμένα σας"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Διαγράψτε τον φάκελο «jobs» του χώρου εργασίας και δημιουργήστε ξανά την έκδοση· αν το πρόβλημα παραμένει, αναφέρετέ το."
"Don't install on units made in March 2026 or later.": "Μην εγκαθιστάτε σε συσκευές που κατασκευάστηκαν τον Μάρτιο του 2026 ή αργότερα."
"Don't install on units whose stock firmware is v1.26.": "Μην εγκαθιστάτε σε συσκευές με εργοστασιακό υλικολογισμικό v1.26."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "Μην ξαναβάλετε την κάρτα σε υπολογιστή για να αντιγράψετε παιχνίδια: περιέχει κρυπτογραφημένη διάταξη Android, οπότε ο υπολογιστής δεν θα εμφανίσει τον αποθηκευτικό σας χώρο. Αντιγράψτε τα παιχνίδια μέσω μεταφοράς αρχείων USB (MTP), με το ADB Explorer ή από κοινόχρηστο φάκελο δικτύου."
"Downloading": "Λήψη"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Όλα: Μεσαίο συν εξομοιωτές GameCube/Wii, 3DS, PS2, Xbox και PS Vita και οι πυρήνες υψηλής ακρίβειας. Το πλήρες σετ Thimsy 1.0a."
"Finishing": "Ολοκλήρωση"
"First time installing custom firmware": "Πρώτη εγκατάσταση προσαρμοσμένου υλικολογισμικού"
"Follow the unlock steps shown in the installer, then continue.": "Ακολουθήστε τα βήματα ξεκλειδώματος που εμφανίζει το πρόγραμμα εγκατάστασης και συνεχίστε."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "Ο οδηγός του GammaOS προειδοποιεί ότι η εγγραφή υλικολογισμικού σε {device} που δεν έχει ξεκλειδωθεί το καθιστά άχρηστο. Μετά το ξεκλείδωμα, το {device} επανεκκινεί στο αρχικό του Android. Περιμένετε να ξεκινήσει το Android και μετά συνεχίστε."
"Heavy": "Πλήρες"
"Hold Back and plug in the cable": "Κρατήστε πατημένο το πλήκτρο Πίσω και συνδέστε το καλώδιο"
"Hold Back and the Anbernic button, then plug in": "Κρατήστε πατημένα το πλήκτρο Πίσω και το πλήκτρο Anbernic και συνδέστε το καλώδιο"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Κρατήστε πατημένο το πλήκτρο λειτουργίας για να απενεργοποιήσετε το {device}. Κρατήστε πατημένα και τα δύο πλήκτρα έντασης και, χωρίς να τα αφήσετε, συνδέστε το καλώδιο USB. Έπειτα πατάτε συνεχόμενα το πλήκτρο λειτουργίας, κρατώντας ακόμη πατημένα τα πλήκτρα έντασης, μέχρι να ξεκινήσει η εγκατάσταση."
"Hold both volume buttons and plug in the cable": "Κρατήστε πατημένα και τα δύο πλήκτρα έντασης και συνδέστε το καλώδιο"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Κρατήστε πατημένα μαζί το πλήκτρο Πίσω, το πλήκτρο μείωσης έντασης και το πλήκτρο λειτουργίας μέχρι να ξεκινήσει ξανά η εγκατάσταση."
"If installation doesn't start": "Αν η εγκατάσταση δεν ξεκινά"
"If installation stalls": "Αν η εγκατάσταση κολλήσει"
"If it isn't found": "Αν δεν εντοπίζεται"
"If the screen stays black": "Αν η οθόνη παραμένει μαύρη"
"Install from the microSD card": "Εγκατάσταση από την κάρτα microSD"
"Installing Thimsy": "Εγκατάσταση του Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Διατηρεί τα δεδομένα σας. Μόνο αν το RG Cube εκτελεί ήδη το GammaOS Next 1.2 ή μια έκδοση Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Διατηρεί τα δεδομένα σας. Μόνο αν η συσκευή εκτελεί ήδη μια συμβατή έκδοση Thimsy ή GammaOS."
"Light": "Ελαφρύ"
"Medium": "Μεσαίο"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "Στην πολύ πρώτη εκκίνηση η οθόνη μπορεί να μείνει κενή έως και ένα λεπτό. Αυτό είναι φυσιολογικό· περιμένετε να εμφανιστεί η οθόνη εκκίνησης."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "Στο {device}, ανοίξτε Ρυθμίσεις, Σχετικά με το τηλέφωνο και πατήστε επτά φορές τον Αριθμό έκδοσης. Έπειτα, στις Ρυθμίσεις, Επιλογές για προγραμματιστές, ενεργοποιήστε τον Εντοπισμό σφαλμάτων USB και το Ξεκλείδωμα OEM. Συνδέστε το {device} σε αυτόν τον υπολογιστή ενώ είναι ενεργοποιημένο· επανεκκινεί σε λειτουργία fastboot για την εγκατάσταση."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "Στο {device}, ανοίξτε Ρυθμίσεις, Σχετικά με το τηλέφωνο και πατήστε επτά φορές τον Αριθμό έκδοσης. Έπειτα, στις Ρυθμίσεις, Επιλογές για προγραμματιστές, ενεργοποιήστε τον Εντοπισμό σφαλμάτων USB και το Ξεκλείδωμα OEM. Συνδέστε το {device} σε αυτόν τον υπολογιστή ενώ είναι ενεργοποιημένο· επανεκκινεί σε λειτουργία fastboot για το ξεκλείδωμα."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Προγραμματίζεται: εγκατάσταση μέσω Qualcomm EDL σε κάθε υπολογιστή. Δεν είναι ακόμα διαθέσιμο."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Προγραμματίζεται: SP Flash Tool σε Windows και Linux. Δεν είναι ακόμα διαθέσιμο."
"Planned: Windows only. Not buildable yet.": "Προγραμματίζεται: μόνο Windows. Δεν είναι ακόμα διαθέσιμο."
"Planned: fastboot install on every computer. Not buildable yet.": "Προγραμματίζεται: εγκατάσταση μέσω fastboot σε κάθε υπολογιστή. Δεν είναι ακόμα διαθέσιμο."
"Planned: microSD card install on every computer. Not buildable yet.": "Προγραμματίζεται: εγκατάσταση μέσω κάρτας microSD σε κάθε υπολογιστή. Δεν είναι ακόμα διαθέσιμο."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Προγραμματίζεται: ίδια μέθοδος flash με το RG Cube. Δεν είναι ακόμα διαθέσιμο."
"Plug in the cable with the device off": "Συνδέστε το καλώδιο με τη συσκευή απενεργοποιημένη"
"Preparing the partitions": "Προετοιμασία των διαμερισμάτων"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Τοποθετήστε την κάρτα στο {device} και ενεργοποιήστε το. Το Thimsy εκτελείται από την κάρτα και αφήνει ανέγγιχτο τον εσωτερικό χώρο αποθήκευσης του {device}: για να επιστρέψετε στο αρχικό σύστημα, απενεργοποιήστε το και αφαιρέστε την κάρτα."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Εγκαταστήστε ξανά το Thimsy Installer ή ορίστε το THIMSY_TOOLS_DIR σε έναν φάκελο που το περιέχει."
"Restart into fastbootd": "Επανεκκίνηση σε fastbootd"
"Restart with Power": "Επανεκκίνηση με το πλήκτρο λειτουργίας"
"Restarting the device": "Επανεκκίνηση της συσκευής"
"Slide it open, hold Back and plug in": "Ανοίξτε τη σύροντας, κρατήστε πατημένο το πλήκτρο Πίσω και συνδέστε το καλώδιο"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Μικρή λήψη για κλασικά συστήματα έως το PlayStation: ένας γρήγορος πυρήνας RetroArch ανά σύστημα, η αρχική οθόνη Minima, χωρίς shaders."
"Start from the microSD card": "Εκκίνηση από την κάρτα microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Αφαιρέστε οποιαδήποτε άλλη κάρτα microSD από το {device}, τοποθετήστε την κάρτα του Thimsy και ενεργοποιήστε το. Το Thimsy εκτελείται από την κάρτα και αφήνει ανέγγιχτο τον εσωτερικό χώρο αποθήκευσης: για να επιστρέψετε στο αρχικό σύστημα, απενεργοποιήστε το και αφαιρέστε την κάρτα."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Αφαιρέστε τυχόν κάρτα SD και κρατήστε πατημένα το πλήκτρο μείωσης έντασης και το πλήκτρο λειτουργίας μέχρι να επανεκκινήσει το {device}."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Αφαιρέστε την κάρτα microSD και ενεργοποιήστε τον Εντοπισμό σφαλμάτων USB στις Επιλογές για προγραμματιστές. Συνδέστε το {device} σε αυτόν τον υπολογιστή ενώ είναι ενεργοποιημένο. Επανεκκινεί σε fastbootd: η οθόνη δείχνει fastbootd με μεγάλα κόκκινα γράμματα."
"The file is damaged or a different version. Delete it and download again.": "Το αρχείο είναι κατεστραμμένο ή διαφορετικής έκδοσης. Διαγράψτε το και κατεβάστε το ξανά."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Η πρώτη εκκίνηση μπορεί να διαρκέσει 1 έως 3 λεπτά και να φαίνεται κολλημένη στο λογότυπο της Anbernic. Αυτό είναι φυσιολογικό."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Η πρώτη εκκίνηση διαρκεί 1 έως 3 λεπτά και η οθόνη μπορεί να φαίνεται κολλημένη στο λογότυπο εκκίνησης. Αυτό είναι φυσιολογικό."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Η πρώτη εκκίνηση διαρκεί λίγα λεπτά, όσο το Thimsy ρυθμίζει τους εξομοιωτές σας. Μην την απενεργοποιήσετε."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Το {device} ξεκλειδώνεται μία φορά, με το εργαλείο UnlockBootloader από τον οδηγό εγκατάστασης του GammaOS Next (Unisoc T820, Βήμα 2): απενεργοποιήστε το {device}, ξεκινήστε το εργαλείο και κρατήστε πατημένο το πλήκτρο Πίσω ενώ συνδέετε το καλώδιο USB. Το πρόγραμμα εγκατάστασης δεν εκτελεί το ίδιο αυτό το εργαλείο. Ακολουθήστε τον οδηγό, έπειτα επιστρέψτε και συνεχίστε."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Το {device} ξεκλειδώνεται μία φορά, με το εργαλείο UnlockBootloader από τον οδηγό εγκατάστασης του GammaOS Next (Unisoc T820, Βήμα 2): απενεργοποιήστε το {device}, ξεκινήστε το εργαλείο και κρατήστε πατημένο το πλήκτρο Πίσω, το πλήκτρο στη δεξιά πλευρά της οθόνης, ενώ συνδέετε το καλώδιο USB. Το πρόγραμμα εγκατάστασης δεν εκτελεί το ίδιο αυτό το εργαλείο. Ακολουθήστε τον οδηγό, έπειτα επιστρέψτε και συνεχίστε."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Το {device} ξεκλειδώνεται μία φορά, με το διαδικτυακό εργαλείο ξεκλειδώματος από τον οδηγό εγκατάστασης του GammaOS Next (Anbernic RG405M / RG405V / RG505, Βήμα 2). Επανεκκινήστε το {device} σε λειτουργία fastboot, ανοίξτε το εργαλείο στο Google Chrome, πατήστε «Connect» και έπειτα «Unlock». Στο {device}, μην πατήσετε το πλήκτρο μείωσης έντασης: πατήστε το πλήκτρο Αρχική / Πίσω για επιβεβαίωση. Το πρόγραμμα εγκατάστασης δεν εκτελεί το ίδιο αυτό το εργαλείο. Ακολουθήστε τον οδηγό, έπειτα επιστρέψτε και συνεχίστε."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Το προφίλ {profile} δεν έχει δημοσιευτεί ακόμα. Επιλέξτε ένα προφίλ που επισημαίνεται ως διαθέσιμο."
"Turn on OEM unlocking": "Ενεργοποιήστε το Ξεκλείδωμα OEM"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Απενεργοποιήστε το {device} και αποσυνδέστε το. Κρατήστε πατημένα το πλήκτρο Πίσω και το πλήκτρο Anbernic δίπλα του και, χωρίς να τα αφήσετε, συνδέστε το καλώδιο USB σε αυτόν τον υπολογιστή. Κρατήστε τα πατημένα μέχρι να ξεκινήσει η εγκατάσταση."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Απενεργοποιήστε το {device} και αποσυνδέστε το. Κρατήστε πατημένο το πλήκτρο Πίσω και, χωρίς να το αφήσετε, συνδέστε το καλώδιο USB σε αυτόν τον υπολογιστή. Κρατήστε το πατημένο μέχρι να ξεκινήσει η εγκατάσταση."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Απενεργοποιήστε το {device} και αποσυνδέστε το. Κρατήστε πατημένο το πλήκτρο Πίσω, το πλήκτρο στη δεξιά πλευρά της οθόνης, και, χωρίς να το αφήσετε, συνδέστε το καλώδιο USB σε αυτόν τον υπολογιστή. Κρατήστε το πατημένο μέχρι να ξεκινήσει η εγκατάσταση."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Απενεργοποιήστε εντελώς το {device} και αποσυνδέστε το. Κρατήστε πατημένα μαζί τα πλήκτρα μείωσης και αύξησης έντασης και, χωρίς να τα αφήσετε, συνδέστε το καλώδιο USB σε αυτόν τον υπολογιστή. Κρατήστε τα πατημένα μέχρι να ξεκινήσει η εγκατάσταση."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "Απενεργοποιήστε εντελώς το {device}. Όταν σας το ζητήσει το πρόγραμμα εγκατάστασης, συνδέστε το καλώδιο USB σε αυτόν τον υπολογιστή."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Απενεργοποιήστε το {device}, τοποθετήστε την κάρτα και ενεργοποιήστε το. Εγκαθίσταται μόνο του στον εσωτερικό χώρο αποθήκευσης από την κάρτα. Μην το αγγίξετε μέχρι να τελειώσει, έπειτα απενεργοποιήστε το και αφαιρέστε την κάρτα."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Απενεργοποιήστε το {device}, αποσυνδέστε το και αφαιρέστε όλες τις κάρτες SD. Ανοίξτε το σύροντάς το, έπειτα κρατήστε πατημένο το πλήκτρο Πίσω στη μέση του joypad και, χωρίς να το αφήσετε, συνδέστε το καλώδιο USB σε αυτόν τον υπολογιστή. Κρατήστε το πατημένο μέχρι να ξεκινήσει η εγκατάσταση."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Ενεργοποιήστε το {device}, με τον Εντοπισμό σφαλμάτων USB ακόμη ενεργό στις Επιλογές για προγραμματιστές, και συνδέστε το σε αυτόν τον υπολογιστή. Επανεκκινεί μόνο του και η εγκατάσταση ξεκινά."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Ενεργοποιήστε το {device}, με τον Εντοπισμό σφαλμάτων USB ακόμη ενεργό στις Επιλογές για προγραμματιστές, και συνδέστε το σε αυτόν τον υπολογιστή. Επανεκκινεί σε λειτουργία fastboot για την εγκατάσταση."
"Unlock before flashing": "Ξεκλειδώστε πριν από την εγγραφή"
"Unlock with GammaOS's own steps": "Ξεκλείδωμα με τα βήματα του GammaOS"
"Unpacking the firmware": "Αποσυμπίεση του υλικολογισμικού"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Αποσυνδέστε το καλώδιο. Κρατήστε πατημένα το πλήκτρο λειτουργίας και το πλήκτρο μείωσης έντασης για τουλάχιστον 60 δευτερόλεπτα και, χωρίς να τα αφήσετε, συνδέστε το καλώδιο USB. Κρατήστε τα πατημένα μέχρι να ξεκινήσει η εγκατάσταση· ο εντοπισμός του {device} μπορεί να διαρκέσει 30 δευτερόλεπτα ή περισσότερο."
"Use a Windows PC": "Χρησιμοποιήστε υπολογιστή με Windows"
"Use the firmware version the catalog lists for this device.": "Χρησιμοποιήστε την έκδοση υλικολογισμικού που αναφέρει ο κατάλογος για αυτή τη συσκευή."
"Use the volume keys to choose Unlock, then press Power.": "Επιλέξτε «Unlock» με τα πλήκτρα έντασης και πατήστε το πλήκτρο λειτουργίας."
"Wait for the first boot": "Περιμένετε την πρώτη εκκίνηση"
"Wait on the Anbernic logo": "Περιμένετε στο λογότυπο της Anbernic"
"Wait through a blank screen": "Περιμένετε ακόμη κι αν η οθόνη είναι κενή"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Όταν ολοκληρωθεί η εγκατάσταση, πατήστε μία φορά το πλήκτρο λειτουργίας αν το {device} δεν έχει επανεκκινήσει μόνο του."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "Όταν η οθόνη εμφανίσει INFO: LOCK FLAG IS: UNLOCK!!!, είναι ξεκλείδωτο. Αποσυνδέστε το καλώδιο, βεβαιωθείτε ότι το {device} είναι απενεργοποιημένο και συνεχίστε."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Όταν η οθόνη εμφανίσει Unlock bootloader success!, είναι ξεκλείδωτο. Αν το {device} εμφανίζει ήδη για λίγο INFO: LOCK FLAG IS : UNLOCK!!! κατά την εκκίνηση, είχε ξεκλειδωθεί από πριν και μπορείτε να παραλείψετε το ξεκλείδωμα."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Όταν το ζητήσει το {device}, πατήστε το πλήκτρο αύξησης έντασης μέσα σε 3 δευτερόλεπτα για να επιβεβαιώσετε το ξεκλείδωμα."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Το {device} σας εκτελεί ήδη προσαρμοσμένο υλικολογισμικό (έχει ξεκλειδωθεί στο παρελθόν). Το ξεκλείδωμα παραλείπεται."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Το {device} σας εκτελεί το αρχικό του υλικολογισμικό. Το πρόγραμμα εγκατάστασης κάνει καθαρή εγκατάσταση, η οποία διαγράφει τη συσκευή."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Το {device} σας εκτελεί ακόμα το αρχικό του υλικολογισμικό. Το πρόγραμμα εγκατάστασης σας καθοδηγεί στο ξεκλείδωμα και μετά κάνει καθαρή εγκατάσταση, η οποία διαγράφει τη συσκευή."
"needs Android API {n}": "απαιτεί Android API {n}"
"needs Vulkan": "απαιτεί Vulkan"
"needs an ARMv8.2 CPU": "απαιτεί επεξεργαστή ARMv8.2"
"needs {n} GB RAM": "απαιτεί {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "Το {device} δεν μπορεί να εγκατασταθεί από {host}. Εκτελέστε το Thimsy Installer σε υπολογιστή με Windows για να το εγκαταστήσετε."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "Το {device} εγκαθίσταται με το PhoenixSuit της Allwinner, που λειτουργεί μόνο σε Windows. Εκτελέστε το Thimsy Installer σε υπολογιστή με Windows για να το εγκαταστήσετε."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "Το {device} εγκαθίσταται με το SP Flash Tool της MediaTek, που δεν λειτουργεί σε {host}. Εκτελέστε το Thimsy Installer σε υπολογιστή με Windows για να το εγκαταστήσετε."
"{device} isn't supported by this version of the installer yet.": "Το {device} δεν υποστηρίζεται ακόμα από αυτή την έκδοση του προγράμματος εγκατάστασης."
