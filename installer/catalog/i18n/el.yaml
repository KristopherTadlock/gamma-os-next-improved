"In Android Settings, Storage, check whether the {device} has 128 GB or 256 GB. Each size needs its own layout, and installing the wrong one can brick the {device}.": "Στις Ρυθμίσεις του Android, Αποθηκευτικός χώρος, ελέγξτε αν το {device} έχει 128 GB ή 256 GB. Κάθε μέγεθος χρειάζεται τη δική του διάταξη και η εγκατάσταση λάθος διάταξης μπορεί να καταστήσει το {device} άχρηστο."
"In Settings, Handheld Settings, About Device, Device Information, note the first four characters of the SN (MQ65 or MQ66). Each hardware revision needs its own firmware.": "Στις Ρυθμίσεις, Ρυθμίσεις φορητής κονσόλας, Σχετικά με τη συσκευή, Πληροφορίες συσκευής, σημειώστε τους πρώτους τέσσερις χαρακτήρες του SN (MQ65 ή MQ66). Κάθε έκδοση υλικού χρειάζεται το δικό της υλικολογισμικό."
"Inside the device pack.": "Περιλαμβάνεται στο πακέτο συσκευής."
