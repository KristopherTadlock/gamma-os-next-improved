"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "Ο οδηγός του GammaOS προειδοποιεί ότι η εγγραφή υλικολογισμικού σε {device} που δεν έχει ξεκλειδωθεί το καθιστά άχρηστο. Μετά το ξεκλείδωμα, το {device} επανεκκινεί στο αρχικό του Android. Περιμένετε να ξεκινήσει το Android και μετά συνεχίστε."
