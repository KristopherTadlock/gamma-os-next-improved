# Greek translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Μια καθαρή εγκατάσταση διαγράφει τον εσωτερικό χώρο αποθήκευσης. Αντιγράψτε τα ROMs, τα αποθηκευμένα παιχνίδια, τα στιγμιότυπα οθόνης και ό,τι άλλο θέλετε να κρατήσετε στον υπολογιστή σας ή στην κάρτα microSD. Τα παιχνίδια στην κάρτα microSD δεν επηρεάζονται."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Αποδεχτείτε το αίτημα άδειας των Windows ή εγκαταστήστε το WinUSB με το Zadig."
"Already unlocked: install new firmware": "Ήδη ξεκλείδωτη: εγκατάσταση νέου υλικολογισμικού"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Ισορροπημένο: RetroArch για κλασικά συστήματα, καθώς και εξομοιωτές N64, Dreamcast, PSP και DS, η αρχική οθόνη ES-DE και το Brave."
"Building Thimsy for your device": "Δημιουργία του Thimsy για τη συσκευή σας"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Δημιουργήθηκε από την επίσημη έκδοση GammaOS Next 1.2 για το RG Cube, που λήφθηκε από τη σελίδα του GammaOS στο GitHub."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Φορτίστε τη συσκευή τουλάχιστον στο 50% πριν ξεκινήσετε και έχετε πρόχειρο το καλώδιο που τη συνόδευε."
"Charge the RG Cube": "Φορτίστε το RG Cube"
"Check it's unlocked": "Ελέγξτε ότι είναι ξεκλείδωτη"
"Check the basics": "Ελέγξτε τα βασικά"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Ελέγξτε τα κουμπιά, την οθόνη αφής, τον ήχο και το Wi-Fi και ξεκινήστε ένα παιχνίδι."
"Check the cable and that the device is still in its flashing mode, then try again.": "Ελέγξτε το καλώδιο και ότι η συσκευή βρίσκεται ακόμα σε λειτουργία flash και δοκιμάστε ξανά."
"Checking the USB driver": "Έλεγχος του προγράμματος οδήγησης USB"
"Checking the build": "Έλεγχος της έκδοσης"
"Checking the plan": "Έλεγχος του σχεδίου"
"Checking the result": "Έλεγχος του αποτελέσματος"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Επιλέξτε χώρο εργασίας σε μονάδα δίσκου με περισσότερο ελεύθερο χώρο (όχι FAT32) ή ελευθερώστε χώρο."
"Confirm on the device": "Επιβεβαιώστε στη συσκευή"
"Connect the device in download mode": "Συνδέστε τη συσκευή σε λειτουργία λήψης"
"Copy your games and saves": "Αντιγράψτε τα παιχνίδια και τα αποθηκευμένα σας"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Διαγράψτε τον φάκελο «jobs» του χώρου εργασίας και δημιουργήστε ξανά την έκδοση· αν το πρόβλημα παραμένει, αναφέρετέ το."
"Don't install on units whose stock firmware is v1.26.": "Μην εγκαθιστάτε σε συσκευές με εργοστασιακό υλικολογισμικό v1.26."
"Downloading": "Λήψη"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Όλα: Μεσαίο συν εξομοιωτές GameCube/Wii, 3DS, PS2, Xbox και PS Vita και οι πυρήνες υψηλής ακρίβειας. Το πλήρες σετ Thimsy 1.0a."
"Finishing": "Ολοκλήρωση"
"First time installing custom firmware": "Πρώτη εγκατάσταση προσαρμοσμένου υλικολογισμικού"
"Follow the unlock steps shown in the installer, then continue.": "Ακολουθήστε τα βήματα ξεκλειδώματος που εμφανίζει το πρόγραμμα εγκατάστασης και συνεχίστε."
"Heavy": "Πλήρες"
"Hold Volume Down and plug in the cable": "Κρατήστε πατημένο το πλήκτρο μείωσης έντασης και συνδέστε το καλώδιο"
"Installing Thimsy": "Εγκατάσταση του Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Διατηρεί τα δεδομένα σας. Μόνο αν το RG Cube εκτελεί ήδη το GammaOS Next 1.2 ή μια έκδοση Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Διατηρεί τα δεδομένα σας. Μόνο αν η συσκευή εκτελεί ήδη μια συμβατή έκδοση Thimsy ή GammaOS."
"Light": "Ελαφρύ"
"Medium": "Μεσαίο"
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Προγραμματίζεται: SP Flash Tool σε Windows και Linux. Δεν είναι ακόμα διαθέσιμο."
"Planned: Windows only. Not buildable yet.": "Προγραμματίζεται: μόνο Windows. Δεν είναι ακόμα διαθέσιμο."
"Planned: fastboot install on every computer. Not buildable yet.": "Προγραμματίζεται: εγκατάσταση μέσω fastboot σε κάθε υπολογιστή. Δεν είναι ακόμα διαθέσιμο."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Προγραμματίζεται: ίδια μέθοδος flash με το RG Cube. Δεν είναι ακόμα διαθέσιμο."
"Preparing the partitions": "Προετοιμασία των διαμερισμάτων"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Εγκαταστήστε ξανά το Thimsy Installer ή ορίστε το THIMSY_TOOLS_DIR σε έναν φάκελο που το περιέχει."
"Required before flashing; skipping it can brick the device.": "Απαιτείται πριν από το flash· αν το παραλείψετε, η συσκευή μπορεί να γίνει άχρηστη."
"Restarting the device": "Επανεκκίνηση της συσκευής"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Μικρή λήψη για κλασικά συστήματα έως το PlayStation: ένας γρήγορος πυρήνας RetroArch ανά σύστημα, η αρχική οθόνη Minima, χωρίς shaders."
"The RG Cube is unlocked once, with the steps from GammaOS Next's installation guide (the Unisoc T820 section). The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Το RG Cube ξεκλειδώνεται μία φορά, με τα βήματα του οδηγού εγκατάστασης του GammaOS Next (ενότητα Unisoc T820). Το πρόγραμμα εγκατάστασης δεν εκτελεί το ίδιο αυτό το εργαλείο. Ακολουθήστε τον οδηγό, μετά επιστρέψτε και συνεχίστε."
"The file is damaged or a different version. Delete it and download again.": "Το αρχείο είναι κατεστραμμένο ή διαφορετικής έκδοσης. Διαγράψτε το και κατεβάστε το ξανά."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Η πρώτη εκκίνηση διαρκεί λίγα λεπτά, όσο το Thimsy ρυθμίζει τους εξομοιωτές σας. Μην την απενεργοποιήσετε."
"The installer sends the unlock command; confirm it on the device with Volume Up.": "Το πρόγραμμα εγκατάστασης στέλνει την εντολή ξεκλειδώματος· επιβεβαιώστε τη στη συσκευή με το πλήκτρο αύξησης έντασης."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Το προφίλ {profile} δεν έχει δημοσιευτεί ακόμα. Επιλέξτε ένα προφίλ που επισημαίνεται ως διαθέσιμο."
"Turn the RG Cube off. Hold Volume Down and connect the USB cable to this computer. Keep holding until installation starts. The screen stays black; that's normal.": "Απενεργοποιήστε το RG Cube. Κρατήστε πατημένο το πλήκτρο μείωσης έντασης και συνδέστε το καλώδιο USB σε αυτόν τον υπολογιστή. Συνεχίστε να το κρατάτε μέχρι να ξεκινήσει η εγκατάσταση. Η οθόνη μένει μαύρη· αυτό είναι φυσιολογικό."
"Unlock in fastboot": "Ξεκλείδωμα σε fastboot"
"Unlock with GammaOS's own steps": "Ξεκλείδωμα με τα βήματα του GammaOS"
"Unpacking the firmware": "Αποσυμπίεση του υλικολογισμικού"
"Use a Windows PC": "Χρησιμοποιήστε υπολογιστή με Windows"
"Use the firmware version the catalog lists for this device.": "Χρησιμοποιήστε την έκδοση υλικολογισμικού που αναφέρει ο κατάλογος για αυτή τη συσκευή."
"Use the volume keys to choose Unlock, then press Power.": "Επιλέξτε «Unlock» με τα πλήκτρα έντασης και πατήστε το πλήκτρο λειτουργίας."
"Wait for the first boot": "Περιμένετε την πρώτη εκκίνηση"
"When the device shows LOCK FLAG IS: UNLOCK, it's unlocked. Turn it off and continue.": "Όταν η συσκευή εμφανίσει LOCK FLAG IS: UNLOCK, είναι ξεκλείδωτη. Απενεργοποιήστε την και συνεχίστε."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Το {device} σας εκτελεί ήδη προσαρμοσμένο υλικολογισμικό (έχει ξεκλειδωθεί στο παρελθόν). Το ξεκλείδωμα παραλείπεται."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Το {device} σας εκτελεί το αρχικό του υλικολογισμικό. Το πρόγραμμα εγκατάστασης κάνει καθαρή εγκατάσταση, η οποία διαγράφει τη συσκευή."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Το {device} σας εκτελεί ακόμα το αρχικό του υλικολογισμικό. Το πρόγραμμα εγκατάστασης σας καθοδηγεί στο ξεκλείδωμα και μετά κάνει καθαρή εγκατάσταση, η οποία διαγράφει τη συσκευή."
"needs Android API {n}": "απαιτεί Android API {n}"
"needs Vulkan": "απαιτεί Vulkan"
"needs an ARMv8.2 CPU": "απαιτεί επεξεργαστή ARMv8.2"
"needs {n} GB RAM": "απαιτεί {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "Το {device} δεν μπορεί να εγκατασταθεί από {host}. Εκτελέστε το Thimsy Installer σε υπολογιστή με Windows για να το εγκαταστήσετε."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "Το {device} εγκαθίσταται με το PhoenixSuit της Allwinner, που λειτουργεί μόνο σε Windows. Εκτελέστε το Thimsy Installer σε υπολογιστή με Windows για να το εγκαταστήσετε."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "Το {device} εγκαθίσταται με το SP Flash Tool της MediaTek, που δεν λειτουργεί σε {host}. Εκτελέστε το Thimsy Installer σε υπολογιστή με Windows για να το εγκαταστήσετε."
"{device} isn't supported by this version of the installer yet.": "Το {device} δεν υποστηρίζεται ακόμα από αυτή την έκδοση του προγράμματος εγκατάστασης."
