"Download Thimsy-1.0a-anbernic-rg-cube-heavy.tar from the Thimsy Installer release page, then choose it with Use a file I already downloaded.": "Κατεβάστε το Thimsy-1.0a-anbernic-rg-cube-heavy.tar από τη σελίδα εκδόσεων του Thimsy Installer και, στη συνέχεια, επιλέξτε το με το «Χρήση αρχείου που έχω ήδη κατεβάσει»."
