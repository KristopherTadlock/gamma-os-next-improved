"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Sätt i kortet i {device} och slå på den. Thimsy körs från kortet och lämnar det interna lagringsutrymmet i {device} orört: för att gå tillbaka till originalsystemet stänger du av den och tar ut kortet."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Installera om Thimsy Installer: dess flashverktyg är inte den version det förväntar sig."
"Reinstall Thimsy Installer: one of its tools is missing.": "Installera om Thimsy Installer: ett av dess verktyg saknas."
"Repeat the download-mode steps and keep holding the button until installing starts, then try again.": "Upprepa stegen för nedladdningsläget och fortsätt hålla ned knappen tills installationen startar, och försök sedan igen."
"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "Upprepa stegen för nedladdningsläget och försök sedan igen. Om den fortfarande inte hittas kontrollerar du i Enhetshanteraren att Unisoc download mode använder drivrutinen WinUSB."
"Repeat the download-mode steps, then try again. If it still isn't found, unplug the cable, plug it into another USB port and try again.": "Upprepa stegen för nedladdningsläget och försök sedan igen. Om den fortfarande inte hittas kopplar du ur kabeln, ansluter den till en annan USB-port och försöker igen."
