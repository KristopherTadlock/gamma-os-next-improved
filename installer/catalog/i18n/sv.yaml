# Swedish translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "En ren installation raderar den interna lagringen. Kopiera ROMs, sparfiler, skärmbilder och allt annat du vill behålla till datorn eller microSD-kortet. Spel på microSD-kortet påverkas inte."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Godkänn Windows behörighetsfråga, eller installera WinUSB med Zadig."
"Already unlocked: install new firmware": "Redan upplåst: installera ny firmware"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Balanserad: RetroArch för klassiska system plus emulatorer för N64, Dreamcast, PSP och DS, ES-DE som startskärm och Brave."
"Building Thimsy for your device": "Bygger Thimsy för din enhet"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Byggd från den officiella GammaOS Next 1.2-versionen för RG Cube, hämtad från GammaOS GitHub-sida."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Ladda den till minst 50 % innan du börjar och ha den medföljande kabeln till hands."
"Charge the RG Cube": "Ladda RG Cube"
"Check it's unlocked": "Kontrollera att den är upplåst"
"Check the basics": "Kontrollera grunderna"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Kontrollera knapparna, pekskärmen, ljudet och Wi-Fi, och starta ett spel."
"Check the cable and that the device is still in its flashing mode, then try again.": "Kontrollera kabeln och att enheten fortfarande är i flashläge, och försök sedan igen."
"Checking the USB driver": "Kontrollerar USB-drivrutinen"
"Checking the build": "Kontrollerar bygget"
"Checking the plan": "Kontrollerar planen"
"Checking the result": "Kontrollerar resultatet"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Välj en arbetsyta på en enhet med mer ledigt utrymme (inte FAT32), eller frigör utrymme."
"Confirm on the device": "Bekräfta på enheten"
"Confirm with Volume Up": "Bekräfta med Volym upp"
"Connect it with USB debugging on": "Anslut den med USB-felsökning på"
"Connect the device in download mode": "Anslut enheten i nedladdningsläge"
"Copy games without a card reader": "Kopiera spel utan kortläsare"
"Copy your games and saves": "Kopiera dina spel och sparfiler"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Ta bort mappen ”jobs” i arbetsytan och bygg igen; rapportera felet om det kvarstår."
"Don't install on units made in March 2026 or later.": "Installera inte på enheter som tillverkats i mars 2026 eller senare."
"Don't install on units whose stock firmware is v1.26.": "Installera inte på enheter vars originalfirmware är v1.26."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "Sätt inte tillbaka kortet i en dator för att kopiera spel: det har en krypterad Android-layout, så datorn visar inte ditt lagringsutrymme. Kopiera i stället spel via USB-filöverföring (MTP), med ADB Explorer eller från en nätverksresurs."
"Downloading": "Laddar ned"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Allt: Medel plus emulatorer för GameCube/Wii, 3DS, PS2, Xbox och PS Vita och de exakta kärnorna. Hela Thimsy 1.0a-paketet."
"Finishing": "Slutför"
"First time installing custom firmware": "Första gången du installerar anpassad firmware"
"Follow the unlock steps shown in the installer, then continue.": "Följ upplåsningsstegen som visas i installationsprogrammet och fortsätt sedan."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "GammaOS guide varnar för att en {device} som inte är upplåst blir obrukbar om den flashas. Efter upplåsningen startar {device} om i sin ursprungliga Android. Vänta tills Android har startat och fortsätt sedan."
"Heavy": "Tung"
"Hold Back and plug in the cable": "Håll ned Bakåt och anslut kabeln"
"Hold Back and the Anbernic button, then plug in": "Håll ned Bakåt och Anbernic-knappen och anslut sedan"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Håll ned strömknappen för att stänga av {device}. Håll ned båda volymknapparna och anslut USB-kabeln medan du fortfarande håller dem. Fortsätt sedan att trycka upprepade gånger på strömknappen, med volymknapparna fortfarande nedtryckta, tills installationen startar."
"Hold both volume buttons and plug in the cable": "Håll ned båda volymknapparna och anslut kabeln"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Håll ned Bakåt-knappen, Volym ned och strömknappen samtidigt tills installationen startar igen."
"If installation doesn't start": "Om installationen inte startar"
"If installation stalls": "Om installationen fastnar"
"If it isn't found": "Om den inte hittas"
"If the screen stays black": "Om skärmen förblir svart"
"Install from the microSD card": "Installera från microSD-kortet"
"Installing Thimsy": "Installerar Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Behåller dina data. Endast om RG Cube redan kör GammaOS Next 1.2 eller ett Thimsy-bygge."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Behåller dina data. Endast om enheten redan kör ett kompatibelt Thimsy- eller GammaOS-bygge."
"Light": "Lätt"
"Medium": "Medel"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "Vid allra första starten kan skärmen vara tom i upp till en minut. Det är normalt; vänta tills startskärmen visas."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "Öppna Inställningar, Om på {device} och tryck sju gånger på Versionsnummer. Slå sedan på USB-felsökning och OEM-upplåsning under Inställningar, Utvecklaralternativ. Anslut {device} till den här datorn medan den är på; den startar om i fastboot-läge för installationen."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "Öppna Inställningar, Om på {device} och tryck sju gånger på Versionsnummer. Slå sedan på USB-felsökning och OEM-upplåsning under Inställningar, Utvecklaralternativ. Anslut {device} till den här datorn medan den är på; den startar om i fastboot-läge för upplåsningen."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Planerat: installation via Qualcomm EDL på alla datorer. Kan inte byggas än."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Planerat: SP Flash Tool på Windows och Linux. Kan inte byggas än."
"Planned: Windows only. Not buildable yet.": "Planerat: endast Windows. Kan inte byggas än."
"Planned: fastboot install on every computer. Not buildable yet.": "Planerat: installation via fastboot på alla datorer. Kan inte byggas än."
"Planned: microSD card install on every computer. Not buildable yet.": "Planerat: installation via microSD-kort på alla datorer. Kan inte byggas än."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Planerat: samma flashmetod som RG Cube. Kan inte byggas än."
"Plug in the cable with the device off": "Anslut kabeln med enheten avstängd"
"Preparing the partitions": "Förbereder partitionerna"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Sätt i kortet i {device} och slå på den. Thimsy körs från kortet och lämnar det interna lagringsutrymmet i {device} orört: för att gå tillbaka till originalsystemet stänger du av den och tar ut kortet."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Installera om Thimsy Installer, eller ange THIMSY_TOOLS_DIR till en mapp som innehåller det."
"Restart into fastbootd": "Starta om i fastbootd"
"Restart with Power": "Starta om med strömknappen"
"Restarting the device": "Startar om enheten"
"Slide it open, hold Back and plug in": "Skjut upp den, håll ned Bakåt och anslut"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Liten nedladdning för klassiska system upp till PlayStation: en snabb RetroArch-kärna per system, Minima som startskärm, inga shaders."
"Start from the microSD card": "Starta från microSD-kortet"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Ta ut alla andra microSD-kort ur {device}, sätt i Thimsy-kortet och slå på den. Thimsy körs från kortet och lämnar det interna lagringsutrymmet orört: för att gå tillbaka till originalsystemet stänger du av den och tar ut kortet."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Ta ut eventuella SD-kort och håll sedan ned Volym ned och strömknappen tills {device} startar om."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Ta ut microSD-kortet och slå på USB-felsökning under Utvecklaralternativ. Anslut {device} till den här datorn medan den är på. Den startar om i fastbootd: skärmen visar fastbootd med stor röd text."
"The file is damaged or a different version. Delete it and download again.": "Filen är skadad eller har en annan version. Ta bort den och ladda ned den igen."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Första starten kan ta 1 till 3 minuter och kan verka ha fastnat på Anbernic-logotypen. Det är normalt."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Första starten tar 1 till 3 minuter, och skärmen kan verka ha fastnat på startlogotypen. Det är normalt."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Den första starten tar några minuter medan Thimsy konfigurerar dina emulatorer. Stäng inte av den."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} låses upp en gång, med verktyget UnlockBootloader från GammaOS Nexts installationsguide (Unisoc T820, steg 2): stäng av {device}, starta verktyget och håll sedan ned Bakåt-knappen medan du ansluter USB-kabeln. Installationsprogrammet kör inte det verktyget självt. Följ guiden, kom sedan tillbaka och fortsätt."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} låses upp en gång, med verktyget UnlockBootloader från GammaOS Nexts installationsguide (Unisoc T820, steg 2): stäng av {device}, starta verktyget och håll sedan ned Bakåt-knappen, knappen till höger om skärmen, medan du ansluter USB-kabeln. Installationsprogrammet kör inte det verktyget självt. Följ guiden, kom sedan tillbaka och fortsätt."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} låses upp en gång, med webbverktyget för upplåsning från GammaOS Nexts installationsguide (Anbernic RG405M / RG405V / RG505, steg 2). Starta om {device} i fastboot-läge, öppna verktyget i Google Chrome, klicka på ”Connect” och sedan på ”Unlock”. Tryck inte på Volym ned på {device}: tryck på Hem/Bakåt-knappen för att bekräfta. Installationsprogrammet kör inte det verktyget självt. Följ guiden, kom sedan tillbaka och fortsätt."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Profilen {profile} har inte publicerats än. Välj en profil som är markerad som tillgänglig."
"Turn on OEM unlocking": "Slå på OEM-upplåsning"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Stäng av {device} och koppla ur den. Håll ned Bakåt-knappen och Anbernic-knappen bredvid den och anslut USB-kabeln till den här datorn medan du fortfarande håller båda. Håll kvar tills installationen startar."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Stäng av {device} och koppla ur den. Håll ned Bakåt-knappen och anslut USB-kabeln till den här datorn medan du fortfarande håller den. Håll kvar tills installationen startar."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Stäng av {device} och koppla ur den. Håll ned Bakåt-knappen, knappen till höger om skärmen, och anslut USB-kabeln till den här datorn medan du fortfarande håller den. Håll kvar tills installationen startar."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Stäng av {device} helt och koppla ur den. Håll ned Volym ned och Volym upp samtidigt och anslut USB-kabeln till den här datorn medan du fortfarande håller båda. Håll kvar tills installationen startar."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "Stäng av {device} helt. När installationsprogrammet ber om det ansluter du USB-kabeln till den här datorn."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Stäng av {device}, sätt i kortet och slå på den. Den installerar sig själv på sitt interna lagringsutrymme från kortet. Låt den vara tills den är klar, stäng sedan av den och ta ut kortet."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Stäng av {device}, koppla ur den och ta ut alla SD-kort. Skjut upp den och håll sedan ned Bakåt-knappen mitt på styrkorset och anslut USB-kabeln till den här datorn medan du fortfarande håller den. Håll kvar tills installationen startar."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Slå på {device}, med USB-felsökning fortfarande påslagen under Utvecklaralternativ, och anslut den till den här datorn. Den startar om av sig själv och installationen börjar."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Slå på {device}, med USB-felsökning fortfarande påslagen under Utvecklaralternativ, och anslut den till den här datorn. Den startar om i fastboot-läge för installationen."
"Unlock before flashing": "Lås upp innan du flashar"
"Unlock with GammaOS's own steps": "Lås upp med GammaOS egna steg"
"Unpacking the firmware": "Packar upp firmware"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Koppla ur kabeln. Håll ned strömknappen och Volym ned i minst 60 sekunder och anslut sedan USB-kabeln medan du fortfarande håller dem. Håll kvar tills installationen startar; det kan ta 30 sekunder eller mer innan {device} hittas."
"Use a Windows PC": "Använd en Windows-dator"
"Use the firmware version the catalog lists for this device.": "Använd den firmwareversion som katalogen anger för den här enheten."
"Use the volume keys to choose Unlock, then press Power.": "Välj ”Unlock” med volymknapparna och tryck sedan på strömknappen."
"Wait for the first boot": "Vänta på första starten"
"Wait on the Anbernic logo": "Vänta på Anbernic-logotypen"
"Wait through a blank screen": "Vänta medan skärmen är tom"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "När installationen är klar trycker du en gång på strömknappen om {device} inte har startat om av sig själv."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "När skärmen visar INFO: LOCK FLAG IS: UNLOCK!!! är den upplåst. Koppla ur kabeln, se till att {device} är avstängd och fortsätt."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "När skärmen visar Unlock bootloader success! är den upplåst. Om {device} redan visar INFO: LOCK FLAG IS : UNLOCK!!! en kort stund när den startar har den låsts upp tidigare och du kan hoppa över upplåsningen."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "När {device} frågar trycker du på Volym upp inom 3 sekunder för att bekräfta upplåsningen."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Din {device} kör redan anpassad firmware (den har låsts upp tidigare). Upplåsningen hoppas över."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Din {device} kör sin originalfirmware. Installationsprogrammet gör en ren installation som raderar enheten."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Din {device} kör fortfarande sin originalfirmware. Installationsprogrammet guidar dig genom upplåsningen och gör sedan en ren installation som raderar enheten."
"needs Android API {n}": "kräver Android API {n}"
"needs Vulkan": "kräver Vulkan"
"needs an ARMv8.2 CPU": "kräver en ARMv8.2-processor"
"needs {n} GB RAM": "kräver {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} kan inte installeras från {host}. Kör Thimsy Installer på en Windows-dator för att installera den."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} installeras med PhoenixSuit från Allwinner, som bara körs på Windows. Kör Thimsy Installer på en Windows-dator för att installera den."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} installeras med SP Flash Tool från MediaTek, som inte körs på {host}. Kör Thimsy Installer på en Windows-dator för att installera den."
"{device} isn't supported by this version of the installer yet.": "{device} stöds inte av den här versionen av installationsprogrammet än."
