"Slide it open, hold Back and plug in": "Skjut upp den, håll ned Bakåt och anslut"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Liten nedladdning för klassiska system upp till PlayStation: en snabb RetroArch-kärna per system, Minima som startskärm, inga shaders."
"Start from the microSD card": "Starta från microSD-kortet"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Ta ut alla andra microSD-kort ur {device}, sätt i Thimsy-kortet och slå på den. Thimsy körs från kortet och lämnar det interna lagringsutrymmet orört: för att gå tillbaka till originalsystemet stänger du av den och tar ut kortet."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Ta ut eventuella SD-kort och håll sedan ned Volym ned och strömknappen tills {device} startar om."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Ta ut microSD-kortet och slå på USB-felsökning under Utvecklaralternativ. Anslut {device} till den här datorn medan den är på. Den startar om i fastbootd: skärmen visar fastbootd med stor röd text."
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "Enheten som arbetsytan ligger på kan vara på väg att gå sönder. Välj en arbetsyta på en annan enhet och bygg igen."
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "Installationsprogrammet för drivrutinen ingår inte i det här bygget. Installera WinUSB för enhetens nedladdningsläge med Zadig."
"The file is damaged or a different version. Delete it and download again.": "Filen är skadad eller har en annan version. Ta bort den och ladda ned den igen."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Första starten kan ta 1 till 3 minuter och kan verka ha fastnat på Anbernic-logotypen. Det är normalt."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Första starten tar 1 till 3 minuter, och skärmen kan verka ha fastnat på startlogotypen. Det är normalt."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Den första starten tar några minuter medan Thimsy konfigurerar dina emulatorer. Stäng inte av den."
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "Det gick inte att kontrollera det lediga utrymmet på den här enheten. Välj en annan mapp för arbetsytan."
"The installer does a fresh install that erases your {device}, whatever it runs now.": "Installationsprogrammet gör en ren installation som raderar din {device}, oavsett vad den kör nu."
"The installer runs as root, so it can open the device": "Installationsprogrammet körs som root, så det kan öppna enheten"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} låses upp en gång, på en Windows-dator: verktyget UnlockBootloader från GammaOS Nexts installationsguide (Unisoc T820, steg 1 och 2) körs bara i Windows. Installera först Unisocs USB-drivrutin från guidens UnisocTools. Stäng sedan av {device} och koppla ur den, starta UnlockBootloader.bat och håll inom 30 sekunder ned Bakåt-knappen (knappen till höger om skärmen) och anslut USB-kabeln medan du fortfarande håller den. Släpp när det visas text på skärmen. Upplåsningen raderar {device}. Installationsprogrammet kör inte det verktyget självt. Följ guiden, kom sedan tillbaka och fortsätt."
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} låses upp en gång, på en Windows-dator: verktyget UnlockBootloader från GammaOS Nexts installationsguide (Unisoc T820, steg 1 och 2) körs bara i Windows. Installera först Unisocs USB-drivrutin från guidens UnisocTools. Stäng sedan av {device} och koppla ur den, starta UnlockBootloader.bat och håll inom 30 sekunder ned Bakåt-knappen och anslut USB-kabeln medan du fortfarande håller den. Släpp när det visas text på skärmen. Upplåsningen raderar {device}. Installationsprogrammet kör inte det verktyget självt. Följ guiden, kom sedan tillbaka och fortsätt."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "{device} låses upp en gång, med webbverktyget för upplåsning från GammaOS Nexts installationsguide (Anbernic RG405M / RG405V / RG505, steg 2). Ta ut microSD-kortet, slå på USB-felsökning under Utvecklaralternativ och starta om {device} i fastboot-läge med adb reboot bootloader: skärmen visar fastboot mode bredvid Anbernic-logotypen. Öppna verktyget i Google Chrome, klicka på ”Connect”, välj enheten och klicka sedan på ”Unlock”. Tryck inte på Volym ned på {device}: tryck på Hem/Bakåt-knappen för att bekräfta. På Linux eller macOS gör verktyget unisoc-unlock från guiden samma sak. Upplåsningen raderar {device}. Installationsprogrammet kör inte de verktygen självt. Följ guiden, kom sedan tillbaka och fortsätt."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Profilen {profile} har inte publicerats än. Välj en profil som är markerad som tillgänglig."
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "Den här enheten kör inte ett matchande Thimsy- eller GammaOS-bygge, så den kan inte uppdateras. Använd en fullständig installation i stället (den raderar enheten)."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "Enhetens partitionslayout stämmer inte med den här firmwaren: det är en annan modell, eller så kör den fortfarande originalfirmware som behöver partitioneras om, vilket den här versionen inte kan ännu."
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "Den här enheten är formaterad som FAT32, som inte kan lagra filer större än 4 GB. Välj en arbetsyta på en annan enhet (NTFS, exFAT, APFS eller ext4)."
"This version of the installer expects a different build. Build again, then install.": "Den här versionen av installationsprogrammet förväntar sig ett annat bygge. Bygg igen och installera sedan."
"Turn it on": "Slå på den"
"Turn on OEM unlocking": "Slå på OEM-upplåsning"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Stäng av {device} och koppla ur den. Håll ned Bakåt-knappen och Anbernic-knappen bredvid den och anslut USB-kabeln till den här datorn medan du fortfarande håller båda. Håll kvar tills installationen startar."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Stäng av {device} och koppla ur den. Håll ned Bakåt-knappen och anslut USB-kabeln till den här datorn medan du fortfarande håller den. Håll kvar tills installationen startar."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Stäng av {device} och koppla ur den. Håll ned Bakåt-knappen, knappen till höger om skärmen, och anslut USB-kabeln till den här datorn medan du fortfarande håller den. Håll kvar tills installationen startar."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Stäng av {device} helt och koppla ur den. Håll ned Volym ned och Volym upp samtidigt och anslut USB-kabeln till den här datorn medan du fortfarande håller båda. Håll kvar tills installationen startar."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "Stäng av {device} helt. När installationsprogrammet ber om det ansluter du USB-kabeln till den här datorn och låter den sitta i tills installationen är klar."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "Stäng av {device}, sätt i kortet och slå på den. Den installerar sig själv på sitt interna lagringsutrymme från kortet, vilket tar några minuter. Låt den vara tills den stängs av eller startar om av sig själv, och ta sedan ut kortet."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Stäng av {device}, sätt i kortet och slå på den. Den installerar sig själv på sitt interna lagringsutrymme från kortet. Låt den vara tills den är klar, stäng sedan av den och ta ut kortet."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Stäng av {device}, koppla ur den och ta ut alla SD-kort. Skjut upp den och håll sedan ned Bakåt-knappen mitt på styrkorset och anslut USB-kabeln till den här datorn medan du fortfarande håller den. Håll kvar tills installationen startar."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Slå på {device}, med USB-felsökning fortfarande påslagen under Utvecklaralternativ, och anslut den till den här datorn. Den startar om av sig själv och installationen börjar."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Slå på {device}, med USB-felsökning fortfarande påslagen under Utvecklaralternativ, och anslut den till den här datorn. Den startar om i fastboot-läge för installationen."
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "USB-åtkomst för {ids} är inte konfigurerad än. När den konfigureras behöver du ange ditt lösenord en gång."
"USB access is set up for {ids}": "USB-åtkomst är konfigurerad för {ids}"
"Unlock before flashing": "Lås upp innan du flashar"
"Unlock with GammaOS's own steps": "Lås upp med GammaOS egna steg"
"Unpacking the firmware": "Packar upp firmware"
"Unpacking {file}": "Packar upp {file}"
"Unplug it and turn it on": "Koppla ur den och slå på den"
"Unplug the cable when it restarts": "Koppla ur kabeln när den startar om"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Koppla ur kabeln. Håll ned strömknappen och Volym ned i minst 60 sekunder och anslut sedan USB-kabeln medan du fortfarande håller dem. Håll kvar tills installationen startar; det kan ta 30 sekunder eller mer innan {device} hittas."
"Updating checksums": "Uppdaterar kontrollsummor"
"Use a Windows PC": "Använd en Windows-dator"
"Use the firmware version the catalog lists for this device.": "Använd den firmwareversion som katalogen anger för den här enheten."
"Use the volume keys to choose Unlock, then press Power.": "Välj ”Unlock” med volymknapparna och tryck sedan på strömknappen."
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "Vänta på första starten"
"Wait on the Anbernic logo": "Vänta på Anbernic-logotypen"
"Wait through a blank screen": "Vänta medan skärmen är tom"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "När installationen är klar trycker du en gång på strömknappen om {device} inte har startat om av sig själv."
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "När installationen är klar startar {device} om av sig själv och konfigurerar sitt lagringsutrymme. Koppla ur kabeln då."
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "När installationen är klar kopplar du ur kabeln och trycker på strömknappen för att slå på {device}."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "När skärmen visar INFO: LOCK FLAG IS: UNLOCK!!! är den upplåst. Koppla ur kabeln och se till att {device} är avstängd (om den startar om håller du ned strömknappen tills den stängs av), och fortsätt sedan."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "När skärmen visar Unlock bootloader success! är den upplåst. Om {device} redan visar INFO: LOCK FLAG IS : UNLOCK!!! en kort stund när den startar har den låsts upp tidigare och du kan hoppa över upplåsningen."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "När {device} frågar trycker du på Volym upp inom 3 sekunder för att bekräfta upplåsningen."
"WinUSB is installed for {ids}": "WinUSB är installerat för {ids}"
"WinUSB will be installed for {ids} the first time you flash": "WinUSB installeras för {ids} första gången du flashar"
"Windows asks for permission next. Click Yes so the installer can give your device the USB driver it needs as soon as you connect it. Don't connect it yet.": "Windows ber nu om behörighet. Klicka på Ja så att installationsprogrammet kan ge enheten den USB-drivrutin den behöver så fort du ansluter den. Anslut den inte än."
"Windows now gives the device the driver the installer needs. Unplug the cable and turn the device off, then repeat the download-mode steps with the same USB port.": "Windows ger nu enheten den drivrutin som installationsprogrammet behöver. Koppla ur kabeln och stäng av enheten, och upprepa sedan stegen för nedladdningsläget med samma USB-port."
"WonderSwan": "WonderSwan"
"Writing {partition}": "Skriver {partition}"
"Wrote {partition}": "Skrev {partition}"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "Din {device} kör redan GammaOS eller Thimsy. Välj hur du vill installera den nya firmwaren."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Din {device} kör redan anpassad firmware (den har låsts upp tidigare). Upplåsningen hoppas över."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Din {device} kör fortfarande sin originalfirmware. Installationsprogrammet guidar dig genom upplåsningen och gör sedan en ren installation som raderar enheten."
"hakuX": "hakuX"
"needs Android API {n}": "kräver Android API {n}"
"needs Vulkan": "kräver Vulkan"
"needs an ARMv8.2 CPU": "kräver en ARMv8.2-processor"
"needs {n} GB RAM": "kräver {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} kan inte installeras från {host}. Kör Thimsy Installer på en Windows-dator för att installera den."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} installeras med PhoenixSuit från Allwinner, som bara körs på Windows. Kör Thimsy Installer på en Windows-dator för att installera den."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} installeras med SP Flash Tool från MediaTek, som inte körs på {host}. Kör Thimsy Installer på en Windows-dator för att installera den."
"{device} isn't supported by this version of the installer yet.": "{device} stöds inte av den här versionen av installationsprogrammet än."
"{host} needs no driver": "{host} behöver ingen drivrutin"
