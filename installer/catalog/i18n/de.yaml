# German translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Eine Neuinstallation löscht den internen Speicher. Kopiere ROMs, Spielstände, Screenshots und alles andere, was du behalten möchtest, auf deinen Computer oder die microSD-Karte. Spiele auf der microSD-Karte bleiben unberührt."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Bestätige die Windows-Berechtigungsabfrage oder installiere WinUSB mit Zadig."
"Already unlocked: install new firmware": "Bereits entsperrt: neue Firmware installieren"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Ausgewogen: RetroArch für klassische Systeme plus Emulatoren für N64, Dreamcast, PSP und DS, die ES-DE-Startoberfläche und Brave."
"Building Thimsy for your device": "Thimsy wird für dein Gerät erstellt"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Erstellt aus dem offiziellen GammaOS Next 1.2-Release für den RG Cube, heruntergeladen von der GitHub-Seite von GammaOS."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Lade es vor dem Start auf mindestens 50 % auf und halte das mitgelieferte Kabel bereit."
"Charge the RG Cube": "RG Cube aufladen"
"Check it's unlocked": "Prüfen, ob es entsperrt ist"
"Check the basics": "Grundfunktionen prüfen"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Prüfe Tasten, Touchscreen, Ton und Wi-Fi und starte ein Spiel."
"Check the cable and that the device is still in its flashing mode, then try again.": "Prüfe das Kabel und ob sich das Gerät noch im Flash-Modus befindet, und versuche es dann erneut."
"Checking the USB driver": "USB-Treiber wird geprüft"
"Checking the build": "Build wird geprüft"
"Checking the plan": "Plan wird geprüft"
"Checking the result": "Ergebnis wird geprüft"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Wähle einen Arbeitsbereich auf einem Laufwerk mit mehr freiem Speicher (nicht FAT32) oder gib Speicher frei."
"Confirm on the device": "Auf dem Gerät bestätigen"
"Confirm with Volume Up": "Mit der Lauter-Taste bestätigen"
"Connect it with USB debugging on": "Mit aktiviertem USB-Debugging verbinden"
"Connect the device in download mode": "Gerät im Download-Modus verbinden"
"Copy games without a card reader": "Spiele ohne Kartenleser kopieren"
"Copy your games and saves": "Spiele und Spielstände kopieren"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Lösche den Ordner „jobs“ im Arbeitsbereich und erstelle den Build erneut; melde den Fehler, wenn er bestehen bleibt."
"Don't install on units made in March 2026 or later.": "Nicht auf Geräten installieren, die im März 2026 oder später hergestellt wurden."
"Don't install on units whose stock firmware is v1.26.": "Nicht auf Geräten installieren, deren Original-Firmware v1.26 ist."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "Stecke die Karte nicht wieder in einen Computer, um Spiele zu kopieren: Sie enthält ein verschlüsseltes Android-Layout, deshalb zeigt der Computer deinen Speicher nicht an. Kopiere Spiele stattdessen per USB-Dateiübertragung (MTP), mit ADB Explorer oder über eine Netzwerkfreigabe."
"Downloading": "Wird heruntergeladen"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Alles: Mittel plus Emulatoren für GameCube/Wii, 3DS, PS2, Xbox und PS Vita sowie die präzisen Cores. Das komplette Thimsy 1.0a-Paket."
"Finishing": "Wird abgeschlossen"
"First time installing custom firmware": "Erstes Mal Custom-Firmware installieren"
"Follow the unlock steps shown in the installer, then continue.": "Folge den im Installer angezeigten Entsperrschritten und fahre dann fort."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "Laut der Anleitung von GammaOS wird dein {device} unbrauchbar, wenn es ohne Entsperren geflasht wird. Nach dem Entsperren startet dein {device} in sein ursprüngliches Android neu. Warte, bis Android gestartet ist, und fahre dann fort."
"Heavy": "Umfassend"
"Hold Back and plug in the cable": "Zurück-Taste halten und Kabel anschließen"
"Hold Back and the Anbernic button, then plug in": "Zurück- und Anbernic-Taste halten, dann Kabel anschließen"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Halte die Ein/Aus-Taste gedrückt, um dein {device} auszuschalten. Halte beide Lautstärketasten gedrückt und schließe dabei das USB-Kabel an. Tippe dann wiederholt auf die Ein/Aus-Taste, während du die Lautstärketasten weiter gedrückt hältst, bis die Installation beginnt."
"Hold both volume buttons and plug in the cable": "Beide Lautstärketasten halten und Kabel anschließen"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Halte die Zurück-Taste, die Leiser-Taste und die Ein/Aus-Taste gleichzeitig gedrückt, bis die Installation wieder beginnt."
"If installation doesn't start": "Wenn die Installation nicht beginnt"
"If installation stalls": "Wenn die Installation hängen bleibt"
"If it isn't found": "Wenn es nicht gefunden wird"
"If the screen stays black": "Wenn der Bildschirm schwarz bleibt"
"Install from the microSD card": "Von der microSD-Karte installieren"
"Installing Thimsy": "Thimsy wird installiert"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Behält deine Daten. Nur wenn auf dem RG Cube bereits GammaOS Next 1.2 oder ein Thimsy-Build läuft."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Behält deine Daten. Nur wenn auf dem Gerät bereits ein kompatibler Thimsy- oder GammaOS-Build läuft."
"Light": "Leicht"
"Medium": "Mittel"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "Beim allerersten Start kann der Bildschirm bis zu einer Minute leer bleiben. Das ist normal; warte, bis der Startbildschirm erscheint."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "Öffne auf deinem {device} die Einstellungen, dann „Über das Gerät“, und tippe siebenmal auf „Build-Nummer“. Aktiviere danach unter Einstellungen > „Entwickleroptionen“ das „USB-Debugging“ und die „OEM-Entsperrung“. Verbinde dein {device} eingeschaltet mit diesem Computer; es startet für die Installation in den Fastboot-Modus neu."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "Öffne auf deinem {device} die Einstellungen, dann „Über das Gerät“, und tippe siebenmal auf „Build-Nummer“. Aktiviere danach unter Einstellungen > „Entwickleroptionen“ das „USB-Debugging“ und die „OEM-Entsperrung“. Verbinde dein {device} eingeschaltet mit diesem Computer; es startet für das Entsperren in den Fastboot-Modus neu."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Geplant: Installation per Qualcomm EDL auf jedem Computer. Noch nicht erstellbar."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Geplant: SP Flash Tool unter Windows und Linux. Noch nicht erstellbar."
"Planned: Windows only. Not buildable yet.": "Geplant: nur Windows. Noch nicht erstellbar."
"Planned: fastboot install on every computer. Not buildable yet.": "Geplant: Installation per fastboot auf jedem Computer. Noch nicht erstellbar."
"Planned: microSD card install on every computer. Not buildable yet.": "Geplant: Installation per microSD-Karte auf jedem Computer. Noch nicht erstellbar."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Geplant: gleicher Flash-Weg wie beim RG Cube. Noch nicht erstellbar."
"Plug in the cable with the device off": "Kabel bei ausgeschaltetem Gerät anschließen"
"Preparing the partitions": "Partitionen werden vorbereitet"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Stecke die Karte in dein {device} und schalte es ein. Thimsy läuft von der Karte und lässt den internen Speicher in deinem {device} unberührt: Um zum ursprünglichen System zurückzukehren, schalte es aus und nimm die Karte heraus."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Installiere Thimsy Installer neu oder setze THIMSY_TOOLS_DIR auf einen Ordner, der es enthält."
"Restart into fastbootd": "In fastbootd neu starten"
"Restart with Power": "Mit der Ein/Aus-Taste neu starten"
"Restarting the device": "Gerät wird neu gestartet"
"Slide it open, hold Back and plug in": "Aufschieben, Zurück-Taste halten und Kabel anschließen"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Kleiner Download für klassische Systeme bis PlayStation: ein schneller RetroArch-Core pro System, die Minima-Startoberfläche, keine Shader."
"Start from the microSD card": "Von der microSD-Karte starten"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Nimm jede andere microSD-Karte aus deinem {device}, stecke die Thimsy-Karte ein und schalte es ein. Thimsy läuft von der Karte und lässt den internen Speicher unberührt: Um zum ursprünglichen System zurückzukehren, schalte es aus und nimm die Karte heraus."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Nimm alle SD-Karten heraus und halte dann die Leiser-Taste und die Ein/Aus-Taste gedrückt, bis dein {device} neu startet."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Nimm die microSD-Karte heraus und aktiviere „USB-Debugging“ in den „Entwickleroptionen“. Verbinde dein {device} eingeschaltet mit diesem Computer. Es startet in fastbootd neu: Auf dem Bildschirm steht fastbootd in großer roter Schrift."
"The file is damaged or a different version. Delete it and download again.": "Die Datei ist beschädigt oder hat eine andere Version. Lösche sie und lade sie erneut herunter."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Der erste Start kann 1 bis 3 Minuten dauern und scheint dabei womöglich auf dem Anbernic-Logo hängen zu bleiben. Das ist normal."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Der erste Start dauert 1 bis 3 Minuten, und der Bildschirm scheint dabei womöglich auf dem Startlogo hängen zu bleiben. Das ist normal."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Der erste Start dauert einige Minuten, während Thimsy deine Emulatoren einrichtet. Schalte das Gerät nicht aus."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Dein {device} wird einmalig mit dem Tool UnlockBootloader aus der Installationsanleitung von GammaOS Next entsperrt (Unisoc T820, Schritt 2): Schalte dein {device} aus, starte das Tool und halte dann die Zurück-Taste gedrückt, während du das USB-Kabel anschließt. Der Installer führt dieses Tool nicht selbst aus. Folge der Anleitung, komm dann zurück und fahre fort."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Dein {device} wird einmalig mit dem Tool UnlockBootloader aus der Installationsanleitung von GammaOS Next entsperrt (Unisoc T820, Schritt 2): Schalte dein {device} aus, starte das Tool und halte dann die Zurück-Taste – die Taste auf der rechten Seite des Bildschirms – gedrückt, während du das USB-Kabel anschließt. Der Installer führt dieses Tool nicht selbst aus. Folge der Anleitung, komm dann zurück und fahre fort."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Dein {device} wird einmalig mit dem Web-Entsperrtool aus der Installationsanleitung von GammaOS Next entsperrt (Anbernic RG405M / RG405V / RG505, Schritt 2). Starte dein {device} im Fastboot-Modus neu, öffne das Tool in Google Chrome und klicke auf „Connect“, dann auf „Unlock“. Drücke auf deinem {device} nicht die Leiser-Taste, sondern bestätige mit der Home-/Zurück-Taste. Der Installer führt dieses Tool nicht selbst aus. Folge der Anleitung, komm dann zurück und fahre fort."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Das Profil {profile} ist noch nicht veröffentlicht. Wähle ein als verfügbar markiertes Profil."
"Turn on OEM unlocking": "OEM-Entsperrung aktivieren"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Schalte dein {device} aus und zieh das Kabel ab. Halte die Zurück-Taste und die Anbernic-Taste daneben gedrückt und schließe dabei das USB-Kabel an diesen Computer an. Halte sie gedrückt, bis die Installation beginnt."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Schalte dein {device} aus und zieh das Kabel ab. Halte die Zurück-Taste gedrückt und schließe dabei das USB-Kabel an diesen Computer an. Halte sie gedrückt, bis die Installation beginnt."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Schalte dein {device} aus und zieh das Kabel ab. Halte die Zurück-Taste – die Taste auf der rechten Seite des Bildschirms – gedrückt und schließe dabei das USB-Kabel an diesen Computer an. Halte sie gedrückt, bis die Installation beginnt."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Schalte dein {device} vollständig aus und zieh das Kabel ab. Halte die Leiser- und die Lauter-Taste gleichzeitig gedrückt und schließe dabei das USB-Kabel an diesen Computer an. Halte beide gedrückt, bis die Installation beginnt."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "Schalte dein {device} vollständig aus. Wenn der Installer dich dazu auffordert, schließe das USB-Kabel an diesen Computer an."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Schalte dein {device} aus, stecke die Karte ein und schalte es ein. Es installiert sich selbstständig von der Karte in den internen Speicher. Lass es in Ruhe, bis es fertig ist, schalte es dann aus und nimm die Karte heraus."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Schalte dein {device} aus, zieh das Kabel ab und nimm alle SD-Karten heraus. Schiebe es auf, halte dann die Zurück-Taste in der Mitte des Joypads gedrückt und schließe dabei das USB-Kabel an diesen Computer an. Halte sie gedrückt, bis die Installation beginnt."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Schalte dein {device} ein, lass das USB-Debugging in den Entwickleroptionen aktiviert und verbinde es mit diesem Computer. Es startet von selbst neu und die Installation beginnt."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Schalte dein {device} ein, lass das USB-Debugging in den Entwickleroptionen aktiviert und verbinde es mit diesem Computer. Es startet für die Installation in den Fastboot-Modus neu."
"Unlock before flashing": "Vor dem Flashen entsperren"
"Unlock with GammaOS's own steps": "Mit den Schritten von GammaOS entsperren"
"Unpacking the firmware": "Firmware wird entpackt"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Zieh das Kabel ab. Halte die Ein/Aus-Taste und die Leiser-Taste mindestens 60 Sekunden lang gedrückt und schließe dann, während du sie weiter hältst, das USB-Kabel an. Halte sie gedrückt, bis die Installation beginnt; es kann 30 Sekunden oder länger dauern, bis dein {device} gefunden wird."
"Use a Windows PC": "Windows-PC verwenden"
"Use the firmware version the catalog lists for this device.": "Verwende die Firmware-Version, die der Katalog für dieses Gerät angibt."
"Use the volume keys to choose Unlock, then press Power.": "Wähle mit den Lautstärketasten „Unlock“ und drücke dann die Ein/Aus-Taste."
"Wait for the first boot": "Auf den ersten Start warten"
"Wait on the Anbernic logo": "Auf dem Anbernic-Logo warten"
"Wait through a blank screen": "Einen leeren Bildschirm abwarten"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Wenn die Installation fertig ist, drücke einmal die Ein/Aus-Taste, falls dein {device} nicht von selbst neu gestartet ist."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "Wenn der Bildschirm INFO: LOCK FLAG IS: UNLOCK!!! anzeigt, ist es entsperrt. Zieh das Kabel ab, vergewissere dich, dass dein {device} ausgeschaltet ist, und fahre fort."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Wenn der Bildschirm Unlock bootloader success! anzeigt, ist es entsperrt. Zeigt dein {device} beim Start bereits kurz INFO: LOCK FLAG IS : UNLOCK!!! an, war es schon entsperrt und du kannst das Entsperren überspringen."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Wenn dein {device} danach fragt, drücke innerhalb von 3 Sekunden die Lauter-Taste, um das Entsperren zu bestätigen."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Auf deinem {device} läuft bereits eine Custom-Firmware (es wurde schon einmal entsperrt). Das Entsperren wird übersprungen."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Auf deinem {device} läuft die Original-Firmware. Der Installer führt eine Neuinstallation durch, die das Gerät löscht."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Auf deinem {device} läuft noch die Original-Firmware. Der Installer führt dich durch das Entsperren und dann durch eine Neuinstallation, die das Gerät löscht."
"needs Android API {n}": "erfordert Android API {n}"
"needs Vulkan": "erfordert Vulkan"
"needs an ARMv8.2 CPU": "erfordert eine ARMv8.2-CPU"
"needs {n} GB RAM": "erfordert {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} kann nicht von {host} aus installiert werden. Führe Thimsy Installer auf einem Windows-PC aus, um es zu installieren."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} wird mit PhoenixSuit von Allwinner installiert, das nur unter Windows läuft. Führe Thimsy Installer auf einem Windows-PC aus, um es zu installieren."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} wird mit SP Flash Tool von MediaTek installiert, das nicht unter {host} läuft. Führe Thimsy Installer auf einem Windows-PC aus, um es zu installieren."
"{device} isn't supported by this version of the installer yet.": "{device} wird von dieser Version des Installers noch nicht unterstützt."
