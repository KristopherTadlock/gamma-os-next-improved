"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Halte die Ein/Aus-Taste gedrückt, um dein {device} auszuschalten. Halte beide Lautstärketasten gedrückt und schließe dabei das USB-Kabel an. Tippe dann wiederholt auf die Ein/Aus-Taste, während du die Lautstärketasten weiter gedrückt hältst, bis die Installation beginnt."
