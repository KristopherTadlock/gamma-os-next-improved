"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "Wiederhole die Schritte für den Download-Modus und versuche es dann erneut. Wird es immer noch nicht gefunden, prüfe im Geräte-Manager, ob Unisoc download mode den WinUSB-Treiber verwendet."
"Repeat the download-mode steps, then try again. If it still isn't found, unplug the cable, plug it into another USB port and try again.": "Wiederhole die Schritte für den Download-Modus und versuche es dann erneut. Wird es immer noch nicht gefunden, zieh das Kabel ab, steck es in einen anderen USB-Anschluss und versuche es erneut."
