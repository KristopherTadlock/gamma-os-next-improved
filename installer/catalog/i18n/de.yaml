"Slide it open, hold Back and plug in": "Aufschieben, Zurück-Taste halten und Kabel anschließen"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Kleiner Download für klassische Systeme bis PlayStation: ein schneller RetroArch-Core pro System, die Minima-Startoberfläche, keine Shader."
"Start from the microSD card": "Von der microSD-Karte starten"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Nimm jede andere microSD-Karte aus deinem {device}, stecke die Thimsy-Karte ein und schalte es ein. Thimsy läuft von der Karte und lässt den internen Speicher unberührt: Um zum ursprünglichen System zurückzukehren, schalte es aus und nimm die Karte heraus."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Nimm alle SD-Karten heraus und halte dann die Leiser-Taste und die Ein/Aus-Taste gedrückt, bis dein {device} neu startet."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Nimm die microSD-Karte heraus und aktiviere „USB-Debugging“ in den „Entwickleroptionen“. Verbinde dein {device} eingeschaltet mit diesem Computer. Es startet in fastbootd neu: Auf dem Bildschirm steht fastbootd in großer roter Schrift."
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "Das Laufwerk, auf dem sich der Arbeitsbereich befindet, könnte ausfallen. Wähle einen Arbeitsbereich auf einem anderen Laufwerk und erstelle den Build erneut."
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "Das Treiber-Installationsprogramm ist in diesem Build nicht enthalten. Installiere mit Zadig WinUSB für den Download-Modus des Geräts."
"The file is damaged or a different version. Delete it and download again.": "Die Datei ist beschädigt oder hat eine andere Version. Lösche sie und lade sie erneut herunter."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Der erste Start kann 1 bis 3 Minuten dauern und scheint dabei womöglich auf dem Anbernic-Logo hängen zu bleiben. Das ist normal."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Der erste Start dauert 1 bis 3 Minuten, und der Bildschirm scheint dabei womöglich auf dem Startlogo hängen zu bleiben. Das ist normal."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Der erste Start dauert einige Minuten, während Thimsy deine Emulatoren einrichtet. Schalte das Gerät nicht aus."
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "Der freie Speicher auf diesem Laufwerk konnte nicht geprüft werden. Wähle einen anderen Ordner für den Arbeitsbereich."
"The installer does a fresh install that erases your {device}, whatever it runs now.": "Der Installer führt eine Neuinstallation durch, die dein {device} löscht, egal was gerade darauf läuft."
"The installer runs as root, so it can open the device": "Der Installer läuft als root und kann daher auf das Gerät zugreifen"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Dein {device} wird einmalig an einem Windows-PC entsperrt: Das Tool UnlockBootloader aus der Installationsanleitung von GammaOS Next (Unisoc T820, Schritte 1 und 2) läuft nur unter Windows. Installiere zuerst den Unisoc-USB-Treiber aus den UnisocTools der Anleitung. Schalte dann dein {device} aus und zieh das Kabel ab, starte UnlockBootloader.bat und halte innerhalb von 30 Sekunden die Zurück-Taste (die Taste auf der rechten Seite des Bildschirms) gedrückt und schließe dabei das USB-Kabel an. Lass los, sobald Text auf dem Bildschirm erscheint. Durch das Entsperren wird dein {device} gelöscht. Der Installer führt dieses Tool nicht selbst aus. Folge der Anleitung, komm dann zurück und fahre fort."
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Dein {device} wird einmalig an einem Windows-PC entsperrt: Das Tool UnlockBootloader aus der Installationsanleitung von GammaOS Next (Unisoc T820, Schritte 1 und 2) läuft nur unter Windows. Installiere zuerst den Unisoc-USB-Treiber aus den UnisocTools der Anleitung. Schalte dann dein {device} aus und zieh das Kabel ab, starte UnlockBootloader.bat und halte innerhalb von 30 Sekunden die Zurück-Taste gedrückt und schließe dabei das USB-Kabel an. Lass los, sobald Text auf dem Bildschirm erscheint. Durch das Entsperren wird dein {device} gelöscht. Der Installer führt dieses Tool nicht selbst aus. Folge der Anleitung, komm dann zurück und fahre fort."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "Dein {device} wird einmalig mit dem Web-Entsperrtool aus der Installationsanleitung von GammaOS Next entsperrt (Anbernic RG405M / RG405V / RG505, Schritt 2). Nimm die microSD-Karte heraus, aktiviere „USB-Debugging“ in den „Entwickleroptionen“ und starte dein {device} mit adb reboot bootloader im Fastboot-Modus neu: Auf dem Bildschirm steht fastboot mode neben dem Anbernic-Logo. Öffne das Tool in Google Chrome, klicke auf „Connect“, wähle das Gerät aus und klicke dann auf „Unlock“. Drücke auf deinem {device} nicht die Leiser-Taste, sondern bestätige mit der Home-/Zurück-Taste. Unter Linux oder macOS macht das Tool unisoc-unlock aus der Anleitung dasselbe. Durch das Entsperren wird dein {device} gelöscht. Der Installer führt diese Tools nicht selbst aus. Folge der Anleitung, komm dann zurück und fahre fort."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Das Profil {profile} ist noch nicht veröffentlicht. Wähle ein als verfügbar markiertes Profil."
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "Auf diesem Gerät läuft kein passender Thimsy- oder GammaOS-Build, daher kann es nicht aktualisiert werden. Verwende stattdessen eine Vollinstallation (sie löscht das Gerät)."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "Das Partitionslayout dieses Geräts passt nicht zu dieser Firmware: Es ist ein anderes Modell, oder es läuft noch die Original-Firmware, die neu partitioniert werden muss, was diese Version noch nicht kann."
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "Dieses Laufwerk ist mit FAT32 formatiert, das keine Dateien über 4 GB speichern kann. Wähle einen Arbeitsbereich auf einem anderen Laufwerk (NTFS, exFAT, APFS oder ext4)."
"This version of the installer expects a different build. Build again, then install.": "Diese Version des Installers erwartet einen anderen Build. Erstelle den Build erneut und installiere dann."
"Turn it on": "Einschalten"
"Turn on OEM unlocking": "OEM-Entsperrung aktivieren"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Schalte dein {device} aus und zieh das Kabel ab. Halte die Zurück-Taste und die Anbernic-Taste daneben gedrückt und schließe dabei das USB-Kabel an diesen Computer an. Halte sie gedrückt, bis die Installation beginnt."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Schalte dein {device} aus und zieh das Kabel ab. Halte die Zurück-Taste gedrückt und schließe dabei das USB-Kabel an diesen Computer an. Halte sie gedrückt, bis die Installation beginnt."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Schalte dein {device} aus und zieh das Kabel ab. Halte die Zurück-Taste – die Taste auf der rechten Seite des Bildschirms – gedrückt und schließe dabei das USB-Kabel an diesen Computer an. Halte sie gedrückt, bis die Installation beginnt."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Schalte dein {device} vollständig aus und zieh das Kabel ab. Halte die Leiser- und die Lauter-Taste gleichzeitig gedrückt und schließe dabei das USB-Kabel an diesen Computer an. Halte beide gedrückt, bis die Installation beginnt."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "Schalte dein {device} vollständig aus. Wenn der Installer dich dazu auffordert, schließe das USB-Kabel an diesen Computer an und lass es angeschlossen, bis die Installation fertig ist."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "Schalte dein {device} aus, stecke die Karte ein und schalte es ein. Es installiert sich selbstständig von der Karte in den internen Speicher, was einige Minuten dauert. Lass es in Ruhe, bis es sich von selbst ausschaltet oder neu startet, und nimm dann die Karte heraus."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Schalte dein {device} aus, stecke die Karte ein und schalte es ein. Es installiert sich selbstständig von der Karte in den internen Speicher. Lass es in Ruhe, bis es fertig ist, schalte es dann aus und nimm die Karte heraus."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Schalte dein {device} aus, zieh das Kabel ab und nimm alle SD-Karten heraus. Schiebe es auf, halte dann die Zurück-Taste in der Mitte des Joypads gedrückt und schließe dabei das USB-Kabel an diesen Computer an. Halte sie gedrückt, bis die Installation beginnt."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Schalte dein {device} ein, lass das USB-Debugging in den Entwickleroptionen aktiviert und verbinde es mit diesem Computer. Es startet von selbst neu und die Installation beginnt."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Schalte dein {device} ein, lass das USB-Debugging in den Entwickleroptionen aktiviert und verbinde es mit diesem Computer. Es startet für die Installation in den Fastboot-Modus neu."
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "Der USB-Zugriff für {ids} ist noch nicht eingerichtet. Beim Einrichten wirst du einmal nach deinem Passwort gefragt."
"USB access is set up for {ids}": "USB-Zugriff für {ids} ist eingerichtet"
"Unlock before flashing": "Vor dem Flashen entsperren"
"Unlock with GammaOS's own steps": "Mit den Schritten von GammaOS entsperren"
"Unpacking the firmware": "Firmware wird entpackt"
"Unpacking {file}": "{file} wird entpackt"
"Unplug it and turn it on": "Kabel abziehen und einschalten"
"Unplug the cable when it restarts": "Kabel beim Neustart abziehen"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Zieh das Kabel ab. Halte die Ein/Aus-Taste und die Leiser-Taste mindestens 60 Sekunden lang gedrückt und schließe dann, während du sie weiter hältst, das USB-Kabel an. Halte sie gedrückt, bis die Installation beginnt; es kann 30 Sekunden oder länger dauern, bis dein {device} gefunden wird."
"Updating checksums": "Prüfsummen werden aktualisiert"
"Use a Windows PC": "Windows-PC verwenden"
"Use the firmware version the catalog lists for this device.": "Verwende die Firmware-Version, die der Katalog für dieses Gerät angibt."
"Use the volume keys to choose Unlock, then press Power.": "Wähle mit den Lautstärketasten „Unlock“ und drücke dann die Ein/Aus-Taste."
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "Auf den ersten Start warten"
"Wait on the Anbernic logo": "Auf dem Anbernic-Logo warten"
"Wait through a blank screen": "Einen leeren Bildschirm abwarten"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Wenn die Installation fertig ist, drücke einmal die Ein/Aus-Taste, falls dein {device} nicht von selbst neu gestartet ist."
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "Wenn die Installation fertig ist, startet dein {device} von selbst neu und richtet seinen Speicher ein. Zieh dann das Kabel ab."
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "Wenn die Installation fertig ist, zieh das Kabel ab und drücke die Ein/Aus-Taste, um dein {device} einzuschalten."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "Wenn der Bildschirm INFO: LOCK FLAG IS: UNLOCK!!! anzeigt, ist es entsperrt. Zieh das Kabel ab, vergewissere dich, dass dein {device} ausgeschaltet ist (falls es neu startet, halte die Ein/Aus-Taste gedrückt, bis es sich ausschaltet), und fahre dann fort."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Wenn der Bildschirm Unlock bootloader success! anzeigt, ist es entsperrt. Zeigt dein {device} beim Start bereits kurz INFO: LOCK FLAG IS : UNLOCK!!! an, war es schon entsperrt und du kannst das Entsperren überspringen."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Wenn dein {device} danach fragt, drücke innerhalb von 3 Sekunden die Lauter-Taste, um das Entsperren zu bestätigen."
"WinUSB is installed for {ids}": "WinUSB ist für {ids} installiert"
"WinUSB will be installed for {ids} the first time you flash": "WinUSB wird beim ersten Flashen für {ids} installiert"
"Windows asks for permission next. Click Yes so the installer can give your device the USB driver it needs as soon as you connect it. Don't connect it yet.": "Windows fragt gleich nach deiner Erlaubnis. Klicke auf Ja, damit das Installationsprogramm deinem Gerät den nötigen USB-Treiber geben kann, sobald du es anschließt. Schließ es noch nicht an."
"Windows now gives the device the driver the installer needs. Unplug the cable and turn the device off, then repeat the download-mode steps with the same USB port.": "Windows gibt dem Gerät jetzt den Treiber, den das Installationsprogramm braucht. Zieh das Kabel ab und schalte das Gerät aus. Wiederhole dann die Schritte für den Download-Modus am selben USB-Anschluss."
"WonderSwan": "WonderSwan"
"Writing {partition}": "{partition} wird geschrieben"
"Wrote {partition}": "{partition} geschrieben"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "Auf deinem {device} läuft bereits GammaOS oder Thimsy. Wähle, wie die neue Firmware installiert werden soll."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Auf deinem {device} läuft bereits eine Custom-Firmware (es wurde schon einmal entsperrt). Das Entsperren wird übersprungen."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Auf deinem {device} läuft noch die Original-Firmware. Der Installer führt dich durch das Entsperren und dann durch eine Neuinstallation, die das Gerät löscht."
"hakuX": "hakuX"
"needs Android API {n}": "erfordert Android API {n}"
"needs Vulkan": "erfordert Vulkan"
"needs an ARMv8.2 CPU": "erfordert eine ARMv8.2-CPU"
"needs {n} GB RAM": "erfordert {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} kann nicht von {host} aus installiert werden. Führe Thimsy Installer auf einem Windows-PC aus, um es zu installieren."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} wird mit PhoenixSuit von Allwinner installiert, das nur unter Windows läuft. Führe Thimsy Installer auf einem Windows-PC aus, um es zu installieren."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} wird mit SP Flash Tool von MediaTek installiert, das nicht unter {host} läuft. Führe Thimsy Installer auf einem Windows-PC aus, um es zu installieren."
"{device} isn't supported by this version of the installer yet.": "{device} wird von dieser Version des Installers noch nicht unterstützt."
"{host} needs no driver": "{host} benötigt keinen Treiber"
