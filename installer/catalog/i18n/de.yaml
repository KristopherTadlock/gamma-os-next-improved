"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "Öffne auf deinem {device} die Einstellungen, dann „Über das Gerät“, und tippe siebenmal auf „Build-Nummer“. Aktiviere danach unter Einstellungen > „Entwickleroptionen“ das „USB-Debugging“ und die „OEM-Entsperrung“. Verbinde dein {device} eingeschaltet mit diesem Computer; es startet für die Installation in den Fastboot-Modus neu."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "Öffne auf deinem {device} die Einstellungen, dann „Über das Gerät“, und tippe siebenmal auf „Build-Nummer“. Aktiviere danach unter Einstellungen > „Entwickleroptionen“ das „USB-Debugging“ und die „OEM-Entsperrung“. Verbinde dein {device} eingeschaltet mit diesem Computer; es startet für das Entsperren in den Fastboot-Modus neu."
