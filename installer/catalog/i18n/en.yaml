"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue."
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue."
