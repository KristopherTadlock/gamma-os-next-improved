"Shattered Pixel Dungeon (pack-in game)": "Shattered Pixel Dungeon (игра в комплекте)"
"Slide it open, hold Back and plug in": "Раздвиньте устройство, удерживайте «Назад» и подключите"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Небольшая загрузка для классических систем вплоть до PlayStation: одно быстрое ядро RetroArch на систему, главный экран Minima, без шейдеров."
"Start from the microSD card": "Запуск с карты microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Извлеките из {device} все остальные карты microSD, вставьте карту Thimsy и включите устройство. Thimsy работает с карты и не затрагивает внутреннюю память: чтобы вернуться к исходной системе, выключите устройство и извлеките карту."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Извлеките SD-карту, если она вставлена, затем удерживайте кнопку уменьшения громкости и кнопку питания, пока {device} не перезагрузится."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Извлеките карту microSD и включите «Отладку по USB» в разделе «Для разработчиков». Подключите включённое {device} к этому компьютеру. Оно перезагрузится в fastbootd: на экране появится крупная красная надпись fastbootd."
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "Возможно, диск с рабочей папкой неисправен. Выберите рабочую папку на другом диске и повторите сборку."
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "Установщик драйвера не входит в эту сборку. Установите WinUSB для режима загрузки устройства с помощью Zadig."
"The file is damaged or a different version. Delete it and download again.": "Файл повреждён или другой версии. Удалите его и загрузите заново."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Первый запуск может занять от 1 до 3 минут, и может показаться, что устройство зависло на логотипе Anbernic. Это нормально."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Первый запуск занимает от 1 до 3 минут, и может показаться, что экран завис на логотипе загрузки. Это нормально."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Первый запуск займёт несколько минут, пока Thimsy настраивает эмуляторы. Не выключайте устройство."
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "Не удалось проверить свободное место на этом диске. Выберите для рабочей папки другую папку."
"The installer does a fresh install that erases your {device}, whatever it runs now.": "Установщик выполнит чистую установку, которая сотрёт данные на {device}, какая бы система на нём ни стояла."
"The installer runs as root, so it can open the device": "Установщик запущен от имени root, поэтому может открыть устройство"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} разблокируется один раз на компьютере с Windows: инструмент UnlockBootloader из руководства по установке GammaOS Next (Unisoc T820, шаги 1 и 2) работает только в Windows. Сначала установите USB-драйвер Unisoc из UnisocTools, указанного в руководстве. Затем выключите {device} и отсоедините кабель, запустите UnlockBootloader.bat и в течение 30 секунд зажмите кнопку «Назад» (кнопку справа от экрана) и, не отпуская её, подключите USB-кабель. Отпустите, когда на экране появится текст. Разблокировка стирает данные на {device}. Установщик сам этот инструмент не запускает. Выполните шаги руководства, затем вернитесь и продолжите."
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} разблокируется один раз на компьютере с Windows: инструмент UnlockBootloader из руководства по установке GammaOS Next (Unisoc T820, шаги 1 и 2) работает только в Windows. Сначала установите USB-драйвер Unisoc из UnisocTools, указанного в руководстве. Затем выключите {device} и отсоедините кабель, запустите UnlockBootloader.bat и в течение 30 секунд зажмите кнопку «Назад» и, не отпуская её, подключите USB-кабель. Отпустите, когда на экране появится текст. Разблокировка стирает данные на {device}. Установщик сам этот инструмент не запускает. Выполните шаги руководства, затем вернитесь и продолжите."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "{device} разблокируется один раз веб-инструментом разблокировки из руководства по установке GammaOS Next (Anbernic RG405M / RG405V / RG505, шаг 2). Извлеките карту microSD, включите «Отладку по USB» в разделе «Для разработчиков» и перезагрузите {device} в режим fastboot командой adb reboot bootloader: на экране рядом с логотипом Anbernic появится надпись fastboot mode. Откройте инструмент в Google Chrome, нажмите «Connect», выберите устройство, затем нажмите «Unlock». На {device} не нажимайте кнопку уменьшения громкости: для подтверждения нажмите кнопку «Домой» / «Назад». В Linux или macOS то же самое делает инструмент unisoc-unlock из руководства. Разблокировка стирает данные на {device}. Установщик сам эти инструменты не запускает. Выполните шаги руководства, затем вернитесь и продолжите."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Профиль {profile} ещё не опубликован. Выберите профиль, отмеченный как доступный."
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "На этом устройстве нет подходящей сборки Thimsy или GammaOS, поэтому его нельзя обновить. Выполните вместо этого полную установку (она сотрёт данные на устройстве)."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "Разметка разделов этого устройства не совпадает с этой прошивкой: это другая модель или на нём всё ещё заводская прошивка, которую нужно переразметить, а эта версия пока так не умеет."
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "Этот диск отформатирован в FAT32, где нельзя хранить файлы больше 4 ГБ. Выберите рабочую папку на другом диске (NTFS, exFAT, APFS или ext4)."
"This version of the installer expects a different build. Build again, then install.": "Эта версия установщика ожидает другую сборку. Повторите сборку, затем установите."
"Turn it on": "Включите устройство"
"Turn on OEM unlocking": "Включите заводскую разблокировку"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Выключите {device} и отсоедините кабель. Удерживайте кнопку «Назад» и кнопку Anbernic рядом с ней и, не отпуская обе, подключите USB-кабель к этому компьютеру. Не отпускайте, пока не начнётся установка."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Выключите {device} и отсоедините кабель. Удерживайте кнопку «Назад» и, не отпуская её, подключите USB-кабель к этому компьютеру. Не отпускайте, пока не начнётся установка."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Выключите {device} и отсоедините кабель. Удерживайте кнопку «Назад» (кнопку справа от экрана) и, не отпуская её, подключите USB-кабель к этому компьютеру. Не отпускайте, пока не начнётся установка."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Полностью выключите {device} и отсоедините кабель. Одновременно удерживайте кнопки уменьшения и увеличения громкости и, не отпуская обе, подключите USB-кабель к этому компьютеру. Не отпускайте, пока не начнётся установка."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "Полностью выключите {device}. Когда установщик попросит, подключите USB-кабель к этому компьютеру и не отключайте его до конца установки."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "Выключите {device}, вставьте карту и включите устройство. Оно само установит систему с карты во внутреннюю память, это займёт несколько минут. Не трогайте его, пока оно само не выключится или не перезагрузится, затем извлеките карту."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Выключите {device}, вставьте карту и включите устройство. Оно само установит систему с карты во внутреннюю память. Не трогайте его, пока процесс не завершится, затем выключите устройство и извлеките карту."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Выключите {device}, отсоедините кабель и извлеките все SD-карты. Раздвиньте устройство, затем удерживайте кнопку «Назад» в центре крестовины и, не отпуская её, подключите USB-кабель к этому компьютеру. Не отпускайте, пока не начнётся установка."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Включите {device}, оставив «Отладку по USB» включённой в разделе «Для разработчиков», и подключите его к этому компьютеру. Оно само перезагрузится, и начнётся установка."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Включите {device}, оставив «Отладку по USB» включённой в разделе «Для разработчиков», и подключите его к этому компьютеру. Оно перезагрузится в режим fastboot для установки."
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "Доступ к USB для {ids} ещё не настроен. При настройке пароль будет запрошен один раз."
"USB access is set up for {ids}": "Доступ к USB для {ids} настроен"
"Unlock before flashing": "Разблокируйте перед прошивкой"
"Unlock with GammaOS's own steps": "Разблокировка по инструкции GammaOS"
"Unpacking the firmware": "Распаковка прошивки"
"Unpacking {file}": "Распаковка {file}"
"Unplug it and turn it on": "Отсоедините кабель и включите устройство"
"Unplug the cable when it restarts": "Отсоедините кабель, когда устройство перезагрузится"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Отсоедините кабель. Удерживайте кнопку питания и кнопку уменьшения громкости не менее 60 секунд, затем, не отпуская их, подключите USB-кабель. Не отпускайте, пока не начнётся установка; обнаружение {device} может занять 30 секунд и больше."
"Updating checksums": "Обновление контрольных сумм"
"Use a Windows PC": "Используйте ПК с Windows"
"Use the firmware version the catalog lists for this device.": "Используйте версию прошивки, указанную в каталоге для этого устройства."
"Use the volume keys to choose Unlock, then press Power.": "Кнопками громкости выберите «Unlock», затем нажмите кнопку питания."
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "Дождитесь первой загрузки"
"Wait on the Anbernic logo": "Дождитесь логотипа Anbernic"
"Wait through a blank screen": "Переждите пустой экран"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Когда установка завершится, один раз нажмите кнопку питания, если {device} не перезагрузилось само."
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "Когда установка завершится, {device} само перезагрузится и подготовит память. Тогда отсоедините кабель."
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "Когда установка завершится, отсоедините кабель и нажмите кнопку питания, чтобы включить {device}."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "Когда на экране появится INFO: LOCK FLAG IS: UNLOCK!!!, устройство разблокировано. Отсоедините кабель и убедитесь, что {device} выключено (если оно перезагрузится, удерживайте кнопку питания, пока оно не выключится), затем продолжите."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Когда на экране появится Unlock bootloader success!, устройство разблокировано. Если {device} уже при включении ненадолго показывает INFO: LOCK FLAG IS : UNLOCK!!!, оно было разблокировано раньше, и разблокировку можно пропустить."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Когда {device} запросит подтверждение, в течение 3 секунд нажмите кнопку увеличения громкости, чтобы подтвердить разблокировку."
"WinUSB is installed for {ids}": "WinUSB установлен для {ids}"
"WinUSB will be installed for {ids} the first time you flash": "WinUSB будет установлен для {ids} при первой прошивке"
"WonderSwan": "WonderSwan"
"Writing {partition}": "Запись {partition}"
"Wrote {partition}": "Раздел {partition} записан"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "На вашем {device} уже стоит GammaOS или Thimsy. Выберите, как установить новую прошивку."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "На вашем {device} уже установлена кастомная прошивка (оно уже было разблокировано). Разблокировка пропускается."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "На вашем {device} всё ещё стоит оригинальная прошивка. Установщик поможет разблокировать его, а затем выполнит чистую установку, которая сотрёт данные на устройстве."
"hakuX": "hakuX"
"needs Android API {n}": "требуется Android API {n}"
"needs Vulkan": "требуется Vulkan"
"needs an ARMv8.2 CPU": "требуется процессор ARMv8.2"
"needs {n} GB RAM": "требуется {n} ГБ ОЗУ"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} нельзя установить из {host}. Чтобы установить его, запустите Thimsy Installer на ПК с Windows."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} устанавливается с помощью PhoenixSuit от Allwinner, который работает только в Windows. Чтобы установить его, запустите Thimsy Installer на ПК с Windows."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} устанавливается с помощью SP Flash Tool от MediaTek, который не работает в {host}. Чтобы установить его, запустите Thimsy Installer на ПК с Windows."
"{device} isn't supported by this version of the installer yet.": "{device} пока не поддерживается этой версией установщика."
"{host} needs no driver": "Для {host} драйвер не нужен"
