"In Android Settings, Storage, check whether the {device} has 128 GB or 256 GB. Each size needs its own layout, and installing the wrong one can brick the {device}.": "В «Настройках» Android, в разделе «Хранилище», проверьте, сколько памяти у {device}: 128 GB или 256 GB. Для каждого объёма нужна своя разметка, и установка неподходящей может вывести {device} из строя."
"In Settings, Handheld Settings, About Device, Device Information, note the first four characters of the SN (MQ65 or MQ66). Each hardware revision needs its own firmware.": "В «Настройках» откройте «Настройки консоли», «Об устройстве», «Сведения об устройстве» и запишите первые четыре символа SN (MQ65 или MQ66). Для каждой аппаратной ревизии нужна своя прошивка."
