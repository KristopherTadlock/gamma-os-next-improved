"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Удерживайте кнопку питания, чтобы выключить {device}. Удерживайте обе кнопки громкости и, не отпуская их, подключите USB-кабель. Затем, по-прежнему удерживая кнопки громкости, многократно нажимайте кнопку питания, пока не начнётся установка."
