"Preparing partitions": "Подготовка разделов"
"Preparing the partitions": "Подготовка разделов"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Вставьте карту в {device} и включите его. Thimsy работает с карты и не затрагивает внутреннюю память {device}: чтобы вернуться к исходной системе, выключите устройство и извлеките карту."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Переустановите Thimsy Installer: его инструмент прошивки не той версии, которая ожидается."
"Reinstall Thimsy Installer: one of its tools is missing.": "Переустановите Thimsy Installer: отсутствует один из его инструментов."
"Repeat the download-mode steps and keep holding the button until installing starts, then try again.": "Повторите шаги для режима загрузки и удерживайте кнопку, пока не начнётся установка, затем повторите попытку."
"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "Повторите шаги для режима загрузки, затем повторите попытку. Если устройство по-прежнему не найдено, проверьте в диспетчере устройств, что для Unisoc download mode используется драйвер WinUSB."
"Repeat the download-mode steps, then try again. If it still isn't found, unplug the cable, plug it into another USB port and try again.": "Повторите шаги для режима загрузки, затем повторите попытку. Если устройство по-прежнему не найдено, отключите кабель, подключите его к другому USB-порту и повторите попытку."
"Restart into fastbootd": "Перезагрузка в fastbootd"
