# Russian translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Чистая установка стирает внутреннюю память. Скопируйте ROMs, сохранения, скриншоты и всё остальное, что хотите сохранить, на компьютер или карту microSD. Игры на карте microSD не затрагиваются."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Подтвердите запрос разрешения Windows или установите WinUSB с помощью Zadig."
"Already unlocked: install new firmware": "Уже разблокировано: установить новую прошивку"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Сбалансированный: RetroArch для классических систем, а также эмуляторы N64, Dreamcast, PSP и DS, главный экран ES-DE и Brave."
"Building Thimsy for your device": "Сборка Thimsy для вашего устройства"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Собрано из официального выпуска GammaOS Next 1.2 для RG Cube, загруженного со страницы GammaOS на GitHub."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Перед началом зарядите устройство минимум до 50% и держите под рукой комплектный кабель."
"Charge the RG Cube": "Зарядите RG Cube"
"Check it's unlocked": "Убедитесь, что устройство разблокировано"
"Check the basics": "Проверьте основное"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Проверьте кнопки, сенсорный экран, звук и Wi-Fi, затем запустите игру."
"Check the cable and that the device is still in its flashing mode, then try again.": "Проверьте кабель и убедитесь, что устройство всё ещё в режиме прошивки, затем повторите попытку."
"Checking the USB driver": "Проверка USB-драйвера"
"Checking the build": "Проверка сборки"
"Checking the plan": "Проверка плана"
"Checking the result": "Проверка результата"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Выберите рабочую папку на диске с бо́льшим объёмом свободного места (не FAT32) или освободите место."
"Confirm on the device": "Подтвердите на устройстве"
"Confirm with Volume Up": "Подтвердите кнопкой увеличения громкости"
"Connect it with USB debugging on": "Подключите с включённой отладкой по USB"
"Connect the device in download mode": "Подключите устройство в режиме загрузки"
"Copy games without a card reader": "Копируйте игры без кардридера"
"Copy your games and saves": "Скопируйте игры и сохранения"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Удалите папку «jobs» в рабочей папке и повторите сборку; если ошибка не исчезнет, сообщите о ней."
"Don't install on units made in March 2026 or later.": "Не устанавливайте на устройства, выпущенные в марте 2026 года или позже."
"Don't install on units whose stock firmware is v1.26.": "Не устанавливайте на устройства с заводской прошивкой v1.26."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "Не вставляйте карту обратно в компьютер, чтобы скопировать игры: на ней зашифрованная разметка Android, поэтому компьютер не покажет ваше хранилище. Вместо этого копируйте игры через передачу файлов по USB (MTP), с помощью ADB Explorer или из сетевой папки."
"Download mode was never seen through WinUSB. Hold Back while you plug in the cable, and check in Device Manager or Zadig that Windows uses WinUSB for Unisoc download mode, not Unisoc's own driver.": "Режим загрузки ни разу не был обнаружен через WinUSB. Удерживайте «Назад», пока подключаете кабель, и проверьте в диспетчере устройств или в Zadig, что Windows использует WinUSB для Unisoc download mode, а не собственный драйвер Unisoc."
"Downloading": "Загрузка"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Всё: Средний, а также эмуляторы GameCube/Wii, 3DS, PS2, Xbox и PS Vita и точные ядра. Полный набор Thimsy 1.0a."
"Finishing": "Завершение"
"First time installing custom firmware": "Первая установка кастомной прошивки"
"Follow the unlock steps shown in the installer, then continue.": "Выполните шаги разблокировки, показанные в установщике, затем продолжите."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "Руководство GammaOS предупреждает, что прошивка {device} без предварительной разблокировки выводит устройство из строя. После разблокировки {device} перезагрузится в исходный Android. Дождитесь запуска Android, затем продолжите."
"Heavy": "Полный"
"Hold Back and plug in the cable": "Удерживайте «Назад» и подключите кабель"
"Hold Back and the Anbernic button, then plug in": "Удерживайте «Назад» и кнопку Anbernic, затем подключите"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Удерживайте кнопку питания, чтобы выключить {device}. Удерживайте обе кнопки громкости и, не отпуская их, подключите USB-кабель. Затем, по-прежнему удерживая кнопки громкости, многократно нажимайте кнопку питания, пока не начнётся установка."
"Hold both volume buttons and plug in the cable": "Удерживайте обе кнопки громкости и подключите кабель"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Одновременно удерживайте кнопку «Назад», кнопку уменьшения громкости и кнопку питания, пока установка не начнётся снова."
"If installation doesn't start": "Если установка не начинается"
"If installation stalls": "Если установка зависла"
"If it isn't found": "Если устройство не найдено"
"If the screen stays black": "Если экран остаётся чёрным"
"Install from the microSD card": "Установка с карты microSD"
"Installing Thimsy": "Установка Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Сохраняет ваши данные. Только если на RG Cube уже установлена GammaOS Next 1.2 или сборка Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Сохраняет ваши данные. Только если на устройстве уже установлена совместимая сборка Thimsy или GammaOS."
"Light": "Лёгкий"
"Medium": "Средний"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "При самом первом запуске экран может оставаться пустым до минуты. Это нормально; дождитесь появления экрана загрузки."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "На {device} откройте «Настройки», «Об устройстве» и семь раз нажмите «Номер сборки». Затем в «Настройках», в разделе «Для разработчиков», включите «Отладку по USB» и «Заводскую разблокировку». Подключите включённое {device} к этому компьютеру; оно перезагрузится в режим fastboot для установки."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "На {device} откройте «Настройки», «Об устройстве» и семь раз нажмите «Номер сборки». Затем в «Настройках», в разделе «Для разработчиков», включите «Отладку по USB» и «Заводскую разблокировку». Подключите включённое {device} к этому компьютеру; оно перезагрузится в режим fastboot для разблокировки."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Запланировано: установка через Qualcomm EDL на любом компьютере. Пока недоступно."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Запланировано: SP Flash Tool в Windows и Linux. Пока недоступно."
"Planned: Windows only. Not buildable yet.": "Запланировано: только Windows. Пока недоступно."
"Planned: fastboot install on every computer. Not buildable yet.": "Запланировано: установка через fastboot на любом компьютере. Пока недоступно."
"Planned: microSD card install on every computer. Not buildable yet.": "Запланировано: установка с карты microSD на любом компьютере. Пока недоступно."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Запланировано: тот же способ прошивки, что и у RG Cube. Пока недоступно."
"Plug in the cable with the device off": "Подключите кабель к выключенному устройству"
"Preparing the partitions": "Подготовка разделов"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Вставьте карту в {device} и включите его. Thimsy работает с карты и не затрагивает внутреннюю память {device}: чтобы вернуться к исходной системе, выключите устройство и извлеките карту."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Переустановите Thimsy Installer или укажите в THIMSY_TOOLS_DIR папку, где он находится."
"Restart into fastbootd": "Перезагрузка в fastbootd"
"Restart with Power": "Перезапуск кнопкой питания"
"Restarting the device": "Перезапуск устройства"
"Slide it open, hold Back and plug in": "Раздвиньте устройство, удерживайте «Назад» и подключите"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Небольшая загрузка для классических систем вплоть до PlayStation: одно быстрое ядро RetroArch на систему, главный экран Minima, без шейдеров."
"Start from the microSD card": "Запуск с карты microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Извлеките из {device} все остальные карты microSD, вставьте карту Thimsy и включите устройство. Thimsy работает с карты и не затрагивает внутреннюю память: чтобы вернуться к исходной системе, выключите устройство и извлеките карту."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Извлеките SD-карту, если она вставлена, затем удерживайте кнопку уменьшения громкости и кнопку питания, пока {device} не перезагрузится."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Извлеките карту microSD и включите «Отладку по USB» в разделе «Для разработчиков». Подключите включённое {device} к этому компьютеру. Оно перезагрузится в fastbootd: на экране появится крупная красная надпись fastbootd."
"The file is damaged or a different version. Delete it and download again.": "Файл повреждён или другой версии. Удалите его и загрузите заново."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Первый запуск может занять от 1 до 3 минут, и может показаться, что устройство зависло на логотипе Anbernic. Это нормально."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Первый запуск занимает от 1 до 3 минут, и может показаться, что экран завис на логотипе загрузки. Это нормально."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Первый запуск займёт несколько минут, пока Thimsy настраивает эмуляторы. Не выключайте устройство."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} разблокируется один раз инструментом UnlockBootloader из руководства по установке GammaOS Next (Unisoc T820, шаг 2): выключите {device}, запустите инструмент, затем удерживайте кнопку «Назад», пока подключаете USB-кабель. Установщик сам этот инструмент не запускает. Выполните шаги руководства, затем вернитесь и продолжите."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} разблокируется один раз инструментом UnlockBootloader из руководства по установке GammaOS Next (Unisoc T820, шаг 2): выключите {device}, запустите инструмент, затем удерживайте кнопку «Назад» (кнопку справа от экрана), пока подключаете USB-кабель. Установщик сам этот инструмент не запускает. Выполните шаги руководства, затем вернитесь и продолжите."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} разблокируется один раз веб-инструментом разблокировки из руководства по установке GammaOS Next (Anbernic RG405M / RG405V / RG505, шаг 2). Перезагрузите {device} в режим fastboot, откройте инструмент в Google Chrome, нажмите «Connect», затем «Unlock». На {device} не нажимайте кнопку уменьшения громкости: для подтверждения нажмите кнопку «Домой» / «Назад». Установщик сам этот инструмент не запускает. Выполните шаги руководства, затем вернитесь и продолжите."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Профиль {profile} ещё не опубликован. Выберите профиль, отмеченный как доступный."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "Разметка разделов этого устройства не совпадает с этой прошивкой: это другая модель или на нём всё ещё заводская прошивка, которую нужно переразметить, а эта версия пока так не умеет."
"Turn on OEM unlocking": "Включите заводскую разблокировку"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Выключите {device} и отсоедините кабель. Удерживайте кнопку «Назад» и кнопку Anbernic рядом с ней и, не отпуская обе, подключите USB-кабель к этому компьютеру. Не отпускайте, пока не начнётся установка."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Выключите {device} и отсоедините кабель. Удерживайте кнопку «Назад» и, не отпуская её, подключите USB-кабель к этому компьютеру. Не отпускайте, пока не начнётся установка."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Выключите {device} и отсоедините кабель. Удерживайте кнопку «Назад» (кнопку справа от экрана) и, не отпуская её, подключите USB-кабель к этому компьютеру. Не отпускайте, пока не начнётся установка."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Полностью выключите {device} и отсоедините кабель. Одновременно удерживайте кнопки уменьшения и увеличения громкости и, не отпуская обе, подключите USB-кабель к этому компьютеру. Не отпускайте, пока не начнётся установка."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "Полностью выключите {device}. Когда установщик попросит, подключите USB-кабель к этому компьютеру."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Выключите {device}, вставьте карту и включите устройство. Оно само установит систему с карты во внутреннюю память. Не трогайте его, пока процесс не завершится, затем выключите устройство и извлеките карту."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Выключите {device}, отсоедините кабель и извлеките все SD-карты. Раздвиньте устройство, затем удерживайте кнопку «Назад» в центре крестовины и, не отпуская её, подключите USB-кабель к этому компьютеру. Не отпускайте, пока не начнётся установка."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Включите {device}, оставив «Отладку по USB» включённой в разделе «Для разработчиков», и подключите его к этому компьютеру. Оно само перезагрузится, и начнётся установка."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Включите {device}, оставив «Отладку по USB» включённой в разделе «Для разработчиков», и подключите его к этому компьютеру. Оно перезагрузится в режим fastboot для установки."
"Unlock before flashing": "Разблокируйте перед прошивкой"
"Unlock with GammaOS's own steps": "Разблокировка по инструкции GammaOS"
"Unpacking the firmware": "Распаковка прошивки"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Отсоедините кабель. Удерживайте кнопку питания и кнопку уменьшения громкости не менее 60 секунд, затем, не отпуская их, подключите USB-кабель. Не отпускайте, пока не начнётся установка; обнаружение {device} может занять 30 секунд и больше."
"Use a Windows PC": "Используйте ПК с Windows"
"Use the firmware version the catalog lists for this device.": "Используйте версию прошивки, указанную в каталоге для этого устройства."
"Use the volume keys to choose Unlock, then press Power.": "Кнопками громкости выберите «Unlock», затем нажмите кнопку питания."
"Wait for the first boot": "Дождитесь первой загрузки"
"Wait on the Anbernic logo": "Дождитесь логотипа Anbernic"
"Wait through a blank screen": "Переждите пустой экран"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Когда установка завершится, один раз нажмите кнопку питания, если {device} не перезагрузилось само."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "Когда на экране появится INFO: LOCK FLAG IS: UNLOCK!!!, устройство разблокировано. Отсоедините кабель, убедитесь, что {device} выключено, и продолжите."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Когда на экране появится Unlock bootloader success!, устройство разблокировано. Если {device} уже при включении ненадолго показывает INFO: LOCK FLAG IS : UNLOCK!!!, оно было разблокировано раньше, и разблокировку можно пропустить."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Когда {device} запросит подтверждение, в течение 3 секунд нажмите кнопку увеличения громкости, чтобы подтвердить разблокировку."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "На вашем {device} уже установлена кастомная прошивка (оно уже было разблокировано). Разблокировка пропускается."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "На вашем {device} стоит оригинальная прошивка. Установщик выполнит чистую установку, которая сотрёт данные на устройстве."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "На вашем {device} всё ещё стоит оригинальная прошивка. Установщик поможет разблокировать его, а затем выполнит чистую установку, которая сотрёт данные на устройстве."
"needs Android API {n}": "требуется Android API {n}"
"needs Vulkan": "требуется Vulkan"
"needs an ARMv8.2 CPU": "требуется процессор ARMv8.2"
"needs {n} GB RAM": "требуется {n} ГБ ОЗУ"
