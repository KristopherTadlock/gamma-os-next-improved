"Preparing partitions": "กำลังเตรียมพาร์ติชัน"
"Preparing the partitions": "กำลังเตรียมพาร์ติชัน"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "ใส่การ์ดใน {device} แล้วเปิดเครื่อง Thimsy จะทำงานจากการ์ดและไม่แตะต้องพื้นที่จัดเก็บภายในของ {device} หากต้องการกลับไปใช้ระบบเดิม ให้ปิดเครื่องแล้วถอดการ์ดออก"
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "ติดตั้ง Thimsy Installer ใหม่ เครื่องมือแฟลชของโปรแกรมไม่ใช่เวอร์ชันที่ต้องการ"
"Reinstall Thimsy Installer: one of its tools is missing.": "ติดตั้ง Thimsy Installer ใหม่ เครื่องมือตัวหนึ่งของโปรแกรมหายไป"
"Repeat the download-mode steps and keep holding the button until installing starts, then try again.": "ทำตามขั้นตอนเข้าโหมดดาวน์โหลดอีกครั้ง และกดปุ่มค้างไว้จนกว่าการติดตั้งจะเริ่ม แล้วลองอีกครั้ง"
"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "ทำตามขั้นตอนเข้าโหมดดาวน์โหลดอีกครั้ง แล้วลองอีกครั้ง หากยังไม่พบอุปกรณ์ ให้ตรวจสอบในตัวจัดการอุปกรณ์ว่า Unisoc download mode ใช้ไดรเวอร์ WinUSB"
"Repeat the download-mode steps, then try again. If it still isn't found, unplug the cable, plug it into another USB port and try again.": "ทำตามขั้นตอนเข้าโหมดดาวน์โหลดอีกครั้ง แล้วลองอีกครั้ง หากยังไม่พบอุปกรณ์ ให้ถอดสาย เสียบเข้ากับพอร์ต USB อื่น แล้วลองอีกครั้ง"
"Restart into fastbootd": "รีสตาร์ทเข้าสู่ fastbootd"
"Restart with Power": "รีสตาร์ทด้วยปุ่มเปิด/ปิด"
"Restarting the device": "กำลังรีสตาร์ทอุปกรณ์"
"RetroArch": "RetroArch"
"SNES": "SNES"
"SNES (cycle-accurate)": "SNES (แม่นยำระดับไซเคิล)"
"Saturn": "Saturn"
"Saturn (accurate)": "Saturn (แม่นยำ)"
"ScummVM": "ScummVM"
"Shattered Pixel Dungeon (pack-in game)": "Shattered Pixel Dungeon (เกมที่แถมมา)"
"Slide it open, hold Back and plug in": "เลื่อนเครื่องเปิด กดปุ่มย้อนกลับค้างไว้แล้วเสียบสาย"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "ดาวน์โหลดขนาดเล็กสำหรับเครื่องคลาสสิกจนถึง PlayStation: คอร์ RetroArch ที่เร็วหนึ่งตัวต่อระบบ หน้าโฮม Minima ไม่มีเชดเดอร์"
"Start from the microSD card": "เริ่มจากการ์ด microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "ถอดการ์ด microSD อื่นๆ ออกจาก {device} ใส่การ์ด Thimsy แล้วเปิดเครื่อง Thimsy จะทำงานจากการ์ดและไม่แตะต้องพื้นที่จัดเก็บภายใน หากต้องการกลับไปใช้ระบบเดิม ให้ปิดเครื่องแล้วถอดการ์ดออก"
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "ถอดการ์ด SD ออก แล้วกดปุ่มลดเสียงและปุ่มเปิด/ปิดค้างไว้จนกว่า {device} จะรีสตาร์ท"
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "ถอดการ์ด microSD ออกและเปิด การแก้ไขข้อบกพร่องผ่าน USB ใน ตัวเลือกสำหรับนักพัฒนาซอฟต์แวร์ เชื่อมต่อ {device} กับคอมพิวเตอร์นี้ขณะที่เครื่องเปิดอยู่ เครื่องจะรีสตาร์ทเข้าสู่ fastbootd และหน้าจอจะแสดงคำว่า fastbootd เป็นตัวอักษรสีแดงขนาดใหญ่"
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "ไดรฟ์ที่พื้นที่ทำงานอยู่อาจกำลังเสีย เลือกพื้นที่ทำงานบนไดรฟ์อื่นแล้วสร้างใหม่"
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "บิลด์นี้ไม่ได้รวมตัวติดตั้งไดรเวอร์มาด้วย ติดตั้ง WinUSB สำหรับโหมดดาวน์โหลดของอุปกรณ์ด้วย Zadig"
"The file is damaged or a different version. Delete it and download again.": "ไฟล์เสียหายหรือเป็นเวอร์ชันอื่น ลบไฟล์แล้วดาวน์โหลดใหม่"
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "การบูตครั้งแรกอาจใช้เวลา 1 ถึง 3 นาที และอาจดูเหมือนค้างอยู่ที่โลโก้ Anbernic นี่เป็นเรื่องปกติ"
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "การบูตครั้งแรกใช้เวลา 1 ถึง 3 นาที และหน้าจออาจดูเหมือนค้างอยู่ที่โลโก้บูต นี่เป็นเรื่องปกติ"
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "การเริ่มต้นครั้งแรกจะใช้เวลาสักครู่ขณะที่ Thimsy ตั้งค่าอีมูเลเตอร์ อย่าปิดเครื่อง"
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "ตรวจสอบพื้นที่ว่างบนไดรฟ์นี้ไม่ได้ เลือกโฟลเดอร์อื่นสำหรับพื้นที่ทำงาน"
"The installer does a fresh install that erases your {device}, whatever it runs now.": "ตัวติดตั้งจะติดตั้งใหม่ทั้งหมดซึ่งจะลบข้อมูลใน {device} ของคุณ ไม่ว่าตอนนี้จะใช้ระบบใดอยู่"
"The installer runs as root, so it can open the device": "ตัวติดตั้งทำงานในฐานะ root จึงเปิดอุปกรณ์ได้"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} ต้องปลดล็อกเพียงครั้งเดียว บนพีซี Windows: เครื่องมือ UnlockBootloader จากคู่มือการติดตั้งของ GammaOS Next (Unisoc T820 ขั้นตอนที่ 1 และ 2) ทำงานบน Windows เท่านั้น ติดตั้งไดรเวอร์ USB ของ Unisoc จาก UnisocTools ในคู่มือก่อน จากนั้นปิด {device} และถอดสาย เริ่ม UnlockBootloader.bat แล้วภายใน 30 วินาที ให้กดปุ่มย้อนกลับ (ปุ่มทางด้านขวาของหน้าจอ) ค้างไว้ และเสียบสาย USB ขณะที่ยังกดอยู่ ปล่อยปุ่มเมื่อมีข้อความปรากฏบนหน้าจอ การปลดล็อกจะลบข้อมูลใน {device} ตัวติดตั้งไม่ได้เรียกใช้เครื่องมือนั้นเอง ทำตามคู่มือ แล้วกลับมาดำเนินการต่อ"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} ต้องปลดล็อกเพียงครั้งเดียว บนพีซี Windows: เครื่องมือ UnlockBootloader จากคู่มือการติดตั้งของ GammaOS Next (Unisoc T820 ขั้นตอนที่ 1 และ 2) ทำงานบน Windows เท่านั้น ติดตั้งไดรเวอร์ USB ของ Unisoc จาก UnisocTools ในคู่มือก่อน จากนั้นปิด {device} และถอดสาย เริ่ม UnlockBootloader.bat แล้วภายใน 30 วินาที ให้กดปุ่มย้อนกลับค้างไว้ และเสียบสาย USB ขณะที่ยังกดอยู่ ปล่อยปุ่มเมื่อมีข้อความปรากฏบนหน้าจอ การปลดล็อกจะลบข้อมูลใน {device} ตัวติดตั้งไม่ได้เรียกใช้เครื่องมือนั้นเอง ทำตามคู่มือ แล้วกลับมาดำเนินการต่อ"
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "{device} ต้องปลดล็อกเพียงครั้งเดียว ด้วยเครื่องมือปลดล็อกบนเว็บจากคู่มือการติดตั้งของ GammaOS Next (Anbernic RG405M / RG405V / RG505 ขั้นตอนที่ 2) ถอดการ์ด microSD ออก เปิด การแก้ไขข้อบกพร่องผ่าน USB ใน ตัวเลือกสำหรับนักพัฒนาซอฟต์แวร์ แล้วรีสตาร์ท {device} เข้าสู่โหมด fastboot ด้วยคำสั่ง adb reboot bootloader หน้าจอจะแสดงคำว่า fastboot mode ข้างโลโก้ Anbernic เปิดเครื่องมือใน Google Chrome คลิก \"Connect\" เลือกอุปกรณ์ แล้วคลิก \"Unlock\" บน {device} อย่ากดปุ่มลดเสียง ให้กดปุ่มโฮม / ย้อนกลับเพื่อยืนยัน บน Linux หรือ macOS เครื่องมือ unisoc-unlock ในคู่มือก็ทำแบบเดียวกันได้ การปลดล็อกจะลบข้อมูลใน {device} ตัวติดตั้งไม่ได้เรียกใช้เครื่องมือเหล่านี้เอง ทำตามคู่มือ แล้วกลับมาดำเนินการต่อ"
"The {profile} profile isn't published yet. Choose a profile marked available.": "โปรไฟล์ {profile} ยังไม่เผยแพร่ เลือกโปรไฟล์ที่ระบุว่าพร้อมใช้งาน"
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "อุปกรณ์นี้ไม่ได้ใช้บิลด์ Thimsy หรือ GammaOS ที่ตรงกัน จึงอัปเดตไม่ได้ ให้ใช้การติดตั้งแบบเต็มแทน (จะลบข้อมูลในอุปกรณ์)"
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "รูปแบบพาร์ติชันของอุปกรณ์นี้ไม่ตรงกับเฟิร์มแวร์นี้ อาจเป็นรุ่นอื่น หรือยังใช้เฟิร์มแวร์เดิมที่ต้องแบ่งพาร์ติชันใหม่ ซึ่งเวอร์ชันนี้ยังทำไม่ได้"
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "ไดรฟ์นี้ฟอร์แมตเป็น FAT32 ซึ่งเก็บไฟล์ที่ใหญ่กว่า 4 GB ไม่ได้ เลือกพื้นที่ทำงานบนไดรฟ์อื่น (NTFS, exFAT, APFS หรือ ext4)"
"This version of the installer expects a different build. Build again, then install.": "ตัวติดตั้งเวอร์ชันนี้ต้องการบิลด์อื่น โปรดสร้างใหม่แล้วจึงติดตั้ง"
"Turn it on": "เปิดเครื่อง"
"Turn on OEM unlocking": "เปิดการปลดล็อก OEM"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "ปิด {device} และถอดสาย กดปุ่มย้อนกลับและปุ่ม Anbernic ที่อยู่ข้างกันค้างไว้ แล้วเสียบสาย USB เข้ากับคอมพิวเตอร์นี้ขณะที่ยังกดทั้งสองปุ่มอยู่ กดค้างไว้จนกว่าการติดตั้งจะเริ่ม"
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "ปิด {device} และถอดสาย กดปุ่มย้อนกลับค้างไว้ แล้วเสียบสาย USB เข้ากับคอมพิวเตอร์นี้ขณะที่ยังกดอยู่ กดค้างไว้จนกว่าการติดตั้งจะเริ่ม"
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "ปิด {device} และถอดสาย กดปุ่มย้อนกลับ ซึ่งเป็นปุ่มทางด้านขวาของหน้าจอ ค้างไว้ แล้วเสียบสาย USB เข้ากับคอมพิวเตอร์นี้ขณะที่ยังกดอยู่ กดค้างไว้จนกว่าการติดตั้งจะเริ่ม"
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "ปิด {device} ให้สนิทและถอดสาย กดปุ่มลดเสียงและปุ่มเพิ่มเสียงค้างไว้พร้อมกัน แล้วเสียบสาย USB เข้ากับคอมพิวเตอร์นี้ขณะที่ยังกดทั้งสองปุ่มอยู่ กดค้างไว้จนกว่าการติดตั้งจะเริ่ม"
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "ปิด {device} ให้สนิท เมื่อตัวติดตั้งแจ้ง ให้เสียบสาย USB เข้ากับคอมพิวเตอร์นี้ และเสียบไว้จนกว่าการติดตั้งจะเสร็จ"
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "ปิด {device} ใส่การ์ด แล้วเปิดเครื่อง เครื่องจะติดตั้งลงในพื้นที่จัดเก็บภายในจากการ์ดเอง ซึ่งใช้เวลาสองสามนาที ปล่อยไว้จนกว่าเครื่องจะปิดหรือรีสตาร์ทเอง จากนั้นถอดการ์ดออก"
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "ปิด {device} ใส่การ์ด แล้วเปิดเครื่อง เครื่องจะติดตั้งลงในพื้นที่จัดเก็บภายในจากการ์ดเอง ปล่อยไว้จนกว่าจะเสร็จ จากนั้นปิดเครื่องแล้วถอดการ์ดออก"
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "ปิด {device} ถอดสาย และถอดการ์ด SD ออกทั้งหมด เลื่อนเครื่องเปิด แล้วกดปุ่มย้อนกลับที่อยู่ตรงกลางปุ่มทิศทางค้างไว้ และเสียบสาย USB เข้ากับคอมพิวเตอร์นี้ขณะที่ยังกดอยู่ กดค้างไว้จนกว่าการติดตั้งจะเริ่ม"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "เปิด {device} โดยยังเปิด การแก้ไขข้อบกพร่องผ่าน USB ไว้ใน ตัวเลือกสำหรับนักพัฒนาซอฟต์แวร์ แล้วเชื่อมต่อกับคอมพิวเตอร์นี้ เครื่องจะรีสตาร์ทเองและการติดตั้งจะเริ่มขึ้น"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "เปิด {device} โดยยังเปิด การแก้ไขข้อบกพร่องผ่าน USB ไว้ใน ตัวเลือกสำหรับนักพัฒนาซอฟต์แวร์ แล้วเชื่อมต่อกับคอมพิวเตอร์นี้ เครื่องจะรีสตาร์ทเข้าสู่โหมด fastboot เพื่อการติดตั้ง"
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "ยังไม่ได้ตั้งค่าการเข้าถึง USB สำหรับ {ids} การตั้งค่าจะขอรหัสผ่านของคุณหนึ่งครั้ง"
"USB access is set up for {ids}": "ตั้งค่าการเข้าถึง USB สำหรับ {ids} แล้ว"
"Unlock before flashing": "ปลดล็อกก่อนแฟลช"
"Unlock with GammaOS's own steps": "ปลดล็อกด้วยขั้นตอนของ GammaOS เอง"
"Unpacking the firmware": "กำลังแตกไฟล์เฟิร์มแวร์"
"Unpacking {file}": "กำลังแตกไฟล์ {file}"
"Unplug it and turn it on": "ถอดสายแล้วเปิดเครื่อง"
"Unplug the cable when it restarts": "ถอดสายเมื่อเครื่องรีสตาร์ท"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "ถอดสาย กดปุ่มเปิด/ปิดและปุ่มลดเสียงค้างไว้อย่างน้อย 60 วินาที จากนั้นเสียบสาย USB ขณะที่ยังกดอยู่ กดค้างไว้จนกว่าการติดตั้งจะเริ่ม การตรวจพบ {device} อาจใช้เวลา 30 วินาทีขึ้นไป"
"Updating checksums": "กำลังอัปเดตเช็กซัม"
"Use a Windows PC": "ใช้พีซี Windows"
"Use the firmware version the catalog lists for this device.": "ใช้เฟิร์มแวร์เวอร์ชันที่แค็ตตาล็อกระบุไว้สำหรับอุปกรณ์นี้"
"Use the volume keys to choose Unlock, then press Power.": "ใช้ปุ่มปรับเสียงเพื่อเลือก \"Unlock\" แล้วกดปุ่มเปิด/ปิด"
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "รอการบูตครั้งแรก"
"Wait on the Anbernic logo": "รอที่โลโก้ Anbernic"
"Wait through a blank screen": "รอขณะหน้าจอว่างเปล่า"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "เมื่อการติดตั้งเสร็จ ให้กดปุ่มเปิด/ปิดหนึ่งครั้งหาก {device} ยังไม่รีสตาร์ทเอง"
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "เมื่อการติดตั้งเสร็จ {device} จะรีสตาร์ทเองและตั้งค่าพื้นที่จัดเก็บ ให้ถอดสายตอนนั้น"
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "เมื่อการติดตั้งเสร็จ ให้ถอดสายแล้วกดปุ่มเปิด/ปิดเพื่อเปิด {device}"
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "เมื่อหน้าจอแสดง INFO: LOCK FLAG IS: UNLOCK!!! แสดงว่าปลดล็อกแล้ว ถอดสายและตรวจสอบให้แน่ใจว่า {device} ปิดอยู่ (หากเครื่องรีสตาร์ท ให้กดปุ่มเปิด/ปิดค้างไว้จนกว่าเครื่องจะปิด) แล้วดำเนินการต่อ"
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "เมื่อหน้าจอแสดง Unlock bootloader success! แสดงว่าปลดล็อกแล้ว หาก {device} แสดง INFO: LOCK FLAG IS : UNLOCK!!! สั้นๆ ตอนเปิดเครื่องอยู่แล้ว แสดงว่าเคยปลดล็อกไว้ก่อนหน้า และคุณข้ามการปลดล็อกได้"
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "เมื่อ {device} ถาม ให้กดปุ่มเพิ่มเสียงภายใน 3 วินาทีเพื่อยืนยันการปลดล็อก"
"WinUSB is installed for {ids}": "ติดตั้ง WinUSB สำหรับ {ids} แล้ว"
"WinUSB will be installed for {ids} the first time you flash": "จะติดตั้ง WinUSB สำหรับ {ids} เมื่อแฟลชครั้งแรก"
"Windows now gives the device the driver the installer needs. Unplug the cable and turn the device off, then repeat the download-mode steps with the same USB port.": "ตอนนี้ Windows กำหนดไดรเวอร์ที่โปรแกรมติดตั้งต้องใช้ให้กับอุปกรณ์แล้ว ถอดสายและปิดอุปกรณ์ จากนั้นทำตามขั้นตอนเข้าโหมดดาวน์โหลดอีกครั้งโดยใช้พอร์ต USB เดิม"
"WonderSwan": "WonderSwan"
"Writing {partition}": "กำลังเขียน {partition}"
"Wrote {partition}": "เขียน {partition} แล้ว"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "{device} ของคุณใช้ GammaOS หรือ Thimsy อยู่แล้ว เลือกวิธีติดตั้งเฟิร์มแวร์ใหม่"
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "{device} ของคุณใช้เฟิร์มแวร์แบบกำหนดเองอยู่แล้ว (เคยปลดล็อกมาก่อน) จะข้ามการปลดล็อก"
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "{device} ของคุณยังใช้เฟิร์มแวร์ดั้งเดิมอยู่ ตัวติดตั้งจะแนะนำขั้นตอนการปลดล็อก แล้วติดตั้งใหม่ทั้งหมดซึ่งจะลบข้อมูลในอุปกรณ์"
"hakuX": "hakuX"
"needs Android API {n}": "ต้องใช้ Android API {n}"
"needs Vulkan": "ต้องใช้ Vulkan"
"needs an ARMv8.2 CPU": "ต้องใช้ CPU ARMv8.2"
"needs {n} GB RAM": "ต้องใช้ RAM {n} GB"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "ไม่สามารถติดตั้ง {device} จาก {host} ได้ เรียกใช้ Thimsy Installer บนพีซี Windows เพื่อติดตั้ง"
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} ติดตั้งด้วย PhoenixSuit ของ Allwinner ซึ่งทำงานบน Windows เท่านั้น เรียกใช้ Thimsy Installer บนพีซี Windows เพื่อติดตั้ง"
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} ติดตั้งด้วย SP Flash Tool ของ MediaTek ซึ่งไม่ทำงานบน {host} เรียกใช้ Thimsy Installer บนพีซี Windows เพื่อติดตั้ง"
"{device} isn't supported by this version of the installer yet.": "{device} ยังไม่รองรับในตัวติดตั้งเวอร์ชันนี้"
"{host} needs no driver": "{host} ไม่ต้องใช้ไดรเวอร์"
