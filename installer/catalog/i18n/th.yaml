# Thai translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "การติดตั้งใหม่ทั้งหมดจะลบข้อมูลในพื้นที่เก็บข้อมูลภายใน คัดลอก ROMs เซฟเกม ภาพหน้าจอ และทุกอย่างที่ต้องการเก็บไว้ไปยังคอมพิวเตอร์หรือการ์ด microSD เกมในการ์ด microSD จะไม่ได้รับผลกระทบ"
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "ยอมรับคำขอสิทธิ์ของ Windows หรือติดตั้ง WinUSB ด้วย Zadig"
