"The installer sends the unlock command; confirm it on the device with Volume Up.": "ตัวติดตั้งจะส่งคำสั่งปลดล็อก ยืนยันบนอุปกรณ์ด้วยปุ่มเพิ่มเสียง"
"The {profile} profile isn't published yet. Choose a profile marked available.": "โปรไฟล์ {profile} ยังไม่เผยแพร่ เลือกโปรไฟล์ที่ระบุว่าพร้อมใช้งาน"
"Turn the RG Cube off. Hold Volume Down and connect the USB cable to this computer. Keep holding until installation starts. The screen stays black; that's normal.": "ปิดเครื่อง RG Cube กดปุ่มลดเสียงค้างไว้แล้วเสียบสาย USB เข้ากับคอมพิวเตอร์เครื่องนี้ กดค้างไว้จนกว่าการติดตั้งจะเริ่ม หน้าจอจะยังคงดำ ซึ่งเป็นเรื่องปกติ"
"Unlock in fastboot": "ปลดล็อกใน fastboot"
