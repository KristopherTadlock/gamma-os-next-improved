"When the device shows LOCK FLAG IS: UNLOCK, it's unlocked. Turn it off and continue.": "เมื่ออุปกรณ์แสดง LOCK FLAG IS: UNLOCK แสดงว่าปลดล็อกแล้ว ปิดเครื่องแล้วดำเนินการต่อ"
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "{device} ของคุณใช้เฟิร์มแวร์แบบกำหนดเองอยู่แล้ว (เคยปลดล็อกมาก่อน) จะข้ามการปลดล็อก"
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "{device} ของคุณใช้เฟิร์มแวร์ดั้งเดิม ตัวติดตั้งจะติดตั้งใหม่ทั้งหมดซึ่งจะลบข้อมูลในอุปกรณ์"
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "{device} ของคุณยังใช้เฟิร์มแวร์ดั้งเดิมอยู่ ตัวติดตั้งจะแนะนำขั้นตอนการปลดล็อก แล้วติดตั้งใหม่ทั้งหมดซึ่งจะลบข้อมูลในอุปกรณ์"
