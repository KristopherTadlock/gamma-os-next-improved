"The RG Cube is unlocked once, with the steps from GammaOS Next's installation guide (the Unisoc T820 section). The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "RG Cube ต้องปลดล็อกเพียงครั้งเดียว ตามขั้นตอนในคู่มือการติดตั้งของ GammaOS Next (หัวข้อ Unisoc T820) ตัวติดตั้งจะไม่เรียกใช้เครื่องมือนั้นเอง ทำตามคู่มือ แล้วกลับมาดำเนินการต่อ"
