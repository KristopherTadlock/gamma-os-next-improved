# Thai translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "การติดตั้งใหม่ทั้งหมดจะลบข้อมูลในพื้นที่เก็บข้อมูลภายใน คัดลอก ROMs เซฟเกม ภาพหน้าจอ และทุกอย่างที่ต้องการเก็บไว้ไปยังคอมพิวเตอร์หรือการ์ด microSD เกมในการ์ด microSD จะไม่ได้รับผลกระทบ"
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "ยอมรับคำขอสิทธิ์ของ Windows หรือติดตั้ง WinUSB ด้วย Zadig"
"Already unlocked: install new firmware": "ปลดล็อกแล้ว: ติดตั้งเฟิร์มแวร์ใหม่"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "สมดุล: RetroArch สำหรับเครื่องคลาสสิก พร้อมอีมูเลเตอร์ N64, Dreamcast, PSP และ DS หน้าโฮม ES-DE และ Brave"
"Building Thimsy for your device": "กำลังสร้าง Thimsy สำหรับอุปกรณ์ของคุณ"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "สร้างจาก GammaOS Next 1.2 รุ่นทางการสำหรับ RG Cube ซึ่งดาวน์โหลดจากหน้า GitHub ของ GammaOS"
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "ชาร์จให้ได้อย่างน้อย 50% ก่อนเริ่ม และเตรียมสายที่มาพร้อมเครื่องไว้ใกล้มือ"
"Charge the RG Cube": "ชาร์จ RG Cube"
"Check it's unlocked": "ตรวจสอบว่าปลดล็อกแล้ว"
"Check the basics": "ตรวจสอบพื้นฐาน"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "ตรวจสอบปุ่ม หน้าจอสัมผัส เสียง และ Wi-Fi แล้วลองเริ่มเกม"
"Check the cable and that the device is still in its flashing mode, then try again.": "ตรวจสอบสาย และตรวจสอบว่าอุปกรณ์ยังอยู่ในโหมดแฟลช แล้วลองอีกครั้ง"
"Checking the USB driver": "กำลังตรวจสอบไดรเวอร์ USB"
"Checking the build": "กำลังตรวจสอบบิลด์"
"Checking the plan": "กำลังตรวจสอบแผน"
"Checking the result": "กำลังตรวจสอบผลลัพธ์"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "เลือกพื้นที่ทำงานบนไดรฟ์ที่มีพื้นที่ว่างมากกว่านี้ (ไม่ใช่ FAT32) หรือเพิ่มพื้นที่ว่าง"
"Confirm on the device": "ยืนยันบนอุปกรณ์"
"Confirm with Volume Up": "ยืนยันด้วยปุ่มเพิ่มเสียง"
"Connect it with USB debugging on": "เชื่อมต่อโดยเปิดการแก้ไขข้อบกพร่องผ่าน USB ไว้"
"Connect the device in download mode": "เชื่อมต่ออุปกรณ์ในโหมดดาวน์โหลด"
"Copy games without a card reader": "คัดลอกเกมโดยไม่ใช้เครื่องอ่านการ์ด"
"Copy your games and saves": "คัดลอกเกมและเซฟของคุณ"
"Delete the workspace's jobs folder and build again; report it if it persists.": "ลบโฟลเดอร์ \"jobs\" ในพื้นที่ทำงานแล้วสร้างใหม่ หากยังเกิดปัญหาอยู่ โปรดรายงาน"
"Don't install on units made in March 2026 or later.": "ห้ามติดตั้งบนเครื่องที่ผลิตในเดือนมีนาคม 2026 หรือหลังจากนั้น"
"Don't install on units whose stock firmware is v1.26.": "ห้ามติดตั้งบนเครื่องที่มีเฟิร์มแวร์เดิมจากโรงงานเป็น v1.26"
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "อย่านำการ์ดกลับไปใส่คอมพิวเตอร์เพื่อคัดลอกเกม เพราะการ์ดใช้โครงสร้างพาร์ทิชัน Android ที่เข้ารหัสไว้ คอมพิวเตอร์จึงไม่แสดงพื้นที่จัดเก็บของคุณ ให้คัดลอกเกมผ่านการโอนไฟล์ทาง USB (MTP) ด้วย ADB Explorer หรือจากการแชร์เครือข่ายแทน"
"Downloading": "กำลังดาวน์โหลด"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "ทั้งหมด: ปานกลาง พร้อมอีมูเลเตอร์ GameCube/Wii, 3DS, PS2, Xbox และ PS Vita และคอร์ความแม่นยำสูง ชุด Thimsy 1.0a แบบสมบูรณ์"
"Finishing": "กำลังเสร็จสิ้น"
"First time installing custom firmware": "ติดตั้งเฟิร์มแวร์แบบกำหนดเองเป็นครั้งแรก"
"Follow the unlock steps shown in the installer, then continue.": "ทำตามขั้นตอนการปลดล็อกที่แสดงในตัวติดตั้ง แล้วดำเนินการต่อ"
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "คู่มือของ GammaOS เตือนว่าการแฟลช {device} ที่ยังไม่ได้ปลดล็อกจะทำให้เครื่องเสีย หลังปลดล็อกแล้ว {device} จะรีสตาร์ทเข้าสู่ Android เดิมของเครื่อง รอจนกว่า Android จะเริ่มทำงาน แล้วดำเนินการต่อ"
"Heavy": "เต็มรูปแบบ"
"Hold Back and plug in the cable": "กดปุ่มย้อนกลับค้างไว้แล้วเสียบสาย"
"Hold Back and the Anbernic button, then plug in": "กดปุ่มย้อนกลับและปุ่ม Anbernic ค้างไว้ แล้วเสียบสาย"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "กดปุ่มเปิด/ปิดค้างไว้เพื่อปิด {device} กดปุ่มปรับเสียงทั้งสองปุ่มค้างไว้ และเสียบสาย USB ขณะที่ยังกดอยู่ จากนั้นกดปุ่มเปิด/ปิดซ้ำๆ โดยยังกดปุ่มปรับเสียงค้างไว้ จนกว่าการติดตั้งจะเริ่ม"
"Hold both volume buttons and plug in the cable": "กดปุ่มปรับเสียงทั้งสองปุ่มค้างไว้แล้วเสียบสาย"
"Hold the Back button, Volume Down and Power together until installation starts again.": "กดปุ่มย้อนกลับ ปุ่มลดเสียง และปุ่มเปิด/ปิดค้างไว้พร้อมกันจนกว่าการติดตั้งจะเริ่มใหม่"
"If installation doesn't start": "หากการติดตั้งไม่เริ่ม"
"If installation stalls": "หากการติดตั้งค้าง"
"If it isn't found": "หากตรวจไม่พบ"
"If the screen stays black": "หากหน้าจอยังดำอยู่"
"Install from the microSD card": "ติดตั้งจากการ์ด microSD"
"Installing Thimsy": "กำลังติดตั้ง Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "เก็บข้อมูลของคุณไว้ ใช้ได้เฉพาะเมื่อ RG Cube ใช้ GammaOS Next 1.2 หรือบิลด์ของ Thimsy อยู่แล้ว"
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "เก็บข้อมูลของคุณไว้ ใช้ได้เฉพาะเมื่ออุปกรณ์ใช้บิลด์ Thimsy หรือ GammaOS ที่เข้ากันได้อยู่แล้ว"
"Light": "เบา"
"Medium": "ปานกลาง"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "ในการบูตครั้งแรกสุด หน้าจออาจว่างเปล่าได้นานถึงหนึ่งนาที นี่เป็นเรื่องปกติ รอจนกว่าหน้าจอบูตจะปรากฏ"
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "บน {device} ให้เปิด การตั้งค่า > เกี่ยวกับ แล้วแตะ หมายเลขบิลด์ เจ็ดครั้ง จากนั้นใน การตั้งค่า > ตัวเลือกสำหรับนักพัฒนาซอฟต์แวร์ ให้เปิด การแก้ไขข้อบกพร่องผ่าน USB และ การปลดล็อก OEM เชื่อมต่อ {device} กับคอมพิวเตอร์นี้ขณะที่เครื่องเปิดอยู่ เครื่องจะรีสตาร์ทเข้าสู่โหมด fastboot เพื่อการติดตั้ง"
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "บน {device} ให้เปิด การตั้งค่า > เกี่ยวกับ แล้วแตะ หมายเลขบิลด์ เจ็ดครั้ง จากนั้นใน การตั้งค่า > ตัวเลือกสำหรับนักพัฒนาซอฟต์แวร์ ให้เปิด การแก้ไขข้อบกพร่องผ่าน USB และ การปลดล็อก OEM เชื่อมต่อ {device} กับคอมพิวเตอร์นี้ขณะที่เครื่องเปิดอยู่ เครื่องจะรีสตาร์ทเข้าสู่โหมด fastboot เพื่อการปลดล็อก"
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "วางแผนไว้: ติดตั้งผ่าน Qualcomm EDL บนคอมพิวเตอร์ทุกเครื่อง ยังสร้างไม่ได้"
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "วางแผนไว้: SP Flash Tool บน Windows และ Linux ยังสร้างไม่ได้"
"Planned: Windows only. Not buildable yet.": "วางแผนไว้: Windows เท่านั้น ยังสร้างไม่ได้"
"Planned: fastboot install on every computer. Not buildable yet.": "วางแผนไว้: ติดตั้งผ่าน fastboot บนคอมพิวเตอร์ทุกเครื่อง ยังสร้างไม่ได้"
"Planned: microSD card install on every computer. Not buildable yet.": "วางแผนไว้: ติดตั้งผ่านการ์ด microSD บนคอมพิวเตอร์ทุกเครื่อง ยังสร้างไม่ได้"
"Planned: same flashing route as the RG Cube. Not buildable yet.": "วางแผนไว้: วิธีแฟลชเดียวกับ RG Cube ยังสร้างไม่ได้"
"Plug in the cable with the device off": "เสียบสายขณะที่อุปกรณ์ปิดอยู่"
"Preparing the partitions": "กำลังเตรียมพาร์ติชัน"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "ใส่การ์ดใน {device} แล้วเปิดเครื่อง Thimsy จะทำงานจากการ์ดและไม่แตะต้องพื้นที่จัดเก็บภายในของ {device} หากต้องการกลับไปใช้ระบบเดิม ให้ปิดเครื่องแล้วถอดการ์ดออก"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "ติดตั้ง Thimsy Installer ใหม่ หรือตั้งค่า THIMSY_TOOLS_DIR เป็นโฟลเดอร์ที่มีเครื่องมือนั้นอยู่"
"Restart into fastbootd": "รีสตาร์ทเข้าสู่ fastbootd"
"Restart with Power": "รีสตาร์ทด้วยปุ่มเปิด/ปิด"
"Restarting the device": "กำลังรีสตาร์ทอุปกรณ์"
"Slide it open, hold Back and plug in": "เลื่อนเครื่องเปิด กดปุ่มย้อนกลับค้างไว้แล้วเสียบสาย"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "ดาวน์โหลดขนาดเล็กสำหรับเครื่องคลาสสิกจนถึง PlayStation: คอร์ RetroArch ที่เร็วหนึ่งตัวต่อระบบ หน้าโฮม Minima ไม่มีเชดเดอร์"
"Start from the microSD card": "เริ่มจากการ์ด microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "ถอดการ์ด microSD อื่นๆ ออกจาก {device} ใส่การ์ด Thimsy แล้วเปิดเครื่อง Thimsy จะทำงานจากการ์ดและไม่แตะต้องพื้นที่จัดเก็บภายใน หากต้องการกลับไปใช้ระบบเดิม ให้ปิดเครื่องแล้วถอดการ์ดออก"
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "ถอดการ์ด SD ออก แล้วกดปุ่มลดเสียงและปุ่มเปิด/ปิดค้างไว้จนกว่า {device} จะรีสตาร์ท"
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "ถอดการ์ด microSD ออกและเปิด การแก้ไขข้อบกพร่องผ่าน USB ใน ตัวเลือกสำหรับนักพัฒนาซอฟต์แวร์ เชื่อมต่อ {device} กับคอมพิวเตอร์นี้ขณะที่เครื่องเปิดอยู่ เครื่องจะรีสตาร์ทเข้าสู่ fastbootd และหน้าจอจะแสดงคำว่า fastbootd เป็นตัวอักษรสีแดงขนาดใหญ่"
"The file is damaged or a different version. Delete it and download again.": "ไฟล์เสียหายหรือเป็นเวอร์ชันอื่น ลบไฟล์แล้วดาวน์โหลดใหม่"
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "การบูตครั้งแรกอาจใช้เวลา 1 ถึง 3 นาที และอาจดูเหมือนค้างอยู่ที่โลโก้ Anbernic นี่เป็นเรื่องปกติ"
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "การบูตครั้งแรกใช้เวลา 1 ถึง 3 นาที และหน้าจออาจดูเหมือนค้างอยู่ที่โลโก้บูต นี่เป็นเรื่องปกติ"
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "การเริ่มต้นครั้งแรกจะใช้เวลาสักครู่ขณะที่ Thimsy ตั้งค่าอีมูเลเตอร์ อย่าปิดเครื่อง"
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} ต้องปลดล็อกเพียงครั้งเดียว ด้วยเครื่องมือ UnlockBootloader จากคู่มือการติดตั้งของ GammaOS Next (Unisoc T820 ขั้นตอนที่ 2): ปิด {device} เริ่มเครื่องมือ แล้วกดปุ่มย้อนกลับค้างไว้ขณะเสียบสาย USB ตัวติดตั้งไม่ได้เรียกใช้เครื่องมือนั้นเอง ทำตามคู่มือ แล้วกลับมาดำเนินการต่อ"
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} ต้องปลดล็อกเพียงครั้งเดียว ด้วยเครื่องมือ UnlockBootloader จากคู่มือการติดตั้งของ GammaOS Next (Unisoc T820 ขั้นตอนที่ 2): ปิด {device} เริ่มเครื่องมือ แล้วกดปุ่มย้อนกลับ ซึ่งเป็นปุ่มทางด้านขวาของหน้าจอ ค้างไว้ขณะเสียบสาย USB ตัวติดตั้งไม่ได้เรียกใช้เครื่องมือนั้นเอง ทำตามคู่มือ แล้วกลับมาดำเนินการต่อ"
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} ต้องปลดล็อกเพียงครั้งเดียว ด้วยเครื่องมือปลดล็อกบนเว็บจากคู่มือการติดตั้งของ GammaOS Next (Anbernic RG405M / RG405V / RG505 ขั้นตอนที่ 2) รีสตาร์ท {device} เข้าสู่โหมด fastboot เปิดเครื่องมือใน Google Chrome คลิก \"Connect\" แล้วคลิก \"Unlock\" บน {device} อย่ากดปุ่มลดเสียง ให้กดปุ่มโฮม / ย้อนกลับเพื่อยืนยัน ตัวติดตั้งไม่ได้เรียกใช้เครื่องมือนั้นเอง ทำตามคู่มือ แล้วกลับมาดำเนินการต่อ"
"The {profile} profile isn't published yet. Choose a profile marked available.": "โปรไฟล์ {profile} ยังไม่เผยแพร่ เลือกโปรไฟล์ที่ระบุว่าพร้อมใช้งาน"
"Turn on OEM unlocking": "เปิดการปลดล็อก OEM"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "ปิด {device} และถอดสาย กดปุ่มย้อนกลับและปุ่ม Anbernic ที่อยู่ข้างกันค้างไว้ แล้วเสียบสาย USB เข้ากับคอมพิวเตอร์นี้ขณะที่ยังกดทั้งสองปุ่มอยู่ กดค้างไว้จนกว่าการติดตั้งจะเริ่ม"
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "ปิด {device} และถอดสาย กดปุ่มย้อนกลับค้างไว้ แล้วเสียบสาย USB เข้ากับคอมพิวเตอร์นี้ขณะที่ยังกดอยู่ กดค้างไว้จนกว่าการติดตั้งจะเริ่ม"
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "ปิด {device} และถอดสาย กดปุ่มย้อนกลับ ซึ่งเป็นปุ่มทางด้านขวาของหน้าจอ ค้างไว้ แล้วเสียบสาย USB เข้ากับคอมพิวเตอร์นี้ขณะที่ยังกดอยู่ กดค้างไว้จนกว่าการติดตั้งจะเริ่ม"
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "ปิด {device} ให้สนิทและถอดสาย กดปุ่มลดเสียงและปุ่มเพิ่มเสียงค้างไว้พร้อมกัน แล้วเสียบสาย USB เข้ากับคอมพิวเตอร์นี้ขณะที่ยังกดทั้งสองปุ่มอยู่ กดค้างไว้จนกว่าการติดตั้งจะเริ่ม"
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "ปิด {device} ให้สนิท เมื่อตัวติดตั้งแจ้ง ให้เสียบสาย USB เข้ากับคอมพิวเตอร์นี้"
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "ปิด {device} ใส่การ์ด แล้วเปิดเครื่อง เครื่องจะติดตั้งลงในพื้นที่จัดเก็บภายในจากการ์ดเอง ปล่อยไว้จนกว่าจะเสร็จ จากนั้นปิดเครื่องแล้วถอดการ์ดออก"
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "ปิด {device} ถอดสาย และถอดการ์ด SD ออกทั้งหมด เลื่อนเครื่องเปิด แล้วกดปุ่มย้อนกลับที่อยู่ตรงกลางปุ่มทิศทางค้างไว้ และเสียบสาย USB เข้ากับคอมพิวเตอร์นี้ขณะที่ยังกดอยู่ กดค้างไว้จนกว่าการติดตั้งจะเริ่ม"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "เปิด {device} โดยยังเปิด การแก้ไขข้อบกพร่องผ่าน USB ไว้ใน ตัวเลือกสำหรับนักพัฒนาซอฟต์แวร์ แล้วเชื่อมต่อกับคอมพิวเตอร์นี้ เครื่องจะรีสตาร์ทเองและการติดตั้งจะเริ่มขึ้น"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "เปิด {device} โดยยังเปิด การแก้ไขข้อบกพร่องผ่าน USB ไว้ใน ตัวเลือกสำหรับนักพัฒนาซอฟต์แวร์ แล้วเชื่อมต่อกับคอมพิวเตอร์นี้ เครื่องจะรีสตาร์ทเข้าสู่โหมด fastboot เพื่อการติดตั้ง"
"Unlock before flashing": "ปลดล็อกก่อนแฟลช"
"Unlock with GammaOS's own steps": "ปลดล็อกด้วยขั้นตอนของ GammaOS เอง"
"Unpacking the firmware": "กำลังแตกไฟล์เฟิร์มแวร์"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "ถอดสาย กดปุ่มเปิด/ปิดและปุ่มลดเสียงค้างไว้อย่างน้อย 60 วินาที จากนั้นเสียบสาย USB ขณะที่ยังกดอยู่ กดค้างไว้จนกว่าการติดตั้งจะเริ่ม การตรวจพบ {device} อาจใช้เวลา 30 วินาทีขึ้นไป"
"Use a Windows PC": "ใช้พีซี Windows"
"Use the firmware version the catalog lists for this device.": "ใช้เฟิร์มแวร์เวอร์ชันที่แค็ตตาล็อกระบุไว้สำหรับอุปกรณ์นี้"
"Use the volume keys to choose Unlock, then press Power.": "ใช้ปุ่มปรับเสียงเพื่อเลือก \"Unlock\" แล้วกดปุ่มเปิด/ปิด"
"Wait for the first boot": "รอการบูตครั้งแรก"
"Wait on the Anbernic logo": "รอที่โลโก้ Anbernic"
"Wait through a blank screen": "รอขณะหน้าจอว่างเปล่า"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "เมื่อการติดตั้งเสร็จ ให้กดปุ่มเปิด/ปิดหนึ่งครั้งหาก {device} ยังไม่รีสตาร์ทเอง"
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "เมื่อหน้าจอแสดง INFO: LOCK FLAG IS: UNLOCK!!! แสดงว่าปลดล็อกแล้ว ถอดสาย ตรวจสอบให้แน่ใจว่า {device} ปิดอยู่ แล้วดำเนินการต่อ"
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "เมื่อหน้าจอแสดง Unlock bootloader success! แสดงว่าปลดล็อกแล้ว หาก {device} แสดง INFO: LOCK FLAG IS : UNLOCK!!! สั้นๆ ตอนเปิดเครื่องอยู่แล้ว แสดงว่าเคยปลดล็อกไว้ก่อนหน้า และคุณข้ามการปลดล็อกได้"
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "เมื่อ {device} ถาม ให้กดปุ่มเพิ่มเสียงภายใน 3 วินาทีเพื่อยืนยันการปลดล็อก"
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "{device} ของคุณใช้เฟิร์มแวร์แบบกำหนดเองอยู่แล้ว (เคยปลดล็อกมาก่อน) จะข้ามการปลดล็อก"
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "{device} ของคุณใช้เฟิร์มแวร์ดั้งเดิม ตัวติดตั้งจะติดตั้งใหม่ทั้งหมดซึ่งจะลบข้อมูลในอุปกรณ์"
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "{device} ของคุณยังใช้เฟิร์มแวร์ดั้งเดิมอยู่ ตัวติดตั้งจะแนะนำขั้นตอนการปลดล็อก แล้วติดตั้งใหม่ทั้งหมดซึ่งจะลบข้อมูลในอุปกรณ์"
"needs Android API {n}": "ต้องใช้ Android API {n}"
"needs Vulkan": "ต้องใช้ Vulkan"
"needs an ARMv8.2 CPU": "ต้องใช้ CPU ARMv8.2"
"needs {n} GB RAM": "ต้องใช้ RAM {n} GB"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "ไม่สามารถติดตั้ง {device} จาก {host} ได้ เรียกใช้ Thimsy Installer บนพีซี Windows เพื่อติดตั้ง"
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} ติดตั้งด้วย PhoenixSuit ของ Allwinner ซึ่งทำงานบน Windows เท่านั้น เรียกใช้ Thimsy Installer บนพีซี Windows เพื่อติดตั้ง"
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} ติดตั้งด้วย SP Flash Tool ของ MediaTek ซึ่งไม่ทำงานบน {host} เรียกใช้ Thimsy Installer บนพีซี Windows เพื่อติดตั้ง"
"{device} isn't supported by this version of the installer yet.": "{device} ยังไม่รองรับในตัวติดตั้งเวอร์ชันนี้"
