# Dutch translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Een schone installatie wist de interne opslag. Kopieer ROMs, opgeslagen spellen, screenshots en alles wat je wilt bewaren naar je computer of de microSD-kaart. Games op de microSD-kaart blijven onaangeroerd."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Accepteer de toestemmingsvraag van Windows of installeer WinUSB met Zadig."
"Already unlocked: install new firmware": "Al ontgrendeld: nieuwe firmware installeren"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Gebalanceerd: RetroArch voor klassieke systemen plus emulators voor N64, Dreamcast, PSP en DS, het ES-DE-startscherm en Brave."
"Building Thimsy for your device": "Thimsy wordt gebouwd voor je apparaat"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Gebouwd uit de officiële GammaOS Next 1.2-release voor de RG Cube, gedownload van de GitHub-pagina van GammaOS."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Laad hem op tot minstens 50% voordat je begint en houd de meegeleverde kabel bij de hand."
"Charge the RG Cube": "RG Cube opladen"
"Check it's unlocked": "Controleren of hij ontgrendeld is"
"Check the basics": "De basis controleren"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Controleer de knoppen, het touchscreen, het geluid en de Wi-Fi, en start een game."
"Check the cable and that the device is still in its flashing mode, then try again.": "Controleer de kabel en of het apparaat nog in de flashmodus staat, en probeer het opnieuw."
"Checking the USB driver": "USB-stuurprogramma controleren"
"Checking the build": "Build controleren"
"Checking the plan": "Plan controleren"
"Checking the result": "Resultaat controleren"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Kies een werkmap op een schijf met meer vrije ruimte (geen FAT32) of maak ruimte vrij."
"Confirm on the device": "Bevestigen op het apparaat"
"Confirm with Volume Up": "Bevestigen met Volume omhoog"
"Connect it with USB debugging on": "Aansluiten met USB-foutopsporing aan"
"Connect the device in download mode": "Apparaat verbinden in downloadmodus"
"Copy games without a card reader": "Games kopiëren zonder kaartlezer"
"Copy your games and saves": "Je games en opgeslagen spellen kopiëren"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Verwijder de map 'jobs' in de werkmap en bouw opnieuw; meld het als het probleem blijft."
"Don't install on units made in March 2026 or later.": "Niet installeren op apparaten die in maart 2026 of later zijn gemaakt."
"Don't install on units whose stock firmware is v1.26.": "Niet installeren op apparaten met originele firmware v1.26."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "Plaats de kaart niet terug in een computer om games te kopiëren: er staat een versleutelde Android-indeling op, dus de computer toont je opslag niet. Kopieer games in plaats daarvan via USB-bestandsoverdracht (MTP), met ADB Explorer of vanaf een netwerkshare."
"Download mode was never seen through WinUSB. Hold Back while you plug in the cable, and check in Device Manager or Zadig that Windows uses WinUSB for Unisoc download mode, not Unisoc's own driver.": "De downloadmodus is nooit via WinUSB gezien. Houd Terug ingedrukt terwijl je de kabel aansluit, en controleer in Apparaatbeheer of Zadig dat Windows WinUSB gebruikt voor Unisoc download mode en niet het eigen stuurprogramma van Unisoc."
"Downloading": "Downloaden"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Alles: Gemiddeld plus emulators voor GameCube/Wii, 3DS, PS2, Xbox en PS Vita en de nauwkeurige cores. De volledige Thimsy 1.0a-set."
"Finishing": "Afronden"
"First time installing custom firmware": "Voor het eerst aangepaste firmware installeren"
"Follow the unlock steps shown in the installer, then continue.": "Volg de ontgrendelstappen in het installatieprogramma en ga dan verder."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "De handleiding van GammaOS waarschuwt dat de {device} onbruikbaar wordt als je hem flasht zonder hem eerst te ontgrendelen. Na het ontgrendelen start de {device} opnieuw op in zijn oorspronkelijke Android. Wacht tot Android is opgestart en ga dan verder."
"Heavy": "Uitgebreid"
"Hold Back and plug in the cable": "Houd Terug ingedrukt en sluit de kabel aan"
"Hold Back and the Anbernic button, then plug in": "Houd Terug en de Anbernic-knop ingedrukt en sluit aan"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Houd de aan/uit-knop ingedrukt om de {device} uit te zetten. Houd beide volumeknoppen ingedrukt en sluit, terwijl je ze ingedrukt houdt, de USB-kabel aan. Blijf dan op de aan/uit-knop tikken, met de volumeknoppen nog steeds ingedrukt, tot de installatie begint."
"Hold both volume buttons and plug in the cable": "Houd beide volumeknoppen ingedrukt en sluit de kabel aan"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Houd de Terug-knop, Volume omlaag en de aan/uit-knop tegelijk ingedrukt tot de installatie opnieuw begint."
"If installation doesn't start": "Als de installatie niet begint"
"If installation stalls": "Als de installatie vastloopt"
"If it isn't found": "Als hij niet wordt gevonden"
"If the screen stays black": "Als het scherm zwart blijft"
"Install from the microSD card": "Installeren vanaf de microSD-kaart"
"Installing Thimsy": "Thimsy installeren"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Behoudt je gegevens. Alleen als de RG Cube al GammaOS Next 1.2 of een Thimsy-build draait."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Behoudt je gegevens. Alleen als het apparaat al een compatibele Thimsy- of GammaOS-build draait."
"Light": "Licht"
"Medium": "Gemiddeld"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "Bij de allereerste start kan het scherm tot een minuut leeg blijven. Dat is normaal; wacht tot het opstartscherm verschijnt."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "Open op de {device} Instellingen, Over en tik zeven keer op Buildnummer. Zet daarna in Instellingen, Ontwikkelaarsopties, USB-foutopsporing en OEM-ontgrendeling aan. Sluit de {device} aan op deze computer terwijl hij aan staat; hij start opnieuw op in fastboot-modus voor de installatie."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "Open op de {device} Instellingen, Over en tik zeven keer op Buildnummer. Zet daarna in Instellingen, Ontwikkelaarsopties, USB-foutopsporing en OEM-ontgrendeling aan. Sluit de {device} aan op deze computer terwijl hij aan staat; hij start opnieuw op in fastboot-modus voor het ontgrendelen."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Gepland: installatie via Qualcomm EDL op elke computer. Nog niet te bouwen."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Gepland: SP Flash Tool op Windows en Linux. Nog niet te bouwen."
"Planned: Windows only. Not buildable yet.": "Gepland: alleen Windows. Nog niet te bouwen."
"Planned: fastboot install on every computer. Not buildable yet.": "Gepland: installatie via fastboot op elke computer. Nog niet te bouwen."
"Planned: microSD card install on every computer. Not buildable yet.": "Gepland: installatie via microSD-kaart op elke computer. Nog niet te bouwen."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Gepland: dezelfde flashmethode als de RG Cube. Nog niet te bouwen."
"Plug in the cable with the device off": "Sluit de kabel aan terwijl het apparaat uit staat"
"Preparing the partitions": "Partities voorbereiden"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Plaats de kaart in de {device} en zet hem aan. Thimsy draait vanaf de kaart en laat de interne opslag van de {device} onaangeroerd: zet hem uit en haal de kaart eruit om terug te gaan naar het oorspronkelijke systeem."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Installeer Thimsy Installer opnieuw of stel THIMSY_TOOLS_DIR in op een map die het bevat."
"Restart into fastbootd": "Opnieuw opstarten in fastbootd"
"Restart with Power": "Opnieuw opstarten met de aan/uit-knop"
"Restarting the device": "Apparaat opnieuw opstarten"
"Slide it open, hold Back and plug in": "Schuif hem open, houd Terug ingedrukt en sluit aan"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Kleine download voor klassieke systemen tot en met PlayStation: één snelle RetroArch-core per systeem, het Minima-startscherm, geen shaders."
"Start from the microSD card": "Opstarten vanaf de microSD-kaart"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Haal alle andere microSD-kaarten uit de {device}, plaats de Thimsy-kaart en zet hem aan. Thimsy draait vanaf de kaart en laat de interne opslag onaangeroerd: zet hem uit en haal de kaart eruit om terug te gaan naar het oorspronkelijke systeem."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Haal een eventuele SD-kaart eruit en houd dan Volume omlaag en de aan/uit-knop ingedrukt tot de {device} opnieuw opstart."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Haal de microSD-kaart eruit en zet USB-foutopsporing aan in Ontwikkelaarsopties. Sluit de {device} aan op deze computer terwijl hij aan staat. Hij start opnieuw op in fastbootd: op het scherm staat fastbootd in grote rode letters."
"The file is damaged or a different version. Delete it and download again.": "Het bestand is beschadigd of een andere versie. Verwijder het en download het opnieuw."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "De eerste start kan 1 tot 3 minuten duren en lijkt soms te blijven hangen op het Anbernic-logo. Dat is normaal."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "De eerste start duurt 1 tot 3 minuten en het scherm lijkt soms te blijven hangen op het opstartlogo. Dat is normaal."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "De eerste start duurt een paar minuten terwijl Thimsy je emulators instelt. Zet het apparaat niet uit."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "De {device} wordt één keer ontgrendeld, met de UnlockBootloader-tool uit de installatiehandleiding van GammaOS Next (Unisoc T820, stap 2): zet de {device} uit, start de tool en houd dan de Terug-knop ingedrukt terwijl je de USB-kabel aansluit. Het installatieprogramma voert die tool niet zelf uit. Volg de handleiding, kom dan terug en ga verder."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "De {device} wordt één keer ontgrendeld, met de UnlockBootloader-tool uit de installatiehandleiding van GammaOS Next (Unisoc T820, stap 2): zet de {device} uit, start de tool en houd dan de Terug-knop, de knop rechts van het scherm, ingedrukt terwijl je de USB-kabel aansluit. Het installatieprogramma voert die tool niet zelf uit. Volg de handleiding, kom dan terug en ga verder."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "De {device} wordt één keer ontgrendeld, met de webtool voor ontgrendelen uit de installatiehandleiding van GammaOS Next (Anbernic RG405M / RG405V / RG505, stap 2). Start de {device} opnieuw op in fastboot-modus, open de tool in Google Chrome en klik op 'Connect' en daarna op 'Unlock'. Druk op de {device} niet op Volume omlaag: druk op de Home / Terug-knop om te bevestigen. Het installatieprogramma voert die tool niet zelf uit. Volg de handleiding, kom dan terug en ga verder."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Het profiel {profile} is nog niet gepubliceerd. Kies een profiel dat als beschikbaar is gemarkeerd."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "De partitie-indeling van dit apparaat past niet bij deze firmware: het is een ander model, of het draait nog de originele firmware die opnieuw gepartitioneerd moet worden, wat deze versie nog niet kan."
"Turn on OEM unlocking": "OEM-ontgrendeling aanzetten"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Zet de {device} uit en koppel de kabel los. Houd de Terug-knop en de Anbernic-knop ernaast ingedrukt en sluit, terwijl je beide ingedrukt houdt, de USB-kabel aan op deze computer. Blijf ingedrukt houden tot de installatie begint."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Zet de {device} uit en koppel de kabel los. Houd de Terug-knop ingedrukt en sluit, terwijl je hem ingedrukt houdt, de USB-kabel aan op deze computer. Blijf ingedrukt houden tot de installatie begint."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Zet de {device} uit en koppel de kabel los. Houd de Terug-knop, de knop rechts van het scherm, ingedrukt en sluit, terwijl je hem ingedrukt houdt, de USB-kabel aan op deze computer. Blijf ingedrukt houden tot de installatie begint."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Zet de {device} volledig uit en koppel de kabel los. Houd Volume omlaag en Volume omhoog tegelijk ingedrukt en sluit, terwijl je beide ingedrukt houdt, de USB-kabel aan op deze computer. Blijf ingedrukt houden tot de installatie begint."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "Zet de {device} volledig uit. Sluit de USB-kabel aan op deze computer zodra het installatieprogramma daarom vraagt."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Zet de {device} uit, plaats de kaart en zet hem aan. Hij installeert zichzelf vanaf de kaart op zijn interne opslag. Laat hem met rust tot hij klaar is, zet hem dan uit en haal de kaart eruit."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Zet de {device} uit, koppel de kabel los en haal alle SD-kaarten eruit. Schuif hem open, houd dan de Terug-knop in het midden van de joypad ingedrukt en sluit, terwijl je hem ingedrukt houdt, de USB-kabel aan op deze computer. Blijf ingedrukt houden tot de installatie begint."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Zet de {device} aan, met USB-foutopsporing nog steeds aan in Ontwikkelaarsopties, en sluit hem aan op deze computer. Hij start vanzelf opnieuw op en de installatie begint."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Zet de {device} aan, met USB-foutopsporing nog steeds aan in Ontwikkelaarsopties, en sluit hem aan op deze computer. Hij start opnieuw op in fastboot-modus voor de installatie."
"Unlock before flashing": "Ontgrendelen vóór het flashen"
"Unlock with GammaOS's own steps": "Ontgrendelen met de stappen van GammaOS"
"Unpacking the firmware": "Firmware uitpakken"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Koppel de kabel los. Houd de aan/uit-knop en Volume omlaag minstens 60 seconden ingedrukt en sluit dan, terwijl je ze ingedrukt houdt, de USB-kabel aan. Blijf ingedrukt houden tot de installatie begint; het kan 30 seconden of langer duren voordat de {device} wordt gevonden."
"Use a Windows PC": "Gebruik een Windows-pc"
"Use the firmware version the catalog lists for this device.": "Gebruik de firmwareversie die de catalogus voor dit apparaat vermeldt."
"Use the volume keys to choose Unlock, then press Power.": "Kies met de volumeknoppen 'Unlock' en druk dan op de aan/uit-knop."
"Wait for the first boot": "Wachten op de eerste start"
"Wait on the Anbernic logo": "Wachten op het Anbernic-logo"
"Wait through a blank screen": "Wachten bij een leeg scherm"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Druk na de installatie één keer op de aan/uit-knop als de {device} niet vanzelf opnieuw is opgestart."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "Als het scherm INFO: LOCK FLAG IS: UNLOCK!!! toont, is hij ontgrendeld. Koppel de kabel los, zorg dat de {device} uit staat en ga verder."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Als het scherm Unlock bootloader success! toont, is hij ontgrendeld. Toont de {device} bij het opstarten al kort INFO: LOCK FLAG IS : UNLOCK!!!, dan was hij al ontgrendeld en kun je het ontgrendelen overslaan."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Als de {device} erom vraagt, druk dan binnen 3 seconden op Volume omhoog om het ontgrendelen te bevestigen."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Je {device} draait al aangepaste firmware (hij is eerder ontgrendeld). Ontgrendelen wordt overgeslagen."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Je {device} draait de originele firmware. Het installatieprogramma voert een schone installatie uit die het apparaat wist."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Je {device} draait nog de originele firmware. Het installatieprogramma begeleidt je bij het ontgrendelen en voert daarna een schone installatie uit die het apparaat wist."
"needs Android API {n}": "vereist Android API {n}"
"needs Vulkan": "vereist Vulkan"
"needs an ARMv8.2 CPU": "vereist een ARMv8.2-cpu"
"needs {n} GB RAM": "vereist {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} kan niet worden geïnstalleerd vanaf {host}. Voer Thimsy Installer uit op een Windows-pc om het te installeren."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} wordt geïnstalleerd met PhoenixSuit van Allwinner, dat alleen op Windows werkt. Voer Thimsy Installer uit op een Windows-pc om het te installeren."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} wordt geïnstalleerd met SP Flash Tool van MediaTek, dat niet op {host} werkt. Voer Thimsy Installer uit op een Windows-pc om het te installeren."
"{device} isn't supported by this version of the installer yet.": "{device} wordt nog niet ondersteund door deze versie van het installatieprogramma."
