"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "Open op de {device} Instellingen, Over en tik zeven keer op Buildnummer. Zet daarna in Instellingen, Ontwikkelaarsopties, USB-foutopsporing en OEM-ontgrendeling aan. Sluit de {device} aan op deze computer terwijl hij aan staat; hij start opnieuw op in fastboot-modus voor de installatie."
