"Slide it open, hold Back and plug in": "Schuif hem open, houd Terug ingedrukt en sluit aan"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Kleine download voor klassieke systemen tot en met PlayStation: één snelle RetroArch-core per systeem, het Minima-startscherm, geen shaders."
"Start from the microSD card": "Opstarten vanaf de microSD-kaart"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Haal alle andere microSD-kaarten uit de {device}, plaats de Thimsy-kaart en zet hem aan. Thimsy draait vanaf de kaart en laat de interne opslag onaangeroerd: zet hem uit en haal de kaart eruit om terug te gaan naar het oorspronkelijke systeem."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Haal een eventuele SD-kaart eruit en houd dan Volume omlaag en de aan/uit-knop ingedrukt tot de {device} opnieuw opstart."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Haal de microSD-kaart eruit en zet USB-foutopsporing aan in Ontwikkelaarsopties. Sluit de {device} aan op deze computer terwijl hij aan staat. Hij start opnieuw op in fastbootd: op het scherm staat fastbootd in grote rode letters."
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "De schijf waarop de werkmap staat, gaat mogelijk kapot. Kies een werkmap op een andere schijf en bouw opnieuw."
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "Het installatieprogramma voor het stuurprogramma zit niet bij deze build. Installeer met Zadig WinUSB voor de downloadmodus van het apparaat."
"The file is damaged or a different version. Delete it and download again.": "Het bestand is beschadigd of een andere versie. Verwijder het en download het opnieuw."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "De eerste start kan 1 tot 3 minuten duren en lijkt soms te blijven hangen op het Anbernic-logo. Dat is normaal."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "De eerste start duurt 1 tot 3 minuten en het scherm lijkt soms te blijven hangen op het opstartlogo. Dat is normaal."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "De eerste start duurt een paar minuten terwijl Thimsy je emulators instelt. Zet het apparaat niet uit."
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "De vrije ruimte op deze schijf kon niet worden gecontroleerd. Kies een andere map als werkmap."
"The installer does a fresh install that erases your {device}, whatever it runs now.": "Het installatieprogramma voert een schone installatie uit die je {device} wist, wat er nu ook op draait."
"The installer runs as root, so it can open the device": "Het installatieprogramma draait als root, dus het kan het apparaat openen"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "De {device} wordt één keer ontgrendeld, op een Windows-pc: de UnlockBootloader-tool uit de installatiehandleiding van GammaOS Next (Unisoc T820, stap 1 en 2) werkt alleen op Windows. Installeer eerst het Unisoc-USB-stuurprogramma uit UnisocTools van de handleiding. Zet daarna de {device} uit en koppel de kabel los, start UnlockBootloader.bat en houd binnen 30 seconden de Terug-knop (de knop rechts van het scherm) ingedrukt en sluit, terwijl je hem ingedrukt houdt, de USB-kabel aan. Laat los als er tekst op het scherm verschijnt. Ontgrendelen wist de {device}. Het installatieprogramma voert die tool niet zelf uit. Volg de handleiding, kom dan terug en ga verder."
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "De {device} wordt één keer ontgrendeld, op een Windows-pc: de UnlockBootloader-tool uit de installatiehandleiding van GammaOS Next (Unisoc T820, stap 1 en 2) werkt alleen op Windows. Installeer eerst het Unisoc-USB-stuurprogramma uit UnisocTools van de handleiding. Zet daarna de {device} uit en koppel de kabel los, start UnlockBootloader.bat en houd binnen 30 seconden de Terug-knop ingedrukt en sluit, terwijl je hem ingedrukt houdt, de USB-kabel aan. Laat los als er tekst op het scherm verschijnt. Ontgrendelen wist de {device}. Het installatieprogramma voert die tool niet zelf uit. Volg de handleiding, kom dan terug en ga verder."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "De {device} wordt één keer ontgrendeld, met de webtool voor ontgrendelen uit de installatiehandleiding van GammaOS Next (Anbernic RG405M / RG405V / RG505, stap 2). Haal de microSD-kaart eruit, zet USB-foutopsporing aan in Ontwikkelaarsopties en start de {device} opnieuw op in fastboot-modus met adb reboot bootloader: op het scherm staat fastboot mode naast het Anbernic-logo. Open de tool in Google Chrome, klik op 'Connect', kies het apparaat en klik daarna op 'Unlock'. Druk op de {device} niet op Volume omlaag: druk op de Home / Terug-knop om te bevestigen. Op Linux of macOS doet de tool unisoc-unlock uit de handleiding hetzelfde. Ontgrendelen wist de {device}. Het installatieprogramma voert deze tools niet zelf uit. Volg de handleiding, kom dan terug en ga verder."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Het profiel {profile} is nog niet gepubliceerd. Kies een profiel dat als beschikbaar is gemarkeerd."
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "Dit apparaat draait geen overeenkomende Thimsy- of GammaOS-build, dus het kan niet worden bijgewerkt. Gebruik in plaats daarvan een volledige installatie (die wist het apparaat)."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "De partitie-indeling van dit apparaat past niet bij deze firmware: het is een ander model, of het draait nog de originele firmware die opnieuw gepartitioneerd moet worden, wat deze versie nog niet kan."
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "Deze schijf is geformatteerd als FAT32, dat geen bestanden groter dan 4 GB kan bevatten. Kies een werkmap op een andere schijf (NTFS, exFAT, APFS of ext4)."
"This version of the installer expects a different build. Build again, then install.": "Deze versie van het installatieprogramma verwacht een andere build. Bouw opnieuw en installeer daarna."
"Turn it on": "Zet hem aan"
"Turn on OEM unlocking": "OEM-ontgrendeling aanzetten"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Zet de {device} uit en koppel de kabel los. Houd de Terug-knop en de Anbernic-knop ernaast ingedrukt en sluit, terwijl je beide ingedrukt houdt, de USB-kabel aan op deze computer. Blijf ingedrukt houden tot de installatie begint."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Zet de {device} uit en koppel de kabel los. Houd de Terug-knop ingedrukt en sluit, terwijl je hem ingedrukt houdt, de USB-kabel aan op deze computer. Blijf ingedrukt houden tot de installatie begint."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Zet de {device} uit en koppel de kabel los. Houd de Terug-knop, de knop rechts van het scherm, ingedrukt en sluit, terwijl je hem ingedrukt houdt, de USB-kabel aan op deze computer. Blijf ingedrukt houden tot de installatie begint."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Zet de {device} volledig uit en koppel de kabel los. Houd Volume omlaag en Volume omhoog tegelijk ingedrukt en sluit, terwijl je beide ingedrukt houdt, de USB-kabel aan op deze computer. Blijf ingedrukt houden tot de installatie begint."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "Zet de {device} volledig uit. Sluit de USB-kabel aan op deze computer zodra het installatieprogramma daarom vraagt, en laat hem aangesloten tot de installatie klaar is."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "Zet de {device} uit, plaats de kaart en zet hem aan. Hij installeert zichzelf vanaf de kaart op zijn interne opslag; dat duurt een paar minuten. Laat hem met rust tot hij vanzelf uitgaat of opnieuw opstart, en haal dan de kaart eruit."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Zet de {device} uit, plaats de kaart en zet hem aan. Hij installeert zichzelf vanaf de kaart op zijn interne opslag. Laat hem met rust tot hij klaar is, zet hem dan uit en haal de kaart eruit."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Zet de {device} uit, koppel de kabel los en haal alle SD-kaarten eruit. Schuif hem open, houd dan de Terug-knop in het midden van de joypad ingedrukt en sluit, terwijl je hem ingedrukt houdt, de USB-kabel aan op deze computer. Blijf ingedrukt houden tot de installatie begint."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Zet de {device} aan, met USB-foutopsporing nog steeds aan in Ontwikkelaarsopties, en sluit hem aan op deze computer. Hij start vanzelf opnieuw op en de installatie begint."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Zet de {device} aan, met USB-foutopsporing nog steeds aan in Ontwikkelaarsopties, en sluit hem aan op deze computer. Hij start opnieuw op in fastboot-modus voor de installatie."
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "USB-toegang voor {ids} is nog niet ingesteld. Bij het instellen wordt één keer om je wachtwoord gevraagd."
"USB access is set up for {ids}": "USB-toegang is ingesteld voor {ids}"
"Unlock before flashing": "Ontgrendelen vóór het flashen"
"Unlock with GammaOS's own steps": "Ontgrendelen met de stappen van GammaOS"
"Unpacking the firmware": "Firmware uitpakken"
"Unpacking {file}": "{file} uitpakken"
"Unplug it and turn it on": "Koppel hem los en zet hem aan"
"Unplug the cable when it restarts": "Koppel de kabel los als hij opnieuw opstart"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Koppel de kabel los. Houd de aan/uit-knop en Volume omlaag minstens 60 seconden ingedrukt en sluit dan, terwijl je ze ingedrukt houdt, de USB-kabel aan. Blijf ingedrukt houden tot de installatie begint; het kan 30 seconden of langer duren voordat de {device} wordt gevonden."
"Updating checksums": "Controlesommen bijwerken"
"Use a Windows PC": "Gebruik een Windows-pc"
"Use the firmware version the catalog lists for this device.": "Gebruik de firmwareversie die de catalogus voor dit apparaat vermeldt."
"Use the volume keys to choose Unlock, then press Power.": "Kies met de volumeknoppen 'Unlock' en druk dan op de aan/uit-knop."
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "Wachten op de eerste start"
"Wait on the Anbernic logo": "Wachten op het Anbernic-logo"
"Wait through a blank screen": "Wachten bij een leeg scherm"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Druk na de installatie één keer op de aan/uit-knop als de {device} niet vanzelf opnieuw is opgestart."
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "Als de installatie klaar is, start de {device} vanzelf opnieuw op en richt hij zijn opslag in. Koppel dan de kabel los."
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "Als de installatie klaar is, koppel je de kabel los en druk je op de aan/uit-knop om de {device} aan te zetten."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "Als het scherm INFO: LOCK FLAG IS: UNLOCK!!! toont, is hij ontgrendeld. Koppel de kabel los en zorg dat de {device} uit staat (als hij opnieuw opstart, houd dan de aan/uit-knop ingedrukt tot hij uitgaat), en ga dan verder."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Als het scherm Unlock bootloader success! toont, is hij ontgrendeld. Toont de {device} bij het opstarten al kort INFO: LOCK FLAG IS : UNLOCK!!!, dan was hij al ontgrendeld en kun je het ontgrendelen overslaan."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Als de {device} erom vraagt, druk dan binnen 3 seconden op Volume omhoog om het ontgrendelen te bevestigen."
"WinUSB is installed for {ids}": "WinUSB is geïnstalleerd voor {ids}"
"WinUSB will be installed for {ids} the first time you flash": "WinUSB wordt geïnstalleerd voor {ids} wanneer je voor het eerst flasht"
"Windows asks for permission next. Click Yes so the installer can give your device the USB driver it needs as soon as you connect it. Don't connect it yet.": "Windows vraagt zo om toestemming. Klik op Ja, zodat het installatieprogramma je apparaat het USB-stuurprogramma kan geven dat het nodig heeft zodra je het aansluit. Sluit het nog niet aan."
"Windows now gives the device the driver the installer needs. Unplug the cable and turn the device off, then repeat the download-mode steps with the same USB port.": "Windows geeft het apparaat nu het stuurprogramma dat het installatieprogramma nodig heeft. Koppel de kabel los en zet het apparaat uit, en herhaal dan de stappen voor de downloadmodus met dezelfde USB-poort."
"WonderSwan": "WonderSwan"
"Writing {partition}": "{partition} schrijven"
"Wrote {partition}": "{partition} geschreven"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "Je {device} draait al GammaOS of Thimsy. Kies hoe je de nieuwe firmware wilt installeren."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Je {device} draait al aangepaste firmware (hij is eerder ontgrendeld). Ontgrendelen wordt overgeslagen."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Je {device} draait nog de originele firmware. Het installatieprogramma begeleidt je bij het ontgrendelen en voert daarna een schone installatie uit die het apparaat wist."
"hakuX": "hakuX"
"needs Android API {n}": "vereist Android API {n}"
"needs Vulkan": "vereist Vulkan"
"needs an ARMv8.2 CPU": "vereist een ARMv8.2-cpu"
"needs {n} GB RAM": "vereist {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} kan niet worden geïnstalleerd vanaf {host}. Voer Thimsy Installer uit op een Windows-pc om het te installeren."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} wordt geïnstalleerd met PhoenixSuit van Allwinner, dat alleen op Windows werkt. Voer Thimsy Installer uit op een Windows-pc om het te installeren."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} wordt geïnstalleerd met SP Flash Tool van MediaTek, dat niet op {host} werkt. Voer Thimsy Installer uit op een Windows-pc om het te installeren."
"{device} isn't supported by this version of the installer yet.": "{device} wordt nog niet ondersteund door deze versie van het installatieprogramma."
"{host} needs no driver": "{host} heeft geen stuurprogramma nodig"
