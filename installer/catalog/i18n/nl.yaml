"In Android Settings, Storage, check whether the {device} has 128 GB or 256 GB. Each size needs its own layout, and installing the wrong one can brick the {device}.": "Controleer in Android onder Instellingen, Opslag of de {device} 128 GB of 256 GB heeft. Elke grootte heeft een eigen indeling nodig, en als je de verkeerde installeert, kan de {device} onbruikbaar worden."
