# French translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Une nouvelle installation efface le stockage interne. Copiez les ROMs, sauvegardes, captures d'écran et tout ce que vous voulez conserver sur votre ordinateur ou sur la carte microSD. Les jeux sur la carte microSD ne sont pas modifiés."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Acceptez la demande d'autorisation de Windows ou installez WinUSB avec Zadig."
"Already unlocked: install new firmware": "Déjà déverrouillé : installer le nouveau firmware"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Équilibré : RetroArch pour les systèmes classiques, plus les émulateurs N64, Dreamcast, PSP et DS, l'accueil ES-DE et Brave."
"Building Thimsy for your device": "Création de Thimsy pour votre appareil"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Créé à partir de la version officielle GammaOS Next 1.2 pour le RG Cube, téléchargée depuis la page GitHub de GammaOS."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Chargez-le à au moins 50 % avant de commencer et gardez à portée de main le câble fourni."
"Charge the RG Cube": "Charger le RG Cube"
"Check it's unlocked": "Vérifier qu'il est déverrouillé"
"Check the basics": "Vérifier l'essentiel"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Vérifiez les boutons, l'écran tactile, le son et le Wi-Fi, puis lancez un jeu."
"Check the cable and that the device is still in its flashing mode, then try again.": "Vérifiez le câble et que l'appareil est toujours en mode flash, puis réessayez."
"Checking the USB driver": "Vérification du pilote USB"
"Checking the build": "Vérification de la build"
"Checking the plan": "Vérification du plan"
"Checking the result": "Vérification du résultat"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Choisissez un espace de travail sur un disque avec plus d'espace libre (pas en FAT32), ou libérez de l'espace."
"Confirm on the device": "Confirmer sur l'appareil"
"Connect the device in download mode": "Connecter l'appareil en mode téléchargement"
"Copy your games and saves": "Copier vos jeux et sauvegardes"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Supprimez le dossier « jobs » de l'espace de travail et relancez la création ; signalez le problème s'il persiste."
"Don't install on units made in March 2026 or later.": "N'installez pas sur les appareils fabriqués en mars 2026 ou après."
"Don't install on units whose stock firmware is v1.26.": "N'installez pas sur les appareils dont le firmware d'origine est en v1.26."
"Downloading": "Téléchargement"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Tout : Moyen, plus les émulateurs GameCube/Wii, 3DS, PS2, Xbox et PS Vita et les cœurs haute précision. L'ensemble complet Thimsy 1.0a."
"Finishing": "Finalisation"
"First time installing custom firmware": "Première installation d'un firmware personnalisé"
"Follow the unlock steps shown in the installer, then continue.": "Suivez les étapes de déverrouillage affichées dans l'installateur, puis continuez."
"Heavy": "Complet"
"Hold Volume Down and plug in the cable": "Maintenir Volume bas et brancher le câble"
"Installing Thimsy": "Installation de Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Conserve vos données. Uniquement si le RG Cube exécute déjà GammaOS Next 1.2 ou une build Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Conserve vos données. Uniquement si l'appareil exécute déjà une build Thimsy ou GammaOS compatible."
"Light": "Léger"
"Medium": "Moyen"
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Prévu : installation via Qualcomm EDL sur tous les ordinateurs. Pas encore disponible."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Prévu : SP Flash Tool sous Windows et Linux. Pas encore disponible."
"Planned: Windows only. Not buildable yet.": "Prévu : Windows uniquement. Pas encore disponible."
"Planned: fastboot install on every computer. Not buildable yet.": "Prévu : installation via fastboot sur tous les ordinateurs. Pas encore disponible."
"Planned: microSD card install on every computer. Not buildable yet.": "Prévu : installation par carte microSD sur tous les ordinateurs. Pas encore disponible."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Prévu : même méthode de flash que le RG Cube. Pas encore disponible."
"Preparing the partitions": "Préparation des partitions"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Réinstallez Thimsy Installer ou définissez THIMSY_TOOLS_DIR sur un dossier qui le contient."
"Required before flashing; skipping it can brick the device.": "Obligatoire avant le flash ; l'ignorer peut rendre l'appareil inutilisable."
"Restarting the device": "Redémarrage de l'appareil"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Petit téléchargement pour les systèmes classiques jusqu'à la PlayStation : un cœur RetroArch rapide par système, l'accueil Minima, sans shaders."
"The RG Cube is unlocked once, with the steps from GammaOS Next's installation guide (the Unisoc T820 section). The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Le RG Cube se déverrouille une seule fois, en suivant les étapes du guide d'installation de GammaOS Next (section Unisoc T820). L'installateur n'exécute pas cet outil lui-même. Suivez le guide, puis revenez ici pour continuer."
"The file is damaged or a different version. Delete it and download again.": "Le fichier est endommagé ou d'une autre version. Supprimez-le et téléchargez-le à nouveau."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Le premier démarrage prend quelques minutes, le temps que Thimsy configure vos émulateurs. Ne l'éteignez pas."
"The installer sends the unlock command; confirm it on the device with Volume Up.": "L'installateur envoie la commande de déverrouillage ; confirmez-la sur l'appareil avec Volume haut."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Le profil {profile} n'est pas encore publié. Choisissez un profil indiqué comme disponible."
"Turn the RG Cube off. Hold Volume Down and connect the USB cable to this computer. Keep holding until installation starts. The screen stays black; that's normal.": "Éteignez le RG Cube. Maintenez Volume bas et branchez le câble USB à cet ordinateur. Maintenez le bouton jusqu'au début de l'installation. L'écran reste noir ; c'est normal."
"Unlock in fastboot": "Déverrouiller en fastboot"
"Unlock with GammaOS's own steps": "Déverrouiller avec la procédure de GammaOS"
"Unpacking the firmware": "Décompression du firmware"
"Use a Windows PC": "Utiliser un PC Windows"
"Use the firmware version the catalog lists for this device.": "Utilisez la version du firmware indiquée dans le catalogue pour cet appareil."
"Use the volume keys to choose Unlock, then press Power.": "Choisissez « Unlock » avec les boutons de volume, puis appuyez sur Marche/Arrêt."
"Wait for the first boot": "Attendre le premier démarrage"
"When the device shows LOCK FLAG IS: UNLOCK, it's unlocked. Turn it off and continue.": "Lorsque l'appareil affiche LOCK FLAG IS: UNLOCK, il est déverrouillé. Éteignez-le et continuez."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Votre {device} utilise déjà un firmware personnalisé (il a déjà été déverrouillé). Le déverrouillage est ignoré."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Votre {device} utilise son firmware d'origine. L'installateur effectue une nouvelle installation qui efface l'appareil."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Votre {device} utilise encore son firmware d'origine. L'installateur vous guide pour le déverrouiller, puis effectue une nouvelle installation qui efface l'appareil."
"needs Android API {n}": "nécessite Android API {n}"
"needs Vulkan": "nécessite Vulkan"
"needs an ARMv8.2 CPU": "nécessite un processeur ARMv8.2"
"needs {n} GB RAM": "nécessite {n} Go de RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "Impossible d'installer {device} depuis {host}. Exécutez Thimsy Installer sur un PC Windows pour l'installer."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} s'installe avec PhoenixSuit d'Allwinner, qui ne fonctionne que sous Windows. Exécutez Thimsy Installer sur un PC Windows pour l'installer."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} s'installe avec SP Flash Tool de MediaTek, qui ne fonctionne pas sous {host}. Exécutez Thimsy Installer sur un PC Windows pour l'installer."
"{device} isn't supported by this version of the installer yet.": "{device} n'est pas encore pris en charge par cette version de l'installateur."
