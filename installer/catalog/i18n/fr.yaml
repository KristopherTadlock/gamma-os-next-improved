"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Insérez la carte dans le {device} et allumez-le. Thimsy fonctionne depuis la carte et ne touche pas au stockage interne du {device} : pour revenir au système d'origine, éteignez-le et retirez la carte."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Réinstallez Thimsy Installer : son outil de flashage n'est pas la version attendue."
