# French translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Une nouvelle installation efface le stockage interne. Copiez les ROMs, sauvegardes, captures d'écran et tout ce que vous voulez conserver sur votre ordinateur ou sur la carte microSD. Les jeux sur la carte microSD ne sont pas modifiés."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Acceptez la demande d'autorisation de Windows ou installez WinUSB avec Zadig."
"Already unlocked: install new firmware": "Déjà déverrouillé : installer le nouveau firmware"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Équilibré : RetroArch pour les systèmes classiques, plus les émulateurs N64, Dreamcast, PSP et DS, l'accueil ES-DE et Brave."
"Building Thimsy for your device": "Création de Thimsy pour votre appareil"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Créé à partir de la version officielle GammaOS Next 1.2 pour le RG Cube, téléchargée depuis la page GitHub de GammaOS."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Chargez-le à au moins 50 % avant de commencer et gardez à portée de main le câble fourni."
"Charge the RG Cube": "Charger le RG Cube"
"Check it's unlocked": "Vérifier qu'il est déverrouillé"
"Check the basics": "Vérifier l'essentiel"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Vérifiez les boutons, l'écran tactile, le son et le Wi-Fi, puis lancez un jeu."
"Check the cable and that the device is still in its flashing mode, then try again.": "Vérifiez le câble et que l'appareil est toujours en mode flash, puis réessayez."
"Checking the USB driver": "Vérification du pilote USB"
"Checking the build": "Vérification de la build"
"Checking the plan": "Vérification du plan"
"Checking the result": "Vérification du résultat"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Choisissez un espace de travail sur un disque avec plus d'espace libre (pas en FAT32), ou libérez de l'espace."
"Confirm on the device": "Confirmer sur l'appareil"
"Confirm with Volume Up": "Confirmer avec Volume haut"
"Connect it with USB debugging on": "Le connecter avec le débogage USB activé"
"Connect the device in download mode": "Connecter l'appareil en mode téléchargement"
"Copy games without a card reader": "Copier les jeux sans lecteur de carte"
"Copy your games and saves": "Copier vos jeux et sauvegardes"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Supprimez le dossier « jobs » de l'espace de travail et relancez la création ; signalez le problème s'il persiste."
"Don't install on units made in March 2026 or later.": "N'installez pas sur les appareils fabriqués en mars 2026 ou après."
"Don't install on units whose stock firmware is v1.26.": "N'installez pas sur les appareils dont le firmware d'origine est en v1.26."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "Ne remettez pas la carte dans un ordinateur pour copier des jeux : elle contient une structure Android chiffrée, et l'ordinateur n'affichera pas votre espace de stockage. Copiez plutôt les jeux par transfert de fichiers USB (MTP), avec ADB Explorer ou depuis un partage réseau."
"Download mode was never seen through WinUSB. Hold Back while you plug in the cable, and check in Device Manager or Zadig that Windows uses WinUSB for Unisoc download mode, not Unisoc's own driver.": "Le mode téléchargement n'a jamais été détecté via WinUSB. Maintenez Retour pendant que vous branchez le câble, et vérifiez dans le Gestionnaire de périphériques ou dans Zadig que Windows utilise WinUSB pour Unisoc download mode, et non le pilote propre à Unisoc."
"Downloading": "Téléchargement"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Tout : Moyen, plus les émulateurs GameCube/Wii, 3DS, PS2, Xbox et PS Vita et les cœurs haute précision. L'ensemble complet Thimsy 1.0a."
"Finishing": "Finalisation"
"First time installing custom firmware": "Première installation d'un firmware personnalisé"
"Follow the unlock steps shown in the installer, then continue.": "Suivez les étapes de déverrouillage affichées dans l'installateur, puis continuez."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "Le guide de GammaOS prévient que flasher un {device} non déverrouillé le rend inutilisable. Après le déverrouillage, le {device} redémarre sur son Android d'origine. Attendez qu'Android ait démarré, puis continuez."
"Heavy": "Complet"
"Hold Back and plug in the cable": "Maintenir Retour et brancher le câble"
"Hold Back and the Anbernic button, then plug in": "Maintenir Retour et le bouton Anbernic, puis brancher"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Maintenez Marche/Arrêt pour éteindre le {device}. Maintenez les deux boutons de volume et, sans les relâcher, branchez le câble USB. Appuyez ensuite plusieurs fois de suite sur Marche/Arrêt, en gardant les boutons de volume enfoncés, jusqu'au début de l'installation."
"Hold both volume buttons and plug in the cable": "Maintenir les deux boutons de volume et brancher le câble"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Maintenez ensemble le bouton Retour, Volume bas et Marche/Arrêt jusqu'à ce que l'installation reprenne."
"If installation doesn't start": "Si l'installation ne démarre pas"
"If installation stalls": "Si l'installation se bloque"
"If it isn't found": "S'il n'est pas détecté"
"If the screen stays black": "Si l'écran reste noir"
"Install from the microSD card": "Installer depuis la carte microSD"
"Installing Thimsy": "Installation de Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Conserve vos données. Uniquement si le RG Cube exécute déjà GammaOS Next 1.2 ou une build Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Conserve vos données. Uniquement si l'appareil exécute déjà une build Thimsy ou GammaOS compatible."
"Light": "Léger"
"Medium": "Moyen"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "Au tout premier démarrage, l'écran peut rester vide jusqu'à une minute. C'est normal ; attendez que l'écran de démarrage apparaisse."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "Sur le {device}, ouvrez Paramètres, À propos et appuyez sept fois sur Numéro de build. Puis, dans Paramètres, Options pour les développeurs, activez Débogage USB et Déverrouillage OEM. Branchez le {device} allumé à cet ordinateur ; il redémarre en mode fastboot pour l'installation."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "Sur le {device}, ouvrez Paramètres, À propos et appuyez sept fois sur Numéro de build. Puis, dans Paramètres, Options pour les développeurs, activez Débogage USB et Déverrouillage OEM. Branchez le {device} allumé à cet ordinateur ; il redémarre en mode fastboot pour le déverrouillage."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Prévu : installation via Qualcomm EDL sur tous les ordinateurs. Pas encore disponible."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Prévu : SP Flash Tool sous Windows et Linux. Pas encore disponible."
"Planned: Windows only. Not buildable yet.": "Prévu : Windows uniquement. Pas encore disponible."
"Planned: fastboot install on every computer. Not buildable yet.": "Prévu : installation via fastboot sur tous les ordinateurs. Pas encore disponible."
"Planned: microSD card install on every computer. Not buildable yet.": "Prévu : installation par carte microSD sur tous les ordinateurs. Pas encore disponible."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Prévu : même méthode de flash que le RG Cube. Pas encore disponible."
"Plug in the cable with the device off": "Brancher le câble, appareil éteint"
"Preparing the partitions": "Préparation des partitions"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Insérez la carte dans le {device} et allumez-le. Thimsy fonctionne depuis la carte et ne touche pas au stockage interne du {device} : pour revenir au système d'origine, éteignez-le et retirez la carte."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Réinstallez Thimsy Installer ou définissez THIMSY_TOOLS_DIR sur un dossier qui le contient."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Réinstallez Thimsy Installer : son outil de flashage n'est pas la version attendue."
"Restart into fastbootd": "Redémarrer en fastbootd"
"Restart with Power": "Redémarrer avec Marche/Arrêt"
"Restarting the device": "Redémarrage de l'appareil"
"Slide it open, hold Back and plug in": "Ouvrir la glissière, maintenir Retour et brancher"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Petit téléchargement pour les systèmes classiques jusqu'à la PlayStation : un cœur RetroArch rapide par système, l'accueil Minima, sans shaders."
"Start from the microSD card": "Démarrer depuis la carte microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Retirez toute autre carte microSD du {device}, insérez la carte Thimsy et allumez-le. Thimsy fonctionne depuis la carte et ne touche pas au stockage interne : pour revenir au système d'origine, éteignez-le et retirez la carte."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Retirez toute carte SD, puis maintenez Volume bas et Marche/Arrêt jusqu'à ce que le {device} redémarre."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Retirez la carte microSD et activez Débogage USB dans Options pour les développeurs. Branchez le {device} allumé à cet ordinateur. Il redémarre en fastbootd : l'écran affiche fastbootd en grandes lettres rouges."
"The file is damaged or a different version. Delete it and download again.": "Le fichier est endommagé ou d'une autre version. Supprimez-le et téléchargez-le à nouveau."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Le premier démarrage peut prendre de 1 à 3 minutes et sembler bloqué sur le logo Anbernic. C'est normal."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Le premier démarrage prend de 1 à 3 minutes, et l'écran peut sembler bloqué sur le logo de démarrage. C'est normal."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Le premier démarrage prend quelques minutes, le temps que Thimsy configure vos émulateurs. Ne l'éteignez pas."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Le {device} se déverrouille une seule fois, avec l'outil UnlockBootloader du guide d'installation de GammaOS Next (Unisoc T820, étape 2) : éteignez le {device}, lancez l'outil, puis maintenez le bouton Retour pendant que vous branchez le câble USB. L'installateur n'exécute pas cet outil lui-même. Suivez le guide, puis revenez ici pour continuer."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Le {device} se déverrouille une seule fois, avec l'outil UnlockBootloader du guide d'installation de GammaOS Next (Unisoc T820, étape 2) : éteignez le {device}, lancez l'outil, puis maintenez le bouton Retour, celui à droite de l'écran, pendant que vous branchez le câble USB. L'installateur n'exécute pas cet outil lui-même. Suivez le guide, puis revenez ici pour continuer."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Le {device} se déverrouille une seule fois, avec l'outil de déverrouillage web du guide d'installation de GammaOS Next (Anbernic RG405M / RG405V / RG505, étape 2). Redémarrez le {device} en mode fastboot, ouvrez l'outil dans Google Chrome, cliquez sur « Connect », puis sur « Unlock ». Sur le {device}, n'appuyez pas sur Volume bas : appuyez sur le bouton Accueil / Retour pour confirmer. L'installateur n'exécute pas cet outil lui-même. Suivez le guide, puis revenez ici pour continuer."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Le profil {profile} n'est pas encore publié. Choisissez un profil indiqué comme disponible."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "La disposition des partitions de cet appareil ne correspond pas à ce firmware : c'est un autre modèle, ou il utilise encore le firmware d'origine, qui doit être repartitionné, ce que cette version ne sait pas encore faire."
"This version of the installer expects a different build. Build again, then install.": "Cette version de l'installateur attend une autre build. Relancez la création, puis installez."
"Turn on OEM unlocking": "Activer le déverrouillage OEM"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Éteignez le {device} et débranchez-le. Maintenez le bouton Retour et le bouton Anbernic juste à côté et, sans les relâcher, branchez le câble USB à cet ordinateur. Gardez-les enfoncés jusqu'au début de l'installation."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Éteignez le {device} et débranchez-le. Maintenez le bouton Retour et, sans le relâcher, branchez le câble USB à cet ordinateur. Gardez-le enfoncé jusqu'au début de l'installation."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Éteignez le {device} et débranchez-le. Maintenez le bouton Retour, celui à droite de l'écran, et, sans le relâcher, branchez le câble USB à cet ordinateur. Gardez-le enfoncé jusqu'au début de l'installation."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Éteignez complètement le {device} et débranchez-le. Maintenez ensemble Volume bas et Volume haut et, sans les relâcher, branchez le câble USB à cet ordinateur. Gardez-les enfoncés jusqu'au début de l'installation."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "Éteignez complètement le {device}. Lorsque l'installateur le demande, branchez le câble USB à cet ordinateur."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Éteignez le {device}, insérez la carte et allumez-le. Il s'installe tout seul sur son stockage interne depuis la carte. Laissez-le faire jusqu'à la fin, puis éteignez-le et retirez la carte."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Éteignez le {device}, débranchez-le et retirez toutes les cartes SD. Ouvrez la glissière, puis maintenez le bouton Retour au centre de la croix directionnelle et, sans le relâcher, branchez le câble USB à cet ordinateur. Gardez-le enfoncé jusqu'au début de l'installation."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Allumez le {device}, avec le débogage USB toujours activé dans Options pour les développeurs, et branchez-le à cet ordinateur. Il redémarre tout seul et l'installation commence."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Allumez le {device}, avec le débogage USB toujours activé dans Options pour les développeurs, et branchez-le à cet ordinateur. Il redémarre en mode fastboot pour l'installation."
"Unlock before flashing": "Déverrouiller avant de flasher"
"Unlock with GammaOS's own steps": "Déverrouiller avec la procédure de GammaOS"
"Unpacking the firmware": "Décompression du firmware"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Débranchez le câble. Maintenez Marche/Arrêt et Volume bas pendant au moins 60 secondes puis, sans les relâcher, branchez le câble USB. Gardez-les enfoncés jusqu'au début de l'installation ; la détection du {device} peut prendre 30 secondes ou plus."
"Use a Windows PC": "Utiliser un PC Windows"
"Use the firmware version the catalog lists for this device.": "Utilisez la version du firmware indiquée dans le catalogue pour cet appareil."
"Use the volume keys to choose Unlock, then press Power.": "Choisissez « Unlock » avec les boutons de volume, puis appuyez sur Marche/Arrêt."
"Wait for the first boot": "Attendre le premier démarrage"
"Wait on the Anbernic logo": "Patienter sur le logo Anbernic"
"Wait through a blank screen": "Patienter pendant l'écran vide"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Une fois l'installation terminée, appuyez une fois sur Marche/Arrêt si le {device} n'a pas redémarré tout seul."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "Lorsque l'écran affiche INFO: LOCK FLAG IS: UNLOCK!!!, il est déverrouillé. Débranchez le câble, vérifiez que le {device} est éteint, et continuez."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Lorsque l'écran affiche Unlock bootloader success!, il est déverrouillé. Si le {device} affiche déjà brièvement INFO: LOCK FLAG IS : UNLOCK!!! au démarrage, il a déjà été déverrouillé et vous pouvez sauter le déverrouillage."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Lorsque le {device} le demande, appuyez sur Volume haut dans les 3 secondes pour confirmer le déverrouillage."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Votre {device} utilise déjà un firmware personnalisé (il a déjà été déverrouillé). Le déverrouillage est ignoré."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Votre {device} utilise son firmware d'origine. L'installateur effectue une nouvelle installation qui efface l'appareil."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Votre {device} utilise encore son firmware d'origine. L'installateur vous guide pour le déverrouiller, puis effectue une nouvelle installation qui efface l'appareil."
"needs Android API {n}": "nécessite Android API {n}"
"needs Vulkan": "nécessite Vulkan"
"needs an ARMv8.2 CPU": "nécessite un processeur ARMv8.2"
"needs {n} GB RAM": "nécessite {n} Go de RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "Impossible d'installer {device} depuis {host}. Exécutez Thimsy Installer sur un PC Windows pour l'installer."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} s'installe avec PhoenixSuit d'Allwinner, qui ne fonctionne que sous Windows. Exécutez Thimsy Installer sur un PC Windows pour l'installer."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} s'installe avec SP Flash Tool de MediaTek, qui ne fonctionne pas sous {host}. Exécutez Thimsy Installer sur un PC Windows pour l'installer."
"{device} isn't supported by this version of the installer yet.": "{device} n'est pas encore pris en charge par cette version de l'installateur."
