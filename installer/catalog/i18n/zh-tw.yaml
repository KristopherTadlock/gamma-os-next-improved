"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "將記憶卡插入 {device} 並開機。Thimsy 從記憶卡執行，不會更動 {device} 的內部儲存空間：要回到原本的系統，關機並取出記憶卡即可。"
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "請重新安裝 Thimsy Installer：它的刷機工具不是預期的版本。"
"Reinstall Thimsy Installer: one of its tools is missing.": "請重新安裝 Thimsy Installer：它的某個工具遺失了。"
"Repeat the download-mode steps and keep holding the button until installing starts, then try again.": "請重複進入下載模式的步驟，並持續按住按鈕直到開始安裝，然後再試一次。"
"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "請重複進入下載模式的步驟，然後再試一次。如果仍找不到裝置，請在裝置管理員中確認 Unisoc download mode 使用的是 WinUSB 驅動程式。"
"Repeat the download-mode steps, then try again. If it still isn't found, unplug the cable, plug it into another USB port and try again.": "請重複進入下載模式的步驟，然後再試一次。如果仍找不到裝置，請拔下傳輸線，插到另一個 USB 連接埠後再試一次。"
