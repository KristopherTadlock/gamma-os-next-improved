"Slide it open, hold Back and plug in": "滑開機身，按住返回鍵並插入傳輸線"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "適用 PlayStation 及更早經典主機的小型下載：每部主機一個快速 RetroArch 核心、Minima 主畫面、不含著色器。"
"Start from the microSD card": "從 microSD 卡啟動"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "取出 {device} 中的其他 microSD 卡，插入 Thimsy 記憶卡並開機。Thimsy 從記憶卡執行，不會更動內部儲存空間：要回到原本的系統，關機並取出記憶卡即可。"
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "取出所有 SD 卡，然後按住音量降低鍵和電源鍵，直到 {device} 重新啟動。"
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "取出 microSD 卡，並在「開發人員選項」中開啟「USB 偵錯」。在開機狀態下將 {device} 連接到這台電腦。它會重新啟動進入 fastbootd：螢幕上會以紅色大字顯示 fastbootd。"
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "工作區所在的磁碟機可能發生故障。請在其他磁碟機上選擇工作區，然後重新建置。"
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "此版本未隨附驅動程式安裝程式。請使用 Zadig 為裝置的下載模式安裝 WinUSB。"
"The file is damaged or a different version. Delete it and download again.": "檔案已損毀或版本不符。請刪除後重新下載。"
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "第一次啟動可能需要 1 到 3 分鐘，並可能看起來停在 Anbernic 標誌上。這是正常的。"
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "第一次啟動需要 1 到 3 分鐘，螢幕可能看起來停在開機標誌上。這是正常的。"
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "首次啟動需要幾分鐘，Thimsy 正在設定模擬器。請勿關機。"
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "無法檢查此磁碟機的可用空間。請為工作區選擇其他資料夾。"
"The installer does a fresh install that erases your {device}, whatever it runs now.": "無論你的 {device} 目前執行什麼系統，安裝程式都會進行全新安裝並清除其資料。"
"The installer runs as root, so it can open the device": "安裝程式以 root 身分執行，因此可以開啟裝置"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} 只需解鎖一次，且須在 Windows 電腦上進行：GammaOS Next 安裝指南中的 UnlockBootloader 工具（Unisoc T820，步驟 1 和 2）只能在 Windows 上執行。請先安裝指南的 UnisocTools 中的 Unisoc USB 驅動程式。接著關閉 {device} 並拔掉傳輸線，啟動 UnlockBootloader.bat，並在 30 秒內按住返回鍵（螢幕右側的那個按鍵），在不放開的情況下插入 USB 傳輸線。螢幕上出現文字時放開。解鎖會清除 {device} 的資料。安裝程式不會自行執行該工具。請依照指南操作，然後回來繼續。"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} 只需解鎖一次，且須在 Windows 電腦上進行：GammaOS Next 安裝指南中的 UnlockBootloader 工具（Unisoc T820，步驟 1 和 2）只能在 Windows 上執行。請先安裝指南的 UnisocTools 中的 Unisoc USB 驅動程式。接著關閉 {device} 並拔掉傳輸線，啟動 UnlockBootloader.bat，並在 30 秒內按住返回鍵，在不放開的情況下插入 USB 傳輸線。螢幕上出現文字時放開。解鎖會清除 {device} 的資料。安裝程式不會自行執行該工具。請依照指南操作，然後回來繼續。"
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "{device} 只需解鎖一次，使用 GammaOS Next 安裝指南中的網頁解鎖工具（Anbernic RG405M / RG405V / RG505，步驟 2）。取出 microSD 卡，在「開發人員選項」中開啟「USB 偵錯」，然後用 adb reboot bootloader 將 {device} 重新啟動進入 fastboot 模式：螢幕上會在 Anbernic 標誌旁顯示 fastboot mode。在 Google Chrome 中開啟該工具，點選「Connect」，選擇裝置，然後點選「Unlock」。在 {device} 上不要按音量降低鍵：按主畫面鍵 / 返回鍵確認。在 Linux 或 macOS 上，可以用指南中的 unisoc-unlock 工具完成同樣的操作。解鎖會清除 {device} 的資料。安裝程式不會自行執行這些工具。請依照指南操作，然後回來繼續。"
"The {profile} profile isn't published yet. Choose a profile marked available.": "{profile} 設定檔尚未發布。請選擇標示為可用的設定檔。"
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "此裝置執行的不是相符的 Thimsy 或 GammaOS 版本，因此無法更新。請改用完整安裝（會清除裝置資料）。"
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "此裝置的分割區配置與這個韌體不符：可能是其他型號，或仍在執行需要重新分割的原廠韌體，而目前版本還無法重新分割。"
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "此磁碟機格式為 FAT32，無法存放超過 4 GB 的檔案。請在其他磁碟機（NTFS、exFAT、APFS 或 ext4）上選擇工作區。"
"This version of the installer expects a different build. Build again, then install.": "此版本的安裝程式需要不同的建置。請重新建置，然後安裝。"
"Turn it on": "開機"
"Turn on OEM unlocking": "開啟 OEM 解鎖"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "關閉 {device} 並拔掉傳輸線。按住返回鍵和旁邊的 Anbernic 鍵，在不放開的情況下將 USB 傳輸線連接到這台電腦。持續按住，直到安裝開始。"
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "關閉 {device} 並拔掉傳輸線。按住返回鍵，在不放開的情況下將 USB 傳輸線連接到這台電腦。持續按住，直到安裝開始。"
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "關閉 {device} 並拔掉傳輸線。按住返回鍵（螢幕右側的那個按鍵），在不放開的情況下將 USB 傳輸線連接到這台電腦。持續按住，直到安裝開始。"
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "將 {device} 完全關機並拔掉傳輸線。同時按住音量降低鍵和音量提高鍵，在不放開的情況下將 USB 傳輸線連接到這台電腦。持續按住，直到安裝開始。"
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "將 {device} 完全關機。當安裝程式提示時，將 USB 傳輸線連接到這台電腦，並保持連接直到安裝完成。"
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "關閉 {device}，插入記憶卡後開機。它會自動從記憶卡安裝到內部儲存空間，需要幾分鐘。在它自動關機或重新啟動之前請勿操作，之後取出記憶卡。"
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "關閉 {device}，插入記憶卡後開機。它會自動從記憶卡安裝到內部儲存空間。安裝完成前請勿操作，完成後關機並取出記憶卡。"
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "關閉 {device}，拔掉傳輸線並取出所有 SD 卡。滑開機身，然後按住方向鍵中間的返回鍵，在不放開的情況下將 USB 傳輸線連接到這台電腦。持續按住，直到安裝開始。"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "在「開發人員選項」中保持「USB 偵錯」開啟，開啟 {device} 並將它連接到這台電腦。它會自動重新啟動並開始安裝。"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "在「開發人員選項」中保持「USB 偵錯」開啟，開啟 {device} 並將它連接到這台電腦。它會重新啟動進入 fastboot 模式進行安裝。"
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "尚未為 {ids} 設定 USB 存取權。設定時需要輸入一次密碼。"
"USB access is set up for {ids}": "已為 {ids} 設定 USB 存取權"
"Unlock before flashing": "刷機前先解鎖"
"Unlock with GammaOS's own steps": "依照 GammaOS 自己的步驟解鎖"
"Unpacking the firmware": "正在解壓縮韌體"
"Unpacking {file}": "正在解壓縮 {file}"
"Unplug it and turn it on": "拔掉傳輸線並開機"
"Unplug the cable when it restarts": "重新啟動時拔掉傳輸線"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "拔掉傳輸線。按住電源鍵和音量降低鍵至少 60 秒，然後在不放開的情況下插入 USB 傳輸線。持續按住，直到安裝開始；找到 {device} 可能需要 30 秒或更久。"
"Updating checksums": "正在更新總和檢查碼"
"Use a Windows PC": "使用 Windows 電腦"
"Use the firmware version the catalog lists for this device.": "請使用目錄中為此裝置列出的韌體版本。"
"Use the volume keys to choose Unlock, then press Power.": "使用音量鍵選擇「Unlock」，然後按下電源鍵。"
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "等待首次啟動"
"Wait on the Anbernic logo": "在 Anbernic 標誌處等待"
"Wait through a blank screen": "螢幕空白時請等待"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "安裝完成後，如果 {device} 沒有自動重新啟動，請按一次電源鍵。"
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "安裝完成後，{device} 會自動重新啟動並設定儲存空間。此時拔掉傳輸線。"
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "安裝完成後，拔掉傳輸線並按電源鍵開啟 {device}。"
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "螢幕顯示 INFO: LOCK FLAG IS: UNLOCK!!! 時即已解鎖。拔掉傳輸線並確認 {device} 已關機（如果它重新啟動，請按住電源鍵直到關機），然後繼續。"
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "螢幕顯示 Unlock bootloader success! 時即已解鎖。如果 {device} 開機時已短暫顯示 INFO: LOCK FLAG IS : UNLOCK!!!，表示先前已經解鎖，可以略過解鎖。"
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "當 {device} 詢問時，在 3 秒內按音量提高鍵確認解鎖。"
"WinUSB is installed for {ids}": "已為 {ids} 安裝 WinUSB"
"WinUSB will be installed for {ids} the first time you flash": "首次刷機時將為 {ids} 安裝 WinUSB"
"Windows now gives the device the driver the installer needs. Unplug the cable and turn the device off, then repeat the download-mode steps with the same USB port.": "Windows 現在已為裝置指派安裝程式需要的驅動程式。請拔下傳輸線並關閉裝置，然後使用同一個 USB 連接埠重複進入下載模式的步驟。"
"WonderSwan": "WonderSwan"
"Writing {partition}": "正在寫入 {partition}"
"Wrote {partition}": "已寫入 {partition}"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "你的 {device} 已在執行 GammaOS 或 Thimsy。請選擇新韌體的安裝方式。"
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "你的 {device} 已在執行自訂韌體（之前已解鎖）。將略過解鎖。"
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "你的 {device} 仍在執行原廠韌體。安裝程式會引導你完成解鎖，然後進行全新安裝並清除裝置資料。"
"hakuX": "hakuX"
"needs Android API {n}": "需要 Android API {n}"
"needs Vulkan": "需要 Vulkan"
"needs an ARMv8.2 CPU": "需要 ARMv8.2 CPU"
"needs {n} GB RAM": "需要 {n} GB 記憶體"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "無法從 {host} 安裝 {device}。請在 Windows 電腦上執行 Thimsy Installer 進行安裝。"
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} 需使用 Allwinner 的 PhoenixSuit 安裝，該工具只能在 Windows 上執行。請在 Windows 電腦上執行 Thimsy Installer 進行安裝。"
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} 需使用 MediaTek 的 SP Flash Tool 安裝，該工具無法在 {host} 上執行。請在 Windows 電腦上執行 Thimsy Installer 進行安裝。"
"{device} isn't supported by this version of the installer yet.": "此版本的安裝程式尚不支援 {device}。"
"{host} needs no driver": "{host} 不需要驅動程式"
