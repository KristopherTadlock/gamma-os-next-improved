# Traditional Chinese (Taiwan) translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "全新安裝會清除內部儲存空間。請將 ROMs、遊戲存檔、螢幕截圖及其他想保留的內容複製到電腦或 microSD 卡。microSD 卡上的遊戲不受影響。"
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "請接受 Windows 的權限提示，或使用 Zadig 安裝 WinUSB。"
"Already unlocked: install new firmware": "已解鎖：安裝新韌體"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "均衡：適用經典主機的 RetroArch，另加 N64、Dreamcast、PSP 和 DS 模擬器、ES-DE 主畫面及 Brave。"
"Building Thimsy for your device": "正在為你的裝置建置 Thimsy"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "以 RG Cube 的官方 GammaOS Next 1.2 版本建置，下載自 GammaOS 的 GitHub 頁面。"
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "開始前請充電至至少 50%，並準備好隨附的傳輸線。"
"Charge the RG Cube": "為 RG Cube 充電"
"Check it's unlocked": "確認已解鎖"
"Check the basics": "檢查基本功能"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "檢查按鍵、觸控螢幕、聲音和 Wi-Fi，並啟動一款遊戲。"
"Check the cable and that the device is still in its flashing mode, then try again.": "請檢查傳輸線，並確認裝置仍處於刷機模式，然後再試一次。"
"Checking the USB driver": "正在檢查 USB 驅動程式"
"Checking the build": "正在檢查建置"
"Checking the plan": "正在檢查方案"
"Checking the result": "正在檢查結果"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "請在可用空間較大的磁碟機（非 FAT32）上選擇工作區，或釋出一些空間。"
"Confirm on the device": "在裝置上確認"
"Confirm with Volume Up": "按音量提高鍵確認"
"Connect it with USB debugging on": "在開啟 USB 偵錯的情況下連接"
"Connect the device in download mode": "以下載模式連接裝置"
"Copy games without a card reader": "不用讀卡機複製遊戲"
"Copy your games and saves": "複製你的遊戲和存檔"
"Delete the workspace's jobs folder and build again; report it if it persists.": "請刪除工作區中的「jobs」資料夾並重新建置；如果問題持續發生，請回報。"
"Don't install on units made in March 2026 or later.": "請勿安裝在 2026 年 3 月或之後生產的裝置上。"
"Don't install on units whose stock firmware is v1.26.": "請勿安裝在原廠韌體為 v1.26 的裝置上。"
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "不要把記憶卡放回電腦裡複製遊戲：卡上是加密的 Android 分割區配置，電腦不會顯示你的儲存空間。請改用 USB 檔案傳輸（MTP）、ADB Explorer 或網路共用來複製遊戲。"
"Download mode was never seen through WinUSB. Hold Back while you plug in the cable, and check in Device Manager or Zadig that Windows uses WinUSB for Unisoc download mode, not Unisoc's own driver.": "從未透過 WinUSB 偵測到下載模式。請在插入傳輸線時按住返回鍵，並在裝置管理員或 Zadig 中確認 Windows 為 Unisoc download mode 使用的是 WinUSB，而不是 Unisoc 自己的驅動程式。"
"Downloading": "正在下載"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "全部：在「標準」之外再加上 GameCube/Wii、3DS、PS2、Xbox 和 PS Vita 模擬器及高精確度核心。完整的 Thimsy 1.0a 套件。"
"Finishing": "正在完成"
"First time installing custom firmware": "第一次安裝自訂韌體"
"Follow the unlock steps shown in the installer, then continue.": "依照安裝程式顯示的解鎖步驟操作，然後繼續。"
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "GammaOS 的指南提醒：刷寫未解鎖的 {device} 會導致裝置變磚。解鎖後，{device} 會重新啟動進入原廠 Android。請等待 Android 啟動完成，然後繼續。"
"Heavy": "完整"
"Hold Back and plug in the cable": "按住返回鍵並插入傳輸線"
"Hold Back and the Anbernic button, then plug in": "按住返回鍵和 Anbernic 鍵，然後插入傳輸線"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "按住電源鍵關閉 {device}。按住兩個音量鍵，在不放開的情況下插入 USB 傳輸線。接著繼續按住音量鍵，同時反覆按電源鍵，直到安裝開始。"
"Hold both volume buttons and plug in the cable": "按住兩個音量鍵並插入傳輸線"
"Hold the Back button, Volume Down and Power together until installation starts again.": "同時按住返回鍵、音量降低鍵和電源鍵，直到安裝重新開始。"
"If installation doesn't start": "如果安裝沒有開始"
"If installation stalls": "如果安裝卡住"
"If it isn't found": "如果找不到裝置"
"If the screen stays black": "如果螢幕一直是黑的"
"Install from the microSD card": "從 microSD 卡安裝"
"Installing Thimsy": "正在安裝 Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "保留你的資料。僅適用於 RG Cube 已在執行 GammaOS Next 1.2 或 Thimsy 版本的情況。"
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "保留你的資料。僅適用於裝置已在執行相容的 Thimsy 或 GammaOS 版本的情況。"
"Light": "輕量"
"Medium": "標準"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "第一次啟動時，螢幕可能會維持空白長達一分鐘。這是正常的，請等待開機畫面出現。"
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "在 {device} 上開啟「設定」>「關於」，連續輕觸「版本號碼」七次。接著在「設定」>「開發人員選項」中開啟「USB 偵錯」和「OEM 解鎖」。在開機狀態下將 {device} 連接到這台電腦；它會重新啟動進入 fastboot 模式進行安裝。"
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "在 {device} 上開啟「設定」>「關於」，連續輕觸「版本號碼」七次。接著在「設定」>「開發人員選項」中開啟「USB 偵錯」和「OEM 解鎖」。在開機狀態下將 {device} 連接到這台電腦；它會重新啟動進入 fastboot 模式進行解鎖。"
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "規劃中：在任何電腦上透過 Qualcomm EDL 安裝。尚無法建置。"
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "規劃中：在 Windows 和 Linux 上使用 SP Flash Tool。尚無法建置。"
"Planned: Windows only. Not buildable yet.": "規劃中：僅限 Windows。尚無法建置。"
"Planned: fastboot install on every computer. Not buildable yet.": "規劃中：在任何電腦上透過 fastboot 安裝。尚無法建置。"
"Planned: microSD card install on every computer. Not buildable yet.": "規劃中：在任何電腦上透過 microSD 卡安裝。尚無法建置。"
"Planned: same flashing route as the RG Cube. Not buildable yet.": "規劃中：與 RG Cube 相同的刷機方式。尚無法建置。"
"Plug in the cable with the device off": "在裝置關機時插入傳輸線"
"Preparing the partitions": "正在準備分割區"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "將記憶卡插入 {device} 並開機。Thimsy 從記憶卡執行，不會更動 {device} 的內部儲存空間：要回到原本的系統，關機並取出記憶卡即可。"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "請重新安裝 Thimsy Installer，或將 THIMSY_TOOLS_DIR 設為包含它的資料夾。"
"Restart into fastbootd": "重新啟動進入 fastbootd"
"Restart with Power": "用電源鍵重新啟動"
"Restarting the device": "正在重新啟動裝置"
"Slide it open, hold Back and plug in": "滑開機身，按住返回鍵並插入傳輸線"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "適用 PlayStation 及更早經典主機的小型下載：每部主機一個快速 RetroArch 核心、Minima 主畫面、不含著色器。"
"Start from the microSD card": "從 microSD 卡啟動"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "取出 {device} 中的其他 microSD 卡，插入 Thimsy 記憶卡並開機。Thimsy 從記憶卡執行，不會更動內部儲存空間：要回到原本的系統，關機並取出記憶卡即可。"
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "取出所有 SD 卡，然後按住音量降低鍵和電源鍵，直到 {device} 重新啟動。"
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "取出 microSD 卡，並在「開發人員選項」中開啟「USB 偵錯」。在開機狀態下將 {device} 連接到這台電腦。它會重新啟動進入 fastbootd：螢幕上會以紅色大字顯示 fastbootd。"
"The file is damaged or a different version. Delete it and download again.": "檔案已損毀或版本不符。請刪除後重新下載。"
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "第一次啟動可能需要 1 到 3 分鐘，並可能看起來停在 Anbernic 標誌上。這是正常的。"
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "第一次啟動需要 1 到 3 分鐘，螢幕可能看起來停在開機標誌上。這是正常的。"
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "首次啟動需要幾分鐘，Thimsy 正在設定模擬器。請勿關機。"
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} 只需解鎖一次，使用 GammaOS Next 安裝指南中的 UnlockBootloader 工具（Unisoc T820，步驟 2）：關閉 {device}，啟動該工具，然後在插入 USB 傳輸線時按住返回鍵。安裝程式不會自行執行該工具。請依照指南操作，然後回來繼續。"
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} 只需解鎖一次，使用 GammaOS Next 安裝指南中的 UnlockBootloader 工具（Unisoc T820，步驟 2）：關閉 {device}，啟動該工具，然後在插入 USB 傳輸線時按住返回鍵（螢幕右側的那個按鍵）。安裝程式不會自行執行該工具。請依照指南操作，然後回來繼續。"
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} 只需解鎖一次，使用 GammaOS Next 安裝指南中的網頁解鎖工具（Anbernic RG405M / RG405V / RG505，步驟 2）。將 {device} 重新啟動進入 fastboot 模式，在 Google Chrome 中開啟該工具，點選「Connect」，然後點選「Unlock」。在 {device} 上不要按音量降低鍵：按主畫面鍵 / 返回鍵確認。安裝程式不會自行執行該工具。請依照指南操作，然後回來繼續。"
"The {profile} profile isn't published yet. Choose a profile marked available.": "{profile} 設定檔尚未發布。請選擇標示為可用的設定檔。"
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "此裝置的分割區配置與這個韌體不符：可能是其他型號，或仍在執行需要重新分割的原廠韌體，而目前版本還無法重新分割。"
"Turn on OEM unlocking": "開啟 OEM 解鎖"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "關閉 {device} 並拔掉傳輸線。按住返回鍵和旁邊的 Anbernic 鍵，在不放開的情況下將 USB 傳輸線連接到這台電腦。持續按住，直到安裝開始。"
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "關閉 {device} 並拔掉傳輸線。按住返回鍵，在不放開的情況下將 USB 傳輸線連接到這台電腦。持續按住，直到安裝開始。"
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "關閉 {device} 並拔掉傳輸線。按住返回鍵（螢幕右側的那個按鍵），在不放開的情況下將 USB 傳輸線連接到這台電腦。持續按住，直到安裝開始。"
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "將 {device} 完全關機並拔掉傳輸線。同時按住音量降低鍵和音量提高鍵，在不放開的情況下將 USB 傳輸線連接到這台電腦。持續按住，直到安裝開始。"
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "將 {device} 完全關機。當安裝程式提示時，將 USB 傳輸線連接到這台電腦。"
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "關閉 {device}，插入記憶卡後開機。它會自動從記憶卡安裝到內部儲存空間。安裝完成前請勿操作，完成後關機並取出記憶卡。"
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "關閉 {device}，拔掉傳輸線並取出所有 SD 卡。滑開機身，然後按住方向鍵中間的返回鍵，在不放開的情況下將 USB 傳輸線連接到這台電腦。持續按住，直到安裝開始。"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "在「開發人員選項」中保持「USB 偵錯」開啟，開啟 {device} 並將它連接到這台電腦。它會自動重新啟動並開始安裝。"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "在「開發人員選項」中保持「USB 偵錯」開啟，開啟 {device} 並將它連接到這台電腦。它會重新啟動進入 fastboot 模式進行安裝。"
"Unlock before flashing": "刷機前先解鎖"
"Unlock with GammaOS's own steps": "依照 GammaOS 自己的步驟解鎖"
"Unpacking the firmware": "正在解壓縮韌體"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "拔掉傳輸線。按住電源鍵和音量降低鍵至少 60 秒，然後在不放開的情況下插入 USB 傳輸線。持續按住，直到安裝開始；找到 {device} 可能需要 30 秒或更久。"
"Use a Windows PC": "使用 Windows 電腦"
"Use the firmware version the catalog lists for this device.": "請使用目錄中為此裝置列出的韌體版本。"
"Use the volume keys to choose Unlock, then press Power.": "使用音量鍵選擇「Unlock」，然後按下電源鍵。"
"Wait for the first boot": "等待首次啟動"
"Wait on the Anbernic logo": "在 Anbernic 標誌處等待"
"Wait through a blank screen": "螢幕空白時請等待"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "安裝完成後，如果 {device} 沒有自動重新啟動，請按一次電源鍵。"
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "螢幕顯示 INFO: LOCK FLAG IS: UNLOCK!!! 時即已解鎖。拔掉傳輸線，確認 {device} 已關機，然後繼續。"
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "螢幕顯示 Unlock bootloader success! 時即已解鎖。如果 {device} 開機時已短暫顯示 INFO: LOCK FLAG IS : UNLOCK!!!，表示先前已經解鎖，可以略過解鎖。"
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "當 {device} 詢問時，在 3 秒內按音量提高鍵確認解鎖。"
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "你的 {device} 已在執行自訂韌體（之前已解鎖）。將略過解鎖。"
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "你的 {device} 正在執行原廠韌體。安裝程式將進行全新安裝，並清除裝置資料。"
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "你的 {device} 仍在執行原廠韌體。安裝程式會引導你完成解鎖，然後進行全新安裝並清除裝置資料。"
"needs Android API {n}": "需要 Android API {n}"
"needs Vulkan": "需要 Vulkan"
"needs an ARMv8.2 CPU": "需要 ARMv8.2 CPU"
"needs {n} GB RAM": "需要 {n} GB 記憶體"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "無法從 {host} 安裝 {device}。請在 Windows 電腦上執行 Thimsy Installer 進行安裝。"
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} 需使用 Allwinner 的 PhoenixSuit 安裝，該工具只能在 Windows 上執行。請在 Windows 電腦上執行 Thimsy Installer 進行安裝。"
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} 需使用 MediaTek 的 SP Flash Tool 安裝，該工具無法在 {host} 上執行。請在 Windows 電腦上執行 Thimsy Installer 進行安裝。"
"{device} isn't supported by this version of the installer yet.": "此版本的安裝程式尚不支援 {device}。"
