# Traditional Chinese (Taiwan) translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "全新安裝會清除內部儲存空間。請將 ROMs、遊戲存檔、螢幕截圖及其他想保留的內容複製到電腦或 microSD 卡。microSD 卡上的遊戲不受影響。"
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "請接受 Windows 的權限提示，或使用 Zadig 安裝 WinUSB。"
"Already unlocked: install new firmware": "已解鎖：安裝新韌體"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "均衡：適用經典主機的 RetroArch，另加 N64、Dreamcast、PSP 和 DS 模擬器、ES-DE 主畫面及 Brave。"
"Building Thimsy for your device": "正在為你的裝置建置 Thimsy"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "以 RG Cube 的官方 GammaOS Next 1.2 版本建置，下載自 GammaOS 的 GitHub 頁面。"
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "開始前請充電至至少 50%，並準備好隨附的傳輸線。"
"Charge the RG Cube": "為 RG Cube 充電"
"Check it's unlocked": "確認已解鎖"
"Check the basics": "檢查基本功能"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "檢查按鍵、觸控螢幕、聲音和 Wi-Fi，並啟動一款遊戲。"
"Check the cable and that the device is still in its flashing mode, then try again.": "請檢查傳輸線，並確認裝置仍處於刷機模式，然後再試一次。"
"Checking the USB driver": "正在檢查 USB 驅動程式"
"Checking the build": "正在檢查建置"
"Checking the plan": "正在檢查方案"
"Checking the result": "正在檢查結果"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "請在可用空間較大的磁碟機（非 FAT32）上選擇工作區，或釋出一些空間。"
"Confirm on the device": "在裝置上確認"
"Connect the device in download mode": "以下載模式連接裝置"
"Copy your games and saves": "複製你的遊戲和存檔"
"Delete the workspace's jobs folder and build again; report it if it persists.": "請刪除工作區中的「jobs」資料夾並重新建置；如果問題持續發生，請回報。"
"Don't install on units made in March 2026 or later.": "請勿安裝在 2026 年 3 月或之後生產的裝置上。"
"Don't install on units whose stock firmware is v1.26.": "請勿安裝在原廠韌體為 v1.26 的裝置上。"
"Downloading": "正在下載"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "全部：在「標準」之外再加上 GameCube/Wii、3DS、PS2、Xbox 和 PS Vita 模擬器及高精確度核心。完整的 Thimsy 1.0a 套件。"
"Finishing": "正在完成"
"First time installing custom firmware": "第一次安裝自訂韌體"
"Follow the unlock steps shown in the installer, then continue.": "依照安裝程式顯示的解鎖步驟操作，然後繼續。"
"Heavy": "完整"
"Hold Volume Down and plug in the cable": "按住音量降低鍵並插入傳輸線"
"Installing Thimsy": "正在安裝 Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "保留你的資料。僅適用於 RG Cube 已在執行 GammaOS Next 1.2 或 Thimsy 版本的情況。"
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "保留你的資料。僅適用於裝置已在執行相容的 Thimsy 或 GammaOS 版本的情況。"
"Light": "輕量"
"Medium": "標準"
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "規劃中：在任何電腦上透過 Qualcomm EDL 安裝。尚無法建置。"
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "規劃中：在 Windows 和 Linux 上使用 SP Flash Tool。尚無法建置。"
"Planned: Windows only. Not buildable yet.": "規劃中：僅限 Windows。尚無法建置。"
"Planned: fastboot install on every computer. Not buildable yet.": "規劃中：在任何電腦上透過 fastboot 安裝。尚無法建置。"
"Planned: microSD card install on every computer. Not buildable yet.": "規劃中：在任何電腦上透過 microSD 卡安裝。尚無法建置。"
"Planned: same flashing route as the RG Cube. Not buildable yet.": "規劃中：與 RG Cube 相同的刷機方式。尚無法建置。"
"Preparing the partitions": "正在準備分割區"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "請重新安裝 Thimsy Installer，或將 THIMSY_TOOLS_DIR 設為包含它的資料夾。"
"Required before flashing; skipping it can brick the device.": "刷機前必須完成；略過此步驟可能導致裝置變磚。"
"Restarting the device": "正在重新啟動裝置"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "適用 PlayStation 及更早經典主機的小型下載：每部主機一個快速 RetroArch 核心、Minima 主畫面、不含著色器。"
"The RG Cube is unlocked once, with the steps from GammaOS Next's installation guide (the Unisoc T820 section). The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "RG Cube 只需解鎖一次，請依照 GammaOS Next 安裝指南（Unisoc T820 章節）中的步驟操作。安裝程式不會自行執行該工具。請依指南操作，然後回到這裡繼續。"
"The file is damaged or a different version. Delete it and download again.": "檔案已損毀或版本不符。請刪除後重新下載。"
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "首次啟動需要幾分鐘，Thimsy 正在設定模擬器。請勿關機。"
"The installer sends the unlock command; confirm it on the device with Volume Up.": "安裝程式會傳送解鎖指令；請在裝置上按音量提高鍵確認。"
"The {profile} profile isn't published yet. Choose a profile marked available.": "{profile} 設定檔尚未發布。請選擇標示為可用的設定檔。"
"Turn the RG Cube off. Hold Volume Down and connect the USB cable to this computer. Keep holding until installation starts. The screen stays black; that's normal.": "關閉 RG Cube。按住音量降低鍵，將 USB 傳輸線連接到這台電腦。持續按住，直到開始安裝。螢幕會保持黑色，這是正常的。"
"Unlock in fastboot": "在 fastboot 中解鎖"
"Unlock with GammaOS's own steps": "依照 GammaOS 自己的步驟解鎖"
"Unpacking the firmware": "正在解壓縮韌體"
"Use a Windows PC": "使用 Windows 電腦"
"Use the firmware version the catalog lists for this device.": "請使用目錄中為此裝置列出的韌體版本。"
"Use the volume keys to choose Unlock, then press Power.": "使用音量鍵選擇「Unlock」，然後按下電源鍵。"
"Wait for the first boot": "等待首次啟動"
"When the device shows LOCK FLAG IS: UNLOCK, it's unlocked. Turn it off and continue.": "裝置顯示 LOCK FLAG IS: UNLOCK 時即已解鎖。請關機並繼續。"
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "你的 {device} 已在執行自訂韌體（之前已解鎖）。將略過解鎖。"
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "你的 {device} 正在執行原廠韌體。安裝程式將進行全新安裝，並清除裝置資料。"
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "你的 {device} 仍在執行原廠韌體。安裝程式會引導你完成解鎖，然後進行全新安裝並清除裝置資料。"
"needs Android API {n}": "需要 Android API {n}"
"needs Vulkan": "需要 Vulkan"
"needs an ARMv8.2 CPU": "需要 ARMv8.2 CPU"
"needs {n} GB RAM": "需要 {n} GB 記憶體"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "無法從 {host} 安裝 {device}。請在 Windows 電腦上執行 Thimsy Installer 進行安裝。"
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} 需使用 Allwinner 的 PhoenixSuit 安裝，該工具只能在 Windows 上執行。請在 Windows 電腦上執行 Thimsy Installer 進行安裝。"
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} 需使用 MediaTek 的 SP Flash Tool 安裝，該工具無法在 {host} 上執行。請在 Windows 電腦上執行 Thimsy Installer 進行安裝。"
"{device} isn't supported by this version of the installer yet.": "此版本的安裝程式尚不支援 {device}。"
