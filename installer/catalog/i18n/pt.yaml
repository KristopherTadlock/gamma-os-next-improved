"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "Repita as etapas do modo de download e tente novamente. Se ele ainda não for encontrado, verifique no Gerenciador de Dispositivos se o Unisoc download mode usa o driver WinUSB."
