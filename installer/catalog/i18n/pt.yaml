# Portuguese translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Uma instalação limpa apaga o armazenamento interno. Copie ROMs, saves, capturas de tela e tudo o que quiser manter para o computador ou para o cartão microSD. Os jogos no cartão microSD não são alterados."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Aceite o pedido de permissão do Windows ou instale o WinUSB com o Zadig."
"Already unlocked: install new firmware": "Já desbloqueado: instalar novo firmware"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Equilibrado: RetroArch para sistemas clássicos, mais emuladores de N64, Dreamcast, PSP e DS, a tela inicial ES-DE e o Brave."
"Building Thimsy for your device": "Criando o Thimsy para o seu dispositivo"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Criado a partir da versão oficial do GammaOS Next 1.2 para o RG Cube, baixada da página do GammaOS no GitHub."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Carregue-o até pelo menos 50% antes de começar e deixe à mão o cabo que veio com ele."
"Charge the RG Cube": "Carregue o RG Cube"
"Check it's unlocked": "Verifique se está desbloqueado"
"Check the basics": "Verifique o básico"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Teste os botões, a tela sensível ao toque, o som e o Wi-Fi, e inicie um jogo."
"Check the cable and that the device is still in its flashing mode, then try again.": "Verifique o cabo e se o dispositivo ainda está no modo de flash, depois tente novamente."
"Checking the USB driver": "Verificando o driver USB"
"Checking the build": "Verificando o build"
"Checking the plan": "Verificando o plano"
"Checking the result": "Verificando o resultado"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Escolha uma pasta de trabalho em uma unidade com mais espaço livre (que não seja FAT32) ou libere espaço."
"Confirm on the device": "Confirme no dispositivo"
"Confirm with Volume Up": "Confirme com Aumentar volume"
"Connect it with USB debugging on": "Conecte com a depuração USB ativada"
"Connect the device in download mode": "Conecte o dispositivo no modo de download"
"Copy games without a card reader": "Copie jogos sem leitor de cartão"
"Copy your games and saves": "Copie seus jogos e saves"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Exclua a pasta \"jobs\" da pasta de trabalho e crie o build novamente; se o problema persistir, informe-o."
"Don't install on units made in March 2026 or later.": "Não instale em unidades fabricadas em março de 2026 ou depois."
"Don't install on units whose stock firmware is v1.26.": "Não instale em unidades cujo firmware original seja v1.26."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "Não coloque o cartão de volta em um computador para copiar jogos: ele contém um layout criptografado do Android, então o computador não mostra seu armazenamento. Em vez disso, copie jogos pela transferência de arquivos USB (MTP), com o ADB Explorer ou de um compartilhamento de rede."
"Downloading": "Baixando"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Tudo: Médio, mais emuladores de GameCube/Wii, 3DS, PS2, Xbox e PS Vita e os núcleos de alta precisão. O conjunto completo do Thimsy 1.0a."
"Finishing": "Finalizando"
"First time installing custom firmware": "Primeira vez instalando firmware personalizado"
"Follow the unlock steps shown in the installer, then continue.": "Siga as etapas de desbloqueio mostradas no instalador e depois continue."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "O guia do GammaOS avisa que instalar o firmware no {device} sem desbloqueá-lo antes o inutiliza. Após o desbloqueio, o {device} reinicia no Android original. Aguarde até o Android iniciar e então continue."
"Heavy": "Completo"
"Hold Back and plug in the cable": "Segure Voltar e conecte o cabo"
"Hold Back and the Anbernic button, then plug in": "Segure Voltar e o botão Anbernic e conecte"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Segure o botão liga/desliga para desligar o {device}. Segure os dois botões de volume e, ainda segurando, conecte o cabo USB. Depois, continue tocando no botão liga/desliga, com os botões de volume ainda pressionados, até a instalação começar."
"Hold both volume buttons and plug in the cable": "Segure os dois botões de volume e conecte o cabo"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Segure o botão Voltar, Diminuir volume e o botão liga/desliga juntos até a instalação começar de novo."
"If installation doesn't start": "Se a instalação não começar"
"If installation stalls": "Se a instalação travar"
"If it isn't found": "Se ele não for encontrado"
"If the screen stays black": "Se a tela continuar preta"
"Install from the microSD card": "Instale pelo cartão microSD"
"Installing Thimsy": "Instalando o Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Mantém seus dados. Somente se o RG Cube já executar o GammaOS Next 1.2 ou um build do Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Mantém seus dados. Somente se o dispositivo já executar um build compatível do Thimsy ou do GammaOS."
"Light": "Leve"
"Medium": "Médio"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "Na primeira inicialização, a tela pode ficar em branco por até um minuto. Isso é normal; aguarde a tela de inicialização aparecer."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "No {device}, abra Configurações, Sobre e toque sete vezes em Número da versão. Depois, em Configurações, Opções do desenvolvedor, ative a Depuração USB e o Desbloqueio de OEM. Conecte o {device} a este computador enquanto ele estiver ligado; ele reinicia no modo fastboot para a instalação."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "No {device}, abra Configurações, Sobre e toque sete vezes em Número da versão. Depois, em Configurações, Opções do desenvolvedor, ative a Depuração USB e o Desbloqueio de OEM. Conecte o {device} a este computador enquanto ele estiver ligado; ele reinicia no modo fastboot para o desbloqueio."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Planejado: instalação via Qualcomm EDL em qualquer computador. Ainda não disponível."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Planejado: SP Flash Tool no Windows e no Linux. Ainda não disponível."
"Planned: Windows only. Not buildable yet.": "Planejado: somente Windows. Ainda não disponível."
"Planned: fastboot install on every computer. Not buildable yet.": "Planejado: instalação via fastboot em qualquer computador. Ainda não disponível."
"Planned: microSD card install on every computer. Not buildable yet.": "Planejado: instalação por cartão microSD em qualquer computador. Ainda não disponível."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Planejado: o mesmo método de flash do RG Cube. Ainda não disponível."
"Plug in the cable with the device off": "Conecte o cabo com o dispositivo desligado"
"Preparing the partitions": "Preparando as partições"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Coloque o cartão no {device} e ligue-o. O Thimsy roda a partir do cartão e não altera o armazenamento interno do {device}: para voltar ao sistema original, desligue-o e retire o cartão."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Reinstale o Thimsy Installer ou defina THIMSY_TOOLS_DIR como uma pasta que o contenha."
"Restart into fastbootd": "Reinicie no fastbootd"
"Restart with Power": "Reinicie com o botão liga/desliga"
"Restarting the device": "Reiniciando o dispositivo"
"Slide it open, hold Back and plug in": "Deslize para abrir, segure Voltar e conecte"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Download pequeno para sistemas clássicos até o PlayStation: um núcleo rápido do RetroArch por sistema, a tela inicial Minima, sem shaders."
"Start from the microSD card": "Inicie pelo cartão microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Retire do {device} qualquer outro cartão microSD, coloque o cartão do Thimsy e ligue-o. O Thimsy roda a partir do cartão e não altera o armazenamento interno: para voltar ao sistema original, desligue-o e retire o cartão."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Retire qualquer cartão SD e segure Diminuir volume e o botão liga/desliga até o {device} reiniciar."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Retire o cartão microSD e ative a Depuração USB em Opções do desenvolvedor. Conecte o {device} a este computador enquanto ele estiver ligado. Ele reinicia no fastbootd: a tela mostra fastbootd em letras grandes e vermelhas."
"The file is damaged or a different version. Delete it and download again.": "O arquivo está danificado ou é de outra versão. Exclua-o e baixe-o novamente."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "A primeira inicialização pode levar de 1 a 3 minutos e parecer travada no logotipo da Anbernic. Isso é normal."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "A primeira inicialização leva de 1 a 3 minutos, e a tela pode parecer travada no logotipo de inicialização. Isso é normal."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "A primeira inicialização leva alguns minutos enquanto o Thimsy configura seus emuladores. Não desligue o dispositivo."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "O {device} é desbloqueado uma única vez, com a ferramenta UnlockBootloader do guia de instalação do GammaOS Next (Unisoc T820, Etapa 2): desligue o {device}, inicie a ferramenta e segure o botão Voltar enquanto conecta o cabo USB. O instalador não executa essa ferramenta por conta própria. Siga o guia e depois volte e continue."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "O {device} é desbloqueado uma única vez, com a ferramenta UnlockBootloader do guia de instalação do GammaOS Next (Unisoc T820, Etapa 2): desligue o {device}, inicie a ferramenta e segure o botão Voltar, o botão do lado direito da tela, enquanto conecta o cabo USB. O instalador não executa essa ferramenta por conta própria. Siga o guia e depois volte e continue."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "O {device} é desbloqueado uma única vez, com a ferramenta web de desbloqueio do guia de instalação do GammaOS Next (Anbernic RG405M / RG405V / RG505, Etapa 2). Reinicie o {device} no modo fastboot, abra a ferramenta no Google Chrome, clique em \"Connect\" e depois em \"Unlock\". No {device}, não pressione Diminuir volume: pressione o botão Início / Voltar para confirmar. O instalador não executa essa ferramenta por conta própria. Siga o guia e depois volte e continue."
"The {profile} profile isn't published yet. Choose a profile marked available.": "O perfil {profile} ainda não foi publicado. Escolha um perfil marcado como disponível."
"Turn on OEM unlocking": "Ative o Desbloqueio de OEM"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Desligue o {device} e desconecte o cabo. Segure o botão Voltar e o botão Anbernic ao lado dele e, ainda segurando os dois, conecte o cabo USB a este computador. Continue segurando até a instalação começar."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Desligue o {device} e desconecte o cabo. Segure o botão Voltar e, ainda segurando, conecte o cabo USB a este computador. Continue segurando até a instalação começar."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Desligue o {device} e desconecte o cabo. Segure o botão Voltar, o botão do lado direito da tela, e, ainda segurando, conecte o cabo USB a este computador. Continue segurando até a instalação começar."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Desligue o {device} completamente e desconecte o cabo. Segure Diminuir volume e Aumentar volume juntos e, ainda segurando os dois, conecte o cabo USB a este computador. Continue segurando até a instalação começar."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "Desligue o {device} completamente. Quando o instalador pedir, conecte o cabo USB a este computador."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Desligue o {device}, coloque o cartão e ligue-o. Ele se instala sozinho no armazenamento interno a partir do cartão. Não mexa nele até terminar; depois, desligue-o e retire o cartão."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Desligue o {device}, desconecte o cabo e retire todos os cartões SD. Deslize-o para abrir, segure o botão Voltar no meio do direcional e, ainda segurando, conecte o cabo USB a este computador. Continue segurando até a instalação começar."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Ligue o {device}, com a Depuração USB ainda ativada em Opções do desenvolvedor, e conecte-o a este computador. Ele reinicia sozinho e a instalação começa."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Ligue o {device}, com a Depuração USB ainda ativada em Opções do desenvolvedor, e conecte-o a este computador. Ele reinicia no modo fastboot para a instalação."
"Unlock before flashing": "Desbloqueie antes de instalar"
"Unlock with GammaOS's own steps": "Desbloquear com as etapas do GammaOS"
"Unpacking the firmware": "Descompactando o firmware"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Desconecte o cabo. Segure o botão liga/desliga e Diminuir volume por pelo menos 60 segundos e, ainda segurando, conecte o cabo USB. Continue segurando até a instalação começar; encontrar o {device} pode levar 30 segundos ou mais."
"Use a Windows PC": "Use um PC com Windows"
"Use the firmware version the catalog lists for this device.": "Use a versão de firmware indicada no catálogo para este dispositivo."
"Use the volume keys to choose Unlock, then press Power.": "Use os botões de volume para escolher \"Unlock\" e pressione o botão liga/desliga."
"Wait for the first boot": "Aguarde a primeira inicialização"
"Wait on the Anbernic logo": "Aguarde no logotipo da Anbernic"
"Wait through a blank screen": "Aguarde com a tela em branco"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Quando a instalação terminar, pressione o botão liga/desliga uma vez se o {device} não tiver reiniciado sozinho."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "Quando a tela mostrar INFO: LOCK FLAG IS: UNLOCK!!!, ele estará desbloqueado. Desconecte o cabo, verifique se o {device} está desligado e continue."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Quando a tela mostrar Unlock bootloader success!, ele estará desbloqueado. Se o {device} já mostra INFO: LOCK FLAG IS : UNLOCK!!! por um instante ao ligar, ele já foi desbloqueado antes e você pode pular o desbloqueio."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Quando o {device} pedir, pressione Aumentar volume em até 3 segundos para confirmar o desbloqueio."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Seu {device} já executa um firmware personalizado (foi desbloqueado antes). O desbloqueio será ignorado."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Seu {device} executa o firmware original. O instalador faz uma instalação limpa que apaga o dispositivo."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Seu {device} ainda executa o firmware original. O instalador orienta você no desbloqueio e depois faz uma instalação limpa que apaga o dispositivo."
"needs Android API {n}": "requer Android API {n}"
"needs Vulkan": "requer Vulkan"
"needs an ARMv8.2 CPU": "requer uma CPU ARMv8.2"
"needs {n} GB RAM": "requer {n} GB de RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "Não é possível instalar {device} a partir de {host}. Execute o Thimsy Installer em um PC com Windows para instalá-lo."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} é instalado com o PhoenixSuit da Allwinner, que só funciona no Windows. Execute o Thimsy Installer em um PC com Windows para instalá-lo."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} é instalado com o SP Flash Tool da MediaTek, que não funciona no {host}. Execute o Thimsy Installer em um PC com Windows para instalá-lo."
"{device} isn't supported by this version of the installer yet.": "{device} ainda não é compatível com esta versão do instalador."
