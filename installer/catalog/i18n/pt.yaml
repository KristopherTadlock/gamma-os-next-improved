"Start from the microSD card": "Inicie pelo cartão microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Retire do {device} qualquer outro cartão microSD, coloque o cartão do Thimsy e ligue-o. O Thimsy roda a partir do cartão e não altera o armazenamento interno: para voltar ao sistema original, desligue-o e retire o cartão."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Retire qualquer cartão SD e segure Diminuir volume e o botão liga/desliga até o {device} reiniciar."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Retire o cartão microSD e ative a Depuração USB em Opções do desenvolvedor. Conecte o {device} a este computador enquanto ele estiver ligado. Ele reinicia no fastbootd: a tela mostra fastbootd em letras grandes e vermelhas."
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "A unidade onde está a pasta de trabalho pode estar falhando. Escolha uma pasta de trabalho em outra unidade e crie o build novamente."
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "O instalador do driver não está incluído nesta versão. Instale o WinUSB para o modo de download do dispositivo com o Zadig."
"The file is damaged or a different version. Delete it and download again.": "O arquivo está danificado ou é de outra versão. Exclua-o e baixe-o novamente."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "A primeira inicialização pode levar de 1 a 3 minutos e parecer travada no logotipo da Anbernic. Isso é normal."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "A primeira inicialização leva de 1 a 3 minutos, e a tela pode parecer travada no logotipo de inicialização. Isso é normal."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "A primeira inicialização leva alguns minutos enquanto o Thimsy configura seus emuladores. Não desligue o dispositivo."
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "Não foi possível verificar o espaço livre nesta unidade. Escolha outra pasta como pasta de trabalho."
"The installer does a fresh install that erases your {device}, whatever it runs now.": "O instalador faz uma instalação limpa que apaga o seu {device}, independentemente do que ele execute agora."
"The installer runs as root, so it can open the device": "O instalador é executado como root, então pode abrir o dispositivo"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "O {device} é desbloqueado uma única vez, em um PC com Windows: a ferramenta UnlockBootloader do guia de instalação do GammaOS Next (Unisoc T820, Etapas 1 e 2) só funciona no Windows. Primeiro, instale o driver USB da Unisoc que está no UnisocTools do guia. Depois, desligue o {device} e desconecte o cabo, inicie o UnlockBootloader.bat e, em até 30 segundos, segure o botão Voltar (o botão do lado direito da tela) e, ainda segurando, conecte o cabo USB. Solte quando aparecer texto na tela. O desbloqueio apaga o {device}. O instalador não executa essa ferramenta por conta própria. Siga o guia e depois volte e continue."
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "O {device} é desbloqueado uma única vez, em um PC com Windows: a ferramenta UnlockBootloader do guia de instalação do GammaOS Next (Unisoc T820, Etapas 1 e 2) só funciona no Windows. Primeiro, instale o driver USB da Unisoc que está no UnisocTools do guia. Depois, desligue o {device} e desconecte o cabo, inicie o UnlockBootloader.bat e, em até 30 segundos, segure o botão Voltar e, ainda segurando, conecte o cabo USB. Solte quando aparecer texto na tela. O desbloqueio apaga o {device}. O instalador não executa essa ferramenta por conta própria. Siga o guia e depois volte e continue."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "O {device} é desbloqueado uma única vez, com a ferramenta web de desbloqueio do guia de instalação do GammaOS Next (Anbernic RG405M / RG405V / RG505, Etapa 2). Retire o cartão microSD, ative a Depuração USB em Opções do desenvolvedor e reinicie o {device} no modo fastboot com adb reboot bootloader: a tela mostra fastboot mode ao lado do logotipo da Anbernic. Abra a ferramenta no Google Chrome, clique em \"Connect\", escolha o dispositivo e depois clique em \"Unlock\". No {device}, não pressione Diminuir volume: pressione o botão Início / Voltar para confirmar. No Linux ou no macOS, a ferramenta unisoc-unlock do guia faz o mesmo. O desbloqueio apaga o {device}. O instalador não executa essas ferramentas por conta própria. Siga o guia e depois volte e continue."
"The {profile} profile isn't published yet. Choose a profile marked available.": "O perfil {profile} ainda não foi publicado. Escolha um perfil marcado como disponível."
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "Este dispositivo não executa um build compatível do Thimsy ou do GammaOS, então não pode ser atualizado. Use uma instalação completa (ela apaga o dispositivo)."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "O layout de partições deste dispositivo não corresponde a este firmware: é outro modelo, ou ainda roda o firmware original, que precisa ser reparticionado, algo que esta versão ainda não faz."
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "Esta unidade está formatada em FAT32, que não comporta arquivos maiores que 4 GB. Escolha uma pasta de trabalho em outra unidade (NTFS, exFAT, APFS ou ext4)."
"This version of the installer expects a different build. Build again, then install.": "Esta versão do instalador espera um build diferente. Crie o build novamente e depois instale."
"Turn it on": "Ligue-o"
"Turn on OEM unlocking": "Ative o Desbloqueio de OEM"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Desligue o {device} e desconecte o cabo. Segure o botão Voltar e o botão Anbernic ao lado dele e, ainda segurando os dois, conecte o cabo USB a este computador. Continue segurando até a instalação começar."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Desligue o {device} e desconecte o cabo. Segure o botão Voltar e, ainda segurando, conecte o cabo USB a este computador. Continue segurando até a instalação começar."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Desligue o {device} e desconecte o cabo. Segure o botão Voltar, o botão do lado direito da tela, e, ainda segurando, conecte o cabo USB a este computador. Continue segurando até a instalação começar."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Desligue o {device} completamente e desconecte o cabo. Segure Diminuir volume e Aumentar volume juntos e, ainda segurando os dois, conecte o cabo USB a este computador. Continue segurando até a instalação começar."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "Desligue o {device} completamente. Quando o instalador pedir, conecte o cabo USB a este computador e deixe-o conectado até a instalação terminar."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "Desligue o {device}, coloque o cartão e ligue-o. Ele se instala sozinho no armazenamento interno a partir do cartão, o que leva alguns minutos. Não mexa nele até que ele desligue ou reinicie sozinho; depois, retire o cartão."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Desligue o {device}, coloque o cartão e ligue-o. Ele se instala sozinho no armazenamento interno a partir do cartão. Não mexa nele até terminar; depois, desligue-o e retire o cartão."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Desligue o {device}, desconecte o cabo e retire todos os cartões SD. Deslize-o para abrir, segure o botão Voltar no meio do direcional e, ainda segurando, conecte o cabo USB a este computador. Continue segurando até a instalação começar."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Ligue o {device}, com a Depuração USB ainda ativada em Opções do desenvolvedor, e conecte-o a este computador. Ele reinicia sozinho e a instalação começa."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Ligue o {device}, com a Depuração USB ainda ativada em Opções do desenvolvedor, e conecte-o a este computador. Ele reinicia no modo fastboot para a instalação."
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "O acesso USB para {ids} ainda não está configurado. A configuração pede sua senha uma vez."
"USB access is set up for {ids}": "Acesso USB configurado para {ids}"
"Unlock before flashing": "Desbloqueie antes de instalar"
"Unlock with GammaOS's own steps": "Desbloquear com as etapas do GammaOS"
"Unpacking the firmware": "Descompactando o firmware"
"Unpacking {file}": "Descompactando {file}"
"Unplug it and turn it on": "Desconecte o cabo e ligue-o"
"Unplug the cable when it restarts": "Desconecte o cabo quando ele reiniciar"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Desconecte o cabo. Segure o botão liga/desliga e Diminuir volume por pelo menos 60 segundos e, ainda segurando, conecte o cabo USB. Continue segurando até a instalação começar; encontrar o {device} pode levar 30 segundos ou mais."
"Updating checksums": "Atualizando somas de verificação"
"Use a Windows PC": "Use um PC com Windows"
"Use the firmware version the catalog lists for this device.": "Use a versão de firmware indicada no catálogo para este dispositivo."
"Use the volume keys to choose Unlock, then press Power.": "Use os botões de volume para escolher \"Unlock\" e pressione o botão liga/desliga."
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "Aguarde a primeira inicialização"
"Wait on the Anbernic logo": "Aguarde no logotipo da Anbernic"
"Wait through a blank screen": "Aguarde com a tela em branco"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Quando a instalação terminar, pressione o botão liga/desliga uma vez se o {device} não tiver reiniciado sozinho."
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "Quando a instalação terminar, o {device} reinicia sozinho e configura o armazenamento. Desconecte o cabo nesse momento."
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "Quando a instalação terminar, desconecte o cabo e pressione o botão liga/desliga para ligar o {device}."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "Quando a tela mostrar INFO: LOCK FLAG IS: UNLOCK!!!, ele estará desbloqueado. Desconecte o cabo e verifique se o {device} está desligado (se ele reiniciar, segure o botão liga/desliga até ele desligar) e depois continue."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Quando a tela mostrar Unlock bootloader success!, ele estará desbloqueado. Se o {device} já mostra INFO: LOCK FLAG IS : UNLOCK!!! por um instante ao ligar, ele já foi desbloqueado antes e você pode pular o desbloqueio."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Quando o {device} pedir, pressione Aumentar volume em até 3 segundos para confirmar o desbloqueio."
"WinUSB is installed for {ids}": "WinUSB instalado para {ids}"
"WinUSB will be installed for {ids} the first time you flash": "O WinUSB será instalado para {ids} na primeira vez que você fizer o flash"
"Windows asks for permission next. Click Yes so the installer can give your device the USB driver it needs as soon as you connect it. Don't connect it yet.": "Em seguida, o Windows pedirá permissão. Clique em Sim para que o instalador possa atribuir ao dispositivo o driver USB de que ele precisa assim que você o conectar. Não o conecte ainda."
"Windows now gives the device the driver the installer needs. Unplug the cable and turn the device off, then repeat the download-mode steps with the same USB port.": "O Windows agora atribui ao dispositivo o driver de que o instalador precisa. Desconecte o cabo e desligue o dispositivo; depois, repita as etapas do modo de download na mesma porta USB."
"WonderSwan": "WonderSwan"
"Writing {partition}": "Gravando {partition}"
"Wrote {partition}": "{partition} gravada"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "Seu {device} já executa GammaOS ou Thimsy. Escolha como instalar o novo firmware."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Seu {device} já executa um firmware personalizado (foi desbloqueado antes). O desbloqueio será ignorado."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Seu {device} ainda executa o firmware original. O instalador orienta você no desbloqueio e depois faz uma instalação limpa que apaga o dispositivo."
"hakuX": "hakuX"
"needs Android API {n}": "requer Android API {n}"
"needs Vulkan": "requer Vulkan"
"needs an ARMv8.2 CPU": "requer uma CPU ARMv8.2"
"needs {n} GB RAM": "requer {n} GB de RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "Não é possível instalar {device} a partir de {host}. Execute o Thimsy Installer em um PC com Windows para instalá-lo."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} é instalado com o PhoenixSuit da Allwinner, que só funciona no Windows. Execute o Thimsy Installer em um PC com Windows para instalá-lo."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} é instalado com o SP Flash Tool da MediaTek, que não funciona no {host}. Execute o Thimsy Installer em um PC com Windows para instalá-lo."
"{device} isn't supported by this version of the installer yet.": "{device} ainda não é compatível com esta versão do instalador."
"{host} needs no driver": "{host} não precisa de driver"
