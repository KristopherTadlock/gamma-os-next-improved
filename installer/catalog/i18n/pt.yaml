# Portuguese translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Uma instalação limpa apaga o armazenamento interno. Copie ROMs, saves, capturas de tela e tudo o que quiser manter para o computador ou para o cartão microSD. Os jogos no cartão microSD não são alterados."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Aceite o pedido de permissão do Windows ou instale o WinUSB com o Zadig."
"Already unlocked: install new firmware": "Já desbloqueado: instalar novo firmware"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Equilibrado: RetroArch para sistemas clássicos, mais emuladores de N64, Dreamcast, PSP e DS, a tela inicial ES-DE e o Brave."
"Building Thimsy for your device": "Criando o Thimsy para o seu dispositivo"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Criado a partir da versão oficial do GammaOS Next 1.2 para o RG Cube, baixada da página do GammaOS no GitHub."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Carregue-o até pelo menos 50% antes de começar e deixe à mão o cabo que veio com ele."
"Charge the RG Cube": "Carregue o RG Cube"
"Check it's unlocked": "Verifique se está desbloqueado"
"Check the basics": "Verifique o básico"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Teste os botões, a tela sensível ao toque, o som e o Wi-Fi, e inicie um jogo."
"Check the cable and that the device is still in its flashing mode, then try again.": "Verifique o cabo e se o dispositivo ainda está no modo de flash, depois tente novamente."
"Checking the USB driver": "Verificando o driver USB"
"Checking the build": "Verificando o build"
"Checking the plan": "Verificando o plano"
"Checking the result": "Verificando o resultado"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Escolha uma pasta de trabalho em uma unidade com mais espaço livre (que não seja FAT32) ou libere espaço."
"Confirm on the device": "Confirme no dispositivo"
"Connect the device in download mode": "Conecte o dispositivo no modo de download"
"Copy your games and saves": "Copie seus jogos e saves"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Exclua a pasta \"jobs\" da pasta de trabalho e crie o build novamente; se o problema persistir, informe-o."
"Don't install on units made in March 2026 or later.": "Não instale em unidades fabricadas em março de 2026 ou depois."
"Don't install on units whose stock firmware is v1.26.": "Não instale em unidades cujo firmware original seja v1.26."
"Downloading": "Baixando"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Tudo: Médio, mais emuladores de GameCube/Wii, 3DS, PS2, Xbox e PS Vita e os núcleos de alta precisão. O conjunto completo do Thimsy 1.0a."
"Finishing": "Finalizando"
"First time installing custom firmware": "Primeira vez instalando firmware personalizado"
"Follow the unlock steps shown in the installer, then continue.": "Siga as etapas de desbloqueio mostradas no instalador e depois continue."
"Heavy": "Completo"
"Hold Volume Down and plug in the cable": "Segure Diminuir volume e conecte o cabo"
"Installing Thimsy": "Instalando o Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Mantém seus dados. Somente se o RG Cube já executar o GammaOS Next 1.2 ou um build do Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Mantém seus dados. Somente se o dispositivo já executar um build compatível do Thimsy ou do GammaOS."
"Light": "Leve"
"Medium": "Médio"
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Planejado: instalação via Qualcomm EDL em qualquer computador. Ainda não disponível."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Planejado: SP Flash Tool no Windows e no Linux. Ainda não disponível."
"Planned: Windows only. Not buildable yet.": "Planejado: somente Windows. Ainda não disponível."
"Planned: fastboot install on every computer. Not buildable yet.": "Planejado: instalação via fastboot em qualquer computador. Ainda não disponível."
"Planned: microSD card install on every computer. Not buildable yet.": "Planejado: instalação por cartão microSD em qualquer computador. Ainda não disponível."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Planejado: o mesmo método de flash do RG Cube. Ainda não disponível."
"Preparing the partitions": "Preparando as partições"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Reinstale o Thimsy Installer ou defina THIMSY_TOOLS_DIR como uma pasta que o contenha."
"Required before flashing; skipping it can brick the device.": "Obrigatório antes do flash; pular esta etapa pode inutilizar o dispositivo."
"Restarting the device": "Reiniciando o dispositivo"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Download pequeno para sistemas clássicos até o PlayStation: um núcleo rápido do RetroArch por sistema, a tela inicial Minima, sem shaders."
"The RG Cube is unlocked once, with the steps from GammaOS Next's installation guide (the Unisoc T820 section). The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "O RG Cube é desbloqueado uma única vez, com as etapas do guia de instalação do GammaOS Next (a seção Unisoc T820). O instalador não executa essa ferramenta. Siga o guia, depois volte e continue."
"The file is damaged or a different version. Delete it and download again.": "O arquivo está danificado ou é de outra versão. Exclua-o e baixe-o novamente."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "A primeira inicialização leva alguns minutos enquanto o Thimsy configura seus emuladores. Não desligue o dispositivo."
"The installer sends the unlock command; confirm it on the device with Volume Up.": "O instalador envia o comando de desbloqueio; confirme no dispositivo com Aumentar volume."
"The {profile} profile isn't published yet. Choose a profile marked available.": "O perfil {profile} ainda não foi publicado. Escolha um perfil marcado como disponível."
"Turn the RG Cube off. Hold Volume Down and connect the USB cable to this computer. Keep holding until installation starts. The screen stays black; that's normal.": "Desligue o RG Cube. Segure Diminuir volume e conecte o cabo USB a este computador. Continue segurando até a instalação começar. A tela fica preta; isso é normal."
"Unlock in fastboot": "Desbloquear no fastboot"
"Unlock with GammaOS's own steps": "Desbloquear com as etapas do GammaOS"
"Unpacking the firmware": "Descompactando o firmware"
"Use a Windows PC": "Use um PC com Windows"
"Use the firmware version the catalog lists for this device.": "Use a versão de firmware indicada no catálogo para este dispositivo."
"Use the volume keys to choose Unlock, then press Power.": "Use os botões de volume para escolher \"Unlock\" e pressione o botão liga/desliga."
"Wait for the first boot": "Aguarde a primeira inicialização"
"When the device shows LOCK FLAG IS: UNLOCK, it's unlocked. Turn it off and continue.": "Quando o dispositivo mostrar LOCK FLAG IS: UNLOCK, ele estará desbloqueado. Desligue-o e continue."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Seu {device} já executa um firmware personalizado (foi desbloqueado antes). O desbloqueio será ignorado."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Seu {device} executa o firmware original. O instalador faz uma instalação limpa que apaga o dispositivo."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Seu {device} ainda executa o firmware original. O instalador orienta você no desbloqueio e depois faz uma instalação limpa que apaga o dispositivo."
"needs Android API {n}": "requer Android API {n}"
"needs Vulkan": "requer Vulkan"
"needs an ARMv8.2 CPU": "requer uma CPU ARMv8.2"
"needs {n} GB RAM": "requer {n} GB de RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "Não é possível instalar {device} a partir de {host}. Execute o Thimsy Installer em um PC com Windows para instalá-lo."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} é instalado com o PhoenixSuit da Allwinner, que só funciona no Windows. Execute o Thimsy Installer em um PC com Windows para instalá-lo."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} é instalado com o SP Flash Tool da MediaTek, que não funciona no {host}. Execute o Thimsy Installer em um PC com Windows para instalá-lo."
"{device} isn't supported by this version of the installer yet.": "{device} ainda não é compatível com esta versão do instalador."
