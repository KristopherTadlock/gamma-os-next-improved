# Spanish translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Una instalación limpia borra el almacenamiento interno. Copia las ROMs, partidas guardadas, capturas de pantalla y todo lo que quieras conservar en tu ordenador o en la tarjeta microSD. Los juegos de la tarjeta microSD no se tocan."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Acepta la solicitud de permiso de Windows o instala WinUSB con Zadig."
"Already unlocked: install new firmware": "Ya desbloqueado: instalar el nuevo firmware"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Equilibrado: RetroArch para sistemas clásicos más emuladores de N64, Dreamcast, PSP y DS, la pantalla de inicio ES-DE y Brave."
"Building Thimsy for your device": "Creando Thimsy para tu dispositivo"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Creado a partir de la versión oficial de GammaOS Next 1.2 para la RG Cube, descargada de la página de GitHub de GammaOS."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Cárgala al menos al 50 % antes de empezar y ten a mano el cable que venía con ella."
"Charge the RG Cube": "Carga la RG Cube"
"Check it's unlocked": "Comprueba que está desbloqueada"
"Check the basics": "Comprueba lo básico"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Comprueba los botones, la pantalla táctil, el sonido y el Wi-Fi, e inicia un juego."
"Check the cable and that the device is still in its flashing mode, then try again.": "Comprueba el cable y que el dispositivo sigue en modo de flasheo, y vuelve a intentarlo."
"Checking the USB driver": "Comprobando el controlador USB"
"Checking the build": "Comprobando la compilación"
"Checking the plan": "Comprobando el plan"
"Checking the result": "Comprobando el resultado"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Elige un espacio de trabajo en una unidad con más espacio libre (que no sea FAT32) o libera espacio."
"Confirm on the device": "Confirma en el dispositivo"
"Confirm with Volume Up": "Confirma con Subir volumen"
"Connect it with USB debugging on": "Conéctalo con la depuración por USB activada"
"Connect the device in download mode": "Conecta el dispositivo en modo de descarga"
"Copy games without a card reader": "Copia los juegos sin lector de tarjetas"
"Copy your games and saves": "Copia tus juegos y partidas guardadas"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Elimina la carpeta «jobs» del espacio de trabajo y vuelve a compilar; si persiste, infórmalo."
"Don't install on units made in March 2026 or later.": "No instales en unidades fabricadas en marzo de 2026 o después."
"Don't install on units whose stock firmware is v1.26.": "No instales en unidades cuyo firmware de fábrica sea v1.26."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "No vuelvas a meter la tarjeta en un ordenador para copiar juegos: contiene un formato de Android cifrado, así que el ordenador no mostrará tu almacenamiento. Copia los juegos por transferencia de archivos USB (MTP), con ADB Explorer o desde una carpeta compartida en red."
"Download mode was never seen through WinUSB. Hold Back while you plug in the cable, and check in Device Manager or Zadig that Windows uses WinUSB for Unisoc download mode, not Unisoc's own driver.": "El modo de descarga nunca se detectó a través de WinUSB. Mantén pulsado Atrás mientras conectas el cable y comprueba en el Administrador de dispositivos o en Zadig que Windows usa WinUSB para Unisoc download mode y no el controlador propio de Unisoc."
"Downloading": "Descargando"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Todo: Medio más emuladores de GameCube/Wii, 3DS, PS2, Xbox y PS Vita y los núcleos de alta precisión. El conjunto completo de Thimsy 1.0a."
"Finishing": "Finalizando"
"First time installing custom firmware": "Primera vez que instalas un firmware personalizado"
"Follow the unlock steps shown in the installer, then continue.": "Sigue los pasos de desbloqueo que muestra el instalador y luego continúa."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "La guía de GammaOS advierte que flashear un {device} que no está desbloqueado lo inutiliza. Tras el desbloqueo, el {device} se reinicia en su Android original. Espera a que Android haya arrancado y continúa."
"Heavy": "Completo"
"Hold Back and plug in the cable": "Mantén pulsado Atrás y conecta el cable"
"Hold Back and the Anbernic button, then plug in": "Mantén pulsados Atrás y el botón Anbernic, y conecta el cable"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Mantén pulsado el botón de encendido para apagar el {device}. Mantén pulsados los dos botones de volumen y, sin soltarlos, conecta el cable USB. Después, pulsa repetidamente el botón de encendido, sin soltar los botones de volumen, hasta que empiece la instalación."
"Hold both volume buttons and plug in the cable": "Mantén pulsados los dos botones de volumen y conecta el cable"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Mantén pulsados a la vez el botón Atrás, Bajar volumen y el botón de encendido hasta que la instalación vuelva a empezar."
"If installation doesn't start": "Si la instalación no empieza"
"If installation stalls": "Si la instalación se detiene"
"If it isn't found": "Si no se detecta"
"If the screen stays black": "Si la pantalla sigue en negro"
"Install from the microSD card": "Instala desde la tarjeta microSD"
"Installing Thimsy": "Instalando Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Conserva tus datos. Solo si la RG Cube ya ejecuta GammaOS Next 1.2 o una compilación de Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Conserva tus datos. Solo si el dispositivo ya ejecuta una compilación compatible de Thimsy o GammaOS."
"Light": "Ligero"
"Medium": "Medio"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "En el primer arranque, la pantalla puede quedarse sin imagen hasta un minuto. Es normal; espera a que aparezca la pantalla de arranque."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "En el {device}, abre Ajustes, Información del teléfono y toca Número de compilación siete veces. Después, en Ajustes, Opciones para desarrolladores, activa Depuración por USB y Desbloqueo de OEM. Conecta el {device} a este ordenador mientras está encendido; se reinicia en modo fastboot para la instalación."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "En el {device}, abre Ajustes, Información del teléfono y toca Número de compilación siete veces. Después, en Ajustes, Opciones para desarrolladores, activa Depuración por USB y Desbloqueo de OEM. Conecta el {device} a este ordenador mientras está encendido; se reinicia en modo fastboot para el desbloqueo."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Previsto: instalación por Qualcomm EDL en cualquier ordenador. Aún no se puede compilar."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Previsto: SP Flash Tool en Windows y Linux. Aún no se puede compilar."
"Planned: Windows only. Not buildable yet.": "Previsto: solo Windows. Aún no se puede compilar."
"Planned: fastboot install on every computer. Not buildable yet.": "Previsto: instalación por fastboot en cualquier ordenador. Aún no se puede compilar."
"Planned: microSD card install on every computer. Not buildable yet.": "Previsto: instalación con tarjeta microSD en cualquier ordenador. Aún no se puede compilar."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Previsto: el mismo método de flasheo que la RG Cube. Aún no se puede compilar."
"Plug in the cable with the device off": "Conecta el cable con el dispositivo apagado"
"Preparing the partitions": "Preparando las particiones"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Inserta la tarjeta en el {device} y enciéndelo. Thimsy funciona desde la tarjeta y no toca el almacenamiento interno del {device}: para volver al sistema original, apágalo y saca la tarjeta."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Reinstala Thimsy Installer o configura THIMSY_TOOLS_DIR con una carpeta que lo contenga."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Reinstala Thimsy Installer: su herramienta de flasheo no es la versión que espera."
"Restart into fastbootd": "Reinicia en fastbootd"
"Restart with Power": "Reinicia con el botón de encendido"
"Restarting the device": "Reiniciando el dispositivo"
"Slide it open, hold Back and plug in": "Desliza para abrirlo, mantén pulsado Atrás y conecta el cable"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Descarga pequeña para sistemas clásicos hasta PlayStation: un núcleo rápido de RetroArch por sistema, la pantalla de inicio Minima, sin shaders."
"Start from the microSD card": "Arranca desde la tarjeta microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Saca cualquier otra tarjeta microSD del {device}, inserta la tarjeta de Thimsy y enciéndelo. Thimsy funciona desde la tarjeta y no toca el almacenamiento interno: para volver al sistema original, apágalo y saca la tarjeta."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Saca cualquier tarjeta SD y mantén pulsados Bajar volumen y el botón de encendido hasta que el {device} se reinicie."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Saca la tarjeta microSD y activa Depuración por USB en Opciones para desarrolladores. Conecta el {device} a este ordenador mientras está encendido. Se reinicia en fastbootd: la pantalla muestra fastbootd en grandes letras rojas."
"The file is damaged or a different version. Delete it and download again.": "El archivo está dañado o es de otra versión. Elimínalo y descárgalo de nuevo."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "El primer arranque puede tardar de 1 a 3 minutos y parecer atascado en el logotipo de Anbernic. Es normal."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "El primer arranque tarda de 1 a 3 minutos y la pantalla puede parecer atascada en el logotipo de arranque. Es normal."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "El primer arranque tarda unos minutos mientras Thimsy configura tus emuladores. No lo apagues."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "El {device} se desbloquea una sola vez, con la herramienta UnlockBootloader de la guía de instalación de GammaOS Next (Unisoc T820, paso 2): apaga el {device}, inicia la herramienta y mantén pulsado el botón Atrás mientras conectas el cable USB. El instalador no ejecuta esa herramienta por sí mismo. Sigue la guía y luego vuelve y continúa."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "El {device} se desbloquea una sola vez, con la herramienta UnlockBootloader de la guía de instalación de GammaOS Next (Unisoc T820, paso 2): apaga el {device}, inicia la herramienta y mantén pulsado el botón Atrás, el botón del lado derecho de la pantalla, mientras conectas el cable USB. El instalador no ejecuta esa herramienta por sí mismo. Sigue la guía y luego vuelve y continúa."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "El {device} se desbloquea una sola vez, con la herramienta web de desbloqueo de la guía de instalación de GammaOS Next (Anbernic RG405M / RG405V / RG505, paso 2). Reinicia el {device} en modo fastboot, abre la herramienta en Google Chrome y haz clic en «Connect» y después en «Unlock». En el {device}, no pulses Bajar volumen: pulsa el botón Inicio / Atrás para confirmar. El instalador no ejecuta esa herramienta por sí mismo. Sigue la guía y luego vuelve y continúa."
"The {profile} profile isn't published yet. Choose a profile marked available.": "El perfil {profile} aún no está publicado. Elige un perfil marcado como disponible."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "La distribución de particiones de este dispositivo no coincide con este firmware: es otro modelo o aún tiene el firmware original, que necesita reparticionarse, algo que esta versión todavía no puede hacer."
"This version of the installer expects a different build. Build again, then install.": "Esta versión del instalador espera una compilación distinta. Vuelve a compilar y luego instala."
"Turn on OEM unlocking": "Activa el desbloqueo de OEM"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Apaga el {device} y desconéctalo. Mantén pulsados el botón Atrás y el botón Anbernic que está a su lado y, sin soltarlos, conecta el cable USB a este ordenador. No los sueltes hasta que empiece la instalación."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Apaga el {device} y desconéctalo. Mantén pulsado el botón Atrás y, sin soltarlo, conecta el cable USB a este ordenador. No lo sueltes hasta que empiece la instalación."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Apaga el {device} y desconéctalo. Mantén pulsado el botón Atrás, el botón del lado derecho de la pantalla, y, sin soltarlo, conecta el cable USB a este ordenador. No lo sueltes hasta que empiece la instalación."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Apaga el {device} por completo y desconéctalo. Mantén pulsados a la vez Bajar volumen y Subir volumen y, sin soltarlos, conecta el cable USB a este ordenador. No los sueltes hasta que empiece la instalación."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "Apaga el {device} por completo. Cuando el instalador te lo pida, conecta el cable USB a este ordenador."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Apaga el {device}, inserta la tarjeta y enciéndelo. Se instala por sí solo en su almacenamiento interno desde la tarjeta. No lo toques hasta que termine; después, apágalo y saca la tarjeta."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Apaga el {device}, desconéctalo y saca todas las tarjetas SD. Deslízalo para abrirlo y mantén pulsado el botón Atrás del centro del joypad; sin soltarlo, conecta el cable USB a este ordenador. No lo sueltes hasta que empiece la instalación."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Enciende el {device}, con Depuración por USB todavía activada en Opciones para desarrolladores, y conéctalo a este ordenador. Se reinicia solo y empieza la instalación."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Enciende el {device}, con Depuración por USB todavía activada en Opciones para desarrolladores, y conéctalo a este ordenador. Se reinicia en modo fastboot para la instalación."
"Unlock before flashing": "Desbloquea antes de flashear"
"Unlock with GammaOS's own steps": "Desbloquear con los pasos de GammaOS"
"Unpacking the firmware": "Descomprimiendo el firmware"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Desconecta el cable. Mantén pulsados el botón de encendido y Bajar volumen durante al menos 60 segundos y, sin soltarlos, conecta el cable USB. No los sueltes hasta que empiece la instalación; detectar el {device} puede tardar 30 segundos o más."
"Use a Windows PC": "Usa un PC con Windows"
"Use the firmware version the catalog lists for this device.": "Usa la versión de firmware que indica el catálogo para este dispositivo."
"Use the volume keys to choose Unlock, then press Power.": "Usa los botones de volumen para elegir «Unlock» y pulsa el botón de encendido."
"Wait for the first boot": "Espera al primer arranque"
"Wait on the Anbernic logo": "Espera en el logotipo de Anbernic"
"Wait through a blank screen": "Espera aunque la pantalla no muestre nada"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Cuando termine la instalación, pulsa una vez el botón de encendido si el {device} no se ha reiniciado solo."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "Cuando la pantalla muestre INFO: LOCK FLAG IS: UNLOCK!!!, estará desbloqueado. Desconecta el cable, asegúrate de que el {device} está apagado y continúa."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Cuando la pantalla muestre Unlock bootloader success!, estará desbloqueado. Si el {device} ya muestra INFO: LOCK FLAG IS : UNLOCK!!! brevemente al arrancar, ya estaba desbloqueado y puedes saltarte el desbloqueo."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Cuando el {device} lo pida, pulsa Subir volumen en menos de 3 segundos para confirmar el desbloqueo."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Tu {device} ya ejecuta un firmware personalizado (ya se desbloqueó antes). Se omite el desbloqueo."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Tu {device} ejecuta su firmware original. El instalador hace una instalación limpia que borra el dispositivo."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Tu {device} aún ejecuta su firmware original. El instalador te guía para desbloquearlo y luego hace una instalación limpia que borra el dispositivo."
"needs Android API {n}": "requiere Android API {n}"
"needs Vulkan": "requiere Vulkan"
"needs an ARMv8.2 CPU": "requiere una CPU ARMv8.2"
"needs {n} GB RAM": "requiere {n} GB de RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} no se puede instalar desde {host}. Ejecuta Thimsy Installer en un PC con Windows para instalarlo."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} se instala con PhoenixSuit de Allwinner, que solo funciona en Windows. Ejecuta Thimsy Installer en un PC con Windows para instalarlo."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} se instala con SP Flash Tool de MediaTek, que no funciona en {host}. Ejecuta Thimsy Installer en un PC con Windows para instalarlo."
"{device} isn't supported by this version of the installer yet.": "Esta versión del instalador aún no es compatible con {device}."
