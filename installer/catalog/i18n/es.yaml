"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Inserta la tarjeta en el {device} y enciéndelo. Thimsy funciona desde la tarjeta y no toca el almacenamiento interno del {device}: para volver al sistema original, apágalo y saca la tarjeta."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Reinstala Thimsy Installer: su herramienta de flasheo no es la versión que espera."
"Reinstall Thimsy Installer: one of its tools is missing.": "Reinstala Thimsy Installer: falta una de sus herramientas."
"Repeat the download-mode steps and keep holding the button until installing starts, then try again.": "Repite los pasos del modo de descarga, mantén pulsado el botón hasta que empiece la instalación y vuelve a intentarlo."
"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "Repite los pasos del modo de descarga y vuelve a intentarlo. Si sigue sin detectarse, comprueba en el Administrador de dispositivos que Unisoc download mode usa el controlador WinUSB."
"Repeat the download-mode steps, then try again. If it still isn't found, unplug the cable, plug it into another USB port and try again.": "Repite los pasos del modo de descarga y vuelve a intentarlo. Si sigue sin detectarse, desconecta el cable, conéctalo a otro puerto USB y vuelve a intentarlo."
