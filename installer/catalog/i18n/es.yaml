"In Android Settings, Storage, check whether the {device} has 128 GB or 256 GB. Each size needs its own layout, and installing the wrong one can brick the {device}.": "En Ajustes de Android, Almacenamiento, comprueba si el {device} tiene 128 GB o 256 GB. Cada capacidad necesita su propia distribución, e instalar la incorrecta puede inutilizar el {device}."
