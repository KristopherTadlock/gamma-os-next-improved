# Spanish translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Una instalación limpia borra el almacenamiento interno. Copia las ROMs, partidas guardadas, capturas de pantalla y todo lo que quieras conservar en tu ordenador o en la tarjeta microSD. Los juegos de la tarjeta microSD no se tocan."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Acepta la solicitud de permiso de Windows o instala WinUSB con Zadig."
"Already unlocked: install new firmware": "Ya desbloqueado: instalar el nuevo firmware"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Equilibrado: RetroArch para sistemas clásicos más emuladores de N64, Dreamcast, PSP y DS, la pantalla de inicio ES-DE y Brave."
"Building Thimsy for your device": "Creando Thimsy para tu dispositivo"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Creado a partir de la versión oficial de GammaOS Next 1.2 para la RG Cube, descargada de la página de GitHub de GammaOS."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Cárgala al menos al 50 % antes de empezar y ten a mano el cable que venía con ella."
"Charge the RG Cube": "Carga la RG Cube"
"Check it's unlocked": "Comprueba que está desbloqueada"
"Check the basics": "Comprueba lo básico"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Comprueba los botones, la pantalla táctil, el sonido y el Wi-Fi, e inicia un juego."
"Check the cable and that the device is still in its flashing mode, then try again.": "Comprueba el cable y que el dispositivo sigue en modo de flasheo, y vuelve a intentarlo."
"Checking the USB driver": "Comprobando el controlador USB"
"Checking the build": "Comprobando la compilación"
"Checking the plan": "Comprobando el plan"
"Checking the result": "Comprobando el resultado"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Elige un espacio de trabajo en una unidad con más espacio libre (que no sea FAT32) o libera espacio."
"Confirm on the device": "Confirma en el dispositivo"
"Connect the device in download mode": "Conecta el dispositivo en modo de descarga"
"Copy your games and saves": "Copia tus juegos y partidas guardadas"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Elimina la carpeta «jobs» del espacio de trabajo y vuelve a compilar; si persiste, infórmalo."
"Don't install on units made in March 2026 or later.": "No instales en unidades fabricadas en marzo de 2026 o después."
"Don't install on units whose stock firmware is v1.26.": "No instales en unidades cuyo firmware de fábrica sea v1.26."
"Downloading": "Descargando"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Todo: Medio más emuladores de GameCube/Wii, 3DS, PS2, Xbox y PS Vita y los núcleos de alta precisión. El conjunto completo de Thimsy 1.0a."
"Finishing": "Finalizando"
"First time installing custom firmware": "Primera vez que instalas un firmware personalizado"
"Follow the unlock steps shown in the installer, then continue.": "Sigue los pasos de desbloqueo que muestra el instalador y luego continúa."
"Heavy": "Completo"
"Hold Volume Down and plug in the cable": "Mantén pulsado Bajar volumen y conecta el cable"
"Installing Thimsy": "Instalando Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Conserva tus datos. Solo si la RG Cube ya ejecuta GammaOS Next 1.2 o una compilación de Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Conserva tus datos. Solo si el dispositivo ya ejecuta una compilación compatible de Thimsy o GammaOS."
"Light": "Ligero"
"Medium": "Medio"
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Previsto: instalación por Qualcomm EDL en cualquier ordenador. Aún no se puede compilar."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Previsto: SP Flash Tool en Windows y Linux. Aún no se puede compilar."
"Planned: Windows only. Not buildable yet.": "Previsto: solo Windows. Aún no se puede compilar."
"Planned: fastboot install on every computer. Not buildable yet.": "Previsto: instalación por fastboot en cualquier ordenador. Aún no se puede compilar."
"Planned: microSD card install on every computer. Not buildable yet.": "Previsto: instalación con tarjeta microSD en cualquier ordenador. Aún no se puede compilar."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Previsto: el mismo método de flasheo que la RG Cube. Aún no se puede compilar."
"Preparing the partitions": "Preparando las particiones"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Reinstala Thimsy Installer o configura THIMSY_TOOLS_DIR con una carpeta que lo contenga."
"Required before flashing; skipping it can brick the device.": "Obligatorio antes de flashear; omitirlo puede dejar el dispositivo inservible."
"Restarting the device": "Reiniciando el dispositivo"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Descarga pequeña para sistemas clásicos hasta PlayStation: un núcleo rápido de RetroArch por sistema, la pantalla de inicio Minima, sin shaders."
"The RG Cube is unlocked once, with the steps from GammaOS Next's installation guide (the Unisoc T820 section). The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "La RG Cube se desbloquea una sola vez, con los pasos de la guía de instalación de GammaOS Next (la sección Unisoc T820). El instalador no ejecuta esa herramienta. Sigue la guía y luego vuelve aquí para continuar."
"The file is damaged or a different version. Delete it and download again.": "El archivo está dañado o es de otra versión. Elimínalo y descárgalo de nuevo."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "El primer arranque tarda unos minutos mientras Thimsy configura tus emuladores. No lo apagues."
"The installer sends the unlock command; confirm it on the device with Volume Up.": "El instalador envía el comando de desbloqueo; confírmalo en el dispositivo con Subir volumen."
"The {profile} profile isn't published yet. Choose a profile marked available.": "El perfil {profile} aún no está publicado. Elige un perfil marcado como disponible."
"Turn the RG Cube off. Hold Volume Down and connect the USB cable to this computer. Keep holding until installation starts. The screen stays black; that's normal.": "Apaga la RG Cube. Mantén pulsado Bajar volumen y conecta el cable USB a este ordenador. No lo sueltes hasta que empiece la instalación. La pantalla se queda en negro; es normal."
"Unlock in fastboot": "Desbloquear en fastboot"
"Unlock with GammaOS's own steps": "Desbloquear con los pasos de GammaOS"
"Unpacking the firmware": "Descomprimiendo el firmware"
"Use a Windows PC": "Usa un PC con Windows"
"Use the firmware version the catalog lists for this device.": "Usa la versión de firmware que indica el catálogo para este dispositivo."
"Use the volume keys to choose Unlock, then press Power.": "Usa los botones de volumen para elegir «Unlock» y pulsa el botón de encendido."
"Wait for the first boot": "Espera al primer arranque"
"When the device shows LOCK FLAG IS: UNLOCK, it's unlocked. Turn it off and continue.": "Cuando el dispositivo muestre LOCK FLAG IS: UNLOCK, estará desbloqueado. Apágalo y continúa."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Tu {device} ya ejecuta un firmware personalizado (ya se desbloqueó antes). Se omite el desbloqueo."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Tu {device} ejecuta su firmware original. El instalador hace una instalación limpia que borra el dispositivo."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Tu {device} aún ejecuta su firmware original. El instalador te guía para desbloquearlo y luego hace una instalación limpia que borra el dispositivo."
"needs Android API {n}": "requiere Android API {n}"
"needs Vulkan": "requiere Vulkan"
"needs an ARMv8.2 CPU": "requiere una CPU ARMv8.2"
"needs {n} GB RAM": "requiere {n} GB de RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} no se puede instalar desde {host}. Ejecuta Thimsy Installer en un PC con Windows para instalarlo."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} se instala con PhoenixSuit de Allwinner, que solo funciona en Windows. Ejecuta Thimsy Installer en un PC con Windows para instalarlo."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} se instala con SP Flash Tool de MediaTek, que no funciona en {host}. Ejecuta Thimsy Installer en un PC con Windows para instalarlo."
"{device} isn't supported by this version of the installer yet.": "Esta versión del instalador aún no es compatible con {device}."
