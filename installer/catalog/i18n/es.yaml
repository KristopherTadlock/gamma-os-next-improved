"Slide it open, hold Back and plug in": "Desliza para abrirlo, mantén pulsado Atrás y conecta el cable"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Descarga pequeña para sistemas clásicos hasta PlayStation: un núcleo rápido de RetroArch por sistema, la pantalla de inicio Minima, sin shaders."
"Start from the microSD card": "Arranca desde la tarjeta microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Saca cualquier otra tarjeta microSD del {device}, inserta la tarjeta de Thimsy y enciéndelo. Thimsy funciona desde la tarjeta y no toca el almacenamiento interno: para volver al sistema original, apágalo y saca la tarjeta."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Saca cualquier tarjeta SD y mantén pulsados Bajar volumen y el botón de encendido hasta que el {device} se reinicie."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Saca la tarjeta microSD y activa Depuración por USB en Opciones para desarrolladores. Conecta el {device} a este ordenador mientras está encendido. Se reinicia en fastbootd: la pantalla muestra fastbootd en grandes letras rojas."
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "Es posible que la unidad donde está el espacio de trabajo esté fallando. Elige un espacio de trabajo en otra unidad y vuelve a compilar."
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "El instalador del controlador no está incluido en esta compilación. Instala WinUSB para el modo de descarga del dispositivo con Zadig."
"The file is damaged or a different version. Delete it and download again.": "El archivo está dañado o es de otra versión. Elimínalo y descárgalo de nuevo."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "El primer arranque puede tardar de 1 a 3 minutos y parecer atascado en el logotipo de Anbernic. Es normal."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "El primer arranque tarda de 1 a 3 minutos y la pantalla puede parecer atascada en el logotipo de arranque. Es normal."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "El primer arranque tarda unos minutos mientras Thimsy configura tus emuladores. No lo apagues."
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "No se pudo comprobar el espacio libre de esta unidad. Elige otra carpeta para el espacio de trabajo."
"The installer does a fresh install that erases your {device}, whatever it runs now.": "El instalador hace una instalación limpia que borra tu {device}, ejecute lo que ejecute ahora."
"The installer runs as root, so it can open the device": "El instalador se ejecuta como root, así que puede abrir el dispositivo"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "El {device} se desbloquea una sola vez, en un PC con Windows: la herramienta UnlockBootloader de la guía de instalación de GammaOS Next (Unisoc T820, pasos 1 y 2) solo funciona en Windows. Primero instala el controlador USB de Unisoc desde UnisocTools de la guía. Después apaga el {device} y desconéctalo, inicia UnlockBootloader.bat y, en menos de 30 segundos, mantén pulsado el botón Atrás (el botón del lado derecho de la pantalla) y, sin soltarlo, conecta el cable USB. Suéltalo cuando aparezca texto en la pantalla. El desbloqueo borra el {device}. El instalador no ejecuta esa herramienta por sí mismo. Sigue la guía y luego vuelve y continúa."
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "El {device} se desbloquea una sola vez, en un PC con Windows: la herramienta UnlockBootloader de la guía de instalación de GammaOS Next (Unisoc T820, pasos 1 y 2) solo funciona en Windows. Primero instala el controlador USB de Unisoc desde UnisocTools de la guía. Después apaga el {device} y desconéctalo, inicia UnlockBootloader.bat y, en menos de 30 segundos, mantén pulsado el botón Atrás y, sin soltarlo, conecta el cable USB. Suéltalo cuando aparezca texto en la pantalla. El desbloqueo borra el {device}. El instalador no ejecuta esa herramienta por sí mismo. Sigue la guía y luego vuelve y continúa."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "El {device} se desbloquea una sola vez, con la herramienta web de desbloqueo de la guía de instalación de GammaOS Next (Anbernic RG405M / RG405V / RG505, paso 2). Saca la tarjeta microSD, activa Depuración por USB en Opciones para desarrolladores y reinicia el {device} en modo fastboot con adb reboot bootloader: la pantalla muestra fastboot mode junto al logotipo de Anbernic. Abre la herramienta en Google Chrome, haz clic en «Connect», elige el dispositivo y después haz clic en «Unlock». En el {device}, no pulses Bajar volumen: pulsa el botón Inicio / Atrás para confirmar. En Linux o macOS, la herramienta unisoc-unlock de la guía hace lo mismo. El desbloqueo borra el {device}. El instalador no ejecuta estas herramientas por sí mismo. Sigue la guía y luego vuelve y continúa."
"The {profile} profile isn't published yet. Choose a profile marked available.": "El perfil {profile} aún no está publicado. Elige un perfil marcado como disponible."
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "Este dispositivo no ejecuta una compilación compatible de Thimsy o GammaOS, así que no se puede actualizar. Usa en su lugar una instalación completa (borra el dispositivo)."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "La distribución de particiones de este dispositivo no coincide con este firmware: es otro modelo o aún tiene el firmware original, que necesita reparticionarse, algo que esta versión todavía no puede hacer."
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "Esta unidad está formateada como FAT32, que no admite archivos de más de 4 GB. Elige un espacio de trabajo en otra unidad (NTFS, exFAT, APFS o ext4)."
"This version of the installer expects a different build. Build again, then install.": "Esta versión del instalador espera una compilación distinta. Vuelve a compilar y luego instala."
"Turn it on": "Enciéndelo"
"Turn on OEM unlocking": "Activa el desbloqueo de OEM"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Apaga el {device} y desconéctalo. Mantén pulsados el botón Atrás y el botón Anbernic que está a su lado y, sin soltarlos, conecta el cable USB a este ordenador. No los sueltes hasta que empiece la instalación."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Apaga el {device} y desconéctalo. Mantén pulsado el botón Atrás y, sin soltarlo, conecta el cable USB a este ordenador. No lo sueltes hasta que empiece la instalación."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Apaga el {device} y desconéctalo. Mantén pulsado el botón Atrás, el botón del lado derecho de la pantalla, y, sin soltarlo, conecta el cable USB a este ordenador. No lo sueltes hasta que empiece la instalación."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Apaga el {device} por completo y desconéctalo. Mantén pulsados a la vez Bajar volumen y Subir volumen y, sin soltarlos, conecta el cable USB a este ordenador. No los sueltes hasta que empiece la instalación."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "Apaga el {device} por completo. Cuando el instalador te lo pida, conecta el cable USB a este ordenador y déjalo conectado hasta que termine la instalación."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "Apaga el {device}, inserta la tarjeta y enciéndelo. Se instala por sí solo en su almacenamiento interno desde la tarjeta, lo que tarda unos minutos. No lo toques hasta que se apague o se reinicie solo; después, saca la tarjeta."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Apaga el {device}, inserta la tarjeta y enciéndelo. Se instala por sí solo en su almacenamiento interno desde la tarjeta. No lo toques hasta que termine; después, apágalo y saca la tarjeta."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Apaga el {device}, desconéctalo y saca todas las tarjetas SD. Deslízalo para abrirlo y mantén pulsado el botón Atrás del centro del joypad; sin soltarlo, conecta el cable USB a este ordenador. No lo sueltes hasta que empiece la instalación."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Enciende el {device}, con Depuración por USB todavía activada en Opciones para desarrolladores, y conéctalo a este ordenador. Se reinicia solo y empieza la instalación."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Enciende el {device}, con Depuración por USB todavía activada en Opciones para desarrolladores, y conéctalo a este ordenador. Se reinicia en modo fastboot para la instalación."
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "El acceso USB para {ids} aún no está configurado. Al configurarlo se te pedirá la contraseña una vez."
"USB access is set up for {ids}": "El acceso USB está configurado para {ids}"
"Unlock before flashing": "Desbloquea antes de flashear"
"Unlock with GammaOS's own steps": "Desbloquear con los pasos de GammaOS"
"Unpacking the firmware": "Descomprimiendo el firmware"
"Unpacking {file}": "Descomprimiendo {file}"
"Unplug it and turn it on": "Desconéctalo y enciéndelo"
"Unplug the cable when it restarts": "Desconecta el cable cuando se reinicie"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Desconecta el cable. Mantén pulsados el botón de encendido y Bajar volumen durante al menos 60 segundos y, sin soltarlos, conecta el cable USB. No los sueltes hasta que empiece la instalación; detectar el {device} puede tardar 30 segundos o más."
"Updating checksums": "Actualizando sumas de comprobación"
"Use a Windows PC": "Usa un PC con Windows"
"Use the firmware version the catalog lists for this device.": "Usa la versión de firmware que indica el catálogo para este dispositivo."
"Use the volume keys to choose Unlock, then press Power.": "Usa los botones de volumen para elegir «Unlock» y pulsa el botón de encendido."
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "Espera al primer arranque"
"Wait on the Anbernic logo": "Espera en el logotipo de Anbernic"
"Wait through a blank screen": "Espera aunque la pantalla no muestre nada"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Cuando termine la instalación, pulsa una vez el botón de encendido si el {device} no se ha reiniciado solo."
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "Cuando termine la instalación, el {device} se reinicia solo y prepara su almacenamiento. Desconecta entonces el cable."
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "Cuando termine la instalación, desconecta el cable y pulsa el botón de encendido para encender el {device}."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "Cuando la pantalla muestre INFO: LOCK FLAG IS: UNLOCK!!!, estará desbloqueado. Desconecta el cable y asegúrate de que el {device} está apagado (si se reinicia, mantén pulsado el botón de encendido hasta que se apague); después, continúa."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Cuando la pantalla muestre Unlock bootloader success!, estará desbloqueado. Si el {device} ya muestra INFO: LOCK FLAG IS : UNLOCK!!! brevemente al arrancar, ya estaba desbloqueado y puedes saltarte el desbloqueo."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Cuando el {device} lo pida, pulsa Subir volumen en menos de 3 segundos para confirmar el desbloqueo."
"WinUSB is installed for {ids}": "WinUSB está instalado para {ids}"
"WinUSB will be installed for {ids} the first time you flash": "WinUSB se instalará para {ids} la primera vez que flashees"
"Windows now gives the device the driver the installer needs. Unplug the cable and turn the device off, then repeat the download-mode steps with the same USB port.": "Windows ya asigna al dispositivo el controlador que necesita el instalador. Desconecta el cable y apaga el dispositivo; después, repite los pasos del modo de descarga en el mismo puerto USB."
"WonderSwan": "WonderSwan"
"Writing {partition}": "Escribiendo {partition}"
"Wrote {partition}": "Partición {partition} escrita"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "Tu {device} ya ejecuta GammaOS o Thimsy. Elige cómo instalar el nuevo firmware."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Tu {device} ya ejecuta un firmware personalizado (ya se desbloqueó antes). Se omite el desbloqueo."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Tu {device} aún ejecuta su firmware original. El instalador te guía para desbloquearlo y luego hace una instalación limpia que borra el dispositivo."
"hakuX": "hakuX"
"needs Android API {n}": "requiere Android API {n}"
"needs Vulkan": "requiere Vulkan"
"needs an ARMv8.2 CPU": "requiere una CPU ARMv8.2"
"needs {n} GB RAM": "requiere {n} GB de RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} no se puede instalar desde {host}. Ejecuta Thimsy Installer en un PC con Windows para instalarlo."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} se instala con PhoenixSuit de Allwinner, que solo funciona en Windows. Ejecuta Thimsy Installer en un PC con Windows para instalarlo."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} se instala con SP Flash Tool de MediaTek, que no funciona en {host}. Ejecuta Thimsy Installer en un PC con Windows para instalarlo."
"{device} isn't supported by this version of the installer yet.": "Esta versión del instalador aún no es compatible con {device}."
"{host} needs no driver": "{host} no necesita controlador"
