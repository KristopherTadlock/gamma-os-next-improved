"In Android Settings, Storage, check whether the {device} has 128 GB or 256 GB. Each size needs its own layout, and installing the wrong one can brick the {device}.": "Tarkista Androidin kohdasta Asetukset, Tallennustila, onko {device}-laitteessa 128 GB vai 256 GB. Kumpikin koko tarvitsee oman osiointinsa, ja väärän asentaminen voi tehdä {device}-laitteesta käyttökelvottoman."
"In Settings, Handheld Settings, About Device, Device Information, note the first four characters of the SN (MQ65 or MQ66). Each hardware revision needs its own firmware.": "Katso kohdasta Asetukset, Käsikonsolin asetukset, Tietoja laitteesta, Laitteen tiedot SN:n neljä ensimmäistä merkkiä (MQ65 tai MQ66) ja kirjoita ne muistiin. Jokainen laitteistoversio tarvitsee oman laiteohjelmistonsa."
