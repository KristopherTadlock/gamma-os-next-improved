"Preparing the partitions": "Valmistellaan osioita"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Laita kortti {device}-laitteeseen ja käynnistä se. Thimsy toimii kortilta eikä koske {device}-laitteen sisäiseen tallennustilaan: palaa alkuperäiseen järjestelmään sammuttamalla laite ja poistamalla kortti."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Asenna Thimsy Installer uudelleen: sen flash-työkalu ei ole odotettu versio."
"Reinstall Thimsy Installer: one of its tools is missing.": "Asenna Thimsy Installer uudelleen: yksi sen työkaluista puuttuu."
"Repeat the download-mode steps and keep holding the button until installing starts, then try again.": "Toista latausmoodin vaiheet, pidä painiketta painettuna, kunnes asennus alkaa, ja yritä sitten uudelleen."
"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "Toista latausmoodin vaiheet ja yritä sitten uudelleen. Jos laitetta ei vieläkään löydy, tarkista Laitehallinnasta, että Unisoc download mode käyttää WinUSB-ajuria."
