# Finnish translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Puhdas asennus tyhjentää sisäisen tallennustilan. Kopioi ROMs-tiedostot, tallennukset, kuvakaappaukset ja kaikki muu, mitä haluat säilyttää, tietokoneelle tai microSD-kortille. microSD-kortin peleihin ei kosketa."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Hyväksy Windowsin käyttöoikeuskysely tai asenna WinUSB Zadigilla."
"Already unlocked: install new firmware": "Jo avattu: asenna uusi laiteohjelmisto"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Tasapainoinen: RetroArch klassisille järjestelmille sekä N64-, Dreamcast-, PSP- ja DS-emulaattorit, ES-DE-aloitusnäkymä ja Brave."
"Building Thimsy for your device": "Thimsyä rakennetaan laitteellesi"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Rakennettu RG Cuben virallisesta GammaOS Next 1.2 -julkaisusta, joka on ladattu GammaOS:n GitHub-sivulta."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Lataa akku vähintään 50 %:iin ennen aloittamista ja pidä mukana tullut kaapeli käden ulottuvilla."
"Charge the RG Cube": "Lataa RG Cube"
"Check it's unlocked": "Tarkista, että lukitus on avattu"
"Check the basics": "Tarkista perusasiat"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Tarkista painikkeet, kosketusnäyttö, ääni ja Wi-Fi ja käynnistä peli."
"Check the cable and that the device is still in its flashing mode, then try again.": "Tarkista kaapeli ja että laite on yhä flash-tilassa, ja yritä sitten uudelleen."
"Checking the USB driver": "Tarkistetaan USB-ajuria"
"Checking the build": "Tarkistetaan koontiversiota"
"Checking the plan": "Tarkistetaan suunnitelmaa"
"Checking the result": "Tarkistetaan tulosta"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Valitse työtila asemalta, jolla on enemmän vapaata tilaa (ei FAT32), tai vapauta tilaa."
"Confirm on the device": "Vahvista laitteella"
"Confirm with Volume Up": "Vahvista äänenvoimakkuuden lisäyspainikkeella"
"Connect it with USB debugging on": "Liitä laite USB-virheenkorjaus päällä"
"Connect the device in download mode": "Yhdistä laite lataustilassa"
"Copy games without a card reader": "Kopioi pelit ilman kortinlukijaa"
"Copy your games and saves": "Kopioi pelisi ja tallennuksesi"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Poista työtilan jobs-kansio ja rakenna uudelleen; ilmoita ongelmasta, jos se jatkuu."
"Don't install on units made in March 2026 or later.": "Älä asenna laitteisiin, jotka on valmistettu maaliskuussa 2026 tai myöhemmin."
"Don't install on units whose stock firmware is v1.26.": "Älä asenna laitteisiin, joiden alkuperäinen laiteohjelmisto on v1.26."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "Älä laita korttia takaisin tietokoneeseen pelien kopiointia varten: kortilla on salattu Android-osiointi, joten tietokone ei näytä tallennustilaasi. Kopioi pelit sen sijaan USB-tiedostonsiirrolla (MTP), ADB Explorerilla tai verkkojaosta."
"Download mode was never seen through WinUSB. Hold Back while you plug in the cable, and check in Device Manager or Zadig that Windows uses WinUSB for Unisoc download mode, not Unisoc's own driver.": "Latausmoodia ei koskaan havaittu WinUSB:n kautta. Pidä Takaisin-painiketta painettuna, kun kytket kaapelin, ja tarkista Laitehallinnasta tai Zadigista, että Windows käyttää Unisoc download moden kanssa WinUSB:tä eikä Unisocin omaa ajuria."
"Downloading": "Ladataan"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Kaikki: Keskitaso sekä GameCube/Wii-, 3DS-, PS2-, Xbox- ja PS Vita -emulaattorit ja tarkat ytimet. Koko Thimsy 1.0a -kokoelma."
"Finishing": "Viimeistellään"
"First time installing custom firmware": "Ensimmäinen kerta mukautetun laiteohjelmiston asennuksessa"
"Follow the unlock steps shown in the installer, then continue.": "Noudata asennusohjelman näyttämiä lukituksen avausohjeita ja jatka sitten."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "GammaOS:n ohjeen mukaan {device}-laite menee käyttökelvottomaksi, jos se flashataan ilman lukituksen avaamista. Lukituksen avaamisen jälkeen {device}-laite käynnistyy uudelleen alkuperäiseen Androidiinsa. Odota, kunnes Android on käynnistynyt, ja jatka sitten."
"Heavy": "Raskas"
"Hold Back and plug in the cable": "Pidä Takaisin-painiketta painettuna ja kytke kaapeli"
"Hold Back and the Anbernic button, then plug in": "Pidä Takaisin- ja Anbernic-painiketta painettuina ja kytke kaapeli"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Sammuta {device}-laite pitämällä virtapainiketta painettuna. Pidä molempia äänenvoimakkuuspainikkeita painettuina ja kytke USB-kaapeli niitä päästämättä. Paina sitten virtapainiketta toistuvasti äänenvoimakkuuspainikkeet yhä painettuina, kunnes asennus alkaa."
"Hold both volume buttons and plug in the cable": "Pidä molempia äänenvoimakkuuspainikkeita painettuina ja kytke kaapeli"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Pidä Takaisin-painiketta, äänenvoimakkuuden vähennyspainiketta ja virtapainiketta painettuina yhtä aikaa, kunnes asennus alkaa uudelleen."
"If installation doesn't start": "Jos asennus ei ala"
"If installation stalls": "Jos asennus pysähtyy"
"If it isn't found": "Jos laitetta ei löydy"
"If the screen stays black": "Jos näyttö pysyy mustana"
"Install from the microSD card": "Asenna microSD-kortilta"
"Installing Thimsy": "Asennetaan Thimsyä"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Säilyttää tietosi. Vain jos RG Cubessa on jo GammaOS Next 1.2 tai Thimsy-koontiversio."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Säilyttää tietosi. Vain jos laitteessa on jo yhteensopiva Thimsy- tai GammaOS-koontiversio."
"Light": "Kevyt"
"Medium": "Keskitaso"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "Aivan ensimmäisellä käynnistyskerralla näyttö voi pysyä tyhjänä jopa minuutin. Tämä on normaalia; odota, että käynnistysnäyttö tulee näkyviin."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "Avaa {device}-laitteessa Asetukset, Tietoja puhelimesta ja napauta Koontiversion numeroa seitsemän kertaa. Ota sitten kohdassa Asetukset, Kehittäjäasetukset käyttöön USB-virheenkorjaus ja OEM-lukituksen avaus. Kytke {device}-laite tähän tietokoneeseen sen ollessa päällä; se käynnistyy uudelleen fastboot-tilaan asennusta varten."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "Avaa {device}-laitteessa Asetukset, Tietoja puhelimesta ja napauta Koontiversion numeroa seitsemän kertaa. Ota sitten kohdassa Asetukset, Kehittäjäasetukset käyttöön USB-virheenkorjaus ja OEM-lukituksen avaus. Kytke {device}-laite tähän tietokoneeseen sen ollessa päällä; se käynnistyy uudelleen fastboot-tilaan lukituksen avaamista varten."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Suunnitteilla: asennus Qualcomm EDL:llä millä tahansa tietokoneella. Ei vielä rakennettavissa."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Suunnitteilla: SP Flash Tool Windowsissa ja Linuxissa. Ei vielä rakennettavissa."
"Planned: Windows only. Not buildable yet.": "Suunnitteilla: vain Windows. Ei vielä rakennettavissa."
"Planned: fastboot install on every computer. Not buildable yet.": "Suunnitteilla: asennus fastbootilla millä tahansa tietokoneella. Ei vielä rakennettavissa."
"Planned: microSD card install on every computer. Not buildable yet.": "Suunnitteilla: asennus microSD-kortilla millä tahansa tietokoneella. Ei vielä rakennettavissa."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Suunnitteilla: sama flash-tapa kuin RG Cubessa. Ei vielä rakennettavissa."
"Plug in the cable with the device off": "Kytke kaapeli laitteen ollessa sammutettuna"
"Preparing the partitions": "Valmistellaan osioita"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Laita kortti {device}-laitteeseen ja käynnistä se. Thimsy toimii kortilta eikä koske {device}-laitteen sisäiseen tallennustilaan: palaa alkuperäiseen järjestelmään sammuttamalla laite ja poistamalla kortti."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Asenna Thimsy Installer uudelleen tai aseta THIMSY_TOOLS_DIR osoittamaan kansioon, joka sisältää sen."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Asenna Thimsy Installer uudelleen: sen flash-työkalu ei ole odotettu versio."
"Restart into fastbootd": "Käynnistä uudelleen fastbootd-tilaan"
"Restart with Power": "Käynnistä uudelleen virtapainikkeella"
"Restarting the device": "Käynnistetään laite uudelleen"
"Slide it open, hold Back and plug in": "Liu'uta auki, pidä Takaisin-painiketta painettuna ja kytke kaapeli"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Pieni lataus klassisille järjestelmille PlayStationiin asti: yksi nopea RetroArch-ydin järjestelmää kohden, Minima-aloitusnäkymä, ei varjostimia."
"Start from the microSD card": "Käynnistä microSD-kortilta"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Poista {device}-laitteesta muut microSD-kortit, laita Thimsy-kortti paikalleen ja käynnistä laite. Thimsy toimii kortilta eikä koske sisäiseen tallennustilaan: palaa alkuperäiseen järjestelmään sammuttamalla laite ja poistamalla kortti."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Poista mahdollinen SD-kortti ja pidä sitten äänenvoimakkuuden vähennyspainiketta ja virtapainiketta painettuina, kunnes {device}-laite käynnistyy uudelleen."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Poista microSD-kortti ja ota USB-virheenkorjaus käyttöön Kehittäjäasetuksissa. Kytke {device}-laite tähän tietokoneeseen sen ollessa päällä. Se käynnistyy uudelleen fastbootd-tilaan: näytössä lukee fastbootd suurella punaisella tekstillä."
"The file is damaged or a different version. Delete it and download again.": "Tiedosto on vioittunut tai eri versio. Poista se ja lataa uudelleen."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Ensimmäinen käynnistys voi kestää 1–3 minuuttia ja näyttää jumittuvan Anbernic-logoon. Tämä on normaalia."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Ensimmäinen käynnistys kestää 1–3 minuuttia, ja näyttö voi näyttää jumittuvan käynnistyslogoon. Tämä on normaalia."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Ensimmäinen käynnistys kestää muutaman minuutin, kun Thimsy määrittää emulaattorisi. Älä sammuta laitetta."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device}-laitteen lukitus avataan kerran GammaOS Nextin asennusohjeen UnlockBootloader-työkalulla (Unisoc T820, vaihe 2): sammuta {device}-laite, käynnistä työkalu ja pidä sitten Takaisin-painiketta painettuna, kun kytket USB-kaapelin. Asennusohjelma ei itse suorita työkalua. Seuraa ohjetta, palaa sitten tänne ja jatka."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device}-laitteen lukitus avataan kerran GammaOS Nextin asennusohjeen UnlockBootloader-työkalulla (Unisoc T820, vaihe 2): sammuta {device}-laite, käynnistä työkalu ja pidä sitten Takaisin-painiketta, näytön oikealla puolella olevaa painiketta, painettuna, kun kytket USB-kaapelin. Asennusohjelma ei itse suorita työkalua. Seuraa ohjetta, palaa sitten tänne ja jatka."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device}-laitteen lukitus avataan kerran GammaOS Nextin asennusohjeen verkkotyökalulla (Anbernic RG405M / RG405V / RG505, vaihe 2). Käynnistä {device}-laite uudelleen fastboot-tilaan, avaa työkalu Google Chromessa ja napsauta ”Connect” ja sitten ”Unlock”. Älä paina {device}-laitteessa äänenvoimakkuuden vähennyspainiketta, vaan vahvista painamalla Aloitus- / Takaisin-painiketta. Asennusohjelma ei itse suorita työkalua. Seuraa ohjetta, palaa sitten tänne ja jatka."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Profiilia {profile} ei ole vielä julkaistu. Valitse profiili, joka on merkitty saatavilla olevaksi."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "Laitteen osiorakenne ei vastaa tätä laiteohjelmistoa: kyseessä on eri malli, tai siinä on yhä alkuperäinen laiteohjelmisto, joka pitää osioida uudelleen, mihin tämä versio ei vielä pysty."
"This version of the installer expects a different build. Build again, then install.": "Tämä asennusohjelman versio odottaa eri koontiversiota. Rakenna uudelleen ja asenna sitten."
"Turn on OEM unlocking": "Ota OEM-lukituksen avaus käyttöön"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Sammuta {device}-laite ja irrota kaapeli. Pidä Takaisin-painiketta ja sen vieressä olevaa Anbernic-painiketta painettuina ja kytke USB-kaapeli tähän tietokoneeseen niitä päästämättä. Pidä painettuna, kunnes asennus alkaa."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Sammuta {device}-laite ja irrota kaapeli. Pidä Takaisin-painiketta painettuna ja kytke USB-kaapeli tähän tietokoneeseen sitä päästämättä. Pidä painettuna, kunnes asennus alkaa."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Sammuta {device}-laite ja irrota kaapeli. Pidä Takaisin-painiketta, näytön oikealla puolella olevaa painiketta, painettuna ja kytke USB-kaapeli tähän tietokoneeseen sitä päästämättä. Pidä painettuna, kunnes asennus alkaa."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Sammuta {device}-laite kokonaan ja irrota kaapeli. Pidä äänenvoimakkuuden vähennys- ja lisäyspainiketta painettuina yhtä aikaa ja kytke USB-kaapeli tähän tietokoneeseen niitä päästämättä. Pidä painettuna, kunnes asennus alkaa."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "Sammuta {device}-laite kokonaan. Kun asennusohjelma pyytää, kytke USB-kaapeli tähän tietokoneeseen."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Sammuta {device}-laite, laita kortti paikalleen ja käynnistä laite. Se asentuu kortilta sisäiseen tallennustilaansa itsestään. Anna sen olla, kunnes se on valmis, ja sammuta se sitten ja poista kortti."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Sammuta {device}-laite, irrota kaapeli ja poista kaikki SD-kortit. Liu'uta laite auki, pidä sitten joypadin keskellä olevaa Takaisin-painiketta painettuna ja kytke USB-kaapeli tähän tietokoneeseen sitä päästämättä. Pidä painettuna, kunnes asennus alkaa."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Käynnistä {device}-laite USB-virheenkorjaus yhä päällä Kehittäjäasetuksissa ja kytke se tähän tietokoneeseen. Se käynnistyy uudelleen itsestään ja asennus alkaa."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Käynnistä {device}-laite USB-virheenkorjaus yhä päällä Kehittäjäasetuksissa ja kytke se tähän tietokoneeseen. Se käynnistyy uudelleen fastboot-tilaan asennusta varten."
"Unlock before flashing": "Avaa lukitus ennen flashausta"
"Unlock with GammaOS's own steps": "Avaa lukitus GammaOS:n omilla ohjeilla"
"Unpacking the firmware": "Puretaan laiteohjelmistoa"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Irrota kaapeli. Pidä virtapainiketta ja äänenvoimakkuuden vähennyspainiketta painettuina vähintään 60 sekuntia ja kytke sitten USB-kaapeli niitä päästämättä. Pidä painettuna, kunnes asennus alkaa; {device}-laitteen löytyminen voi kestää 30 sekuntia tai kauemmin."
"Use a Windows PC": "Käytä Windows-tietokonetta"
"Use the firmware version the catalog lists for this device.": "Käytä laiteohjelmistoversiota, jonka luettelo ilmoittaa tälle laitteelle."
"Use the volume keys to choose Unlock, then press Power.": "Valitse äänenvoimakkuuspainikkeilla ”Unlock” ja paina sitten virtapainiketta."
"Wait for the first boot": "Odota ensimmäistä käynnistystä"
"Wait on the Anbernic logo": "Odota Anbernic-logon kohdalla"
"Wait through a blank screen": "Odota, vaikka näyttö on tyhjä"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Kun asennus on valmis, paina virtapainiketta kerran, jos {device}-laite ei ole käynnistynyt uudelleen itsestään."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "Kun näytössä lukee INFO: LOCK FLAG IS: UNLOCK!!!, lukitus on avattu. Irrota kaapeli, varmista, että {device}-laite on sammutettu, ja jatka."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Kun näytössä lukee Unlock bootloader success!, lukitus on avattu. Jos {device}-laite näyttää jo käynnistyessään hetken tekstin INFO: LOCK FLAG IS : UNLOCK!!!, sen lukitus on avattu aiemmin ja voit ohittaa lukituksen avaamisen."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Kun {device}-laite kysyy, vahvista lukituksen avaus painamalla äänenvoimakkuuden lisäyspainiketta 3 sekunnin kuluessa."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "{device}-laitteessasi on jo mukautettu laiteohjelmisto (sen lukitus on avattu aiemmin). Lukituksen avaus ohitetaan."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "{device}-laitteessasi on alkuperäinen laiteohjelmisto. Asennusohjelma tekee puhtaan asennuksen, joka tyhjentää laitteen."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "{device}-laitteessasi on yhä alkuperäinen laiteohjelmisto. Asennusohjelma opastaa sinut lukituksen avaamisessa ja tekee sitten puhtaan asennuksen, joka tyhjentää laitteen."
"needs Android API {n}": "vaatii Android API {n}"
"needs Vulkan": "vaatii Vulkanin"
"needs an ARMv8.2 CPU": "vaatii ARMv8.2-suorittimen"
"needs {n} GB RAM": "vaatii {n} Gt RAM-muistia"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "Laitetta {device} ei voi asentaa käyttöjärjestelmästä {host}. Asenna se suorittamalla Thimsy Installer Windows-tietokoneella."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} asennetaan Allwinnerin PhoenixSuitilla, joka toimii vain Windowsissa. Asenna se suorittamalla Thimsy Installer Windows-tietokoneella."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} asennetaan MediaTekin SP Flash Toolilla, joka ei toimi käyttöjärjestelmässä {host}. Asenna se suorittamalla Thimsy Installer Windows-tietokoneella."
"{device} isn't supported by this version of the installer yet.": "Tämä asennusohjelman versio ei vielä tue laitetta {device}."
