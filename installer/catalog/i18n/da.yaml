"In Android Settings, Storage, check whether the {device} has 128 GB or 256 GB. Each size needs its own layout, and installing the wrong one can brick the {device}.": "Tjek under Indstillinger, Lagerplads i Android, om {device} har 128 GB eller 256 GB. Hver størrelse kræver sit eget layout, og hvis du installerer det forkerte, kan {device} blive ødelagt."
"In Settings, Handheld Settings, About Device, Device Information, note the first four characters of the SN (MQ65 or MQ66). Each hardware revision needs its own firmware.": "Notér de første fire tegn i SN (MQ65 eller MQ66) under Indstillinger, Håndholdt-indstillinger, Om enheden, Enhedsoplysninger. Hver hardwarerevision kræver sin egen firmware."
"Inside the device pack.": "Findes i enhedspakken."
"Install from the microSD card": "Installér fra microSD-kortet"
