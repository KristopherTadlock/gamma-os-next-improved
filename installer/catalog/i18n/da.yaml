"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Hold afbryderknappen inde for at slukke {device}. Hold begge lydstyrkeknapper inde, og tilslut USB-kablet, mens du stadig holder dem. Tryk derefter gentagne gange på afbryderknappen, stadig med lydstyrkeknapperne holdt inde, indtil installationen starter."
"Hold both volume buttons and plug in the cable": "Hold begge lydstyrkeknapper inde, og tilslut kablet"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Hold Tilbage-knappen, Lydstyrke ned og afbryderknappen inde samtidig, indtil installationen starter igen."
