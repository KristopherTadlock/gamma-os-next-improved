"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Sæt kortet i {device}, og tænd den. Thimsy kører fra kortet og lader det interne lager i {device} være urørt: Sluk den, og tag kortet ud for at vende tilbage til det originale system."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Geninstaller Thimsy Installer: dets flashværktøj er ikke den version, det forventer."
"Reinstall Thimsy Installer: one of its tools is missing.": "Geninstaller Thimsy Installer: et af dets værktøjer mangler."
"Repeat the download-mode steps and keep holding the button until installing starts, then try again.": "Gentag trinene til download-tilstand, hold knappen inde, indtil installationen starter, og prøv så igen."
"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "Gentag trinene til download-tilstand, og prøv igen. Hvis den stadig ikke findes, så tjek i Enhedshåndtering, at Unisoc download mode bruger WinUSB-driveren."
