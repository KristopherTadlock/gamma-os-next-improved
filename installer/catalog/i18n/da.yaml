# Danish translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "En ren installation sletter det interne lager. Kopiér ROMs, gemte spil, skærmbilleder og alt andet, du vil beholde, til din computer eller microSD-kortet. Spil på microSD-kortet bliver ikke rørt."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Accepter Windows' anmodning om tilladelse, eller installer WinUSB med Zadig."
"Already unlocked: install new firmware": "Allerede låst op: installer ny firmware"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Balanceret: RetroArch til klassiske systemer plus emulatorer til N64, Dreamcast, PSP og DS, ES-DE som startskærm og Brave."
"Building Thimsy for your device": "Bygger Thimsy til din enhed"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Bygget ud fra den officielle GammaOS Next 1.2-udgivelse til RG Cube, hentet fra GammaOS' GitHub-side."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Oplad den til mindst 50 %, før du starter, og hav det medfølgende kabel klar."
"Charge the RG Cube": "Oplad RG Cube"
"Check it's unlocked": "Tjek, at den er låst op"
"Check the basics": "Tjek det grundlæggende"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Tjek knapperne, touchskærmen, lyden og Wi-Fi, og start et spil."
"Check the cable and that the device is still in its flashing mode, then try again.": "Tjek kablet, og at enheden stadig er i flash-tilstand, og prøv igen."
"Checking the USB driver": "Tjekker USB-driveren"
"Checking the build": "Tjekker buildet"
"Checking the plan": "Tjekker planen"
"Checking the result": "Tjekker resultatet"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Vælg et arbejdsområde på et drev med mere ledig plads (ikke FAT32), eller frigør plads."
"Confirm on the device": "Bekræft på enheden"
"Confirm with Volume Up": "Bekræft med Lydstyrke op"
"Connect it with USB debugging on": "Tilslut den med USB-fejlretning slået til"
"Connect the device in download mode": "Tilslut enheden i download-tilstand"
"Copy games without a card reader": "Kopiér spil uden kortlæser"
"Copy your games and saves": "Kopiér dine spil og gemte spil"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Slet mappen \"jobs\" i arbejdsområdet, og byg igen; rapportér det, hvis problemet fortsætter."
"Don't install on units made in March 2026 or later.": "Installer ikke på enheder fremstillet i marts 2026 eller senere."
"Don't install on units whose stock firmware is v1.26.": "Installer ikke på enheder, hvis originale firmware er v1.26."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "Sæt ikke kortet i en computer igen for at kopiere spil: det indeholder et krypteret Android-layout, så computeren kan ikke vise dit lager. Kopiér i stedet spil via USB-filoverførsel (MTP), med ADB Explorer eller fra et netværksdrev."
"Download mode was never seen through WinUSB. Hold Back while you plug in the cable, and check in Device Manager or Zadig that Windows uses WinUSB for Unisoc download mode, not Unisoc's own driver.": "Download-tilstand blev aldrig set via WinUSB. Hold Tilbage inde, mens du tilslutter kablet, og tjek i Enhedshåndtering eller Zadig, at Windows bruger WinUSB til Unisoc download mode og ikke Unisocs egen driver."
"Downloading": "Downloader"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Alt: Mellem plus emulatorer til GameCube/Wii, 3DS, PS2, Xbox og PS Vita samt de præcise cores. Hele Thimsy 1.0a-sættet."
"Finishing": "Afslutter"
"First time installing custom firmware": "Første gang du installerer brugerdefineret firmware"
"Follow the unlock steps shown in the installer, then continue.": "Følg trinnene til oplåsning i installationsprogrammet, og fortsæt derefter."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "GammaOS' vejledning advarer om, at en {device}, der flashes uden at være låst op, bliver ødelagt. Efter oplåsningen genstarter {device} i sin originale Android. Vent, til Android er startet, og fortsæt så."
"Heavy": "Tung"
"Hold Back and plug in the cable": "Hold Tilbage inde, og tilslut kablet"
"Hold Back and the Anbernic button, then plug in": "Hold Tilbage og Anbernic-knappen inde, og tilslut kablet"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Hold afbryderknappen inde for at slukke {device}. Hold begge lydstyrkeknapper inde, og tilslut USB-kablet, mens du stadig holder dem. Tryk derefter gentagne gange på afbryderknappen, stadig med lydstyrkeknapperne holdt inde, indtil installationen starter."
"Hold both volume buttons and plug in the cable": "Hold begge lydstyrkeknapper inde, og tilslut kablet"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Hold Tilbage-knappen, Lydstyrke ned og afbryderknappen inde samtidig, indtil installationen starter igen."
"If installation doesn't start": "Hvis installationen ikke starter"
"If installation stalls": "Hvis installationen går i stå"
"If it isn't found": "Hvis den ikke bliver fundet"
"If the screen stays black": "Hvis skærmen forbliver sort"
"Install from the microSD card": "Installér fra microSD-kortet"
"Installing Thimsy": "Installerer Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Bevarer dine data. Kun når RG Cube allerede kører GammaOS Next 1.2 eller et Thimsy-build."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Bevarer dine data. Kun når enheden allerede kører et kompatibelt Thimsy- eller GammaOS-build."
"Light": "Let"
"Medium": "Mellem"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "Ved den allerførste opstart kan skærmen være tom i op til et minut. Det er normalt; vent, til opstartsskærmen vises."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "Åbn Indstillinger, Om telefonen på {device}, og tryk syv gange på Buildnummer. Slå derefter USB-fejlretning og OEM-oplåsning til under Indstillinger, Indstillinger for udviklere. Tilslut {device} til denne computer, mens den er tændt; den genstarter i fastboot-tilstand til installationen."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "Åbn Indstillinger, Om telefonen på {device}, og tryk syv gange på Buildnummer. Slå derefter USB-fejlretning og OEM-oplåsning til under Indstillinger, Indstillinger for udviklere. Tilslut {device} til denne computer, mens den er tændt; den genstarter i fastboot-tilstand til oplåsningen."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Planlagt: installation via Qualcomm EDL på alle computere. Kan ikke bygges endnu."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Planlagt: SP Flash Tool på Windows og Linux. Kan ikke bygges endnu."
"Planned: Windows only. Not buildable yet.": "Planlagt: kun Windows. Kan ikke bygges endnu."
"Planned: fastboot install on every computer. Not buildable yet.": "Planlagt: installation via fastboot på alle computere. Kan ikke bygges endnu."
"Planned: microSD card install on every computer. Not buildable yet.": "Planlagt: installation via microSD-kort på alle computere. Kan ikke bygges endnu."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Planlagt: samme flash-metode som RG Cube. Kan ikke bygges endnu."
"Plug in the cable with the device off": "Tilslut kablet, mens enheden er slukket"
"Preparing the partitions": "Forbereder partitionerne"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Sæt kortet i {device}, og tænd den. Thimsy kører fra kortet og lader det interne lager i {device} være urørt: Sluk den, og tag kortet ud for at vende tilbage til det originale system."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Geninstaller Thimsy Installer, eller angiv THIMSY_TOOLS_DIR til en mappe, der indeholder det."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Geninstaller Thimsy Installer: dets flashværktøj er ikke den version, det forventer."
"Restart into fastbootd": "Genstart i fastbootd"
"Restart with Power": "Genstart med afbryderknappen"
"Restarting the device": "Genstarter enheden"
"Slide it open, hold Back and plug in": "Skub den op, hold Tilbage inde, og tilslut kablet"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Lille download til klassiske systemer op til PlayStation: én hurtig RetroArch-core pr. system, Minima som startskærm, ingen shaders."
"Start from the microSD card": "Start fra microSD-kortet"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Tag andre microSD-kort ud af {device}, sæt Thimsy-kortet i, og tænd den. Thimsy kører fra kortet og lader det interne lager være urørt: Sluk den, og tag kortet ud for at vende tilbage til det originale system."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Tag eventuelle SD-kort ud, og hold derefter Lydstyrke ned og afbryderknappen inde, indtil {device} genstarter."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Tag microSD-kortet ud, og slå USB-fejlretning til under Indstillinger for udviklere. Tilslut {device} til denne computer, mens den er tændt. Den genstarter i fastbootd: skærmen viser fastbootd med stor rød tekst."
"The file is damaged or a different version. Delete it and download again.": "Filen er beskadiget eller en anden version. Slet den, og download den igen."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Første opstart kan tage 1 til 3 minutter og kan se ud til at hænge på Anbernic-logoet. Det er normalt."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Første opstart tager 1 til 3 minutter, og skærmen kan se ud til at hænge på opstartslogoet. Det er normalt."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Første opstart tager et par minutter, mens Thimsy konfigurerer dine emulatorer. Sluk den ikke."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} låses op én gang med værktøjet UnlockBootloader fra installationsvejledningen til GammaOS Next (Unisoc T820, trin 2): Sluk {device}, start værktøjet, og hold derefter Tilbage-knappen inde, mens du tilslutter USB-kablet. Installationsprogrammet kører ikke selv det værktøj. Følg vejledningen, og kom så tilbage og fortsæt."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} låses op én gang med værktøjet UnlockBootloader fra installationsvejledningen til GammaOS Next (Unisoc T820, trin 2): Sluk {device}, start værktøjet, og hold derefter Tilbage-knappen, knappen i højre side af skærmen, inde, mens du tilslutter USB-kablet. Installationsprogrammet kører ikke selv det værktøj. Følg vejledningen, og kom så tilbage og fortsæt."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} låses op én gang med weboplåsningsværktøjet fra installationsvejledningen til GammaOS Next (Anbernic RG405M / RG405V / RG505, trin 2). Genstart {device} i fastboot-tilstand, åbn værktøjet i Google Chrome, og klik på \"Connect\" og derefter \"Unlock\". Tryk ikke på Lydstyrke ned på {device}: Tryk på Hjem / Tilbage-knappen for at bekræfte. Installationsprogrammet kører ikke selv det værktøj. Følg vejledningen, og kom så tilbage og fortsæt."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Profilen {profile} er ikke udgivet endnu. Vælg en profil, der er markeret som tilgængelig."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "Enhedens partitionslayout passer ikke til denne firmware: det er en anden model, eller den kører stadig original firmware, der skal ompartitioneres, hvilket denne version ikke kan endnu."
"This version of the installer expects a different build. Build again, then install.": "Denne version af installationsprogrammet forventer et andet build. Byg igen, og installer derefter."
"Turn on OEM unlocking": "Slå OEM-oplåsning til"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Sluk {device}, og tag kablet ud. Hold Tilbage-knappen og Anbernic-knappen ved siden af den inde, og tilslut USB-kablet til denne computer, mens du stadig holder dem. Bliv ved med at holde dem, indtil installationen starter."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Sluk {device}, og tag kablet ud. Hold Tilbage-knappen inde, og tilslut USB-kablet til denne computer, mens du stadig holder den. Bliv ved med at holde den, indtil installationen starter."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Sluk {device}, og tag kablet ud. Hold Tilbage-knappen, knappen i højre side af skærmen, inde, og tilslut USB-kablet til denne computer, mens du stadig holder den. Bliv ved med at holde den, indtil installationen starter."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Sluk {device} helt, og tag kablet ud. Hold Lydstyrke ned og Lydstyrke op inde samtidig, og tilslut USB-kablet til denne computer, mens du stadig holder dem. Bliv ved med at holde dem, indtil installationen starter."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "Sluk {device} helt. Når installationsprogrammet beder om det, skal du tilslutte USB-kablet til denne computer."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Sluk {device}, sæt kortet i, og tænd den. Den installerer sig selv på sit interne lager fra kortet. Lad den være, til den er færdig, og sluk den så, og tag kortet ud."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Sluk {device}, tag kablet ud, og tag alle SD-kort ud. Skub den op, hold derefter Tilbage-knappen midt på joypad'en inde, og tilslut USB-kablet til denne computer, mens du stadig holder den. Bliv ved med at holde den, indtil installationen starter."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Tænd {device} med USB-fejlretning stadig slået til under Indstillinger for udviklere, og tilslut den til denne computer. Den genstarter af sig selv, og installationen starter."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Tænd {device} med USB-fejlretning stadig slået til under Indstillinger for udviklere, og tilslut den til denne computer. Den genstarter i fastboot-tilstand til installationen."
"Unlock before flashing": "Lås op før flashing"
"Unlock with GammaOS's own steps": "Lås op med GammaOS' egne trin"
"Unpacking the firmware": "Udpakker firmwaren"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Tag kablet ud. Hold afbryderknappen og Lydstyrke ned inde i mindst 60 sekunder, og tilslut derefter USB-kablet, mens du stadig holder dem. Bliv ved med at holde dem, indtil installationen starter; det kan tage 30 sekunder eller mere at finde {device}."
"Use a Windows PC": "Brug en Windows-pc"
"Use the firmware version the catalog lists for this device.": "Brug den firmwareversion, som kataloget angiver for denne enhed."
"Use the volume keys to choose Unlock, then press Power.": "Vælg \"Unlock\" med lydstyrkeknapperne, og tryk derefter på afbryderknappen."
"Wait for the first boot": "Vent på første opstart"
"Wait on the Anbernic logo": "Vent ved Anbernic-logoet"
"Wait through a blank screen": "Vent, selvom skærmen er tom"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Når installationen er færdig, skal du trykke én gang på afbryderknappen, hvis {device} ikke er genstartet af sig selv."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "Når skærmen viser INFO: LOCK FLAG IS: UNLOCK!!!, er den låst op. Tag kablet ud, sørg for, at {device} er slukket, og fortsæt."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Når skærmen viser Unlock bootloader success!, er den låst op. Hvis {device} allerede kort viser INFO: LOCK FLAG IS : UNLOCK!!!, når den starter, er den låst op i forvejen, og du kan springe oplåsningen over."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Når {device} spørger, skal du trykke på Lydstyrke op inden for 3 sekunder for at bekræfte oplåsningen."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Din {device} kører allerede brugerdefineret firmware (den er låst op før). Oplåsning springes over."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Din {device} kører sin originale firmware. Installationsprogrammet laver en ren installation, der sletter enheden."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Din {device} kører stadig sin originale firmware. Installationsprogrammet guider dig gennem oplåsningen og laver derefter en ren installation, der sletter enheden."
"needs Android API {n}": "kræver Android API {n}"
"needs Vulkan": "kræver Vulkan"
"needs an ARMv8.2 CPU": "kræver en ARMv8.2-processor"
"needs {n} GB RAM": "kræver {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} kan ikke installeres fra {host}. Kør Thimsy Installer på en Windows-pc for at installere den."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} installeres med PhoenixSuit fra Allwinner, som kun kører på Windows. Kør Thimsy Installer på en Windows-pc for at installere den."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} installeres med SP Flash Tool fra MediaTek, som ikke kører på {host}. Kør Thimsy Installer på en Windows-pc for at installere den."
"{device} isn't supported by this version of the installer yet.": "{device} understøttes endnu ikke af denne version af installationsprogrammet."
