"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "GammaOS' vejledning advarer om, at en {device}, der flashes uden at være låst op, bliver ødelagt. Efter oplåsningen genstarter {device} i sin originale Android. Vent, til Android er startet, og fortsæt så."
