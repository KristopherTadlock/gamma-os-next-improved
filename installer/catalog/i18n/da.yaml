"Installing Thimsy": "Installerer Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Bevarer dine data. Kun når RG Cube allerede kører GammaOS Next 1.2 eller et Thimsy-build."
