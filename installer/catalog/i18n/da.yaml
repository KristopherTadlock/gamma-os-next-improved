# Danish translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "En ren installation sletter det interne lager. Kopiér ROMs, gemte spil, skærmbilleder og alt andet, du vil beholde, til din computer eller microSD-kortet. Spil på microSD-kortet bliver ikke rørt."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Accepter Windows' anmodning om tilladelse, eller installer WinUSB med Zadig."
"Already unlocked: install new firmware": "Allerede låst op: installer ny firmware"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Balanceret: RetroArch til klassiske systemer plus emulatorer til N64, Dreamcast, PSP og DS, ES-DE som startskærm og Brave."
"Building Thimsy for your device": "Bygger Thimsy til din enhed"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Bygget ud fra den officielle GammaOS Next 1.2-udgivelse til RG Cube, hentet fra GammaOS' GitHub-side."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Oplad den til mindst 50 %, før du starter, og hav det medfølgende kabel klar."
"Charge the RG Cube": "Oplad RG Cube"
"Check it's unlocked": "Tjek, at den er låst op"
"Check the basics": "Tjek det grundlæggende"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Tjek knapperne, touchskærmen, lyden og Wi-Fi, og start et spil."
"Check the cable and that the device is still in its flashing mode, then try again.": "Tjek kablet, og at enheden stadig er i flash-tilstand, og prøv igen."
"Checking the USB driver": "Tjekker USB-driveren"
"Checking the build": "Tjekker buildet"
"Checking the plan": "Tjekker planen"
"Checking the result": "Tjekker resultatet"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Vælg et arbejdsområde på et drev med mere ledig plads (ikke FAT32), eller frigør plads."
"Confirm on the device": "Bekræft på enheden"
"Connect the device in download mode": "Tilslut enheden i download-tilstand"
"Copy your games and saves": "Kopiér dine spil og gemte spil"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Slet mappen \"jobs\" i arbejdsområdet, og byg igen; rapportér det, hvis problemet fortsætter."
"Don't install on units whose stock firmware is v1.26.": "Installer ikke på enheder, hvis originale firmware er v1.26."
"Downloading": "Downloader"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Alt: Mellem plus emulatorer til GameCube/Wii, 3DS, PS2, Xbox og PS Vita samt de præcise cores. Hele Thimsy 1.0a-sættet."
"Finishing": "Afslutter"
"First time installing custom firmware": "Første gang du installerer brugerdefineret firmware"
"Follow the unlock steps shown in the installer, then continue.": "Følg trinnene til oplåsning i installationsprogrammet, og fortsæt derefter."
"Heavy": "Tung"
"Hold Volume Down and plug in the cable": "Hold Lydstyrke ned inde, og tilslut kablet"
"Installing Thimsy": "Installerer Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Bevarer dine data. Kun når RG Cube allerede kører GammaOS Next 1.2 eller et Thimsy-build."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Bevarer dine data. Kun når enheden allerede kører et kompatibelt Thimsy- eller GammaOS-build."
"Light": "Let"
"Medium": "Mellem"
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Planlagt: SP Flash Tool på Windows og Linux. Kan ikke bygges endnu."
"Planned: Windows only. Not buildable yet.": "Planlagt: kun Windows. Kan ikke bygges endnu."
"Planned: fastboot install on every computer. Not buildable yet.": "Planlagt: installation via fastboot på alle computere. Kan ikke bygges endnu."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Planlagt: samme flash-metode som RG Cube. Kan ikke bygges endnu."
"Preparing the partitions": "Forbereder partitionerne"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Geninstaller Thimsy Installer, eller angiv THIMSY_TOOLS_DIR til en mappe, der indeholder det."
"Required before flashing; skipping it can brick the device.": "Påkrævet før flash; springes det over, kan enheden blive ubrugelig."
"Restarting the device": "Genstarter enheden"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Lille download til klassiske systemer op til PlayStation: én hurtig RetroArch-core pr. system, Minima som startskærm, ingen shaders."
"The RG Cube is unlocked once, with the steps from GammaOS Next's installation guide (the Unisoc T820 section). The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "RG Cube låses op én gang med trinnene fra installationsvejledningen til GammaOS Next (afsnittet Unisoc T820). Installationsprogrammet kører ikke selv det værktøj. Følg vejledningen, vend så tilbage, og fortsæt."
"The file is damaged or a different version. Delete it and download again.": "Filen er beskadiget eller en anden version. Slet den, og download den igen."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Første opstart tager et par minutter, mens Thimsy konfigurerer dine emulatorer. Sluk den ikke."
"The installer sends the unlock command; confirm it on the device with Volume Up.": "Installationsprogrammet sender kommandoen til oplåsning; bekræft den på enheden med Lydstyrke op."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Profilen {profile} er ikke udgivet endnu. Vælg en profil, der er markeret som tilgængelig."
"Turn the RG Cube off. Hold Volume Down and connect the USB cable to this computer. Keep holding until installation starts. The screen stays black; that's normal.": "Sluk RG Cube. Hold Lydstyrke ned inde, og tilslut USB-kablet til denne computer. Bliv ved med at holde, indtil installationen starter. Skærmen forbliver sort; det er normalt."
"Unlock in fastboot": "Lås op i fastboot"
"Unlock with GammaOS's own steps": "Lås op med GammaOS' egne trin"
"Unpacking the firmware": "Udpakker firmwaren"
"Use a Windows PC": "Brug en Windows-pc"
"Use the firmware version the catalog lists for this device.": "Brug den firmwareversion, som kataloget angiver for denne enhed."
"Use the volume keys to choose Unlock, then press Power.": "Vælg \"Unlock\" med lydstyrkeknapperne, og tryk derefter på afbryderknappen."
"Wait for the first boot": "Vent på første opstart"
"When the device shows LOCK FLAG IS: UNLOCK, it's unlocked. Turn it off and continue.": "Når enheden viser LOCK FLAG IS: UNLOCK, er den låst op. Sluk den, og fortsæt."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Din {device} kører allerede brugerdefineret firmware (den er låst op før). Oplåsning springes over."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Din {device} kører sin originale firmware. Installationsprogrammet laver en ren installation, der sletter enheden."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Din {device} kører stadig sin originale firmware. Installationsprogrammet guider dig gennem oplåsningen og laver derefter en ren installation, der sletter enheden."
"needs Android API {n}": "kræver Android API {n}"
"needs Vulkan": "kræver Vulkan"
"needs an ARMv8.2 CPU": "kræver en ARMv8.2-processor"
"needs {n} GB RAM": "kræver {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} kan ikke installeres fra {host}. Kør Thimsy Installer på en Windows-pc for at installere den."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} installeres med PhoenixSuit fra Allwinner, som kun kører på Windows. Kør Thimsy Installer på en Windows-pc for at installere den."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} installeres med SP Flash Tool fra MediaTek, som ikke kører på {host}. Kør Thimsy Installer på en Windows-pc for at installere den."
"{device} isn't supported by this version of the installer yet.": "{device} understøttes endnu ikke af denne version af installationsprogrammet."
