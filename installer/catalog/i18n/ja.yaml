# Japanese translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "クリーンインストールを行うと内部ストレージが消去されます。ROMs、セーブデータ、スクリーンショットなど残しておきたいものはすべてパソコンか microSD カードにコピーしてください。microSD カード上のゲームには影響しません。"
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Windows の許可を求めるメッセージを承認するか、Zadig で WinUSB をインストールしてください。"
"Already unlocked: install new firmware": "ロック解除済み：新しいファームウェアをインストール"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "バランス：クラシック機向けの RetroArch に加え、N64、Dreamcast、PSP、DS のエミュレーター、ES-DE ホーム画面、Brave。"
"Building Thimsy for your device": "お使いのデバイス向けに Thimsy をビルドしています"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "GammaOS の GitHub ページからダウンロードした、RG Cube 向け公式 GammaOS Next 1.2 リリースをもとにビルドしています。"
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "始める前に 50% 以上充電し、付属のケーブルを手元に用意してください。"
"Charge the RG Cube": "RG Cube を充電する"
"Check it's unlocked": "ロック解除されていることを確認する"
"Check the basics": "基本動作を確認する"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "ボタン、タッチスクリーン、サウンド、Wi-Fi を確認し、ゲームを起動してください。"
"Check the cable and that the device is still in its flashing mode, then try again.": "ケーブルと、デバイスがまだ書き込みモードになっていることを確認して、もう一度お試しください。"
"Checking the USB driver": "USB ドライバーを確認しています"
"Checking the build": "ビルドを確認しています"
"Checking the plan": "プランを確認しています"
"Checking the result": "結果を確認しています"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "空き容量の多いドライブ（FAT32 以外）にある作業フォルダーを選ぶか、空き容量を増やしてください。"
"Confirm on the device": "デバイスで確認する"
"Confirm with Volume Up": "音量アップボタンで確定する"
"Connect it with USB debugging on": "USB デバッグをオンにして接続する"
"Connect the device in download mode": "ダウンロードモードでデバイスを接続する"
"Copy games without a card reader": "カードリーダーを使わずにゲームをコピーする"
"Copy your games and saves": "ゲームとセーブデータをコピーする"
"Delete the workspace's jobs folder and build again; report it if it persists.": "作業フォルダー内の「jobs」フォルダーを削除して、もう一度ビルドしてください。解決しない場合は報告してください。"
"Don't install on units made in March 2026 or later.": "2026年3月以降に製造された本体にはインストールしないでください。"
"Don't install on units whose stock firmware is v1.26.": "純正ファームウェアが v1.26 の本体にはインストールしないでください。"
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "ゲームをコピーするためにカードをパソコンに戻さないでください。カードには暗号化された Android の構成が入っているため、パソコンではストレージが表示されません。代わりに USB ファイル転送（MTP）、ADB Explorer、またはネットワーク共有でゲームをコピーしてください。"
"Download mode was never seen through WinUSB. Hold Back while you plug in the cable, and check in Device Manager or Zadig that Windows uses WinUSB for Unisoc download mode, not Unisoc's own driver.": "ダウンロードモードが WinUSB 経由で一度も検出されませんでした。戻るボタンを押しながらケーブルを接続し、デバイス マネージャーまたは Zadig で、Unisoc download mode に Unisoc 独自のドライバーではなく WinUSB が使われていることを確認してください。"
"Downloading": "ダウンロード中"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "すべて：ミディアムに加えて GameCube/Wii、3DS、PS2、Xbox、PS Vita のエミュレーターと高精度コア。Thimsy 1.0a のフルセットです。"
"Finishing": "仕上げ中"
"First time installing custom firmware": "カスタムファームウェアを初めてインストールする"
"Follow the unlock steps shown in the installer, then continue.": "インストーラーに表示されるロック解除の手順に従ってから、続行してください。"
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "GammaOS のガイドでは、ロック解除していない {device} に書き込むと起動できなくなると警告しています。ロック解除後、{device} は元の Android で再起動します。Android が起動するまで待ってから続行してください。"
"Heavy": "ヘビー"
"Hold Back and plug in the cable": "戻るボタンを押しながらケーブルを接続する"
"Hold Back and the Anbernic button, then plug in": "戻るボタンと Anbernic ボタンを押しながら接続する"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "電源ボタンを長押しして {device} の電源を切ります。両方の音量ボタンを押したまま USB ケーブルを接続します。続けて、音量ボタンを押したまま、インストールが始まるまで電源ボタンを繰り返し押してください。"
"Hold both volume buttons and plug in the cable": "両方の音量ボタンを押しながらケーブルを接続する"
"Hold the Back button, Volume Down and Power together until installation starts again.": "インストールが再開するまで、戻るボタン、音量ダウンボタン、電源ボタンを同時に押し続けてください。"
"If installation doesn't start": "インストールが始まらない場合"
"If installation stalls": "インストールが止まった場合"
"If it isn't found": "認識されない場合"
"If the screen stays black": "画面が黒いままの場合"
"Install from the microSD card": "microSD カードからインストールする"
"Installing Thimsy": "Thimsy をインストールしています"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "データを保持します。RG Cube ですでに GammaOS Next 1.2 または Thimsy ビルドが動作している場合のみ。"
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "データを保持します。デバイスですでに互換性のある Thimsy または GammaOS ビルドが動作している場合のみ。"
"Light": "ライト"
"Medium": "ミディアム"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "最初の起動では、画面が最大 1 分ほど何も表示されないことがあります。これは正常です。起動画面が表示されるまで待ってください。"
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "{device} で「設定」の「デバイス情報」を開き、「ビルド番号」を 7 回タップします。次に「設定」の「開発者向けオプション」で「USB デバッグ」と「OEM ロック解除」をオンにします。電源が入った状態の {device} をこのパソコンに接続してください。インストールのために fastboot モードで再起動します。"
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "{device} で「設定」の「デバイス情報」を開き、「ビルド番号」を 7 回タップします。次に「設定」の「開発者向けオプション」で「USB デバッグ」と「OEM ロック解除」をオンにします。電源が入った状態の {device} をこのパソコンに接続してください。ロック解除のために fastboot モードで再起動します。"
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "予定：すべてのパソコンで Qualcomm EDL によるインストール。まだビルドできません。"
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "予定：Windows と Linux で SP Flash Tool を使用。まだビルドできません。"
"Planned: Windows only. Not buildable yet.": "予定：Windows のみ。まだビルドできません。"
"Planned: fastboot install on every computer. Not buildable yet.": "予定：すべてのパソコンで fastboot によるインストール。まだビルドできません。"
"Planned: microSD card install on every computer. Not buildable yet.": "予定：すべてのパソコンで microSD カードによるインストール。まだビルドできません。"
"Planned: same flashing route as the RG Cube. Not buildable yet.": "予定：RG Cube と同じ書き込み方法。まだビルドできません。"
"Plug in the cable with the device off": "電源を切った状態でケーブルを接続する"
"Preparing the partitions": "パーティションを準備しています"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "カードを {device} に入れて電源を入れます。Thimsy はカードから動作し、{device} の内部ストレージには手を加えません。元のシステムに戻すには、電源を切ってカードを取り出してください。"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Thimsy Installer を再インストールするか、THIMSY_TOOLS_DIR にそれを含むフォルダーを設定してください。"
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Thimsy Installer を再インストールしてください。書き込みツールが想定されたバージョンではありません。"
"Restart into fastbootd": "fastbootd で再起動する"
"Restart with Power": "電源ボタンで再起動する"
"Restarting the device": "デバイスを再起動しています"
"Slide it open, hold Back and plug in": "スライドを開き、戻るボタンを押しながら接続する"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "PlayStation までのクラシック機向けの小さなダウンロード：システムごとに高速な RetroArch コアを 1 つ、Minima ホーム画面、シェーダーなし。"
"Start from the microSD card": "microSD カードから起動する"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "{device} から他の microSD カードを取り出し、Thimsy のカードを入れて電源を入れます。Thimsy はカードから動作し、内部ストレージには手を加えません。元のシステムに戻すには、電源を切ってカードを取り出してください。"
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "SD カードをすべて取り出し、{device} が再起動するまで音量ダウンボタンと電源ボタンを押し続けてください。"
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "microSD カードを取り出し、「開発者向けオプション」で「USB デバッグ」をオンにします。電源が入った状態の {device} をこのパソコンに接続してください。fastbootd で再起動し、画面に大きな赤い文字で fastbootd と表示されます。"
"The file is damaged or a different version. Delete it and download again.": "ファイルが破損しているか、バージョンが異なります。削除してもう一度ダウンロードしてください。"
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "最初の起動には 1～3 分かかることがあり、Anbernic のロゴで止まっているように見える場合があります。これは正常です。"
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "最初の起動には 1～3 分かかり、起動ロゴで画面が止まっているように見える場合があります。これは正常です。"
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "初回起動時は Thimsy がエミュレーターを設定するため数分かかります。電源を切らないでください。"
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} のロック解除は一度だけ、GammaOS Next のインストールガイド（Unisoc T820、ステップ 2）にある UnlockBootloader ツールで行います。{device} の電源を切ってツールを起動し、戻るボタンを押しながら USB ケーブルを接続します。インストーラーはこのツールを実行しません。ガイドの手順を終えたら、ここに戻って続行してください。"
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} のロック解除は一度だけ、GammaOS Next のインストールガイド（Unisoc T820、ステップ 2）にある UnlockBootloader ツールで行います。{device} の電源を切ってツールを起動し、戻るボタン（画面の右側にあるボタン）を押しながら USB ケーブルを接続します。インストーラーはこのツールを実行しません。ガイドの手順を終えたら、ここに戻って続行してください。"
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} のロック解除は一度だけ、GammaOS Next のインストールガイド（Anbernic RG405M / RG405V / RG505、ステップ 2）にある Web ロック解除ツールで行います。{device} を fastboot モードで再起動し、Google Chrome でツールを開いて「Connect」、続けて「Unlock」をクリックします。{device} では音量ダウンボタンを押さず、ホーム / 戻るボタンを押して確定してください。インストーラーはこのツールを実行しません。ガイドの手順を終えたら、ここに戻って続行してください。"
"The {profile} profile isn't published yet. Choose a profile marked available.": "{profile} プロファイルはまだ公開されていません。「利用可能」と表示されたプロファイルを選んでください。"
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "このデバイスのパーティション構成はこのファームウェアと一致しません。別の機種か、まだ純正ファームウェアのままでパーティションの再構成が必要です。このバージョンではまだ再構成できません。"
"This version of the installer expects a different build. Build again, then install.": "このバージョンのインストーラーは別のビルドを想定しています。もう一度ビルドしてからインストールしてください。"
"Turn on OEM unlocking": "OEM ロック解除をオンにする"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "{device} の電源を切り、ケーブルを抜きます。戻るボタンとその隣の Anbernic ボタンを押したまま、USB ケーブルをこのパソコンに接続します。インストールが始まるまで押し続けてください。"
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device} の電源を切り、ケーブルを抜きます。戻るボタンを押したまま、USB ケーブルをこのパソコンに接続します。インストールが始まるまで押し続けてください。"
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device} の電源を切り、ケーブルを抜きます。戻るボタン（画面の右側にあるボタン）を押したまま、USB ケーブルをこのパソコンに接続します。インストールが始まるまで押し続けてください。"
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "{device} の電源を完全に切り、ケーブルを抜きます。音量ダウンボタンと音量アップボタンを同時に押したまま、USB ケーブルをこのパソコンに接続します。インストールが始まるまで押し続けてください。"
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "{device} の電源を完全に切ります。インストーラーの指示が出たら、USB ケーブルをこのパソコンに接続してください。"
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "{device} の電源を切り、カードを入れて電源を入れます。カードから内部ストレージへ自動でインストールされます。終わるまで触らずに待ち、終わったら電源を切ってカードを取り出してください。"
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device} の電源を切ってケーブルを抜き、SD カードをすべて取り出します。スライドを開き、十字キーの中央にある戻るボタンを押したまま、USB ケーブルをこのパソコンに接続します。インストールが始まるまで押し続けてください。"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "「開発者向けオプション」で「USB デバッグ」をオンにしたまま {device} の電源を入れ、このパソコンに接続します。自動で再起動し、インストールが始まります。"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "「開発者向けオプション」で「USB デバッグ」をオンにしたまま {device} の電源を入れ、このパソコンに接続します。インストールのために fastboot モードで再起動します。"
"Unlock before flashing": "書き込み前にロック解除する"
"Unlock with GammaOS's own steps": "GammaOS の手順でロック解除する"
"Unpacking the firmware": "ファームウェアを展開しています"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "ケーブルを抜きます。電源ボタンと音量ダウンボタンを 60 秒以上押し続け、押したまま USB ケーブルを接続します。インストールが始まるまで押し続けてください。{device} が認識されるまで 30 秒以上かかることがあります。"
"Use a Windows PC": "Windows パソコンを使う"
"Use the firmware version the catalog lists for this device.": "カタログでこのデバイス用に指定されているファームウェアのバージョンを使用してください。"
"Use the volume keys to choose Unlock, then press Power.": "音量ボタンで「Unlock」を選び、電源ボタンを押します。"
"Wait for the first boot": "初回起動を待つ"
"Wait on the Anbernic logo": "Anbernic のロゴで待つ"
"Wait through a blank screen": "何も表示されない画面のまま待つ"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "インストールが終わっても {device} が自動で再起動しない場合は、電源ボタンを 1 回押してください。"
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "画面に INFO: LOCK FLAG IS: UNLOCK!!! と表示されたら、ロック解除は完了です。ケーブルを抜き、{device} の電源が切れていることを確認して続行してください。"
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "画面に Unlock bootloader success! と表示されたら、ロック解除は完了です。{device} の起動時にすでに INFO: LOCK FLAG IS : UNLOCK!!! が一瞬表示される場合は、以前にロック解除済みなので、ロック解除は省略できます。"
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "{device} で確認を求められたら、3 秒以内に音量アップボタンを押してロック解除を確定してください。"
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "お使いの {device} はすでにカスタムファームウェアで動作しています（以前にロック解除済み）。ロック解除はスキップされます。"
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "お使いの {device} は純正ファームウェアで動作しています。インストーラーはデバイスを消去するクリーンインストールを行います。"
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "お使いの {device} はまだ純正ファームウェアで動作しています。インストーラーがロック解除の手順を案内し、その後デバイスを消去するクリーンインストールを行います。"
"needs Android API {n}": "Android API {n} が必要"
"needs Vulkan": "Vulkan が必要"
"needs an ARMv8.2 CPU": "ARMv8.2 CPU が必要"
"needs {n} GB RAM": "{n} GB の RAM が必要"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} は {host} からインストールできません。Windows パソコンで Thimsy Installer を実行してインストールしてください。"
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} は Allwinner の PhoenixSuit でインストールしますが、これは Windows でしか動作しません。Windows パソコンで Thimsy Installer を実行してインストールしてください。"
