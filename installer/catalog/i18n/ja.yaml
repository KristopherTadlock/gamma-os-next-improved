"Importing {file}": "{file} を取り込んでいます"
"In Android Settings, Storage, check whether the {device} has 128 GB or 256 GB. Each size needs its own layout, and installing the wrong one can brick the {device}.": "Android の「設定」の「ストレージ」で、{device} が 128 GB か 256 GB かを確認してください。容量ごとに専用のレイアウトが必要で、違うものをインストールすると {device} が起動できなくなることがあります。"
"In Settings, Handheld Settings, About Device, Device Information, note the first four characters of the SN (MQ65 or MQ66). Each hardware revision needs its own firmware.": "「設定」の「ハンドヘルド設定」、「デバイスについて」、「デバイス情報」で、SN の最初の 4 文字（MQ65 または MQ66）を控えてください。ハードウェアのリビジョンごとに専用のファームウェアが必要です。"
"Inside the device pack.": "デバイスパックの中にあります。"
"Install from the microSD card": "microSD カードからインストールする"
"Install polkit (pkexec), or add a udev rule for the device's download mode yourself, then try again.": "polkit（pkexec）をインストールするか、デバイスのダウンロードモード用の udev ルールを自分で追加してから、もう一度お試しください。"
"Installing Thimsy": "Thimsy をインストールしています"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "データを保持します。RG Cube ですでに GammaOS Next 1.2 または Thimsy ビルドが動作している場合のみ。"
