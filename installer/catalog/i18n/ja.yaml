"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "ゲームをコピーするためにカードをパソコンに戻さないでください。カードには暗号化された Android の構成が入っているため、パソコンではストレージが表示されません。代わりに USB ファイル転送（MTP）、ADB Explorer、またはネットワーク共有でゲームをコピーしてください。"
"Download Thimsy-1.0a-anbernic-rg-cube-heavy.tar from the Thimsy Installer release page, then choose it with Use a file I already downloaded.": "Thimsy Installer のリリースページから Thimsy-1.0a-anbernic-rg-cube-heavy.tar をダウンロードし、「ダウンロード済みのファイルを使う」で選択してください。"
"Download the file yourself, then choose it with Use a file I already downloaded.": "ファイルを自分でダウンロードし、「ダウンロード済みのファイルを使う」で選択してください。"
