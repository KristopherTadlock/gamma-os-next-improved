"Plug in the cable with the device off": "電源を切った状態でケーブルを接続する"
"Point-and-click adventures": "ポイントアンドクリック アドベンチャー"
"Preparing partitions": "パーティションを準備しています"
"Preparing the partitions": "パーティションを準備しています"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "カードを {device} に入れて電源を入れます。Thimsy はカードから動作し、{device} の内部ストレージには手を加えません。元のシステムに戻すには、電源を切ってカードを取り出してください。"
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Thimsy Installer を再インストールしてください。書き込みツールが想定されたバージョンではありません。"
"Reinstall Thimsy Installer: one of its tools is missing.": "Thimsy Installer を再インストールしてください。ツールの一つが見つかりません。"
"Repeat the download-mode steps and keep holding the button until installing starts, then try again.": "ダウンロードモードの手順をやり直し、インストールが始まるまでボタンを押し続けてから、もう一度お試しください。"
"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "ダウンロードモードの手順をやり直してから、もう一度お試しください。それでも見つからない場合は、デバイス マネージャーで Unisoc download mode が WinUSB ドライバーを使用していることを確認してください。"
"Repeat the download-mode steps, then try again. If it still isn't found, unplug the cable, plug it into another USB port and try again.": "ダウンロードモードの手順をやり直してから、もう一度お試しください。それでも見つからない場合は、ケーブルを抜いて別の USB ポートに挿し、もう一度お試しください。"
"Restart into fastbootd": "fastbootd で再起動する"
"Restart the computer, then try again.": "パソコンを再起動してから、もう一度お試しください。"
"Restart with Power": "電源ボタンで再起動する"
"Restarting the device": "デバイスを再起動しています"
"RetroArch": "RetroArch"
"SNES": "SNES"
"SNES (cycle-accurate)": "SNES（サイクル精度）"
"Saturn": "Saturn"
"Saturn (accurate)": "Saturn（高精度）"
"ScummVM": "ScummVM"
"Shattered Pixel Dungeon (pack-in game)": "Shattered Pixel Dungeon（同梱ゲーム）"
"Slide it open, hold Back and plug in": "スライドを開き、戻るボタンを押しながら接続する"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "PlayStation までのクラシック機向けの小さなダウンロード：システムごとに高速な RetroArch コアを 1 つ、Minima ホーム画面、シェーダーなし。"
"Start from the microSD card": "microSD カードから起動する"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "{device} から他の microSD カードを取り出し、Thimsy のカードを入れて電源を入れます。Thimsy はカードから動作し、内部ストレージには手を加えません。元のシステムに戻すには、電源を切ってカードを取り出してください。"
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "SD カードをすべて取り出し、{device} が再起動するまで音量ダウンボタンと電源ボタンを押し続けてください。"
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "microSD カードを取り出し、「開発者向けオプション」で「USB デバッグ」をオンにします。電源が入った状態の {device} をこのパソコンに接続してください。fastbootd で再起動し、画面に大きな赤い文字で fastbootd と表示されます。"
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "作業フォルダーのあるドライブが故障しかけている可能性があります。別のドライブにある作業フォルダーを選んで、もう一度ビルドしてください。"
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "このビルドにはドライバーのインストーラーが同梱されていません。Zadig で、デバイスのダウンロードモード用に WinUSB をインストールしてください。"
"The file is damaged or a different version. Delete it and download again.": "ファイルが破損しているか、バージョンが異なります。削除してもう一度ダウンロードしてください。"
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "最初の起動には 1～3 分かかることがあり、Anbernic のロゴで止まっているように見える場合があります。これは正常です。"
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "最初の起動には 1～3 分かかり、起動ロゴで画面が止まっているように見える場合があります。これは正常です。"
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "初回起動時は Thimsy がエミュレーターを設定するため数分かかります。電源を切らないでください。"
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "このドライブの空き容量を確認できませんでした。作業フォルダーには別のフォルダーを選んでください。"
"The installer does a fresh install that erases your {device}, whatever it runs now.": "インストーラーは、現在何が動作していても {device} を消去するクリーンインストールを行います。"
"The installer runs as root, so it can open the device": "インストーラーは root として実行されるため、デバイスを開くことができます"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} のロック解除は一度だけ、Windows パソコンで行います。GammaOS Next のインストールガイド（Unisoc T820、ステップ 1 と 2）にある UnlockBootloader ツールは Windows でしか動作しません。まず、ガイドの UnisocTools から Unisoc USB ドライバーをインストールします。次に {device} の電源を切ってケーブルを抜き、UnlockBootloader.bat を起動して、30 秒以内に戻るボタン（画面の右側にあるボタン）を押し、押したまま USB ケーブルを接続します。画面に文字が表示されたらボタンを離します。ロック解除すると {device} は消去されます。インストーラーはこのツールを実行しません。ガイドの手順を終えたら、ここに戻って続行してください。"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} のロック解除は一度だけ、Windows パソコンで行います。GammaOS Next のインストールガイド（Unisoc T820、ステップ 1 と 2）にある UnlockBootloader ツールは Windows でしか動作しません。まず、ガイドの UnisocTools から Unisoc USB ドライバーをインストールします。次に {device} の電源を切ってケーブルを抜き、UnlockBootloader.bat を起動して、30 秒以内に戻るボタンを押し、押したまま USB ケーブルを接続します。画面に文字が表示されたらボタンを離します。ロック解除すると {device} は消去されます。インストーラーはこのツールを実行しません。ガイドの手順を終えたら、ここに戻って続行してください。"
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "{device} のロック解除は一度だけ、GammaOS Next のインストールガイド（Anbernic RG405M / RG405V / RG505、ステップ 2）にある Web ロック解除ツールで行います。microSD カードを取り出し、「開発者向けオプション」で「USB デバッグ」をオンにしてから、adb reboot bootloader で {device} を fastboot モードで再起動します。画面には Anbernic のロゴの横に fastboot mode と表示されます。Google Chrome でツールを開き、「Connect」をクリックしてデバイスを選び、「Unlock」をクリックします。{device} では音量ダウンボタンを押さず、ホーム / 戻るボタンを押して確定してください。Linux または macOS では、ガイドの unisoc-unlock ツールで同じことができます。ロック解除すると {device} は消去されます。インストーラーはこれらのツールを実行しません。ガイドの手順を終えたら、ここに戻って続行してください。"
"The {profile} profile isn't published yet. Choose a profile marked available.": "{profile} プロファイルはまだ公開されていません。「利用可能」と表示されたプロファイルを選んでください。"
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "このデバイスでは対応する Thimsy または GammaOS ビルドが動作していないため、アップデートできません。代わりにフルインストールを行ってください（デバイスは消去されます）。"
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "このデバイスのパーティション構成はこのファームウェアと一致しません。別の機種か、まだ純正ファームウェアのままでパーティションの再構成が必要です。このバージョンではまだ再構成できません。"
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "このドライブは FAT32 でフォーマットされているため、4 GB を超えるファイルを保存できません。別のドライブ（NTFS、exFAT、APFS、ext4）にある作業フォルダーを選んでください。"
"This version of the installer expects a different build. Build again, then install.": "このバージョンのインストーラーは別のビルドを想定しています。もう一度ビルドしてからインストールしてください。"
"Turn it on": "電源を入れる"
"Turn on OEM unlocking": "OEM ロック解除をオンにする"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "{device} の電源を切り、ケーブルを抜きます。戻るボタンとその隣の Anbernic ボタンを押したまま、USB ケーブルをこのパソコンに接続します。インストールが始まるまで押し続けてください。"
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device} の電源を切り、ケーブルを抜きます。戻るボタンを押したまま、USB ケーブルをこのパソコンに接続します。インストールが始まるまで押し続けてください。"
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device} の電源を切り、ケーブルを抜きます。戻るボタン（画面の右側にあるボタン）を押したまま、USB ケーブルをこのパソコンに接続します。インストールが始まるまで押し続けてください。"
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "{device} の電源を完全に切り、ケーブルを抜きます。音量ダウンボタンと音量アップボタンを同時に押したまま、USB ケーブルをこのパソコンに接続します。インストールが始まるまで押し続けてください。"
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "{device} の電源を完全に切ります。インストーラーの指示が出たら、USB ケーブルをこのパソコンに接続し、インストールが終わるまで接続したままにしてください。"
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "{device} の電源を切り、カードを入れて電源を入れます。カードから内部ストレージへ自動でインストールされ、数分かかります。自動で電源が切れるか再起動するまで触らずに待ち、その後カードを取り出してください。"
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "{device} の電源を切り、カードを入れて電源を入れます。カードから内部ストレージへ自動でインストールされます。終わるまで触らずに待ち、終わったら電源を切ってカードを取り出してください。"
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device} の電源を切ってケーブルを抜き、SD カードをすべて取り出します。スライドを開き、十字キーの中央にある戻るボタンを押したまま、USB ケーブルをこのパソコンに接続します。インストールが始まるまで押し続けてください。"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "「開発者向けオプション」で「USB デバッグ」をオンにしたまま {device} の電源を入れ、このパソコンに接続します。自動で再起動し、インストールが始まります。"
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "「開発者向けオプション」で「USB デバッグ」をオンにしたまま {device} の電源を入れ、このパソコンに接続します。インストールのために fastboot モードで再起動します。"
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "{ids} の USB アクセスはまだ設定されていません。設定時にパスワードを一度だけ求められます。"
"USB access is set up for {ids}": "{ids} の USB アクセスは設定済みです"
"Unlock before flashing": "書き込み前にロック解除する"
"Unlock with GammaOS's own steps": "GammaOS の手順でロック解除する"
"Unpacking the firmware": "ファームウェアを展開しています"
"Unpacking {file}": "{file} を展開しています"
"Unplug it and turn it on": "ケーブルを抜いて電源を入れる"
"Unplug the cable when it restarts": "再起動したらケーブルを抜く"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "ケーブルを抜きます。電源ボタンと音量ダウンボタンを 60 秒以上押し続け、押したまま USB ケーブルを接続します。インストールが始まるまで押し続けてください。{device} が認識されるまで 30 秒以上かかることがあります。"
"Updating checksums": "チェックサムを更新しています"
"Use a Windows PC": "Windows パソコンを使う"
"Use the firmware version the catalog lists for this device.": "カタログでこのデバイス用に指定されているファームウェアのバージョンを使用してください。"
"Use the volume keys to choose Unlock, then press Power.": "音量ボタンで「Unlock」を選び、電源ボタンを押します。"
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "初回起動を待つ"
"Wait on the Anbernic logo": "Anbernic のロゴで待つ"
"Wait through a blank screen": "何も表示されない画面のまま待つ"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "インストールが終わっても {device} が自動で再起動しない場合は、電源ボタンを 1 回押してください。"
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "インストールが終わると、{device} は自動で再起動してストレージをセットアップします。そのときにケーブルを抜いてください。"
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "インストールが終わったら、ケーブルを抜き、電源ボタンを押して {device} の電源を入れてください。"
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "画面に INFO: LOCK FLAG IS: UNLOCK!!! と表示されたら、ロック解除は完了です。ケーブルを抜き、{device} の電源が切れていることを確認してから（再起動した場合は、電源が切れるまで電源ボタンを押し続けてください）、続行してください。"
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "画面に Unlock bootloader success! と表示されたら、ロック解除は完了です。{device} の起動時にすでに INFO: LOCK FLAG IS : UNLOCK!!! が一瞬表示される場合は、以前にロック解除済みなので、ロック解除は省略できます。"
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "{device} で確認を求められたら、3 秒以内に音量アップボタンを押してロック解除を確定してください。"
"WinUSB is installed for {ids}": "{ids} に WinUSB がインストールされています"
"WinUSB will be installed for {ids} the first time you flash": "初回の書き込み時に {ids} に WinUSB がインストールされます"
"Windows asks for permission next. Click Yes so the installer can give your device the USB driver it needs as soon as you connect it. Don't connect it yet.": "次に Windows が許可を求めます。[はい] をクリックすると、デバイスを接続した直後に、インストーラーが必要な USB ドライバーをデバイスに割り当てられます。まだ接続しないでください。"
"Windows now gives the device the driver the installer needs. Unplug the cable and turn the device off, then repeat the download-mode steps with the same USB port.": "Windows が、インストーラーに必要なドライバーをデバイスに割り当てました。ケーブルを抜いてデバイスの電源を切り、同じ USB ポートでダウンロードモードの手順をやり直してください。"
"WonderSwan": "WonderSwan"
"Writing {partition}": "{partition} を書き込んでいます"
"Wrote {partition}": "{partition} を書き込みました"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "お使いの {device} はすでに GammaOS または Thimsy で動作しています。新しいファームウェアのインストール方法を選んでください。"
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "お使いの {device} はすでにカスタムファームウェアで動作しています（以前にロック解除済み）。ロック解除はスキップされます。"
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "お使いの {device} はまだ純正ファームウェアで動作しています。インストーラーがロック解除の手順を案内し、その後デバイスを消去するクリーンインストールを行います。"
"hakuX": "hakuX"
"needs Android API {n}": "Android API {n} が必要"
"needs Vulkan": "Vulkan が必要"
"needs an ARMv8.2 CPU": "ARMv8.2 CPU が必要"
"needs {n} GB RAM": "{n} GB の RAM が必要"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} は {host} からインストールできません。Windows パソコンで Thimsy Installer を実行してインストールしてください。"
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} は Allwinner の PhoenixSuit でインストールしますが、これは Windows でしか動作しません。Windows パソコンで Thimsy Installer を実行してインストールしてください。"
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} は MediaTek の SP Flash Tool でインストールしますが、これは {host} では動作しません。Windows パソコンで Thimsy Installer を実行してインストールしてください。"
"{device} isn't supported by this version of the installer yet.": "{device} はこのバージョンのインストーラーではまだサポートされていません。"
"{host} needs no driver": "{host} ではドライバーは不要です"
