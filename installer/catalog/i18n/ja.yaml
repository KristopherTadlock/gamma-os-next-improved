# Japanese translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "クリーンインストールを行うと内部ストレージが消去されます。ROMs、セーブデータ、スクリーンショットなど残しておきたいものはすべてパソコンか microSD カードにコピーしてください。microSD カード上のゲームには影響しません。"
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Windows の許可を求めるメッセージを承認するか、Zadig で WinUSB をインストールしてください。"
"Already unlocked: install new firmware": "ロック解除済み：新しいファームウェアをインストール"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "バランス：クラシック機向けの RetroArch に加え、N64、Dreamcast、PSP、DS のエミュレーター、ES-DE ホーム画面、Brave。"
"Building Thimsy for your device": "お使いのデバイス向けに Thimsy をビルドしています"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "GammaOS の GitHub ページからダウンロードした、RG Cube 向け公式 GammaOS Next 1.2 リリースをもとにビルドしています。"
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "始める前に 50% 以上充電し、付属のケーブルを手元に用意してください。"
"Charge the RG Cube": "RG Cube を充電する"
"Check it's unlocked": "ロック解除されていることを確認する"
"Check the basics": "基本動作を確認する"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "ボタン、タッチスクリーン、サウンド、Wi-Fi を確認し、ゲームを起動してください。"
"Check the cable and that the device is still in its flashing mode, then try again.": "ケーブルと、デバイスがまだ書き込みモードになっていることを確認して、もう一度お試しください。"
"Checking the USB driver": "USB ドライバーを確認しています"
"Checking the build": "ビルドを確認しています"
"Checking the plan": "プランを確認しています"
"Checking the result": "結果を確認しています"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "空き容量の多いドライブ（FAT32 以外）にある作業フォルダーを選ぶか、空き容量を増やしてください。"
"Confirm on the device": "デバイスで確認する"
"Connect the device in download mode": "ダウンロードモードでデバイスを接続する"
"Copy your games and saves": "ゲームとセーブデータをコピーする"
"Delete the workspace's jobs folder and build again; report it if it persists.": "作業フォルダー内の「jobs」フォルダーを削除して、もう一度ビルドしてください。解決しない場合は報告してください。"
"Don't install on units made in March 2026 or later.": "2026年3月以降に製造された本体にはインストールしないでください。"
"Don't install on units whose stock firmware is v1.26.": "純正ファームウェアが v1.26 の本体にはインストールしないでください。"
"Downloading": "ダウンロード中"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "すべて：ミディアムに加えて GameCube/Wii、3DS、PS2、Xbox、PS Vita のエミュレーターと高精度コア。Thimsy 1.0a のフルセットです。"
"Finishing": "仕上げ中"
"First time installing custom firmware": "カスタムファームウェアを初めてインストールする"
"Follow the unlock steps shown in the installer, then continue.": "インストーラーに表示されるロック解除の手順に従ってから、続行してください。"
"Heavy": "ヘビー"
"Hold Volume Down and plug in the cable": "音量ダウンボタンを押しながらケーブルを接続する"
"Installing Thimsy": "Thimsy をインストールしています"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "データを保持します。RG Cube ですでに GammaOS Next 1.2 または Thimsy ビルドが動作している場合のみ。"
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "データを保持します。デバイスですでに互換性のある Thimsy または GammaOS ビルドが動作している場合のみ。"
"Light": "ライト"
"Medium": "ミディアム"
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "予定：すべてのパソコンで Qualcomm EDL によるインストール。まだビルドできません。"
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "予定：Windows と Linux で SP Flash Tool を使用。まだビルドできません。"
"Planned: Windows only. Not buildable yet.": "予定：Windows のみ。まだビルドできません。"
"Planned: fastboot install on every computer. Not buildable yet.": "予定：すべてのパソコンで fastboot によるインストール。まだビルドできません。"
"Planned: microSD card install on every computer. Not buildable yet.": "予定：すべてのパソコンで microSD カードによるインストール。まだビルドできません。"
"Planned: same flashing route as the RG Cube. Not buildable yet.": "予定：RG Cube と同じ書き込み方法。まだビルドできません。"
"Preparing the partitions": "パーティションを準備しています"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Thimsy Installer を再インストールするか、THIMSY_TOOLS_DIR にそれを含むフォルダーを設定してください。"
"Required before flashing; skipping it can brick the device.": "書き込み前に必須です。省略するとデバイスが起動しなくなるおそれがあります。"
"Restarting the device": "デバイスを再起動しています"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "PlayStation までのクラシック機向けの小さなダウンロード：システムごとに高速な RetroArch コアを 1 つ、Minima ホーム画面、シェーダーなし。"
"The RG Cube is unlocked once, with the steps from GammaOS Next's installation guide (the Unisoc T820 section). The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "RG Cube のロック解除は一度だけで、GammaOS Next のインストールガイド（Unisoc T820 のセクション）の手順で行います。インストーラーはそのツールを実行しません。ガイドに従ってから戻り、続行してください。"
"The file is damaged or a different version. Delete it and download again.": "ファイルが破損しているか、バージョンが異なります。削除してもう一度ダウンロードしてください。"
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "初回起動時は Thimsy がエミュレーターを設定するため数分かかります。電源を切らないでください。"
"The installer sends the unlock command; confirm it on the device with Volume Up.": "インストーラーがロック解除コマンドを送信します。デバイスで音量アップボタンを押して確定してください。"
"The {profile} profile isn't published yet. Choose a profile marked available.": "{profile} プロファイルはまだ公開されていません。「利用可能」と表示されたプロファイルを選んでください。"
"Turn the RG Cube off. Hold Volume Down and connect the USB cable to this computer. Keep holding until installation starts. The screen stays black; that's normal.": "RG Cube の電源を切ります。音量ダウンボタンを押しながら、USB ケーブルをこのパソコンに接続します。インストールが始まるまで押し続けてください。画面は黒いままですが、正常です。"
"Unlock in fastboot": "fastboot でロック解除する"
"Unlock with GammaOS's own steps": "GammaOS の手順でロック解除する"
"Unpacking the firmware": "ファームウェアを展開しています"
"Use a Windows PC": "Windows パソコンを使う"
"Use the firmware version the catalog lists for this device.": "カタログでこのデバイス用に指定されているファームウェアのバージョンを使用してください。"
"Use the volume keys to choose Unlock, then press Power.": "音量ボタンで「Unlock」を選び、電源ボタンを押します。"
"Wait for the first boot": "初回起動を待つ"
"When the device shows LOCK FLAG IS: UNLOCK, it's unlocked. Turn it off and continue.": "デバイスに LOCK FLAG IS: UNLOCK と表示されたら、ロック解除は完了です。電源を切って続行してください。"
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "お使いの {device} はすでにカスタムファームウェアで動作しています（以前にロック解除済み）。ロック解除はスキップされます。"
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "お使いの {device} は純正ファームウェアで動作しています。インストーラーはデバイスを消去するクリーンインストールを行います。"
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "お使いの {device} はまだ純正ファームウェアで動作しています。インストーラーがロック解除の手順を案内し、その後デバイスを消去するクリーンインストールを行います。"
"needs Android API {n}": "Android API {n} が必要"
"needs Vulkan": "Vulkan が必要"
"needs an ARMv8.2 CPU": "ARMv8.2 CPU が必要"
"needs {n} GB RAM": "{n} GB の RAM が必要"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} は {host} からインストールできません。Windows パソコンで Thimsy Installer を実行してインストールしてください。"
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} は Allwinner の PhoenixSuit でインストールしますが、これは Windows でしか動作しません。Windows パソコンで Thimsy Installer を実行してインストールしてください。"
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} は MediaTek の SP Flash Tool でインストールしますが、これは {host} では動作しません。Windows パソコンで Thimsy Installer を実行してインストールしてください。"
"{device} isn't supported by this version of the installer yet.": "{device} はこのバージョンのインストーラーではまだサポートされていません。"
