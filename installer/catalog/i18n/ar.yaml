# Arabic translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "يؤدي التثبيت النظيف إلى مسح وحدة التخزين الداخلية. انسخ ملفات ROMs وحفظ الألعاب ولقطات الشاشة وأي شيء آخر تريد الاحتفاظ به إلى الكمبيوتر أو بطاقة microSD. لن تُمس الألعاب الموجودة على بطاقة microSD."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "وافق على طلب الإذن في Windows، أو ثبّت WinUSB باستخدام Zadig."
"Already unlocked: install new firmware": "مفتوح القفل بالفعل: تثبيت برنامج ثابت جديد"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "متوازن: RetroArch للأنظمة الكلاسيكية بالإضافة إلى محاكيات N64 وDreamcast وPSP وDS، وواجهة ES-DE الرئيسية، وBrave."
"Building Thimsy for your device": "جارٍ إنشاء Thimsy لجهازك"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "مبني على إصدار GammaOS Next 1.2 الرسمي لجهاز RG Cube، والذي تم تنزيله من صفحة GammaOS على GitHub."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "اشحن الجهاز إلى 50% على الأقل قبل البدء، واحتفظ بالكابل المرفق معه في متناول يدك."
"Charge the RG Cube": "اشحن RG Cube"
"Check it's unlocked": "تحقق من فتح القفل"
"Check the basics": "تحقق من الأساسيات"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "تحقق من الأزرار وشاشة اللمس والصوت وWi-Fi، ثم ابدأ لعبة."
"Check the cable and that the device is still in its flashing mode, then try again.": "تحقق من الكابل ومن أن الجهاز لا يزال في وضع التفليش، ثم حاول مرة أخرى."
"Checking the USB driver": "جارٍ التحقق من برنامج تشغيل USB"
"Checking the build": "جارٍ التحقق من الإصدار المبني"
"Checking the plan": "جارٍ التحقق من الخطة"
"Checking the result": "جارٍ التحقق من النتيجة"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "اختر مساحة عمل على محرك أقراص به مساحة خالية أكبر (ليس FAT32)، أو أفرغ بعض المساحة."
"Confirm on the device": "أكّد على الجهاز"
"Confirm with Volume Up": "أكّد بزر رفع الصوت"
"Connect it with USB debugging on": "وصّله مع تفعيل تصحيح أخطاء USB"
"Connect the device in download mode": "وصّل الجهاز في وضع التنزيل"
"Copy games without a card reader": "انسخ الألعاب دون قارئ بطاقات"
"Copy your games and saves": "انسخ ألعابك وملفات الحفظ"
"Delete the workspace's jobs folder and build again; report it if it persists.": "احذف مجلد \"jobs\" في مساحة العمل وأعد البناء؛ وأبلغ عن المشكلة إذا استمرت."
"Don't install on units made in March 2026 or later.": "لا تثبّت على الأجهزة المصنوعة في مارس 2026 أو بعده."
"Don't install on units whose stock firmware is v1.26.": "لا تثبّت على الأجهزة التي يكون برنامجها الثابت الأصلي v1.26."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "لا تُعد البطاقة إلى الكمبيوتر لنسخ الألعاب: فهي تحتوي على تخطيط Android مشفّر، لذا لن يعرض الكمبيوتر مساحة التخزين لديك. انسخ الألعاب بدلًا من ذلك عبر نقل الملفات بـ USB (MTP)، أو باستخدام ADB Explorer، أو من مجلد مشترك على الشبكة."
"Downloading": "جارٍ التنزيل"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "كل شيء: متوسط بالإضافة إلى محاكيات GameCube/Wii و3DS وPS2 وXbox وPS Vita والنوى عالية الدقة. مجموعة Thimsy 1.0a الكاملة."
"Finishing": "جارٍ الإنهاء"
"First time installing custom firmware": "أول مرة أثبّت فيها برنامجًا ثابتًا مخصصًا"
"Follow the unlock steps shown in the installer, then continue.": "اتبع خطوات فتح القفل المعروضة في أداة التثبيت، ثم تابع."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "يحذّر دليل GammaOS من أن تثبيت البرنامج الثابت على جهاز {device} غير مفتوح القفل يعطّله تمامًا. بعد فتح القفل، يُعاد تشغيل جهاز {device} إلى نظام Android الأصلي. انتظر حتى يبدأ Android، ثم تابع."
"Heavy": "كامل"
"Hold Back and plug in the cable": "اضغط مع الاستمرار على زر الرجوع ووصّل الكابل"
"Hold Back and the Anbernic button, then plug in": "اضغط مع الاستمرار على زر الرجوع وزر Anbernic ثم وصّل الكابل"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "اضغط مع الاستمرار على زر التشغيل لإطفاء جهاز {device}. اضغط مع الاستمرار على زرَّي الصوت كليهما، ودون إفلاتهما وصّل كابل USB. ثم اضغط على زر التشغيل مرارًا مع إبقاء زرَّي الصوت مضغوطين حتى يبدأ التثبيت."
"Hold both volume buttons and plug in the cable": "اضغط مع الاستمرار على زرَّي الصوت كليهما ووصّل الكابل"
"Hold the Back button, Volume Down and Power together until installation starts again.": "اضغط مع الاستمرار على زر الرجوع وزر خفض الصوت وزر التشغيل معًا حتى يبدأ التثبيت من جديد."
"If installation doesn't start": "إذا لم يبدأ التثبيت"
"If installation stalls": "إذا توقف التثبيت"
"If it isn't found": "إذا لم يُعثر على الجهاز"
"If the screen stays black": "إذا بقيت الشاشة سوداء"
"Install from the microSD card": "ثبّت من بطاقة microSD"
"Installing Thimsy": "جارٍ تثبيت Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "يحتفظ ببياناتك. فقط إذا كان RG Cube يعمل بالفعل بنظام GammaOS Next 1.2 أو بإصدار من Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "يحتفظ ببياناتك. فقط إذا كان الجهاز يعمل بالفعل بإصدار متوافق من Thimsy أو GammaOS."
"Light": "خفيف"
"Medium": "متوسط"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "في التشغيل الأول تمامًا قد تبقى الشاشة فارغة لمدة تصل إلى دقيقة. هذا طبيعي؛ انتظر حتى تظهر شاشة الإقلاع."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "على جهاز {device}، افتح الإعدادات ثم حول الهاتف، واضغط على رقم الإصدار سبع مرات. بعد ذلك، في الإعدادات ثم خيارات المطوّر، فعّل تصحيح أخطاء USB وإلغاء قفل OEM. وصّل جهاز {device} بهذا الكمبيوتر وهو قيد التشغيل؛ سيُعاد تشغيله في وضع fastboot من أجل التثبيت."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "على جهاز {device}، افتح الإعدادات ثم حول الهاتف، واضغط على رقم الإصدار سبع مرات. بعد ذلك، في الإعدادات ثم خيارات المطوّر، فعّل تصحيح أخطاء USB وإلغاء قفل OEM. وصّل جهاز {device} بهذا الكمبيوتر وهو قيد التشغيل؛ سيُعاد تشغيله في وضع fastboot من أجل فتح القفل."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "مخطط له: التثبيت عبر Qualcomm EDL على أي كمبيوتر. غير متاح للبناء بعد."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "مخطط له: SP Flash Tool على Windows وLinux. غير متاح للبناء بعد."
"Planned: Windows only. Not buildable yet.": "مخطط له: Windows فقط. غير متاح للبناء بعد."
"Planned: fastboot install on every computer. Not buildable yet.": "مخطط له: التثبيت عبر fastboot على أي كمبيوتر. غير متاح للبناء بعد."
"Planned: microSD card install on every computer. Not buildable yet.": "مخطط له: التثبيت عبر بطاقة microSD على أي كمبيوتر. غير متاح للبناء بعد."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "مخطط له: طريقة التفليش نفسها المستخدمة مع RG Cube. غير متاح للبناء بعد."
"Plug in the cable with the device off": "وصّل الكابل والجهاز مطفأ"
"Preparing the partitions": "جارٍ تجهيز الأقسام"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "ضع البطاقة في جهاز {device} وشغّله. يعمل Thimsy من البطاقة ويترك وحدة التخزين الداخلية لجهاز {device} دون مساس: للعودة إلى النظام الأصلي، أطفئه وأخرج البطاقة."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "أعد تثبيت Thimsy Installer، أو اضبط THIMSY_TOOLS_DIR على مجلد يحتوي عليه."
"Restart into fastbootd": "أعد التشغيل في fastbootd"
"Restart with Power": "أعد التشغيل بزر التشغيل"
"Restarting the device": "جارٍ إعادة تشغيل الجهاز"
"Slide it open, hold Back and plug in": "افتحه بالانزلاق، واضغط مع الاستمرار على زر الرجوع، ثم وصّل الكابل"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "تنزيل صغير للأنظمة الكلاسيكية حتى PlayStation: نواة RetroArch سريعة واحدة لكل نظام، وواجهة Minima الرئيسية، بدون مؤثرات تظليل."
"Start from the microSD card": "ابدأ التشغيل من بطاقة microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "أخرج أي بطاقة microSD أخرى من جهاز {device}، وضع بطاقة Thimsy وشغّله. يعمل Thimsy من البطاقة ويترك وحدة التخزين الداخلية دون مساس: للعودة إلى النظام الأصلي، أطفئه وأخرج البطاقة."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "أخرج أي بطاقة SD، ثم اضغط مع الاستمرار على زر خفض الصوت وزر التشغيل حتى يُعاد تشغيل جهاز {device}."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "أخرج بطاقة microSD وفعّل تصحيح أخطاء USB في خيارات المطوّر. وصّل جهاز {device} بهذا الكمبيوتر وهو قيد التشغيل. سيُعاد تشغيله في fastbootd: تعرض الشاشة fastbootd بنص أحمر كبير."
"The file is damaged or a different version. Delete it and download again.": "الملف تالف أو من إصدار مختلف. احذفه ونزّله مرة أخرى."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "قد يستغرق التشغيل الأول من 1 إلى 3 دقائق وقد يبدو عالقًا على شعار Anbernic. هذا طبيعي."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "يستغرق التشغيل الأول من 1 إلى 3 دقائق، وقد تبدو الشاشة عالقة على شعار الإقلاع. هذا طبيعي."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "يستغرق التشغيل الأول بضع دقائق بينما يُعدّ Thimsy المحاكيات. لا تطفئ الجهاز."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "يُفتح قفل جهاز {device} مرة واحدة باستخدام أداة UnlockBootloader من دليل تثبيت GammaOS Next (Unisoc T820، الخطوة 2): أطفئ جهاز {device}، وشغّل الأداة، ثم اضغط مع الاستمرار على زر الرجوع أثناء توصيل كابل USB. لا تشغّل أداة التثبيت تلك الأداة بنفسها. اتبع الدليل، ثم عد وتابع."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "يُفتح قفل جهاز {device} مرة واحدة باستخدام أداة UnlockBootloader من دليل تثبيت GammaOS Next (Unisoc T820، الخطوة 2): أطفئ جهاز {device}، وشغّل الأداة، ثم اضغط مع الاستمرار على زر الرجوع، وهو الزر الموجود على الجانب الأيمن من الشاشة، أثناء توصيل كابل USB. لا تشغّل أداة التثبيت تلك الأداة بنفسها. اتبع الدليل، ثم عد وتابع."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "يُفتح قفل جهاز {device} مرة واحدة باستخدام أداة فتح القفل على الويب من دليل تثبيت GammaOS Next (Anbernic RG405M / RG405V / RG505، الخطوة 2). أعد تشغيل جهاز {device} في وضع fastboot، وافتح الأداة في Google Chrome، وانقر على \"Connect\" ثم \"Unlock\". على جهاز {device}، لا تضغط على زر خفض الصوت: اضغط على زر الشاشة الرئيسية / الرجوع للتأكيد. لا تشغّل أداة التثبيت تلك الأداة بنفسها. اتبع الدليل، ثم عد وتابع."
"The {profile} profile isn't published yet. Choose a profile marked available.": "لم يُنشر ملف التعريف {profile} بعد. اختر ملف تعريف مُعلَّمًا بأنه متاح."
"Turn on OEM unlocking": "فعّل إلغاء قفل OEM"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "أطفئ جهاز {device} وافصل الكابل. اضغط مع الاستمرار على زر الرجوع وزر Anbernic المجاور له، ودون إفلاتهما وصّل كابل USB بهذا الكمبيوتر. واصل الضغط حتى يبدأ التثبيت."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "أطفئ جهاز {device} وافصل الكابل. اضغط مع الاستمرار على زر الرجوع، ودون إفلاته وصّل كابل USB بهذا الكمبيوتر. واصل الضغط حتى يبدأ التثبيت."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "أطفئ جهاز {device} وافصل الكابل. اضغط مع الاستمرار على زر الرجوع، وهو الزر الموجود على الجانب الأيمن من الشاشة، ودون إفلاته وصّل كابل USB بهذا الكمبيوتر. واصل الضغط حتى يبدأ التثبيت."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "أطفئ جهاز {device} تمامًا وافصل الكابل. اضغط مع الاستمرار على زر خفض الصوت وزر رفع الصوت معًا، ودون إفلاتهما وصّل كابل USB بهذا الكمبيوتر. واصل الضغط حتى يبدأ التثبيت."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "أطفئ جهاز {device} تمامًا. عندما تطلب أداة التثبيت ذلك، وصّل كابل USB بهذا الكمبيوتر."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "أطفئ جهاز {device}، وضع البطاقة، ثم شغّله. سيثبّت النظام على وحدة التخزين الداخلية من البطاقة تلقائيًا. اتركه حتى ينتهي، ثم أطفئه وأخرج البطاقة."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "أطفئ جهاز {device}، وافصل الكابل، وأخرج كل بطاقات SD. افتحه بالانزلاق، ثم اضغط مع الاستمرار على زر الرجوع الموجود في منتصف لوحة التحكم، ودون إفلاته وصّل كابل USB بهذا الكمبيوتر. واصل الضغط حتى يبدأ التثبيت."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "شغّل جهاز {device} مع إبقاء تصحيح أخطاء USB مفعّلًا في خيارات المطوّر، ووصّله بهذا الكمبيوتر. سيُعاد تشغيله تلقائيًا ويبدأ التثبيت."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "شغّل جهاز {device} مع إبقاء تصحيح أخطاء USB مفعّلًا في خيارات المطوّر، ووصّله بهذا الكمبيوتر. سيُعاد تشغيله في وضع fastboot من أجل التثبيت."
"Unlock before flashing": "افتح القفل قبل تثبيت البرنامج الثابت"
"Unlock with GammaOS's own steps": "افتح القفل بخطوات GammaOS الخاصة"
"Unpacking the firmware": "جارٍ فك ضغط البرنامج الثابت"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "افصل الكابل. اضغط مع الاستمرار على زر التشغيل وزر خفض الصوت لمدة 60 ثانية على الأقل، ثم وصّل كابل USB دون إفلاتهما. واصل الضغط حتى يبدأ التثبيت؛ قد يستغرق العثور على جهاز {device} 30 ثانية أو أكثر."
"Use a Windows PC": "استخدم كمبيوتر يعمل بنظام Windows"
"Use the firmware version the catalog lists for this device.": "استخدم إصدار البرنامج الثابت المذكور في الكتالوج لهذا الجهاز."
"Use the volume keys to choose Unlock, then press Power.": "استخدم أزرار الصوت لاختيار \"Unlock\"، ثم اضغط على زر التشغيل."
"Wait for the first boot": "انتظر التشغيل الأول"
"Wait on the Anbernic logo": "انتظر عند شعار Anbernic"
"Wait through a blank screen": "انتظر حتى لو كانت الشاشة فارغة"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "عند انتهاء التثبيت، اضغط على زر التشغيل مرة واحدة إذا لم يُعد جهاز {device} التشغيل من تلقاء نفسه."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "عندما تعرض الشاشة INFO: LOCK FLAG IS: UNLOCK!!! يكون القفل قد فُتح. افصل الكابل، وتأكد من أن جهاز {device} مطفأ، ثم تابع."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "عندما تعرض الشاشة Unlock bootloader success! يكون القفل قد فُتح. إذا كان جهاز {device} يعرض بالفعل INFO: LOCK FLAG IS : UNLOCK!!! لفترة وجيزة عند تشغيله، فقد فُتح قفله من قبل ويمكنك تخطي فتح القفل."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "عندما يطلب جهاز {device} ذلك، اضغط على زر رفع الصوت خلال 3 ثوانٍ لتأكيد فتح القفل."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "يعمل جهاز {device} لديك ببرنامج ثابت مخصص بالفعل (فُتح قفله من قبل). سيتم تخطي فتح القفل."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "يعمل جهاز {device} لديك ببرنامجه الثابت الأصلي. تُجري أداة التثبيت تثبيتًا نظيفًا يمسح الجهاز."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "لا يزال جهاز {device} لديك يعمل ببرنامجه الثابت الأصلي. سترشدك أداة التثبيت خلال فتح قفله، ثم تُجري تثبيتًا نظيفًا يمسح الجهاز."
"needs Android API {n}": "يتطلب Android API {n}"
"needs Vulkan": "يتطلب Vulkan"
"needs an ARMv8.2 CPU": "يتطلب معالج ARMv8.2"
"needs {n} GB RAM": "يتطلب {n} GB من ذاكرة RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "لا يمكن تثبيت {device} من {host}. شغّل Thimsy Installer على كمبيوتر يعمل بنظام Windows لتثبيته."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "يُثبَّت {device} باستخدام PhoenixSuit من Allwinner، الذي يعمل على Windows فقط. شغّل Thimsy Installer على كمبيوتر يعمل بنظام Windows لتثبيته."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "يُثبَّت {device} باستخدام SP Flash Tool من MediaTek، الذي لا يعمل على {host}. شغّل Thimsy Installer على كمبيوتر يعمل بنظام Windows لتثبيته."
"{device} isn't supported by this version of the installer yet.": "لا يدعم هذا الإصدار من أداة التثبيت {device} بعد."
