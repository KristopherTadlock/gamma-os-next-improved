"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "تنزيل صغير للأنظمة الكلاسيكية حتى PlayStation: نواة RetroArch سريعة واحدة لكل نظام، وواجهة Minima الرئيسية، بدون مؤثرات تظليل."
"Start from the microSD card": "ابدأ التشغيل من بطاقة microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "أخرج أي بطاقة microSD أخرى من جهاز {device}، وضع بطاقة Thimsy وشغّله. يعمل Thimsy من البطاقة ويترك وحدة التخزين الداخلية دون مساس: للعودة إلى النظام الأصلي، أطفئه وأخرج البطاقة."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "أخرج أي بطاقة SD، ثم اضغط مع الاستمرار على زر خفض الصوت وزر التشغيل حتى يُعاد تشغيل جهاز {device}."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "أخرج بطاقة microSD وفعّل تصحيح أخطاء USB في خيارات المطوّر. وصّل جهاز {device} بهذا الكمبيوتر وهو قيد التشغيل. سيُعاد تشغيله في fastbootd: تعرض الشاشة fastbootd بنص أحمر كبير."
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "قد يكون محرك الأقراص الذي توجد عليه مساحة العمل على وشك التعطل. اختر مساحة عمل على محرك أقراص آخر وأعد البناء."
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "مثبّت برنامج التشغيل غير مضمّن في هذا الإصدار. ثبّت WinUSB لوضع التنزيل في الجهاز باستخدام Zadig."
"The file is damaged or a different version. Delete it and download again.": "الملف تالف أو من إصدار مختلف. احذفه ونزّله مرة أخرى."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "قد يستغرق التشغيل الأول من 1 إلى 3 دقائق وقد يبدو عالقًا على شعار Anbernic. هذا طبيعي."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "يستغرق التشغيل الأول من 1 إلى 3 دقائق، وقد تبدو الشاشة عالقة على شعار الإقلاع. هذا طبيعي."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "يستغرق التشغيل الأول بضع دقائق بينما يُعدّ Thimsy المحاكيات. لا تطفئ الجهاز."
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "تعذّر التحقق من المساحة الخالية على محرك الأقراص هذا. اختر مجلدًا آخر لمساحة العمل."
"The installer does a fresh install that erases your {device}, whatever it runs now.": "تُجري أداة التثبيت تثبيتًا نظيفًا يمسح جهاز {device} لديك، أيًّا كان ما يعمل عليه الآن."
"The installer runs as root, so it can open the device": "يعمل المثبّت بصلاحيات root، لذا يمكنه فتح الجهاز"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "يُفتح قفل جهاز {device} مرة واحدة على كمبيوتر يعمل بنظام Windows: لا تعمل أداة UnlockBootloader من دليل تثبيت GammaOS Next (Unisoc T820، الخطوتان 1 و2) إلا على Windows. ثبّت أولًا برنامج تشغيل USB من Unisoc من UnisocTools الموجودة في الدليل. ثم أطفئ جهاز {device} وافصل الكابل، وشغّل UnlockBootloader.bat، وفي غضون 30 ثانية اضغط مع الاستمرار على زر الرجوع (الزر الموجود على الجانب الأيمن من الشاشة)، ودون إفلاته وصّل كابل USB. أفلته عندما يظهر نص على الشاشة. يؤدي فتح القفل إلى مسح جهاز {device}. لا تشغّل أداة التثبيت تلك الأداة بنفسها. اتبع الدليل، ثم عد وتابع."
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "يُفتح قفل جهاز {device} مرة واحدة على كمبيوتر يعمل بنظام Windows: لا تعمل أداة UnlockBootloader من دليل تثبيت GammaOS Next (Unisoc T820، الخطوتان 1 و2) إلا على Windows. ثبّت أولًا برنامج تشغيل USB من Unisoc من UnisocTools الموجودة في الدليل. ثم أطفئ جهاز {device} وافصل الكابل، وشغّل UnlockBootloader.bat، وفي غضون 30 ثانية اضغط مع الاستمرار على زر الرجوع، ودون إفلاته وصّل كابل USB. أفلته عندما يظهر نص على الشاشة. يؤدي فتح القفل إلى مسح جهاز {device}. لا تشغّل أداة التثبيت تلك الأداة بنفسها. اتبع الدليل، ثم عد وتابع."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "يُفتح قفل جهاز {device} مرة واحدة باستخدام أداة فتح القفل على الويب من دليل تثبيت GammaOS Next (Anbernic RG405M / RG405V / RG505، الخطوة 2). أخرج بطاقة microSD، وفعّل تصحيح أخطاء USB في خيارات المطوّر، وأعد تشغيل جهاز {device} في وضع fastboot باستخدام adb reboot bootloader: تعرض الشاشة fastboot mode بجوار شعار Anbernic. افتح الأداة في Google Chrome، وانقر على \"Connect\"، واختر الجهاز، ثم انقر على \"Unlock\". على جهاز {device}، لا تضغط على زر خفض الصوت: اضغط على زر الشاشة الرئيسية / الرجوع للتأكيد. على Linux أو macOS، تؤدي أداة unisoc-unlock الموجودة في الدليل المهمة نفسها. يؤدي فتح القفل إلى مسح جهاز {device}. لا تشغّل أداة التثبيت هذه الأدوات بنفسها. اتبع الدليل، ثم عد وتابع."
"The {profile} profile isn't published yet. Choose a profile marked available.": "لم يُنشر ملف التعريف {profile} بعد. اختر ملف تعريف مُعلَّمًا بأنه متاح."
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "لا يعمل هذا الجهاز بإصدار مطابق من Thimsy أو GammaOS، لذا لا يمكن تحديثه. استخدم التثبيت الكامل بدلًا من ذلك (يمحو الجهاز)."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "تخطيط الأقسام في هذا الجهاز لا يطابق هذه البرامج الثابتة: إما أنه طراز مختلف، أو أنه لا يزال يعمل بالبرامج الثابتة الأصلية التي تحتاج إلى إعادة تقسيم، وهو ما لا يستطيع هذا الإصدار فعله بعد."
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "محرك الأقراص هذا مهيأ بنظام FAT32، الذي لا يستوعب ملفات أكبر من 4 غيغابايت. اختر مساحة عمل على محرك أقراص آخر (NTFS أو exFAT أو APFS أو ext4)."
"This version of the installer expects a different build. Build again, then install.": "يتوقع هذا الإصدار من المثبّت إصدارًا مبنيًا مختلفًا. أعد البناء، ثم ثبّت."
"Turn it on": "شغّل الجهاز"
"Turn on OEM unlocking": "فعّل إلغاء قفل OEM"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "أطفئ جهاز {device} وافصل الكابل. اضغط مع الاستمرار على زر الرجوع وزر Anbernic المجاور له، ودون إفلاتهما وصّل كابل USB بهذا الكمبيوتر. واصل الضغط حتى يبدأ التثبيت."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "أطفئ جهاز {device} وافصل الكابل. اضغط مع الاستمرار على زر الرجوع، ودون إفلاته وصّل كابل USB بهذا الكمبيوتر. واصل الضغط حتى يبدأ التثبيت."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "أطفئ جهاز {device} وافصل الكابل. اضغط مع الاستمرار على زر الرجوع، وهو الزر الموجود على الجانب الأيمن من الشاشة، ودون إفلاته وصّل كابل USB بهذا الكمبيوتر. واصل الضغط حتى يبدأ التثبيت."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "أطفئ جهاز {device} تمامًا وافصل الكابل. اضغط مع الاستمرار على زر خفض الصوت وزر رفع الصوت معًا، ودون إفلاتهما وصّل كابل USB بهذا الكمبيوتر. واصل الضغط حتى يبدأ التثبيت."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "أطفئ جهاز {device} تمامًا. عندما تطلب أداة التثبيت ذلك، وصّل كابل USB بهذا الكمبيوتر، واتركه موصولًا حتى ينتهي التثبيت."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "أطفئ جهاز {device}، وضع البطاقة، ثم شغّله. سيثبّت النظام على وحدة التخزين الداخلية من البطاقة تلقائيًا، ويستغرق ذلك بضع دقائق. اتركه حتى ينطفئ أو يُعاد تشغيله من تلقاء نفسه، ثم أخرج البطاقة."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "أطفئ جهاز {device}، وضع البطاقة، ثم شغّله. سيثبّت النظام على وحدة التخزين الداخلية من البطاقة تلقائيًا. اتركه حتى ينتهي، ثم أطفئه وأخرج البطاقة."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "أطفئ جهاز {device}، وافصل الكابل، وأخرج كل بطاقات SD. افتحه بالانزلاق، ثم اضغط مع الاستمرار على زر الرجوع الموجود في منتصف لوحة التحكم، ودون إفلاته وصّل كابل USB بهذا الكمبيوتر. واصل الضغط حتى يبدأ التثبيت."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "شغّل جهاز {device} مع إبقاء تصحيح أخطاء USB مفعّلًا في خيارات المطوّر، ووصّله بهذا الكمبيوتر. سيُعاد تشغيله تلقائيًا ويبدأ التثبيت."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "شغّل جهاز {device} مع إبقاء تصحيح أخطاء USB مفعّلًا في خيارات المطوّر، ووصّله بهذا الكمبيوتر. سيُعاد تشغيله في وضع fastboot من أجل التثبيت."
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "لم يُضبط الوصول عبر USB لـ {ids} بعد. سيطلب ضبطه كلمة المرور مرة واحدة."
"USB access is set up for {ids}": "تم ضبط الوصول عبر USB لـ {ids}"
"Unlock before flashing": "افتح القفل قبل تثبيت البرنامج الثابت"
"Unlock with GammaOS's own steps": "افتح القفل بخطوات GammaOS الخاصة"
"Unpacking the firmware": "جارٍ فك ضغط البرنامج الثابت"
"Unpacking {file}": "جارٍ فك ضغط {file}"
"Unplug it and turn it on": "افصل الكابل وشغّل الجهاز"
"Unplug the cable when it restarts": "افصل الكابل عند إعادة التشغيل"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "افصل الكابل. اضغط مع الاستمرار على زر التشغيل وزر خفض الصوت لمدة 60 ثانية على الأقل، ثم وصّل كابل USB دون إفلاتهما. واصل الضغط حتى يبدأ التثبيت؛ قد يستغرق العثور على جهاز {device} 30 ثانية أو أكثر."
"Updating checksums": "جارٍ تحديث المجاميع الاختبارية"
"Use a Windows PC": "استخدم كمبيوتر يعمل بنظام Windows"
"Use the firmware version the catalog lists for this device.": "استخدم إصدار البرنامج الثابت المذكور في الكتالوج لهذا الجهاز."
"Use the volume keys to choose Unlock, then press Power.": "استخدم أزرار الصوت لاختيار \"Unlock\"، ثم اضغط على زر التشغيل."
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "انتظر التشغيل الأول"
"Wait on the Anbernic logo": "انتظر عند شعار Anbernic"
"Wait through a blank screen": "انتظر حتى لو كانت الشاشة فارغة"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "عند انتهاء التثبيت، اضغط على زر التشغيل مرة واحدة إذا لم يُعد جهاز {device} التشغيل من تلقاء نفسه."
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "عند انتهاء التثبيت، يُعاد تشغيل جهاز {device} من تلقاء نفسه ويُهيّئ وحدة التخزين الخاصة به. افصل الكابل عندئذٍ."
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "عند انتهاء التثبيت، افصل الكابل واضغط على زر التشغيل لتشغيل جهاز {device}."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "عندما تعرض الشاشة INFO: LOCK FLAG IS: UNLOCK!!! يكون القفل قد فُتح. افصل الكابل وتأكد من أن جهاز {device} مطفأ (إذا أُعيد تشغيله، فاضغط مع الاستمرار على زر التشغيل حتى ينطفئ)، ثم تابع."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "عندما تعرض الشاشة Unlock bootloader success! يكون القفل قد فُتح. إذا كان جهاز {device} يعرض بالفعل INFO: LOCK FLAG IS : UNLOCK!!! لفترة وجيزة عند تشغيله، فقد فُتح قفله من قبل ويمكنك تخطي فتح القفل."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "عندما يطلب جهاز {device} ذلك، اضغط على زر رفع الصوت خلال 3 ثوانٍ لتأكيد فتح القفل."
"WinUSB is installed for {ids}": "تم تثبيت WinUSB لـ {ids}"
"WinUSB will be installed for {ids} the first time you flash": "سيُثبَّت WinUSB لـ {ids} في أول مرة تُجري فيها التفليش"
"Windows now gives the device the driver the installer needs. Unplug the cable and turn the device off, then repeat the download-mode steps with the same USB port.": "يمنح Windows الجهاز الآن برنامج التشغيل الذي يحتاجه برنامج التثبيت. افصل الكابل وأوقف تشغيل الجهاز، ثم كرّر خطوات وضع التنزيل باستخدام منفذ USB نفسه."
"WonderSwan": "WonderSwan"
"Writing {partition}": "جارٍ كتابة {partition}"
"Wrote {partition}": "تمت كتابة {partition}"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "يعمل جهاز {device} لديك بالفعل بنظام GammaOS أو Thimsy. اختر طريقة تثبيت البرنامج الثابت الجديد."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "يعمل جهاز {device} لديك ببرنامج ثابت مخصص بالفعل (فُتح قفله من قبل). سيتم تخطي فتح القفل."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "لا يزال جهاز {device} لديك يعمل ببرنامجه الثابت الأصلي. سترشدك أداة التثبيت خلال فتح قفله، ثم تُجري تثبيتًا نظيفًا يمسح الجهاز."
"hakuX": "hakuX"
"needs Android API {n}": "يتطلب Android API {n}"
"needs Vulkan": "يتطلب Vulkan"
"needs an ARMv8.2 CPU": "يتطلب معالج ARMv8.2"
"needs {n} GB RAM": "يتطلب {n} GB من ذاكرة RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "لا يمكن تثبيت {device} من {host}. شغّل Thimsy Installer على كمبيوتر يعمل بنظام Windows لتثبيته."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "يُثبَّت {device} باستخدام PhoenixSuit من Allwinner، الذي يعمل على Windows فقط. شغّل Thimsy Installer على كمبيوتر يعمل بنظام Windows لتثبيته."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "يُثبَّت {device} باستخدام SP Flash Tool من MediaTek، الذي لا يعمل على {host}. شغّل Thimsy Installer على كمبيوتر يعمل بنظام Windows لتثبيته."
"{device} isn't supported by this version of the installer yet.": "لا يدعم هذا الإصدار من أداة التثبيت {device} بعد."
"{host} needs no driver": "لا يحتاج {host} إلى برنامج تشغيل"
