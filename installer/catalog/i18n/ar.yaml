"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "ضع البطاقة في جهاز {device} وشغّله. يعمل Thimsy من البطاقة ويترك وحدة التخزين الداخلية لجهاز {device} دون مساس: للعودة إلى النظام الأصلي، أطفئه وأخرج البطاقة."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "أعد تثبيت Thimsy Installer: أداة الكتابة المرفقة به ليست الإصدار الذي يتوقعه."
"Reinstall Thimsy Installer: one of its tools is missing.": "أعد تثبيت Thimsy Installer: إحدى أدواته مفقودة."
"Repeat the download-mode steps and keep holding the button until installing starts, then try again.": "كرّر خطوات وضع التنزيل واستمر في الضغط على الزر حتى يبدأ التثبيت، ثم حاول مرة أخرى."
"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "كرّر خطوات وضع التنزيل، ثم حاول مرة أخرى. إذا لم يُعثر على الجهاز بعد ذلك، فتحقق في إدارة الأجهزة من أن Unisoc download mode يستخدم برنامج التشغيل WinUSB."
"Repeat the download-mode steps, then try again. If it still isn't found, unplug the cable, plug it into another USB port and try again.": "كرّر خطوات وضع التنزيل، ثم حاول مرة أخرى. إذا لم يُعثر على الجهاز بعد ذلك، فافصل الكابل وصِله بمنفذ USB آخر ثم حاول مرة أخرى."
