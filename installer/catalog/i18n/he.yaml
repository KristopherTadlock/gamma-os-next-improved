# Hebrew translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "התקנה נקייה מוחקת את האחסון הפנימי. כדאי להעתיק ROMs, שמירות משחק, צילומי מסך וכל דבר אחר שרוצים לשמור למחשב או לכרטיס ה-microSD. משחקים בכרטיס ה-microSD לא ייפגעו."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "יש לאשר את בקשת ההרשאה של Windows, או להתקין את WinUSB באמצעות Zadig."
"Already unlocked: install new firmware": "כבר משוחרר: התקנת קושחה חדשה"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "מאוזן: RetroArch למערכות קלאסיות, וגם אמולטורים ל-N64, Dreamcast, PSP ו-DS, מסך הבית ES-DE ו-Brave."
"Building Thimsy for your device": "בונים את Thimsy עבור המכשיר שלך"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "נבנה מגרסת GammaOS Next 1.2 הרשמית עבור RG Cube, שהורדה מדף ה-GitHub של GammaOS."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "יש לטעון את המכשיר ל-50% לפחות לפני שמתחילים, ולהחזיק בהישג יד את הכבל שהגיע איתו."
"Charge the RG Cube": "טעינת ה-RG Cube"
"Check it's unlocked": "בדיקה שהמכשיר משוחרר"
"Check the basics": "בדיקת היסודות"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "יש לבדוק את הלחצנים, מסך המגע, הצליל וה-Wi-Fi, ולהפעיל משחק."
"Check the cable and that the device is still in its flashing mode, then try again.": "יש לבדוק את הכבל ושהמכשיר עדיין במצב צריבה, ולנסות שוב."
"Checking the USB driver": "בודקים את מנהל ההתקן של USB"
"Checking the build": "בודקים את הבנייה"
"Checking the plan": "בודקים את התוכנית"
"Checking the result": "בודקים את התוצאה"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "יש לבחור סביבת עבודה בכונן עם יותר מקום פנוי (לא FAT32), או לפנות מקום."
"Confirm on the device": "אישור במכשיר"
"Confirm with Volume Up": "אישור בלחצן הגברת עוצמת הקול"
"Connect it with USB debugging on": "חיבור עם ניפוי באגים ב-USB פעיל"
"Connect the device in download mode": "חיבור המכשיר במצב הורדה"
"Copy games without a card reader": "העתקת משחקים בלי קורא כרטיסים"
"Copy your games and saves": "העתקת המשחקים והשמירות"
"Delete the workspace's jobs folder and build again; report it if it persists.": "יש למחוק את התיקייה \"jobs\" בסביבת העבודה ולבנות שוב; אם הבעיה נמשכת, יש לדווח עליה."
"Don't install on units made in March 2026 or later.": "אין להתקין על יחידות שיוצרו במרץ 2026 ואילך."
"Don't install on units whose stock firmware is v1.26.": "אין להתקין על יחידות שהקושחה המקורית שלהן היא v1.26."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "אין להחזיר את הכרטיס למחשב כדי להעתיק משחקים: הוא מכיל מבנה Android מוצפן, ולכן המחשב לא יציג את נפח האחסון. במקום זאת יש להעתיק משחקים בהעברת קבצים ב-USB (MTP), עם ADB Explorer או משיתוף רשת."
"Download mode was never seen through WinUSB. Hold Back while you plug in the cable, and check in Device Manager or Zadig that Windows uses WinUSB for Unisoc download mode, not Unisoc's own driver.": "מצב ההורדה לא זוהה אף פעם דרך WinUSB. יש להחזיק את לחצן החזרה בזמן חיבור הכבל, ולוודא במנהל ההתקנים או ב-Zadig ש-Windows משתמש ב-WinUSB עבור Unisoc download mode, ולא במנהל ההתקן של Unisoc."
"Downloading": "מורידים"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "הכול: בינוני, וגם אמולטורים ל-GameCube/Wii, 3DS, PS2, Xbox ו-PS Vita וליבות הדיוק. ערכת Thimsy 1.0a המלאה."
"Finishing": "מסיימים"
"First time installing custom firmware": "פעם ראשונה שמתקינים קושחה מותאמת אישית"
"Follow the unlock steps shown in the installer, then continue.": "יש לבצע את שלבי השחרור שמוצגים במתקין, ואז להמשיך."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "המדריך של GammaOS מזהיר שצריבה של {device} שלא שוחרר הופכת אותו ללבנה. אחרי השחרור, {device} מופעל מחדש ב-Android המקורי שלו. יש לחכות עד ש-Android עולה, ואז להמשיך."
"Heavy": "מלא"
"Hold Back and plug in the cable": "להחזיק את לחצן החזרה ולחבר את הכבל"
"Hold Back and the Anbernic button, then plug in": "להחזיק את לחצן החזרה ואת לחצן Anbernic, ואז לחבר"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "יש להחזיק את לחצן ההפעלה כדי לכבות את {device}. יש להחזיק את שני לחצני עוצמת הקול, ובלי לשחרר לחבר את כבל ה-USB. אחר כך יש להקיש שוב ושוב על לחצן ההפעלה, כשלחצני עוצמת הקול עדיין לחוצים, עד שההתקנה מתחילה."
"Hold both volume buttons and plug in the cable": "להחזיק את שני לחצני עוצמת הקול ולחבר את הכבל"
"Hold the Back button, Volume Down and Power together until installation starts again.": "יש להחזיק יחד את לחצן החזרה, את לחצן החלשת עוצמת הקול ואת לחצן ההפעלה עד שההתקנה מתחילה שוב."
"If installation doesn't start": "אם ההתקנה לא מתחילה"
"If installation stalls": "אם ההתקנה נתקעת"
"If it isn't found": "אם המכשיר לא מזוהה"
"If the screen stays black": "אם המסך נשאר שחור"
"Install from the microSD card": "התקנה מכרטיס ה-microSD"
"Installing Thimsy": "מתקינים את Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "שומר על הנתונים שלך. רק אם ב-RG Cube כבר פועלת GammaOS Next 1.2 או גרסת Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "שומר על הנתונים שלך. רק אם במכשיר כבר פועלת גרסת Thimsy או GammaOS תואמת."
"Light": "קל"
"Medium": "בינוני"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "באתחול הראשון ממש, המסך עשוי להישאר ריק עד דקה. זה תקין; יש לחכות שמסך האתחול יופיע."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "ב-{device} יש לפתוח את 'הגדרות', 'מידע על המכשיר' ולהקיש שבע פעמים על 'מספר Build'. לאחר מכן, ב'הגדרות', 'אפשרויות למפתחים', יש להפעיל את 'ניפוי באגים ב-USB' ואת 'ביטול נעילת OEM'. יש לחבר את {device} למחשב הזה כשהוא דולק; הוא יופעל מחדש במצב fastboot לצורך ההתקנה."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "ב-{device} יש לפתוח את 'הגדרות', 'מידע על המכשיר' ולהקיש שבע פעמים על 'מספר Build'. לאחר מכן, ב'הגדרות', 'אפשרויות למפתחים', יש להפעיל את 'ניפוי באגים ב-USB' ואת 'ביטול נעילת OEM'. יש לחבר את {device} למחשב הזה כשהוא דולק; הוא יופעל מחדש במצב fastboot לצורך השחרור."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "מתוכנן: התקנה דרך Qualcomm EDL בכל מחשב. עדיין לא ניתן לבנייה."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "מתוכנן: SP Flash Tool ב-Windows וב-Linux. עדיין לא ניתן לבנייה."
"Planned: Windows only. Not buildable yet.": "מתוכנן: Windows בלבד. עדיין לא ניתן לבנייה."
"Planned: fastboot install on every computer. Not buildable yet.": "מתוכנן: התקנה דרך fastboot בכל מחשב. עדיין לא ניתן לבנייה."
"Planned: microSD card install on every computer. Not buildable yet.": "מתוכנן: התקנה מכרטיס microSD בכל מחשב. עדיין לא ניתן לבנייה."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "מתוכנן: אותה שיטת צריבה כמו ב-RG Cube. עדיין לא ניתן לבנייה."
"Plug in the cable with the device off": "לחבר את הכבל כשהמכשיר כבוי"
"Preparing the partitions": "מכינים את המחיצות"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "יש להכניס את הכרטיס ל-{device} ולהדליק אותו. Thimsy פועל מהכרטיס ולא נוגע באחסון הפנימי של {device}: כדי לחזור למערכת המקורית, יש לכבות אותו ולהוציא את הכרטיס."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "יש להתקין מחדש את Thimsy Installer, או להגדיר את THIMSY_TOOLS_DIR לתיקייה שמכילה אותו."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "יש להתקין מחדש את Thimsy Installer: כלי הצריבה שלו אינו הגרסה שהוא מצפה לה."
"Restart into fastbootd": "הפעלה מחדש במצב fastbootd"
"Restart with Power": "הפעלה מחדש בלחצן ההפעלה"
"Restarting the device": "מפעילים מחדש את המכשיר"
"Slide it open, hold Back and plug in": "לפתוח בהחלקה, להחזיק את לחצן החזרה ולחבר"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "הורדה קטנה למערכות קלאסיות עד PlayStation: ליבת RetroArch מהירה אחת לכל מערכת, מסך הבית Minima, בלי שיידרים."
"Start from the microSD card": "הפעלה מכרטיס ה-microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "יש להוציא מ-{device} כל כרטיס microSD אחר, להכניס את כרטיס Thimsy ולהדליק אותו. Thimsy פועל מהכרטיס ולא נוגע באחסון הפנימי: כדי לחזור למערכת המקורית, יש לכבות אותו ולהוציא את הכרטיס."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "יש להוציא כל כרטיס SD, ואז להחזיק את לחצן החלשת עוצמת הקול ואת לחצן ההפעלה עד ש-{device} מופעל מחדש."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "יש להוציא את כרטיס ה-microSD ולהפעיל את 'ניפוי באגים ב-USB' ב'אפשרויות למפתחים'. יש לחבר את {device} למחשב הזה כשהוא דולק. הוא יופעל מחדש במצב fastbootd: על המסך יופיע fastbootd באותיות אדומות גדולות."
"The file is damaged or a different version. Delete it and download again.": "הקובץ פגום או מגרסה אחרת. יש למחוק אותו ולהוריד שוב."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "האתחול הראשון עשוי להימשך 1 עד 3 דקות ולהיראות תקוע על הלוגו של Anbernic. זה תקין."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "האתחול הראשון נמשך 1 עד 3 דקות, והמסך עשוי להיראות תקוע על לוגו האתחול. זה תקין."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "ההפעלה הראשונה נמשכת כמה דקות בזמן ש-Thimsy מגדיר את האמולטורים. אין לכבות את המכשיר."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} משוחרר פעם אחת, בעזרת הכלי UnlockBootloader ממדריך ההתקנה של GammaOS Next (Unisoc T820, שלב 2): יש לכבות את {device}, להפעיל את הכלי, ואז להחזיק את לחצן החזרה בזמן חיבור כבל ה-USB. המתקין לא מפעיל את הכלי הזה בעצמו. יש לבצע את המדריך, ואז לחזור לכאן ולהמשיך."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} משוחרר פעם אחת, בעזרת הכלי UnlockBootloader ממדריך ההתקנה של GammaOS Next (Unisoc T820, שלב 2): יש לכבות את {device}, להפעיל את הכלי, ואז להחזיק את לחצן החזרה, הלחצן שמימין למסך, בזמן חיבור כבל ה-USB. המתקין לא מפעיל את הכלי הזה בעצמו. יש לבצע את המדריך, ואז לחזור לכאן ולהמשיך."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} משוחרר פעם אחת, בעזרת כלי השחרור המקוון ממדריך ההתקנה של GammaOS Next (Anbernic RG405M / RG405V / RG505, שלב 2). יש להפעיל מחדש את {device} במצב fastboot, לפתוח את הכלי ב-Google Chrome, וללחוץ על \"Connect\" ואז על \"Unlock\". ב-{device} אין ללחוץ על לחצן החלשת עוצמת הקול: יש ללחוץ על לחצן דף הבית / החזרה כדי לאשר. המתקין לא מפעיל את הכלי הזה בעצמו. יש לבצע את המדריך, ואז לחזור לכאן ולהמשיך."
"The {profile} profile isn't published yet. Choose a profile marked available.": "הפרופיל {profile} עדיין לא פורסם. יש לבחור פרופיל שמסומן כזמין."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "פריסת המחיצות של המכשיר הזה לא תואמת לקושחה הזו: זה דגם אחר, או שהוא עדיין מריץ את הקושחה המקורית שצריך לחלק מחדש, ודבר זה עדיין לא אפשרי בגרסה הזו."
"This version of the installer expects a different build. Build again, then install.": "גרסה זו של תוכנית ההתקנה מצפה לבנייה אחרת. יש לבנות שוב ואז להתקין."
"Turn on OEM unlocking": "הפעלת ביטול נעילת OEM"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "יש לכבות את {device} ולנתק אותו. יש להחזיק את לחצן החזרה ואת לחצן Anbernic שלידו, ובלי לשחרר לחבר את כבל ה-USB למחשב הזה. יש להמשיך להחזיק עד שההתקנה מתחילה."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "יש לכבות את {device} ולנתק אותו. יש להחזיק את לחצן החזרה, ובלי לשחרר לחבר את כבל ה-USB למחשב הזה. יש להמשיך להחזיק עד שההתקנה מתחילה."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "יש לכבות את {device} ולנתק אותו. יש להחזיק את לחצן החזרה, הלחצן שמימין למסך, ובלי לשחרר לחבר את כבל ה-USB למחשב הזה. יש להמשיך להחזיק עד שההתקנה מתחילה."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "יש לכבות את {device} לגמרי ולנתק אותו. יש להחזיק יחד את לחצן החלשת עוצמת הקול ואת לחצן הגברת עוצמת הקול, ובלי לשחרר לחבר את כבל ה-USB למחשב הזה. יש להמשיך להחזיק עד שההתקנה מתחילה."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "יש לכבות את {device} לגמרי. כשהמתקין מבקש, יש לחבר את כבל ה-USB למחשב הזה."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "יש לכבות את {device}, להכניס את הכרטיס ולהדליק אותו. המכשיר מתקין את עצמו מהכרטיס על האחסון הפנימי שלו. אין לגעת בו עד שהוא מסיים, ואז יש לכבות אותו ולהוציא את הכרטיס."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "יש לכבות את {device}, לנתק אותו ולהוציא כל כרטיס SD. יש לפתוח אותו בהחלקה, ואז להחזיק את לחצן החזרה שבמרכז לוח הכיוונים, ובלי לשחרר לחבר את כבל ה-USB למחשב הזה. יש להמשיך להחזיק עד שההתקנה מתחילה."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "יש להדליק את {device}, כש'ניפוי באגים ב-USB' עדיין פעיל ב'אפשרויות למפתחים', ולחבר אותו למחשב הזה. הוא יופעל מחדש מעצמו וההתקנה תתחיל."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "יש להדליק את {device}, כש'ניפוי באגים ב-USB' עדיין פעיל ב'אפשרויות למפתחים', ולחבר אותו למחשב הזה. הוא יופעל מחדש במצב fastboot לצורך ההתקנה."
"Unlock before flashing": "שחרור לפני הצריבה"
"Unlock with GammaOS's own steps": "שחרור לפי השלבים של GammaOS"
"Unpacking the firmware": "מחלצים את הקושחה"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "יש לנתק את הכבל. יש להחזיק את לחצן ההפעלה ואת לחצן החלשת עוצמת הקול לפחות 60 שניות, ואז, בלי לשחרר, לחבר את כבל ה-USB. יש להמשיך להחזיק עד שההתקנה מתחילה; זיהוי {device} עשוי להימשך 30 שניות או יותר."
"Use a Windows PC": "שימוש במחשב Windows"
"Use the firmware version the catalog lists for this device.": "יש להשתמש בגרסת הקושחה שמופיעה בקטלוג עבור המכשיר הזה."
"Use the volume keys to choose Unlock, then press Power.": "יש לבחור \"Unlock\" בלחצני עוצמת הקול, ואז ללחוץ על לחצן ההפעלה."
"Wait for the first boot": "המתנה להפעלה הראשונה"
"Wait on the Anbernic logo": "המתנה על הלוגו של Anbernic"
"Wait through a blank screen": "המתנה בזמן מסך ריק"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "כשההתקנה מסתיימת, יש ללחוץ פעם אחת על לחצן ההפעלה אם {device} לא הופעל מחדש מעצמו."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "כשעל המסך מופיע INFO: LOCK FLAG IS: UNLOCK!!!, המכשיר משוחרר. יש לנתק את הכבל, לוודא ש-{device} כבוי, ולהמשיך."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "כשעל המסך מופיע Unlock bootloader success!, המכשיר משוחרר. אם {device} כבר מציג לרגע INFO: LOCK FLAG IS : UNLOCK!!! כשהוא מופעל, הוא שוחרר בעבר ואפשר לדלג על השחרור."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "כש-{device} מבקש, יש ללחוץ על לחצן הגברת עוצמת הקול תוך 3 שניות כדי לאשר את השחרור."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "ב-{device} שלך כבר פועלת קושחה מותאמת אישית (הוא שוחרר בעבר). שלב השחרור יידלג."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "ב-{device} שלך פועלת הקושחה המקורית. המתקין מבצע התקנה נקייה שמוחקת את המכשיר."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "ב-{device} שלך עדיין פועלת הקושחה המקורית. המתקין ידריך אותך בשחרור, ואז יבצע התקנה נקייה שמוחקת את המכשיר."
"needs Android API {n}": "דורש Android API {n}"
"needs Vulkan": "דורש Vulkan"
"needs an ARMv8.2 CPU": "דורש מעבד ARMv8.2"
"needs {n} GB RAM": "דורש {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "לא ניתן להתקין את {device} מ-{host}. כדי להתקין, יש להפעיל את Thimsy Installer במחשב Windows."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} מותקן באמצעות PhoenixSuit של Allwinner, שפועל רק ב-Windows. כדי להתקין, יש להפעיל את Thimsy Installer במחשב Windows."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} מותקן באמצעות SP Flash Tool של MediaTek, שלא פועל ב-{host}. כדי להתקין, יש להפעיל את Thimsy Installer במחשב Windows."
"{device} isn't supported by this version of the installer yet.": "גרסה זו של המתקין עדיין לא תומכת ב-{device}."
