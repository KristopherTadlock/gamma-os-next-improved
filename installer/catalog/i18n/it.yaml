# Italian translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Un'installazione pulita cancella la memoria interna. Copia ROMs, salvataggi, screenshot e tutto ciò che vuoi conservare sul computer o sulla scheda microSD. I giochi sulla scheda microSD non vengono toccati."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Accetta la richiesta di autorizzazione di Windows oppure installa WinUSB con Zadig."
"Already unlocked: install new firmware": "Già sbloccato: installa il nuovo firmware"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Bilanciato: RetroArch per i sistemi classici più gli emulatori N64, Dreamcast, PSP e DS, la home ES-DE e Brave."
"Building Thimsy for your device": "Creazione di Thimsy per il tuo dispositivo"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Creato dalla release ufficiale di GammaOS Next 1.2 per RG Cube, scaricata dalla pagina GitHub di GammaOS."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Caricalo almeno al 50% prima di iniziare e tieni a portata di mano il cavo in dotazione."
"Charge the RG Cube": "Carica RG Cube"
"Check it's unlocked": "Verifica che sia sbloccato"
"Check the basics": "Controlla le funzioni di base"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Controlla tasti, touchscreen, audio e Wi-Fi, poi avvia un gioco."
"Check the cable and that the device is still in its flashing mode, then try again.": "Controlla il cavo e che il dispositivo sia ancora in modalità flash, poi riprova."
"Checking the USB driver": "Verifica del driver USB"
"Checking the build": "Verifica della build"
"Checking the plan": "Verifica del piano"
"Checking the result": "Verifica del risultato"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Scegli un'area di lavoro su un'unità con più spazio libero (non FAT32) oppure libera spazio."
"Confirm on the device": "Conferma sul dispositivo"
"Confirm with Volume Up": "Conferma con Volume su"
"Connect it with USB debugging on": "Collegalo con il debug USB attivo"
"Connect the device in download mode": "Collega il dispositivo in modalità download"
"Copy games without a card reader": "Copia i giochi senza lettore di schede"
"Copy your games and saves": "Copia giochi e salvataggi"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Elimina la cartella \"jobs\" dell'area di lavoro e ripeti la build; se il problema persiste, segnalalo."
"Don't install on units made in March 2026 or later.": "Non installare su unità prodotte a marzo 2026 o successivamente."
"Don't install on units whose stock firmware is v1.26.": "Non installare su unità con firmware originale v1.26."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "Non reinserire la scheda in un computer per copiare i giochi: contiene una struttura Android crittografata, quindi il computer non mostrerà lo spazio di archiviazione. Copia invece i giochi tramite trasferimento file USB (MTP), con ADB Explorer o da una condivisione di rete."
"Download mode was never seen through WinUSB. Hold Back while you plug in the cable, and check in Device Manager or Zadig that Windows uses WinUSB for Unisoc download mode, not Unisoc's own driver.": "La modalità download non è mai stata rilevata tramite WinUSB. Tieni premuto Indietro mentre colleghi il cavo e verifica in Gestione dispositivi o in Zadig che Windows usi WinUSB per Unisoc download mode e non il driver di Unisoc."
"Downloading": "Download in corso"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Tutto: Medio più gli emulatori GameCube/Wii, 3DS, PS2, Xbox e PS Vita e i core ad alta precisione. Il set completo di Thimsy 1.0a."
"Finishing": "Completamento"
"First time installing custom firmware": "Prima installazione di un firmware personalizzato"
"Follow the unlock steps shown in the installer, then continue.": "Segui i passaggi di sblocco mostrati nel programma di installazione, poi continua."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "La guida di GammaOS avverte che flashare un {device} non sbloccato lo rende inutilizzabile. Dopo lo sblocco, il {device} si riavvia nel suo Android originale. Attendi che Android sia avviato, poi continua."
"Heavy": "Completo"
"Hold Back and plug in the cable": "Tieni premuto Indietro e collega il cavo"
"Hold Back and the Anbernic button, then plug in": "Tieni premuti Indietro e il tasto Anbernic, poi collega"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Tieni premuto il tasto di accensione per spegnere il {device}. Tieni premuti entrambi i tasti del volume e, senza rilasciarli, collega il cavo USB. Poi premi ripetutamente il tasto di accensione, sempre tenendo premuti i tasti del volume, finché non inizia l'installazione."
"Hold both volume buttons and plug in the cable": "Tieni premuti entrambi i tasti del volume e collega il cavo"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Tieni premuti insieme il tasto Indietro, Volume giù e il tasto di accensione finché l'installazione non riparte."
"If installation doesn't start": "Se l'installazione non parte"
"If installation stalls": "Se l'installazione si blocca"
"If it isn't found": "Se non viene rilevato"
"If the screen stays black": "Se lo schermo resta nero"
"Install from the microSD card": "Installa dalla scheda microSD"
"Installing Thimsy": "Installazione di Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Mantiene i tuoi dati. Solo se su RG Cube è già installato GammaOS Next 1.2 o una build di Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Mantiene i tuoi dati. Solo se sul dispositivo è già installata una build compatibile di Thimsy o GammaOS."
"Light": "Leggero"
"Medium": "Medio"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "Al primissimo avvio lo schermo può restare vuoto fino a un minuto. È normale; attendi che compaia la schermata di avvio."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "Sul {device}, apri Impostazioni, Informazioni sul dispositivo e tocca sette volte Numero build. Poi, in Impostazioni, Opzioni sviluppatore, attiva Debug USB e Sblocco OEM. Collega il {device} acceso a questo computer; si riavvia in modalità fastboot per l'installazione."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "Sul {device}, apri Impostazioni, Informazioni sul dispositivo e tocca sette volte Numero build. Poi, in Impostazioni, Opzioni sviluppatore, attiva Debug USB e Sblocco OEM. Collega il {device} acceso a questo computer; si riavvia in modalità fastboot per lo sblocco."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Previsto: installazione tramite Qualcomm EDL su qualsiasi computer. Non ancora disponibile."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Previsto: SP Flash Tool su Windows e Linux. Non ancora disponibile."
"Planned: Windows only. Not buildable yet.": "Previsto: solo Windows. Non ancora disponibile."
"Planned: fastboot install on every computer. Not buildable yet.": "Previsto: installazione tramite fastboot su qualsiasi computer. Non ancora disponibile."
"Planned: microSD card install on every computer. Not buildable yet.": "Previsto: installazione tramite scheda microSD su qualsiasi computer. Non ancora disponibile."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Previsto: stesso metodo di flash di RG Cube. Non ancora disponibile."
"Plug in the cable with the device off": "Collega il cavo a dispositivo spento"
"Preparing the partitions": "Preparazione delle partizioni"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Inserisci la scheda nel {device} e accendilo. Thimsy funziona dalla scheda e lascia intatta la memoria interna del {device}: per tornare al sistema originale, spegnilo e togli la scheda."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Reinstalla Thimsy Installer oppure imposta THIMSY_TOOLS_DIR su una cartella che lo contiene."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Reinstalla Thimsy Installer: il suo strumento di flash non è la versione prevista."
"Restart into fastbootd": "Riavvia in fastbootd"
"Restart with Power": "Riavvia con il tasto di accensione"
"Restarting the device": "Riavvio del dispositivo"
"Slide it open, hold Back and plug in": "Apri lo slider, tieni premuto Indietro e collega"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Download leggero per i sistemi classici fino a PlayStation: un core RetroArch veloce per sistema, la home Minima, nessuno shader."
"Start from the microSD card": "Avvia dalla scheda microSD"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Togli dal {device} qualsiasi altra scheda microSD, inserisci la scheda Thimsy e accendilo. Thimsy funziona dalla scheda e lascia intatta la memoria interna: per tornare al sistema originale, spegnilo e togli la scheda."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Togli qualsiasi scheda SD, poi tieni premuti Volume giù e il tasto di accensione finché il {device} non si riavvia."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Togli la scheda microSD e attiva Debug USB in Opzioni sviluppatore. Collega il {device} acceso a questo computer. Si riavvia in fastbootd: lo schermo mostra fastbootd in grandi lettere rosse."
"The file is damaged or a different version. Delete it and download again.": "Il file è danneggiato o è di una versione diversa. Eliminalo e scaricalo di nuovo."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Il primo avvio può richiedere da 1 a 3 minuti e sembrare bloccato sul logo Anbernic. È normale."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Il primo avvio richiede da 1 a 3 minuti e lo schermo può sembrare bloccato sul logo di avvio. È normale."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Il primo avvio richiede alcuni minuti mentre Thimsy configura gli emulatori. Non spegnere il dispositivo."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Il {device} si sblocca una sola volta, con lo strumento UnlockBootloader della guida di installazione di GammaOS Next (Unisoc T820, passaggio 2): spegni il {device}, avvia lo strumento, poi tieni premuto il tasto Indietro mentre colleghi il cavo USB. Il programma di installazione non esegue questo strumento da solo. Segui la guida, poi torna qui e continua."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Il {device} si sblocca una sola volta, con lo strumento UnlockBootloader della guida di installazione di GammaOS Next (Unisoc T820, passaggio 2): spegni il {device}, avvia lo strumento, poi tieni premuto il tasto Indietro, quello a destra dello schermo, mentre colleghi il cavo USB. Il programma di installazione non esegue questo strumento da solo. Segui la guida, poi torna qui e continua."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "Il {device} si sblocca una sola volta, con lo strumento di sblocco web della guida di installazione di GammaOS Next (Anbernic RG405M / RG405V / RG505, passaggio 2). Riavvia il {device} in modalità fastboot, apri lo strumento in Google Chrome, fai clic su \"Connect\" e poi su \"Unlock\". Sul {device} non premere Volume giù: premi il tasto Home / Indietro per confermare. Il programma di installazione non esegue questo strumento da solo. Segui la guida, poi torna qui e continua."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Il profilo {profile} non è ancora pubblicato. Scegli un profilo contrassegnato come disponibile."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "Lo schema delle partizioni di questo dispositivo non corrisponde a questo firmware: è un modello diverso, oppure ha ancora il firmware originale, che va ripartizionato, cosa che questa versione non sa ancora fare."
"This version of the installer expects a different build. Build again, then install.": "Questa versione del programma di installazione si aspetta una build diversa. Ripeti la build, poi installa."
"Turn on OEM unlocking": "Attiva lo sblocco OEM"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Spegni il {device} e scollegalo. Tieni premuti il tasto Indietro e il tasto Anbernic accanto e, senza rilasciarli, collega il cavo USB a questo computer. Continua a tenerli premuti finché non inizia l'installazione."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Spegni il {device} e scollegalo. Tieni premuto il tasto Indietro e, senza rilasciarlo, collega il cavo USB a questo computer. Continua a tenerlo premuto finché non inizia l'installazione."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Spegni il {device} e scollegalo. Tieni premuto il tasto Indietro, quello a destra dello schermo, e, senza rilasciarlo, collega il cavo USB a questo computer. Continua a tenerlo premuto finché non inizia l'installazione."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Spegni completamente il {device} e scollegalo. Tieni premuti insieme Volume giù e Volume su e, senza rilasciarli, collega il cavo USB a questo computer. Continua a tenerli premuti finché non inizia l'installazione."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "Spegni completamente il {device}. Quando il programma di installazione lo chiede, collega il cavo USB a questo computer."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Spegni il {device}, inserisci la scheda e accendilo. Si installa da solo nella memoria interna dalla scheda. Non toccarlo finché non ha finito, poi spegnilo e togli la scheda."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Spegni il {device}, scollegalo e togli tutte le schede SD. Apri lo slider, poi tieni premuto il tasto Indietro al centro della croce direzionale e, senza rilasciarlo, collega il cavo USB a questo computer. Continua a tenerlo premuto finché non inizia l'installazione."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Accendi il {device}, con il debug USB ancora attivo in Opzioni sviluppatore, e collegalo a questo computer. Si riavvia da solo e l'installazione inizia."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Accendi il {device}, con il debug USB ancora attivo in Opzioni sviluppatore, e collegalo a questo computer. Si riavvia in modalità fastboot per l'installazione."
"Unlock before flashing": "Sblocca prima del flash"
"Unlock with GammaOS's own steps": "Sblocca con la procedura di GammaOS"
"Unpacking the firmware": "Estrazione del firmware"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Scollega il cavo. Tieni premuti il tasto di accensione e Volume giù per almeno 60 secondi, poi, senza rilasciarli, collega il cavo USB. Continua a tenerli premuti finché non inizia l'installazione; il rilevamento del {device} può richiedere 30 secondi o più."
"Use a Windows PC": "Usa un PC Windows"
"Use the firmware version the catalog lists for this device.": "Usa la versione del firmware indicata nel catalogo per questo dispositivo."
"Use the volume keys to choose Unlock, then press Power.": "Usa i tasti del volume per scegliere \"Unlock\", poi premi il tasto di accensione."
"Wait for the first boot": "Attendi il primo avvio"
"Wait on the Anbernic logo": "Attendi sul logo Anbernic"
"Wait through a blank screen": "Attendi durante lo schermo vuoto"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Al termine dell'installazione, premi una volta il tasto di accensione se il {device} non si è riavviato da solo."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "Quando lo schermo mostra INFO: LOCK FLAG IS: UNLOCK!!!, è sbloccato. Scollega il cavo, assicurati che il {device} sia spento e continua."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Quando lo schermo mostra Unlock bootloader success!, è sbloccato. Se il {device} mostra già per un attimo INFO: LOCK FLAG IS : UNLOCK!!! all'avvio, era già stato sbloccato e puoi saltare lo sblocco."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Quando il {device} lo chiede, premi Volume su entro 3 secondi per confermare lo sblocco."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Il tuo {device} usa già un firmware personalizzato (è stato sbloccato in precedenza). Lo sblocco viene saltato."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Il tuo {device} usa il firmware originale. Il programma di installazione esegue un'installazione pulita che cancella il dispositivo."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Il tuo {device} usa ancora il firmware originale. Il programma di installazione ti guida nello sblocco, poi esegue un'installazione pulita che cancella il dispositivo."
"needs Android API {n}": "richiede Android API {n}"
"needs Vulkan": "richiede Vulkan"
"needs an ARMv8.2 CPU": "richiede una CPU ARMv8.2"
"needs {n} GB RAM": "richiede {n} GB di RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "Impossibile installare {device} da {host}. Esegui Thimsy Installer su un PC Windows per installarlo."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} si installa con PhoenixSuit di Allwinner, che funziona solo su Windows. Esegui Thimsy Installer su un PC Windows per installarlo."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} si installa con SP Flash Tool di MediaTek, che non funziona su {host}. Esegui Thimsy Installer su un PC Windows per installarlo."
"{device} isn't supported by this version of the installer yet.": "{device} non è ancora supportato da questa versione del programma di installazione."
