"In Android Settings, Storage, check whether the {device} has 128 GB or 256 GB. Each size needs its own layout, and installing the wrong one can brick the {device}.": "In Android, in Impostazioni, Spazio di archiviazione, controlla se il {device} ha 128 GB o 256 GB. Ogni capacità richiede una propria struttura e installare quella sbagliata può rendere il {device} inutilizzabile."
"In Settings, Handheld Settings, About Device, Device Information, note the first four characters of the SN (MQ65 or MQ66). Each hardware revision needs its own firmware.": "In Impostazioni, Impostazioni handheld, Informazioni sul dispositivo, Informazioni dispositivo, annota i primi quattro caratteri del SN (MQ65 o MQ66). Ogni revisione hardware richiede il proprio firmware."
"Inside the device pack.": "All'interno del pacchetto dispositivo."
