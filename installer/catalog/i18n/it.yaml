# Italian translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "Un'installazione pulita cancella la memoria interna. Copia ROMs, salvataggi, screenshot e tutto ciò che vuoi conservare sul computer o sulla scheda microSD. I giochi sulla scheda microSD non vengono toccati."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Accetta la richiesta di autorizzazione di Windows oppure installa WinUSB con Zadig."
"Already unlocked: install new firmware": "Già sbloccato: installa il nuovo firmware"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Bilanciato: RetroArch per i sistemi classici più gli emulatori N64, Dreamcast, PSP e DS, la home ES-DE e Brave."
"Building Thimsy for your device": "Creazione di Thimsy per il tuo dispositivo"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Creato dalla release ufficiale di GammaOS Next 1.2 per RG Cube, scaricata dalla pagina GitHub di GammaOS."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Caricalo almeno al 50% prima di iniziare e tieni a portata di mano il cavo in dotazione."
"Charge the RG Cube": "Carica RG Cube"
"Check it's unlocked": "Verifica che sia sbloccato"
"Check the basics": "Controlla le funzioni di base"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Controlla tasti, touchscreen, audio e Wi-Fi, poi avvia un gioco."
"Check the cable and that the device is still in its flashing mode, then try again.": "Controlla il cavo e che il dispositivo sia ancora in modalità flash, poi riprova."
"Checking the USB driver": "Verifica del driver USB"
"Checking the build": "Verifica della build"
"Checking the plan": "Verifica del piano"
"Checking the result": "Verifica del risultato"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Scegli un'area di lavoro su un'unità con più spazio libero (non FAT32) oppure libera spazio."
"Confirm on the device": "Conferma sul dispositivo"
"Connect the device in download mode": "Collega il dispositivo in modalità download"
"Copy your games and saves": "Copia giochi e salvataggi"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Elimina la cartella \"jobs\" dell'area di lavoro e ripeti la build; se il problema persiste, segnalalo."
"Don't install on units made in March 2026 or later.": "Non installare su unità prodotte a marzo 2026 o successivamente."
"Don't install on units whose stock firmware is v1.26.": "Non installare su unità con firmware originale v1.26."
"Downloading": "Download in corso"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Tutto: Medio più gli emulatori GameCube/Wii, 3DS, PS2, Xbox e PS Vita e i core ad alta precisione. Il set completo di Thimsy 1.0a."
"Finishing": "Completamento"
"First time installing custom firmware": "Prima installazione di un firmware personalizzato"
"Follow the unlock steps shown in the installer, then continue.": "Segui i passaggi di sblocco mostrati nel programma di installazione, poi continua."
"Heavy": "Completo"
"Hold Volume Down and plug in the cable": "Tieni premuto Volume giù e collega il cavo"
"Installing Thimsy": "Installazione di Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Mantiene i tuoi dati. Solo se su RG Cube è già installato GammaOS Next 1.2 o una build di Thimsy."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Mantiene i tuoi dati. Solo se sul dispositivo è già installata una build compatibile di Thimsy o GammaOS."
"Light": "Leggero"
"Medium": "Medio"
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Previsto: installazione tramite Qualcomm EDL su qualsiasi computer. Non ancora disponibile."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Previsto: SP Flash Tool su Windows e Linux. Non ancora disponibile."
"Planned: Windows only. Not buildable yet.": "Previsto: solo Windows. Non ancora disponibile."
"Planned: fastboot install on every computer. Not buildable yet.": "Previsto: installazione tramite fastboot su qualsiasi computer. Non ancora disponibile."
"Planned: microSD card install on every computer. Not buildable yet.": "Previsto: installazione tramite scheda microSD su qualsiasi computer. Non ancora disponibile."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Previsto: stesso metodo di flash di RG Cube. Non ancora disponibile."
"Preparing the partitions": "Preparazione delle partizioni"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Reinstalla Thimsy Installer oppure imposta THIMSY_TOOLS_DIR su una cartella che lo contiene."
"Required before flashing; skipping it can brick the device.": "Obbligatorio prima del flash; saltarlo può rendere il dispositivo inutilizzabile."
"Restarting the device": "Riavvio del dispositivo"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Download leggero per i sistemi classici fino a PlayStation: un core RetroArch veloce per sistema, la home Minima, nessuno shader."
"The RG Cube is unlocked once, with the steps from GammaOS Next's installation guide (the Unisoc T820 section). The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "RG Cube si sblocca una sola volta, con i passaggi della guida di installazione di GammaOS Next (sezione Unisoc T820). Il programma di installazione non esegue direttamente quello strumento. Segui la guida, poi torna qui e continua."
"The file is damaged or a different version. Delete it and download again.": "Il file è danneggiato o è di una versione diversa. Eliminalo e scaricalo di nuovo."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Il primo avvio richiede alcuni minuti mentre Thimsy configura gli emulatori. Non spegnere il dispositivo."
"The installer sends the unlock command; confirm it on the device with Volume Up.": "Il programma di installazione invia il comando di sblocco; confermalo sul dispositivo con Volume su."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Il profilo {profile} non è ancora pubblicato. Scegli un profilo contrassegnato come disponibile."
"Turn the RG Cube off. Hold Volume Down and connect the USB cable to this computer. Keep holding until installation starts. The screen stays black; that's normal.": "Spegni RG Cube. Tieni premuto Volume giù e collega il cavo USB a questo computer. Continua a tenerlo premuto finché non inizia l'installazione. Lo schermo resta nero; è normale."
"Unlock in fastboot": "Sblocca in fastboot"
"Unlock with GammaOS's own steps": "Sblocca con la procedura di GammaOS"
"Unpacking the firmware": "Estrazione del firmware"
"Use a Windows PC": "Usa un PC Windows"
"Use the firmware version the catalog lists for this device.": "Usa la versione del firmware indicata nel catalogo per questo dispositivo."
"Use the volume keys to choose Unlock, then press Power.": "Usa i tasti del volume per scegliere \"Unlock\", poi premi il tasto di accensione."
"Wait for the first boot": "Attendi il primo avvio"
"When the device shows LOCK FLAG IS: UNLOCK, it's unlocked. Turn it off and continue.": "Quando il dispositivo mostra LOCK FLAG IS: UNLOCK, è sbloccato. Spegnilo e continua."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "Il tuo {device} usa già un firmware personalizzato (è stato sbloccato in precedenza). Lo sblocco viene saltato."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "Il tuo {device} usa il firmware originale. Il programma di installazione esegue un'installazione pulita che cancella il dispositivo."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "Il tuo {device} usa ancora il firmware originale. Il programma di installazione ti guida nello sblocco, poi esegue un'installazione pulita che cancella il dispositivo."
"needs Android API {n}": "richiede Android API {n}"
"needs Vulkan": "richiede Vulkan"
"needs an ARMv8.2 CPU": "richiede una CPU ARMv8.2"
"needs {n} GB RAM": "richiede {n} GB di RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "Impossibile installare {device} da {host}. Esegui Thimsy Installer su un PC Windows per installarlo."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} si installa con PhoenixSuit di Allwinner, che funziona solo su Windows. Esegui Thimsy Installer su un PC Windows per installarlo."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} si installa con SP Flash Tool di MediaTek, che non funziona su {host}. Esegui Thimsy Installer su un PC Windows per installarlo."
"{device} isn't supported by this version of the installer yet.": "{device} non è ancora supportato da questa versione del programma di installazione."
