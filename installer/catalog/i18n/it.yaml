"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Inserisci la scheda nel {device} e accendilo. Thimsy funziona dalla scheda e lascia intatta la memoria interna del {device}: per tornare al sistema originale, spegnilo e togli la scheda."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Reinstalla Thimsy Installer: il suo strumento di flash non è la versione prevista."
"Reinstall Thimsy Installer: one of its tools is missing.": "Reinstalla Thimsy Installer: manca uno dei suoi strumenti."
"Repeat the download-mode steps and keep holding the button until installing starts, then try again.": "Ripeti i passaggi per la modalità download e tieni premuto il tasto finché non inizia l'installazione, poi riprova."
"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "Ripeti i passaggi per la modalità download, poi riprova. Se il dispositivo non viene ancora rilevato, verifica in Gestione dispositivi che Unisoc download mode usi il driver WinUSB."
"Repeat the download-mode steps, then try again. If it still isn't found, unplug the cable, plug it into another USB port and try again.": "Ripeti i passaggi per la modalità download, poi riprova. Se il dispositivo non viene ancora rilevato, scollega il cavo, collegalo a un'altra porta USB e riprova."
