# Korean translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "클린 설치를 하면 내부 저장소가 지워집니다. ROMs, 세이브 파일, 스크린샷 등 보관하려는 모든 것을 컴퓨터나 microSD 카드에 복사하세요. microSD 카드의 게임은 그대로 유지됩니다."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Windows 권한 요청을 허용하거나 Zadig로 WinUSB를 설치하세요."
"Already unlocked: install new firmware": "이미 잠금 해제됨: 새 펌웨어 설치"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "균형: 클래식 기종용 RetroArch에 N64, Dreamcast, PSP, DS 에뮬레이터, ES-DE 홈 화면, Brave 포함."
"Building Thimsy for your device": "기기에 맞게 Thimsy를 빌드하는 중"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "GammaOS의 GitHub 페이지에서 다운로드한 RG Cube용 공식 GammaOS Next 1.2 릴리스를 바탕으로 빌드했습니다."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "시작하기 전에 50% 이상 충전하고, 기기와 함께 제공된 케이블을 준비해 두세요."
"Charge the RG Cube": "RG Cube 충전하기"
"Check it's unlocked": "잠금 해제 여부 확인하기"
"Check the basics": "기본 기능 확인하기"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "버튼, 터치스크린, 소리, Wi-Fi를 확인하고 게임을 실행해 보세요."
"Check the cable and that the device is still in its flashing mode, then try again.": "케이블을 확인하고 기기가 아직 플래싱 모드인지 확인한 다음 다시 시도하세요."
"Checking the USB driver": "USB 드라이버 확인 중"
"Checking the build": "빌드 확인 중"
"Checking the plan": "계획 확인 중"
"Checking the result": "결과 확인 중"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "여유 공간이 더 많은 드라이브(FAT32 제외)에서 작업 폴더를 선택하거나 공간을 확보하세요."
"Confirm on the device": "기기에서 확인하기"
"Confirm with Volume Up": "볼륨 업 버튼으로 확인하기"
"Connect it with USB debugging on": "USB 디버깅을 켜고 연결하기"
"Connect the device in download mode": "다운로드 모드로 기기 연결하기"
"Copy games without a card reader": "카드 리더 없이 게임 복사하기"
"Copy your games and saves": "게임과 세이브 파일 복사하기"
"Delete the workspace's jobs folder and build again; report it if it persists.": "작업 폴더의 \"jobs\" 폴더를 삭제하고 다시 빌드하세요. 문제가 계속되면 신고해 주세요."
"Don't install on units made in March 2026 or later.": "2026년 3월 이후에 제조된 기기에는 설치하지 마세요."
"Don't install on units whose stock firmware is v1.26.": "기본 펌웨어가 v1.26인 기기에는 설치하지 마세요."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "게임을 복사하려고 카드를 다시 컴퓨터에 넣지 마세요. 카드에는 암호화된 Android 구성이 들어 있어 컴퓨터에 저장 공간이 표시되지 않습니다. 대신 USB 파일 전송(MTP), ADB Explorer 또는 네트워크 공유로 게임을 복사하세요."
"Downloading": "다운로드 중"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "전체: 미디엄에 GameCube/Wii, 3DS, PS2, Xbox, PS Vita 에뮬레이터와 고정확도 코어 추가. Thimsy 1.0a 전체 구성입니다."
"Finishing": "마무리 중"
"First time installing custom firmware": "커스텀 펌웨어를 처음 설치함"
"Follow the unlock steps shown in the installer, then continue.": "설치 프로그램에 표시되는 잠금 해제 단계를 따른 다음 계속하세요."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "GammaOS 가이드는 잠금 해제하지 않은 {device}에 플래싱하면 기기를 쓸 수 없게 된다고 경고합니다. 잠금 해제 후 {device}은(는) 원래 Android로 다시 시작됩니다. Android가 시작될 때까지 기다린 다음 계속하세요."
"Heavy": "헤비"
"Hold Back and plug in the cable": "뒤로 버튼을 누른 채 케이블 연결하기"
"Hold Back and the Anbernic button, then plug in": "뒤로 버튼과 Anbernic 버튼을 누른 채 연결하기"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "전원 버튼을 길게 눌러 {device}의 전원을 끄세요. 볼륨 버튼 두 개를 누른 채로 USB 케이블을 연결하세요. 그런 다음 볼륨 버튼을 계속 누른 상태에서 설치가 시작될 때까지 전원 버튼을 반복해서 누르세요."
"Hold both volume buttons and plug in the cable": "볼륨 버튼 두 개를 누른 채 케이블 연결하기"
"Hold the Back button, Volume Down and Power together until installation starts again.": "설치가 다시 시작될 때까지 뒤로 버튼, 볼륨 다운 버튼, 전원 버튼을 함께 누르고 계세요."
"If installation doesn't start": "설치가 시작되지 않으면"
"If installation stalls": "설치가 멈추면"
"If it isn't found": "인식되지 않으면"
"If the screen stays black": "화면이 계속 검은색이면"
"Install from the microSD card": "microSD 카드로 설치하기"
"Installing Thimsy": "Thimsy 설치 중"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "데이터가 유지됩니다. RG Cube에서 이미 GammaOS Next 1.2 또는 Thimsy 빌드가 실행 중인 경우에만 가능합니다."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "데이터가 유지됩니다. 기기에서 이미 호환되는 Thimsy 또는 GammaOS 빌드가 실행 중인 경우에만 가능합니다."
"Light": "라이트"
"Medium": "미디엄"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "맨 처음 부팅할 때는 최대 1분 동안 화면에 아무것도 표시되지 않을 수 있습니다. 정상입니다. 부팅 화면이 나타날 때까지 기다리세요."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "{device}에서 설정, 기기 정보를 열고 빌드 번호를 일곱 번 탭하세요. 그런 다음 설정, 개발자 옵션에서 USB 디버깅과 OEM 잠금 해제를 켜세요. 전원이 켜진 {device}을(를) 이 컴퓨터에 연결하세요. 설치를 위해 fastboot 모드로 다시 시작됩니다."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "{device}에서 설정, 기기 정보를 열고 빌드 번호를 일곱 번 탭하세요. 그런 다음 설정, 개발자 옵션에서 USB 디버깅과 OEM 잠금 해제를 켜세요. 전원이 켜진 {device}을(를) 이 컴퓨터에 연결하세요. 잠금 해제를 위해 fastboot 모드로 다시 시작됩니다."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "예정: 모든 컴퓨터에서 Qualcomm EDL로 설치. 아직 빌드할 수 없습니다."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "예정: Windows 및 Linux에서 SP Flash Tool 사용. 아직 빌드할 수 없습니다."
"Planned: Windows only. Not buildable yet.": "예정: Windows 전용. 아직 빌드할 수 없습니다."
"Planned: fastboot install on every computer. Not buildable yet.": "예정: 모든 컴퓨터에서 fastboot로 설치. 아직 빌드할 수 없습니다."
"Planned: microSD card install on every computer. Not buildable yet.": "예정: 모든 컴퓨터에서 microSD 카드로 설치. 아직 빌드할 수 없습니다."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "예정: RG Cube와 같은 플래싱 방식. 아직 빌드할 수 없습니다."
"Plug in the cable with the device off": "기기를 끈 상태로 케이블 연결하기"
"Preparing the partitions": "파티션 준비 중"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "카드를 {device}에 넣고 전원을 켜세요. Thimsy는 카드에서 실행되며 {device}의 내부 저장소는 건드리지 않습니다. 원래 시스템으로 돌아가려면 전원을 끄고 카드를 빼세요."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Thimsy Installer를 다시 설치하거나 THIMSY_TOOLS_DIR을 해당 파일이 들어 있는 폴더로 설정하세요."
"Restart into fastbootd": "fastbootd로 다시 시작하기"
"Restart with Power": "전원 버튼으로 다시 시작하기"
"Restarting the device": "기기 재시작 중"
"Slide it open, hold Back and plug in": "슬라이드를 열고 뒤로 버튼을 누른 채 연결하기"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "PlayStation까지의 클래식 기종을 위한 작은 다운로드: 기종별 빠른 RetroArch 코어 1개, Minima 홈 화면, 셰이더 없음."
"Start from the microSD card": "microSD 카드로 시작하기"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "{device}에서 다른 microSD 카드를 모두 빼고 Thimsy 카드를 넣은 다음 전원을 켜세요. Thimsy는 카드에서 실행되며 내부 저장소는 건드리지 않습니다. 원래 시스템으로 돌아가려면 전원을 끄고 카드를 빼세요."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "SD 카드를 모두 뺀 다음 {device}이(가) 다시 시작될 때까지 볼륨 다운 버튼과 전원 버튼을 누르고 계세요."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "microSD 카드를 빼고 개발자 옵션에서 USB 디버깅을 켜세요. 전원이 켜진 {device}을(를) 이 컴퓨터에 연결하세요. fastbootd로 다시 시작되며 화면에 큰 빨간 글씨로 fastbootd가 표시됩니다."
"The file is damaged or a different version. Delete it and download again.": "파일이 손상되었거나 다른 버전입니다. 삭제한 다음 다시 다운로드하세요."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "첫 부팅은 1~3분 걸릴 수 있으며 Anbernic 로고에서 멈춘 것처럼 보일 수 있습니다. 정상입니다."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "첫 부팅은 1~3분 걸리며 부팅 로고에서 화면이 멈춘 것처럼 보일 수 있습니다. 정상입니다."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Thimsy가 에뮬레이터를 설정하는 동안 첫 시작에 몇 분이 걸립니다. 전원을 끄지 마세요."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device}은(는) GammaOS Next 설치 가이드(Unisoc T820, 2단계)의 UnlockBootloader 도구로 한 번만 잠금 해제합니다. {device}의 전원을 끄고 도구를 실행한 다음, 뒤로 버튼을 누른 채 USB 케이블을 연결하세요. 설치 프로그램은 이 도구를 직접 실행하지 않습니다. 가이드를 따른 다음 돌아와서 계속하세요."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device}은(는) GammaOS Next 설치 가이드(Unisoc T820, 2단계)의 UnlockBootloader 도구로 한 번만 잠금 해제합니다. {device}의 전원을 끄고 도구를 실행한 다음, 뒤로 버튼(화면 오른쪽에 있는 버튼)을 누른 채 USB 케이블을 연결하세요. 설치 프로그램은 이 도구를 직접 실행하지 않습니다. 가이드를 따른 다음 돌아와서 계속하세요."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device}은(는) GammaOS Next 설치 가이드(Anbernic RG405M / RG405V / RG505, 2단계)의 웹 잠금 해제 도구로 한 번만 잠금 해제합니다. {device}을(를) fastboot 모드로 다시 시작하고 Google Chrome에서 도구를 연 다음 \"Connect\", 이어서 \"Unlock\"을 클릭하세요. {device}에서는 볼륨 다운 버튼을 누르지 말고 홈 / 뒤로 버튼을 눌러 확인하세요. 설치 프로그램은 이 도구를 직접 실행하지 않습니다. 가이드를 따른 다음 돌아와서 계속하세요."
"The {profile} profile isn't published yet. Choose a profile marked available.": "{profile} 프로필은 아직 게시되지 않았습니다. 사용 가능으로 표시된 프로필을 선택하세요."
"Turn on OEM unlocking": "OEM 잠금 해제 켜기"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "{device}의 전원을 끄고 케이블을 뽑으세요. 뒤로 버튼과 그 옆의 Anbernic 버튼을 누른 채로 USB 케이블을 이 컴퓨터에 연결하세요. 설치가 시작될 때까지 계속 누르고 계세요."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device}의 전원을 끄고 케이블을 뽑으세요. 뒤로 버튼을 누른 채로 USB 케이블을 이 컴퓨터에 연결하세요. 설치가 시작될 때까지 계속 누르고 계세요."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device}의 전원을 끄고 케이블을 뽑으세요. 뒤로 버튼(화면 오른쪽에 있는 버튼)을 누른 채로 USB 케이블을 이 컴퓨터에 연결하세요. 설치가 시작될 때까지 계속 누르고 계세요."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "{device}의 전원을 완전히 끄고 케이블을 뽑으세요. 볼륨 다운 버튼과 볼륨 업 버튼을 함께 누른 채로 USB 케이블을 이 컴퓨터에 연결하세요. 설치가 시작될 때까지 계속 누르고 계세요."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "{device}의 전원을 완전히 끄세요. 설치 프로그램이 요청하면 USB 케이블을 이 컴퓨터에 연결하세요."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "{device}의 전원을 끄고 카드를 넣은 다음 전원을 켜세요. 카드에서 내부 저장소로 스스로 설치됩니다. 끝날 때까지 그대로 두었다가 전원을 끄고 카드를 빼세요."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device}의 전원을 끄고 케이블을 뽑은 다음 SD 카드를 모두 빼세요. 슬라이드를 연 다음 방향 패드 가운데의 뒤로 버튼을 누른 채로 USB 케이블을 이 컴퓨터에 연결하세요. 설치가 시작될 때까지 계속 누르고 계세요."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "개발자 옵션에서 USB 디버깅을 켠 상태로 {device}의 전원을 켜고 이 컴퓨터에 연결하세요. 스스로 다시 시작되고 설치가 시작됩니다."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "개발자 옵션에서 USB 디버깅을 켠 상태로 {device}의 전원을 켜고 이 컴퓨터에 연결하세요. 설치를 위해 fastboot 모드로 다시 시작됩니다."
"Unlock before flashing": "플래싱 전에 잠금 해제하기"
"Unlock with GammaOS's own steps": "GammaOS 자체 단계로 잠금 해제하기"
"Unpacking the firmware": "펌웨어 압축 해제 중"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "케이블을 뽑으세요. 전원 버튼과 볼륨 다운 버튼을 60초 이상 누른 다음, 계속 누른 채로 USB 케이블을 연결하세요. 설치가 시작될 때까지 계속 누르고 계세요. {device}을(를) 인식하는 데 30초 이상 걸릴 수 있습니다."
"Use a Windows PC": "Windows PC 사용하기"
"Use the firmware version the catalog lists for this device.": "카탈로그에 이 기기용으로 나와 있는 펌웨어 버전을 사용하세요."
"Use the volume keys to choose Unlock, then press Power.": "볼륨 버튼으로 \"Unlock\"을 선택한 다음 전원 버튼을 누르세요."
"Wait for the first boot": "첫 부팅 기다리기"
"Wait on the Anbernic logo": "Anbernic 로고에서 기다리기"
"Wait through a blank screen": "빈 화면 동안 기다리기"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "설치가 끝난 뒤 {device}이(가) 스스로 다시 시작되지 않으면 전원 버튼을 한 번 누르세요."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "화면에 INFO: LOCK FLAG IS: UNLOCK!!!이 표시되면 잠금 해제된 것입니다. 케이블을 뽑고 {device}의 전원이 꺼져 있는지 확인한 다음 계속하세요."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "화면에 Unlock bootloader success!가 표시되면 잠금 해제된 것입니다. {device}이(가) 켜질 때 이미 INFO: LOCK FLAG IS : UNLOCK!!!이 잠깐 표시된다면 전에 잠금 해제된 것이므로 잠금 해제를 건너뛰어도 됩니다."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "{device}에서 요청하면 3초 안에 볼륨 업 버튼을 눌러 잠금 해제를 확인하세요."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "{device}에서 이미 커스텀 펌웨어가 실행 중입니다(이전에 잠금 해제됨). 잠금 해제를 건너뜁니다."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "{device}에서 기본 펌웨어가 실행 중입니다. 설치 프로그램이 기기를 지우는 클린 설치를 진행합니다."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "{device}에서 아직 기본 펌웨어가 실행 중입니다. 설치 프로그램이 잠금 해제 과정을 안내한 다음 기기를 지우는 클린 설치를 진행합니다."
"needs Android API {n}": "Android API {n} 필요"
"needs Vulkan": "Vulkan 필요"
"needs an ARMv8.2 CPU": "ARMv8.2 CPU 필요"
"needs {n} GB RAM": "{n}GB RAM 필요"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device}은(는) {host}에서 설치할 수 없습니다. 설치하려면 Windows PC에서 Thimsy Installer를 실행하세요."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device}은(는) Allwinner의 PhoenixSuit로 설치하며, 이 도구는 Windows에서만 실행됩니다. 설치하려면 Windows PC에서 Thimsy Installer를 실행하세요."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device}은(는) MediaTek의 SP Flash Tool로 설치하며, 이 도구는 {host}에서 실행되지 않습니다. 설치하려면 Windows PC에서 Thimsy Installer를 실행하세요."
"{device} isn't supported by this version of the installer yet.": "이 버전의 설치 프로그램은 아직 {device}을(를) 지원하지 않습니다."
