# Korean translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "클린 설치를 하면 내부 저장소가 지워집니다. ROMs, 세이브 파일, 스크린샷 등 보관하려는 모든 것을 컴퓨터나 microSD 카드에 복사하세요. microSD 카드의 게임은 그대로 유지됩니다."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Windows 권한 요청을 허용하거나 Zadig로 WinUSB를 설치하세요."
"Already unlocked: install new firmware": "이미 잠금 해제됨: 새 펌웨어 설치"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "균형: 클래식 기종용 RetroArch에 N64, Dreamcast, PSP, DS 에뮬레이터, ES-DE 홈 화면, Brave 포함."
"Building Thimsy for your device": "기기에 맞게 Thimsy를 빌드하는 중"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "GammaOS의 GitHub 페이지에서 다운로드한 RG Cube용 공식 GammaOS Next 1.2 릴리스를 바탕으로 빌드했습니다."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "시작하기 전에 50% 이상 충전하고, 기기와 함께 제공된 케이블을 준비해 두세요."
"Charge the RG Cube": "RG Cube 충전하기"
"Check it's unlocked": "잠금 해제 여부 확인하기"
"Check the basics": "기본 기능 확인하기"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "버튼, 터치스크린, 소리, Wi-Fi를 확인하고 게임을 실행해 보세요."
"Check the cable and that the device is still in its flashing mode, then try again.": "케이블을 확인하고 기기가 아직 플래싱 모드인지 확인한 다음 다시 시도하세요."
"Checking the USB driver": "USB 드라이버 확인 중"
"Checking the build": "빌드 확인 중"
"Checking the plan": "계획 확인 중"
"Checking the result": "결과 확인 중"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "여유 공간이 더 많은 드라이브(FAT32 제외)에서 작업 폴더를 선택하거나 공간을 확보하세요."
"Confirm on the device": "기기에서 확인하기"
"Connect the device in download mode": "다운로드 모드로 기기 연결하기"
"Copy your games and saves": "게임과 세이브 파일 복사하기"
"Delete the workspace's jobs folder and build again; report it if it persists.": "작업 폴더의 \"jobs\" 폴더를 삭제하고 다시 빌드하세요. 문제가 계속되면 신고해 주세요."
"Don't install on units whose stock firmware is v1.26.": "기본 펌웨어가 v1.26인 기기에는 설치하지 마세요."
"Downloading": "다운로드 중"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "전체: 미디엄에 GameCube/Wii, 3DS, PS2, Xbox, PS Vita 에뮬레이터와 고정확도 코어 추가. Thimsy 1.0a 전체 구성입니다."
"Finishing": "마무리 중"
"First time installing custom firmware": "커스텀 펌웨어를 처음 설치함"
"Follow the unlock steps shown in the installer, then continue.": "설치 프로그램에 표시되는 잠금 해제 단계를 따른 다음 계속하세요."
"Heavy": "헤비"
"Hold Volume Down and plug in the cable": "볼륨 다운 버튼을 누른 채 케이블 연결하기"
"Installing Thimsy": "Thimsy 설치 중"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "데이터가 유지됩니다. RG Cube에서 이미 GammaOS Next 1.2 또는 Thimsy 빌드가 실행 중인 경우에만 가능합니다."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "데이터가 유지됩니다. 기기에서 이미 호환되는 Thimsy 또는 GammaOS 빌드가 실행 중인 경우에만 가능합니다."
"Light": "라이트"
"Medium": "미디엄"
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "예정: Windows 및 Linux에서 SP Flash Tool 사용. 아직 빌드할 수 없습니다."
"Planned: Windows only. Not buildable yet.": "예정: Windows 전용. 아직 빌드할 수 없습니다."
"Planned: fastboot install on every computer. Not buildable yet.": "예정: 모든 컴퓨터에서 fastboot로 설치. 아직 빌드할 수 없습니다."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "예정: RG Cube와 같은 플래싱 방식. 아직 빌드할 수 없습니다."
"Preparing the partitions": "파티션 준비 중"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Thimsy Installer를 다시 설치하거나 THIMSY_TOOLS_DIR을 해당 파일이 들어 있는 폴더로 설정하세요."
"Required before flashing; skipping it can brick the device.": "플래싱 전에 반드시 필요합니다. 건너뛰면 기기가 벽돌이 될 수 있습니다."
"Restarting the device": "기기 재시작 중"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "PlayStation까지의 클래식 기종을 위한 작은 다운로드: 기종별 빠른 RetroArch 코어 1개, Minima 홈 화면, 셰이더 없음."
"The RG Cube is unlocked once, with the steps from GammaOS Next's installation guide (the Unisoc T820 section). The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "RG Cube는 GammaOS Next 설치 가이드(Unisoc T820 섹션)의 단계에 따라 한 번만 잠금 해제합니다. 설치 프로그램은 해당 도구를 직접 실행하지 않습니다. 가이드를 따른 다음 돌아와서 계속하세요."
"The file is damaged or a different version. Delete it and download again.": "파일이 손상되었거나 다른 버전입니다. 삭제한 다음 다시 다운로드하세요."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Thimsy가 에뮬레이터를 설정하는 동안 첫 시작에 몇 분이 걸립니다. 전원을 끄지 마세요."
"The installer sends the unlock command; confirm it on the device with Volume Up.": "설치 프로그램이 잠금 해제 명령을 보냅니다. 기기에서 볼륨 업 버튼으로 확인하세요."
"The {profile} profile isn't published yet. Choose a profile marked available.": "{profile} 프로필은 아직 게시되지 않았습니다. 사용 가능으로 표시된 프로필을 선택하세요."
"Turn the RG Cube off. Hold Volume Down and connect the USB cable to this computer. Keep holding until installation starts. The screen stays black; that's normal.": "RG Cube의 전원을 끄세요. 볼륨 다운 버튼을 누른 채 USB 케이블을 이 컴퓨터에 연결하세요. 설치가 시작될 때까지 계속 누르고 있으세요. 화면은 검은색으로 유지되며, 이는 정상입니다."
"Unlock in fastboot": "fastboot에서 잠금 해제하기"
"Unlock with GammaOS's own steps": "GammaOS 자체 단계로 잠금 해제하기"
"Unpacking the firmware": "펌웨어 압축 해제 중"
"Use a Windows PC": "Windows PC 사용하기"
"Use the firmware version the catalog lists for this device.": "카탈로그에 이 기기용으로 나와 있는 펌웨어 버전을 사용하세요."
"Use the volume keys to choose Unlock, then press Power.": "볼륨 버튼으로 \"Unlock\"을 선택한 다음 전원 버튼을 누르세요."
"Wait for the first boot": "첫 부팅 기다리기"
"When the device shows LOCK FLAG IS: UNLOCK, it's unlocked. Turn it off and continue.": "기기에 LOCK FLAG IS: UNLOCK이 표시되면 잠금 해제된 것입니다. 전원을 끄고 계속하세요."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "{device}에서 이미 커스텀 펌웨어가 실행 중입니다(이전에 잠금 해제됨). 잠금 해제를 건너뜁니다."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "{device}에서 기본 펌웨어가 실행 중입니다. 설치 프로그램이 기기를 지우는 클린 설치를 진행합니다."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "{device}에서 아직 기본 펌웨어가 실행 중입니다. 설치 프로그램이 잠금 해제 과정을 안내한 다음 기기를 지우는 클린 설치를 진행합니다."
"needs Android API {n}": "Android API {n} 필요"
"needs Vulkan": "Vulkan 필요"
"needs an ARMv8.2 CPU": "ARMv8.2 CPU 필요"
"needs {n} GB RAM": "{n}GB RAM 필요"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device}은(는) {host}에서 설치할 수 없습니다. 설치하려면 Windows PC에서 Thimsy Installer를 실행하세요."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device}은(는) Allwinner의 PhoenixSuit로 설치하며, 이 도구는 Windows에서만 실행됩니다. 설치하려면 Windows PC에서 Thimsy Installer를 실행하세요."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device}은(는) MediaTek의 SP Flash Tool로 설치하며, 이 도구는 {host}에서 실행되지 않습니다. 설치하려면 Windows PC에서 Thimsy Installer를 실행하세요."
"{device} isn't supported by this version of the installer yet.": "이 버전의 설치 프로그램은 아직 {device}을(를) 지원하지 않습니다."
