"Start from the microSD card": "microSD 카드로 시작하기"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "{device}에서 다른 microSD 카드를 모두 빼고 Thimsy 카드를 넣은 다음 전원을 켜세요. Thimsy는 카드에서 실행되며 내부 저장소는 건드리지 않습니다. 원래 시스템으로 돌아가려면 전원을 끄고 카드를 빼세요."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "SD 카드를 모두 뺀 다음 {device}이(가) 다시 시작될 때까지 볼륨 다운 버튼과 전원 버튼을 누르고 계세요."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "microSD 카드를 빼고 개발자 옵션에서 USB 디버깅을 켜세요. 전원이 켜진 {device}을(를) 이 컴퓨터에 연결하세요. fastbootd로 다시 시작되며 화면에 큰 빨간 글씨로 fastbootd가 표시됩니다."
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "작업 폴더가 있는 드라이브가 고장 나고 있을 수 있습니다. 다른 드라이브에서 작업 폴더를 선택하고 다시 빌드하세요."
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "이 빌드에는 드라이버 설치 프로그램이 포함되어 있지 않습니다. Zadig로 기기의 다운로드 모드용 WinUSB를 설치하세요."
"The file is damaged or a different version. Delete it and download again.": "파일이 손상되었거나 다른 버전입니다. 삭제한 다음 다시 다운로드하세요."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "첫 부팅은 1~3분 걸릴 수 있으며 Anbernic 로고에서 멈춘 것처럼 보일 수 있습니다. 정상입니다."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "첫 부팅은 1~3분 걸리며 부팅 로고에서 화면이 멈춘 것처럼 보일 수 있습니다. 정상입니다."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Thimsy가 에뮬레이터를 설정하는 동안 첫 시작에 몇 분이 걸립니다. 전원을 끄지 마세요."
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "이 드라이브의 여유 공간을 확인할 수 없습니다. 작업 폴더로 사용할 다른 폴더를 선택하세요."
"The installer does a fresh install that erases your {device}, whatever it runs now.": "설치 프로그램은 지금 무엇이 실행 중이든 {device}을(를) 지우는 클린 설치를 진행합니다."
"The installer runs as root, so it can open the device": "설치 프로그램이 root로 실행되므로 기기를 열 수 있습니다"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device}은(는) Windows PC에서 한 번만 잠금 해제합니다. GammaOS Next 설치 가이드(Unisoc T820, 1단계와 2단계)의 UnlockBootloader 도구는 Windows에서만 실행됩니다. 먼저 가이드의 UnisocTools에서 Unisoc USB 드라이버를 설치하세요. 그런 다음 {device}의 전원을 끄고 케이블을 뽑은 뒤, UnlockBootloader.bat를 실행하고 30초 안에 뒤로 버튼(화면 오른쪽에 있는 버튼)을 누른 채로 USB 케이블을 연결하세요. 화면에 글자가 나타나면 버튼에서 손을 떼세요. 잠금 해제하면 {device}의 데이터가 지워집니다. 설치 프로그램은 이 도구를 직접 실행하지 않습니다. 가이드를 따른 다음 돌아와서 계속하세요."
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device}은(는) Windows PC에서 한 번만 잠금 해제합니다. GammaOS Next 설치 가이드(Unisoc T820, 1단계와 2단계)의 UnlockBootloader 도구는 Windows에서만 실행됩니다. 먼저 가이드의 UnisocTools에서 Unisoc USB 드라이버를 설치하세요. 그런 다음 {device}의 전원을 끄고 케이블을 뽑은 뒤, UnlockBootloader.bat를 실행하고 30초 안에 뒤로 버튼을 누른 채로 USB 케이블을 연결하세요. 화면에 글자가 나타나면 버튼에서 손을 떼세요. 잠금 해제하면 {device}의 데이터가 지워집니다. 설치 프로그램은 이 도구를 직접 실행하지 않습니다. 가이드를 따른 다음 돌아와서 계속하세요."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "{device}은(는) GammaOS Next 설치 가이드(Anbernic RG405M / RG405V / RG505, 2단계)의 웹 잠금 해제 도구로 한 번만 잠금 해제합니다. microSD 카드를 빼고 개발자 옵션에서 USB 디버깅을 켠 다음, adb reboot bootloader로 {device}을(를) fastboot 모드로 다시 시작하세요. 화면의 Anbernic 로고 옆에 fastboot mode가 표시됩니다. Google Chrome에서 도구를 열고 \"Connect\"를 클릭한 다음 기기를 선택하고 \"Unlock\"을 클릭하세요. {device}에서는 볼륨 다운 버튼을 누르지 말고 홈 / 뒤로 버튼을 눌러 확인하세요. Linux나 macOS에서는 가이드의 unisoc-unlock 도구로 같은 작업을 할 수 있습니다. 잠금 해제하면 {device}의 데이터가 지워집니다. 설치 프로그램은 이 도구들을 직접 실행하지 않습니다. 가이드를 따른 다음 돌아와서 계속하세요."
"The {profile} profile isn't published yet. Choose a profile marked available.": "{profile} 프로필은 아직 게시되지 않았습니다. 사용 가능으로 표시된 프로필을 선택하세요."
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "이 기기에서는 일치하는 Thimsy 또는 GammaOS 빌드가 실행되고 있지 않아 업데이트할 수 없습니다. 대신 전체 설치를 사용하세요(기기가 지워집니다)."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "이 기기의 파티션 구성이 이 펌웨어와 맞지 않습니다. 다른 모델이거나, 파티션을 다시 나눠야 하는 순정 펌웨어가 아직 설치되어 있습니다. 이 버전은 아직 파티션을 다시 나눌 수 없습니다."
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "이 드라이브는 FAT32로 포맷되어 있어 4GB를 넘는 파일을 저장할 수 없습니다. 다른 드라이브(NTFS, exFAT, APFS 또는 ext4)에서 작업 폴더를 선택하세요."
"This version of the installer expects a different build. Build again, then install.": "이 버전의 설치 프로그램은 다른 빌드를 필요로 합니다. 다시 빌드한 다음 설치하세요."
"Turn it on": "전원 켜기"
"Turn on OEM unlocking": "OEM 잠금 해제 켜기"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "{device}의 전원을 끄고 케이블을 뽑으세요. 뒤로 버튼과 그 옆의 Anbernic 버튼을 누른 채로 USB 케이블을 이 컴퓨터에 연결하세요. 설치가 시작될 때까지 계속 누르고 계세요."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device}의 전원을 끄고 케이블을 뽑으세요. 뒤로 버튼을 누른 채로 USB 케이블을 이 컴퓨터에 연결하세요. 설치가 시작될 때까지 계속 누르고 계세요."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device}의 전원을 끄고 케이블을 뽑으세요. 뒤로 버튼(화면 오른쪽에 있는 버튼)을 누른 채로 USB 케이블을 이 컴퓨터에 연결하세요. 설치가 시작될 때까지 계속 누르고 계세요."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "{device}의 전원을 완전히 끄고 케이블을 뽑으세요. 볼륨 다운 버튼과 볼륨 업 버튼을 함께 누른 채로 USB 케이블을 이 컴퓨터에 연결하세요. 설치가 시작될 때까지 계속 누르고 계세요."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "{device}의 전원을 완전히 끄세요. 설치 프로그램이 요청하면 USB 케이블을 이 컴퓨터에 연결하고, 설치가 끝날 때까지 연결해 두세요."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "{device}의 전원을 끄고 카드를 넣은 다음 전원을 켜세요. 카드에서 내부 저장소로 스스로 설치되며, 몇 분 정도 걸립니다. 스스로 꺼지거나 다시 시작될 때까지 그대로 두었다가 카드를 빼세요."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "{device}의 전원을 끄고 카드를 넣은 다음 전원을 켜세요. 카드에서 내부 저장소로 스스로 설치됩니다. 끝날 때까지 그대로 두었다가 전원을 끄고 카드를 빼세요."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "{device}의 전원을 끄고 케이블을 뽑은 다음 SD 카드를 모두 빼세요. 슬라이드를 연 다음 방향 패드 가운데의 뒤로 버튼을 누른 채로 USB 케이블을 이 컴퓨터에 연결하세요. 설치가 시작될 때까지 계속 누르고 계세요."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "개발자 옵션에서 USB 디버깅을 켠 상태로 {device}의 전원을 켜고 이 컴퓨터에 연결하세요. 스스로 다시 시작되고 설치가 시작됩니다."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "개발자 옵션에서 USB 디버깅을 켠 상태로 {device}의 전원을 켜고 이 컴퓨터에 연결하세요. 설치를 위해 fastboot 모드로 다시 시작됩니다."
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "{ids}에 대한 USB 접근이 아직 설정되지 않았습니다. 설정할 때 비밀번호를 한 번 묻습니다."
"USB access is set up for {ids}": "{ids}에 대한 USB 접근 설정됨"
"Unlock before flashing": "플래싱 전에 잠금 해제하기"
"Unlock with GammaOS's own steps": "GammaOS 자체 단계로 잠금 해제하기"
"Unpacking the firmware": "펌웨어 압축 해제 중"
"Unpacking {file}": "{file} 압축 해제 중"
"Unplug it and turn it on": "케이블을 뽑고 전원 켜기"
"Unplug the cable when it restarts": "다시 시작되면 케이블 뽑기"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "케이블을 뽑으세요. 전원 버튼과 볼륨 다운 버튼을 60초 이상 누른 다음, 계속 누른 채로 USB 케이블을 연결하세요. 설치가 시작될 때까지 계속 누르고 계세요. {device}을(를) 인식하는 데 30초 이상 걸릴 수 있습니다."
"Updating checksums": "체크섬 업데이트 중"
"Use a Windows PC": "Windows PC 사용하기"
"Use the firmware version the catalog lists for this device.": "카탈로그에 이 기기용으로 나와 있는 펌웨어 버전을 사용하세요."
"Use the volume keys to choose Unlock, then press Power.": "볼륨 버튼으로 \"Unlock\"을 선택한 다음 전원 버튼을 누르세요."
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "첫 부팅 기다리기"
"Wait on the Anbernic logo": "Anbernic 로고에서 기다리기"
"Wait through a blank screen": "빈 화면 동안 기다리기"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "설치가 끝난 뒤 {device}이(가) 스스로 다시 시작되지 않으면 전원 버튼을 한 번 누르세요."
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "설치가 끝나면 {device}이(가) 스스로 다시 시작되어 저장소를 설정합니다. 그때 케이블을 뽑으세요."
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "설치가 끝나면 케이블을 뽑고 전원 버튼을 눌러 {device}을(를) 켜세요."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "화면에 INFO: LOCK FLAG IS: UNLOCK!!!이 표시되면 잠금 해제된 것입니다. 케이블을 뽑고 {device}의 전원이 꺼져 있는지 확인한 다음(다시 시작되면 꺼질 때까지 전원 버튼을 누르고 계세요) 계속하세요."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "화면에 Unlock bootloader success!가 표시되면 잠금 해제된 것입니다. {device}이(가) 켜질 때 이미 INFO: LOCK FLAG IS : UNLOCK!!!이 잠깐 표시된다면 전에 잠금 해제된 것이므로 잠금 해제를 건너뛰어도 됩니다."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "{device}에서 요청하면 3초 안에 볼륨 업 버튼을 눌러 잠금 해제를 확인하세요."
"WinUSB is installed for {ids}": "{ids}에 WinUSB 설치됨"
"WinUSB will be installed for {ids} the first time you flash": "처음 플래시할 때 {ids}에 WinUSB가 설치됩니다"
"WonderSwan": "WonderSwan"
"Writing {partition}": "{partition} 쓰는 중"
"Wrote {partition}": "{partition} 쓰기 완료"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "{device}에서 이미 GammaOS 또는 Thimsy가 실행 중입니다. 새 펌웨어를 설치할 방법을 선택하세요."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "{device}에서 이미 커스텀 펌웨어가 실행 중입니다(이전에 잠금 해제됨). 잠금 해제를 건너뜁니다."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "{device}에서 아직 기본 펌웨어가 실행 중입니다. 설치 프로그램이 잠금 해제 과정을 안내한 다음 기기를 지우는 클린 설치를 진행합니다."
"hakuX": "hakuX"
"needs Android API {n}": "Android API {n} 필요"
"needs Vulkan": "Vulkan 필요"
"needs an ARMv8.2 CPU": "ARMv8.2 CPU 필요"
"needs {n} GB RAM": "{n}GB RAM 필요"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device}은(는) {host}에서 설치할 수 없습니다. 설치하려면 Windows PC에서 Thimsy Installer를 실행하세요."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device}은(는) Allwinner의 PhoenixSuit로 설치하며, 이 도구는 Windows에서만 실행됩니다. 설치하려면 Windows PC에서 Thimsy Installer를 실행하세요."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device}은(는) MediaTek의 SP Flash Tool로 설치하며, 이 도구는 {host}에서 실행되지 않습니다. 설치하려면 Windows PC에서 Thimsy Installer를 실행하세요."
"{device} isn't supported by this version of the installer yet.": "이 버전의 설치 프로그램은 아직 {device}을(를) 지원하지 않습니다."
"{host} needs no driver": "{host}에서는 드라이버가 필요 없습니다"
