# Norwegian Bokmål translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "En ren installasjon sletter den interne lagringen. Kopier ROMs, lagrede spill, skjermbilder og alt annet du vil beholde, til datamaskinen eller microSD-kortet. Spill på microSD-kortet blir ikke rørt."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Godta tillatelsesforespørselen fra Windows, eller installer WinUSB med Zadig."
"Already unlocked: install new firmware": "Allerede låst opp: installer ny fastvare"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Balansert: RetroArch for klassiske systemer pluss emulatorer for N64, Dreamcast, PSP og DS, ES-DE som startskjerm og Brave."
"Building Thimsy for your device": "Bygger Thimsy for enheten din"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Bygget fra den offisielle GammaOS Next 1.2-utgivelsen for RG Cube, lastet ned fra GammaOS sin GitHub-side."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Lad den til minst 50 % før du begynner, og ha den medfølgende kabelen for hånden."
"Charge the RG Cube": "Lad RG Cube"
"Check it's unlocked": "Sjekk at den er låst opp"
"Check the basics": "Sjekk det grunnleggende"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Sjekk knappene, berøringsskjermen, lyden og Wi-Fi, og start et spill."
"Check the cable and that the device is still in its flashing mode, then try again.": "Sjekk kabelen og at enheten fortsatt er i flashmodus, og prøv igjen."
"Checking the USB driver": "Sjekker USB-driveren"
"Checking the build": "Sjekker bygget"
"Checking the plan": "Sjekker planen"
"Checking the result": "Sjekker resultatet"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Velg et arbeidsområde på en stasjon med mer ledig plass (ikke FAT32), eller frigjør plass."
"Confirm on the device": "Bekreft på enheten"
"Confirm with Volume Up": "Bekreft med Volum opp"
"Connect it with USB debugging on": "Koble til med USB-feilsøking på"
"Connect the device in download mode": "Koble til enheten i nedlastingsmodus"
"Copy games without a card reader": "Kopier spill uten kortleser"
"Copy your games and saves": "Kopier spill og lagrede spill"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Slett mappen «jobs» i arbeidsområdet og bygg på nytt; rapporter det hvis problemet vedvarer."
"Don't install on units made in March 2026 or later.": "Ikke installer på enheter produsert i mars 2026 eller senere."
"Don't install on units whose stock firmware is v1.26.": "Ikke installer på enheter med original fastvare v1.26."
"Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead.": "Ikke sett kortet tilbake i en datamaskin for å kopiere spill: det inneholder en kryptert Android-inndeling, så datamaskinen viser ikke lagringsplassen din. Kopier heller spill med USB-filoverføring (MTP), med ADB Explorer eller fra en nettverksdeling."
"Download mode was never seen through WinUSB. Hold Back while you plug in the cable, and check in Device Manager or Zadig that Windows uses WinUSB for Unisoc download mode, not Unisoc's own driver.": "Nedlastingsmodus ble aldri sett via WinUSB. Hold inne Tilbake mens du kobler til kabelen, og sjekk i Enhetsbehandling eller Zadig at Windows bruker WinUSB for Unisoc download mode og ikke Unisocs egen driver."
"Downloading": "Laster ned"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Alt: Middels pluss emulatorer for GameCube/Wii, 3DS, PS2, Xbox og PS Vita og de nøyaktige kjernene. Hele Thimsy 1.0a-settet."
"Finishing": "Fullfører"
"First time installing custom firmware": "Første gang du installerer tilpasset fastvare"
"Follow the unlock steps shown in the installer, then continue.": "Følg opplåsingstrinnene som vises i installasjonsprogrammet, og fortsett deretter."
"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "GammaOS-veiledningen advarer om at {device} blir ubrukelig hvis den flashes uten å være låst opp. Etter opplåsingen starter {device} på nytt i sin opprinnelige Android. Vent til Android har startet, og fortsett deretter."
"Heavy": "Tung"
"Hold Back and plug in the cable": "Hold inne Tilbake og koble til kabelen"
"Hold Back and the Anbernic button, then plug in": "Hold inne Tilbake og Anbernic-knappen, og koble til"
"Hold Power to turn the {device} off. Hold both volume buttons and, still holding them, connect the USB cable. Then keep tapping the Power button, with the volume buttons still held, until installation starts.": "Hold inne av/på-knappen for å slå av {device}. Hold inne begge volumknappene, og koble til USB-kabelen mens du fortsatt holder dem. Fortsett å holde volumknappene, og trykk gjentatte ganger på av/på-knappen til installasjonen starter."
"Hold both volume buttons and plug in the cable": "Hold inne begge volumknappene og koble til kabelen"
"Hold the Back button, Volume Down and Power together until installation starts again.": "Hold inne Tilbake-knappen, Volum ned og av/på-knappen samtidig til installasjonen starter igjen."
"If installation doesn't start": "Hvis installasjonen ikke starter"
"If installation stalls": "Hvis installasjonen stopper opp"
"If it isn't found": "Hvis den ikke blir funnet"
"If the screen stays black": "Hvis skjermen forblir svart"
"Install from the microSD card": "Installer fra microSD-kortet"
"Installing Thimsy": "Installerer Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Beholder dataene dine. Bare når RG Cube allerede kjører GammaOS Next 1.2 eller et Thimsy-bygg."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Beholder dataene dine. Bare når enheten allerede kjører et kompatibelt Thimsy- eller GammaOS-bygg."
"Light": "Lett"
"Medium": "Middels"
"On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear.": "Ved aller første oppstart kan skjermen være tom i opptil ett minutt. Det er normalt; vent til oppstartsskjermen vises."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "Åpne Innstillinger, Om på {device}, og trykk sju ganger på Delversjonsnummer. Slå deretter på USB-feilsøking og OEM-opplåsing under Innstillinger, Utvikleralternativer. Koble {device} til denne datamaskinen mens den er på; den starter på nytt i fastboot-modus for installasjonen."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "Åpne Innstillinger, Om på {device}, og trykk sju ganger på Delversjonsnummer. Slå deretter på USB-feilsøking og OEM-opplåsing under Innstillinger, Utvikleralternativer. Koble {device} til denne datamaskinen mens den er på; den starter på nytt i fastboot-modus for opplåsingen."
"Planned: Qualcomm EDL install on every computer. Not buildable yet.": "Planlagt: installasjon via Qualcomm EDL på alle datamaskiner. Kan ikke bygges ennå."
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Planlagt: SP Flash Tool på Windows og Linux. Kan ikke bygges ennå."
"Planned: Windows only. Not buildable yet.": "Planlagt: bare Windows. Kan ikke bygges ennå."
"Planned: fastboot install on every computer. Not buildable yet.": "Planlagt: installasjon via fastboot på alle datamaskiner. Kan ikke bygges ennå."
"Planned: microSD card install on every computer. Not buildable yet.": "Planlagt: installasjon via microSD-kort på alle datamaskiner. Kan ikke bygges ennå."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Planlagt: samme flashmetode som RG Cube. Kan ikke bygges ennå."
"Plug in the cable with the device off": "Koble til kabelen mens enheten er av"
"Preparing the partitions": "Klargjør partisjonene"
"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Sett kortet i {device} og slå den på. Thimsy kjører fra kortet og lar den interne lagringen på {device} være urørt: for å gå tilbake til det opprinnelige systemet slår du den av og tar ut kortet."
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Installer Thimsy Installer på nytt, eller sett THIMSY_TOOLS_DIR til en mappe som inneholder det."
"Restart into fastbootd": "Start på nytt i fastbootd"
"Restart with Power": "Start på nytt med av/på-knappen"
"Restarting the device": "Starter enheten på nytt"
"Slide it open, hold Back and plug in": "Skyv den opp, hold inne Tilbake og koble til"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Liten nedlasting for klassiske systemer opp til PlayStation: én rask RetroArch-kjerne per system, Minima som startskjerm, ingen shadere."
"Start from the microSD card": "Start fra microSD-kortet"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Ta alle andre microSD-kort ut av {device}, sett inn Thimsy-kortet og slå den på. Thimsy kjører fra kortet og lar den interne lagringen være urørt: for å gå tilbake til det opprinnelige systemet slår du den av og tar ut kortet."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Ta ut eventuelle SD-kort, og hold deretter inne Volum ned og av/på-knappen til {device} starter på nytt."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Ta ut microSD-kortet, og slå på USB-feilsøking i Utvikleralternativer. Koble {device} til denne datamaskinen mens den er på. Den starter på nytt i fastbootd: skjermen viser fastbootd med stor rød tekst."
"The file is damaged or a different version. Delete it and download again.": "Filen er skadet eller en annen versjon. Slett den og last den ned på nytt."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Første oppstart kan ta 1 til 3 minutter og kan se ut til å henge på Anbernic-logoen. Det er normalt."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Første oppstart tar 1 til 3 minutter, og skjermen kan se ut til å henge på oppstartslogoen. Det er normalt."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Første oppstart tar noen minutter mens Thimsy setter opp emulatorene dine. Ikke slå den av."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} låses opp én gang, med UnlockBootloader-verktøyet fra installasjonsveiledningen til GammaOS Next (Unisoc T820, trinn 2): slå av {device}, start verktøyet, og hold deretter inne Tilbake-knappen mens du kobler til USB-kabelen. Installasjonsprogrammet kjører ikke selv dette verktøyet. Følg veiledningen, og kom deretter tilbake og fortsett."
"The {device} is unlocked once, with the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Step 2): turn the {device} off, start the tool, then hold the Back button, the button on the right side of the screen, while you connect the USB cable. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} låses opp én gang, med UnlockBootloader-verktøyet fra installasjonsveiledningen til GammaOS Next (Unisoc T820, trinn 2): slå av {device}, start verktøyet, og hold deretter inne Tilbake-knappen, knappen på høyre side av skjermen, mens du kobler til USB-kabelen. Installasjonsprogrammet kjører ikke selv dette verktøyet. Følg veiledningen, og kom deretter tilbake og fortsett."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Restart the {device} into fastboot mode, open the tool in Google Chrome, click Connect, then Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} låses opp én gang, med nettverktøyet for opplåsing fra installasjonsveiledningen til GammaOS Next (Anbernic RG405M / RG405V / RG505, trinn 2). Start {device} på nytt i fastboot-modus, åpne verktøyet i Google Chrome, klikk på «Connect» og deretter «Unlock». Ikke trykk på Volum ned på {device}: trykk på Hjem / Tilbake-knappen for å bekrefte. Installasjonsprogrammet kjører ikke selv dette verktøyet. Følg veiledningen, og kom deretter tilbake og fortsett."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Profilen {profile} er ikke publisert ennå. Velg en profil som er merket som tilgjengelig."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "Partisjonsoppsettet på denne enheten passer ikke til denne fastvaren: det er en annen modell, eller den kjører fortsatt original fastvare som må partisjoneres på nytt, noe denne versjonen ikke kan ennå."
"Turn on OEM unlocking": "Slå på OEM-opplåsing"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Slå av {device} og koble fra kabelen. Hold inne Tilbake-knappen og Anbernic-knappen ved siden av den, og koble USB-kabelen til denne datamaskinen mens du fortsatt holder begge. Fortsett å holde til installasjonen starter."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Slå av {device} og koble fra kabelen. Hold inne Tilbake-knappen, og koble USB-kabelen til denne datamaskinen mens du fortsatt holder den. Fortsett å holde til installasjonen starter."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Slå av {device} og koble fra kabelen. Hold inne Tilbake-knappen, knappen på høyre side av skjermen, og koble USB-kabelen til denne datamaskinen mens du fortsatt holder den. Fortsett å holde til installasjonen starter."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Slå {device} helt av og koble fra kabelen. Hold inne Volum ned og Volum opp samtidig, og koble USB-kabelen til denne datamaskinen mens du fortsatt holder begge. Fortsett å holde til installasjonen starter."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer.": "Slå {device} helt av. Når installasjonsprogrammet ber om det, kobler du USB-kabelen til denne datamaskinen."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Slå av {device}, sett inn kortet og slå den på. Den installerer seg selv på den interne lagringen fra kortet. La den være i fred til den er ferdig, og slå den deretter av og ta ut kortet."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Slå av {device}, koble fra kabelen og ta ut alle SD-kort. Skyv den opp, hold deretter inne Tilbake-knappen midt på styrekorset, og koble USB-kabelen til denne datamaskinen mens du fortsatt holder den. Fortsett å holde til installasjonen starter."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Slå på {device} med USB-feilsøking fortsatt på i Utvikleralternativer, og koble den til denne datamaskinen. Den starter på nytt av seg selv, og installasjonen begynner."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Slå på {device} med USB-feilsøking fortsatt på i Utvikleralternativer, og koble den til denne datamaskinen. Den starter på nytt i fastboot-modus for installasjonen."
"Unlock before flashing": "Lås opp før flashing"
"Unlock with GammaOS's own steps": "Lås opp med GammaOS sine egne trinn"
"Unpacking the firmware": "Pakker ut fastvaren"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Koble fra kabelen. Hold inne av/på-knappen og Volum ned i minst 60 sekunder, og koble deretter til USB-kabelen mens du fortsatt holder dem. Fortsett å holde til installasjonen starter; det kan ta 30 sekunder eller mer før {device} blir funnet."
"Use a Windows PC": "Bruk en Windows-PC"
"Use the firmware version the catalog lists for this device.": "Bruk fastvareversjonen som katalogen oppgir for denne enheten."
"Use the volume keys to choose Unlock, then press Power.": "Velg «Unlock» med volumknappene, og trykk deretter på av/på-knappen."
"Wait for the first boot": "Vent på første oppstart"
"Wait on the Anbernic logo": "Vent på Anbernic-logoen"
"Wait through a blank screen": "Vent gjennom en tom skjerm"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Når installasjonen er ferdig, trykker du én gang på av/på-knappen hvis {device} ikke har startet på nytt av seg selv."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable, make sure the {device} is off, and continue.": "Når skjermen viser INFO: LOCK FLAG IS: UNLOCK!!!, er den låst opp. Koble fra kabelen, sørg for at {device} er av, og fortsett."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Når skjermen viser Unlock bootloader success!, er den låst opp. Hvis {device} allerede viser INFO: LOCK FLAG IS : UNLOCK!!! en kort stund når den starter, er den låst opp fra før, og du kan hoppe over opplåsingen."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Når {device} spør, trykker du på Volum opp innen 3 sekunder for å bekrefte opplåsingen."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "{device} kjører allerede tilpasset fastvare (den har vært låst opp før). Opplåsing hoppes over."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "{device} kjører den originale fastvaren. Installasjonsprogrammet gjør en ren installasjon som sletter enheten."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "{device} kjører fortsatt den originale fastvaren. Installasjonsprogrammet veileder deg gjennom opplåsingen og gjør deretter en ren installasjon som sletter enheten."
"needs Android API {n}": "krever Android API {n}"
"needs Vulkan": "krever Vulkan"
"needs an ARMv8.2 CPU": "krever en ARMv8.2-prosessor"
"needs {n} GB RAM": "krever {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} kan ikke installeres fra {host}. Kjør Thimsy Installer på en Windows-PC for å installere den."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} installeres med PhoenixSuit fra Allwinner, som bare kjører på Windows. Kjør Thimsy Installer på en Windows-PC for å installere den."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} installeres med SP Flash Tool fra MediaTek, som ikke kjører på {host}. Kjør Thimsy Installer på en Windows-PC for å installere den."
"{device} isn't supported by this version of the installer yet.": "{device} støttes ikke av denne versjonen av installasjonsprogrammet ennå."
