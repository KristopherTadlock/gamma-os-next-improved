# Norwegian Bokmål translation of en.yaml
"A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched.": "En ren installasjon sletter den interne lagringen. Kopier ROMs, lagrede spill, skjermbilder og alt annet du vil beholde, til datamaskinen eller microSD-kortet. Spill på microSD-kortet blir ikke rørt."
"Accept the Windows permission prompt, or install WinUSB with Zadig.": "Godta tillatelsesforespørselen fra Windows, eller installer WinUSB med Zadig."
"Already unlocked: install new firmware": "Allerede låst opp: installer ny fastvare"
"Balanced: RetroArch for classic systems plus N64, Dreamcast, PSP and DS emulators, the ES-DE home and Brave.": "Balansert: RetroArch for klassiske systemer pluss emulatorer for N64, Dreamcast, PSP og DS, ES-DE som startskjerm og Brave."
"Building Thimsy for your device": "Bygger Thimsy for enheten din"
"Built from the official GammaOS Next 1.2 release for the RG Cube, downloaded from GammaOS's GitHub page.": "Bygget fra den offisielle GammaOS Next 1.2-utgivelsen for RG Cube, lastet ned fra GammaOS sin GitHub-side."
"Charge it to at least 50% before you start, and keep the cable it came with handy.": "Lad den til minst 50 % før du begynner, og ha den medfølgende kabelen for hånden."
"Charge the RG Cube": "Lad RG Cube"
"Check it's unlocked": "Sjekk at den er låst opp"
"Check the basics": "Sjekk det grunnleggende"
"Check the buttons, touch screen, sound and Wi-Fi, and start a game.": "Sjekk knappene, berøringsskjermen, lyden og Wi-Fi, og start et spill."
"Check the cable and that the device is still in its flashing mode, then try again.": "Sjekk kabelen og at enheten fortsatt er i flashmodus, og prøv igjen."
"Checking the USB driver": "Sjekker USB-driveren"
"Checking the build": "Sjekker bygget"
"Checking the plan": "Sjekker planen"
"Checking the result": "Sjekker resultatet"
"Choose a workspace on a drive with more free space (not FAT32), or free some space.": "Velg et arbeidsområde på en stasjon med mer ledig plass (ikke FAT32), eller frigjør plass."
"Confirm on the device": "Bekreft på enheten"
"Connect the device in download mode": "Koble til enheten i nedlastingsmodus"
"Copy your games and saves": "Kopier spill og lagrede spill"
"Delete the workspace's jobs folder and build again; report it if it persists.": "Slett mappen «jobs» i arbeidsområdet og bygg på nytt; rapporter det hvis problemet vedvarer."
"Don't install on units whose stock firmware is v1.26.": "Ikke installer på enheter med original fastvare v1.26."
"Downloading": "Laster ned"
"Everything: Medium plus GameCube/Wii, 3DS, PS2, Xbox and PS Vita emulators and the accuracy cores. The full Thimsy 1.0a set.": "Alt: Middels pluss emulatorer for GameCube/Wii, 3DS, PS2, Xbox og PS Vita og de nøyaktige kjernene. Hele Thimsy 1.0a-settet."
"Finishing": "Fullfører"
"First time installing custom firmware": "Første gang du installerer tilpasset fastvare"
"Follow the unlock steps shown in the installer, then continue.": "Følg opplåsingstrinnene som vises i installasjonsprogrammet, og fortsett deretter."
"Heavy": "Tung"
"Hold Volume Down and plug in the cable": "Hold inne Volum ned og koble til kabelen"
"Installing Thimsy": "Installerer Thimsy"
"Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build.": "Beholder dataene dine. Bare når RG Cube allerede kjører GammaOS Next 1.2 eller et Thimsy-bygg."
"Keeps your data. Only when the device already runs a compatible Thimsy or GammaOS build.": "Beholder dataene dine. Bare når enheten allerede kjører et kompatibelt Thimsy- eller GammaOS-bygg."
"Light": "Lett"
"Medium": "Middels"
"Planned: SP Flash Tool on Windows and Linux. Not buildable yet.": "Planlagt: SP Flash Tool på Windows og Linux. Kan ikke bygges ennå."
"Planned: Windows only. Not buildable yet.": "Planlagt: bare Windows. Kan ikke bygges ennå."
"Planned: fastboot install on every computer. Not buildable yet.": "Planlagt: installasjon via fastboot på alle datamaskiner. Kan ikke bygges ennå."
"Planned: same flashing route as the RG Cube. Not buildable yet.": "Planlagt: samme flashmetode som RG Cube. Kan ikke bygges ennå."
"Preparing the partitions": "Klargjør partisjonene"
"Reinstall Thimsy Installer, or set THIMSY_TOOLS_DIR to a folder containing it.": "Installer Thimsy Installer på nytt, eller sett THIMSY_TOOLS_DIR til en mappe som inneholder det."
"Required before flashing; skipping it can brick the device.": "Påkrevd før flashing; hopper du over dette, kan enheten bli ubrukelig."
"Restarting the device": "Starter enheten på nytt"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Liten nedlasting for klassiske systemer opp til PlayStation: én rask RetroArch-kjerne per system, Minima som startskjerm, ingen shadere."
"The RG Cube is unlocked once, with the steps from GammaOS Next's installation guide (the Unisoc T820 section). The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "RG Cube låses opp én gang, med trinnene fra installasjonsveiledningen for GammaOS Next (delen om Unisoc T820). Installasjonsprogrammet kjører ikke selve verktøyet. Følg veiledningen, kom så tilbake og fortsett."
"The file is damaged or a different version. Delete it and download again.": "Filen er skadet eller en annen versjon. Slett den og last den ned på nytt."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Første oppstart tar noen minutter mens Thimsy setter opp emulatorene dine. Ikke slå den av."
"The installer sends the unlock command; confirm it on the device with Volume Up.": "Installasjonsprogrammet sender opplåsingskommandoen; bekreft den på enheten med Volum opp."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Profilen {profile} er ikke publisert ennå. Velg en profil som er merket som tilgjengelig."
"Turn the RG Cube off. Hold Volume Down and connect the USB cable to this computer. Keep holding until installation starts. The screen stays black; that's normal.": "Slå av RG Cube. Hold inne Volum ned og koble USB-kabelen til denne datamaskinen. Fortsett å holde til installasjonen starter. Skjermen forblir svart; det er normalt."
"Unlock in fastboot": "Lås opp i fastboot"
"Unlock with GammaOS's own steps": "Lås opp med GammaOS sine egne trinn"
"Unpacking the firmware": "Pakker ut fastvaren"
"Use a Windows PC": "Bruk en Windows-PC"
"Use the firmware version the catalog lists for this device.": "Bruk fastvareversjonen som katalogen oppgir for denne enheten."
"Use the volume keys to choose Unlock, then press Power.": "Velg «Unlock» med volumknappene, og trykk deretter på av/på-knappen."
"Wait for the first boot": "Vent på første oppstart"
"When the device shows LOCK FLAG IS: UNLOCK, it's unlocked. Turn it off and continue.": "Når enheten viser LOCK FLAG IS: UNLOCK, er den låst opp. Slå den av og fortsett."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "{device} kjører allerede tilpasset fastvare (den har vært låst opp før). Opplåsing hoppes over."
"Your {device} runs its original firmware. The installer does a fresh install that erases the device.": "{device} kjører den originale fastvaren. Installasjonsprogrammet gjør en ren installasjon som sletter enheten."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "{device} kjører fortsatt den originale fastvaren. Installasjonsprogrammet veileder deg gjennom opplåsingen og gjør deretter en ren installasjon som sletter enheten."
"needs Android API {n}": "krever Android API {n}"
"needs Vulkan": "krever Vulkan"
"needs an ARMv8.2 CPU": "krever en ARMv8.2-prosessor"
"needs {n} GB RAM": "krever {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} kan ikke installeres fra {host}. Kjør Thimsy Installer på en Windows-PC for å installere den."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} installeres med PhoenixSuit fra Allwinner, som bare kjører på Windows. Kjør Thimsy Installer på en Windows-PC for å installere den."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} installeres med SP Flash Tool fra MediaTek, som ikke kjører på {host}. Kjør Thimsy Installer på en Windows-PC for å installere den."
"{device} isn't supported by this version of the installer yet.": "{device} støttes ikke av denne versjonen av installasjonsprogrammet ennå."
