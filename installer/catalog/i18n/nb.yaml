"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the installation.": "Åpne Innstillinger, Om på {device}, og trykk sju ganger på Delversjonsnummer. Slå deretter på USB-feilsøking og OEM-opplåsing under Innstillinger, Utvikleralternativer. Koble {device} til denne datamaskinen mens den er på; den starter på nytt i fastboot-modus for installasjonen."
"On the {device}, open Settings, About and tap Build number seven times. Then, in Settings, Developer options, turn on USB debugging and OEM unlocking. Connect the {device} to this computer while it's on; it restarts into fastboot mode for the unlock.": "Åpne Innstillinger, Om på {device}, og trykk sju ganger på Delversjonsnummer. Slå deretter på USB-feilsøking og OEM-opplåsing under Innstillinger, Utvikleralternativer. Koble {device} til denne datamaskinen mens den er på; den starter på nytt i fastboot-modus for opplåsingen."
