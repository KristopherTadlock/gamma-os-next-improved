"In Android Settings, Storage, check whether the {device} has 128 GB or 256 GB. Each size needs its own layout, and installing the wrong one can brick the {device}.": "Sjekk under Innstillinger, Lagring i Android om {device} har 128 GB eller 256 GB. Hver størrelse trenger sin egen inndeling, og hvis du installerer feil inndeling, kan {device} bli ubrukelig."
"In Settings, Handheld Settings, About Device, Device Information, note the first four characters of the SN (MQ65 or MQ66). Each hardware revision needs its own firmware.": "Noter de fire første tegnene i SN (MQ65 eller MQ66) under Innstillinger, Håndkonsoll-innstillinger, Om enheten, Enhetsinformasjon. Hver maskinvarerevisjon trenger sin egen fastvare."
