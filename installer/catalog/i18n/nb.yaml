"Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out.": "Sett kortet i {device} og slå den på. Thimsy kjører fra kortet og lar den interne lagringen på {device} være urørt: for å gå tilbake til det opprinnelige systemet slår du den av og tar ut kortet."
"Reinstall Thimsy Installer: its flashing tool isn't the version it expects.": "Installer Thimsy Installer på nytt: flashverktøyet er ikke versjonen det forventer."
"Reinstall Thimsy Installer: one of its tools is missing.": "Installer Thimsy Installer på nytt: et av verktøyene mangler."
"Repeat the download-mode steps and keep holding the button until installing starts, then try again.": "Gjenta trinnene for nedlastingsmodus og hold knappen inne til installasjonen starter, og prøv igjen."
"Repeat the download-mode steps, then try again. If it still isn't found, check in Device Manager that Unisoc download mode uses the WinUSB driver.": "Gjenta trinnene for nedlastingsmodus, og prøv igjen. Hvis enheten fortsatt ikke blir funnet, sjekk i Enhetsbehandling at Unisoc download mode bruker WinUSB-driveren."
"Repeat the download-mode steps, then try again. If it still isn't found, unplug the cable, plug it into another USB port and try again.": "Gjenta trinnene for nedlastingsmodus, og prøv igjen. Hvis enheten fortsatt ikke blir funnet, trekk ut kabelen, koble den til en annen USB-port og prøv igjen."
