"Slide it open, hold Back and plug in": "Skyv den opp, hold inne Tilbake og koble til"
"Small download for classic systems up to PlayStation: one fast RetroArch core per system, the Minima home, no shaders.": "Liten nedlasting for klassiske systemer opp til PlayStation: én rask RetroArch-kjerne per system, Minima som startskjerm, ingen shadere."
"Start from the microSD card": "Start fra microSD-kortet"
"Take any other microSD card out of the {device}, put the Thimsy card in and turn it on. Thimsy runs from the card and leaves the internal storage untouched: to go back to the original system, turn it off and take the card out.": "Ta alle andre microSD-kort ut av {device}, sett inn Thimsy-kortet og slå den på. Thimsy kjører fra kortet og lar den interne lagringen være urørt: for å gå tilbake til det opprinnelige systemet slår du den av og tar ut kortet."
"Take out any SD card, then hold Volume Down and Power until the {device} restarts.": "Ta ut eventuelle SD-kort, og hold deretter inne Volum ned og av/på-knappen til {device} starter på nytt."
"Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text.": "Ta ut microSD-kortet, og slå på USB-feilsøking i Utvikleralternativer. Koble {device} til denne datamaskinen mens den er på. Den starter på nytt i fastbootd: skjermen viser fastbootd med stor rød tekst."
"The drive the workspace is on may be failing. Choose a workspace on another drive and build again.": "Stasjonen arbeidsområdet ligger på, kan være i ferd med å svikte. Velg et arbeidsområde på en annen stasjon og bygg på nytt."
"The driver installer isn't bundled with this build. Install WinUSB for the device's download mode with Zadig.": "Driverinstallasjonsprogrammet følger ikke med dette bygget. Installer WinUSB for enhetens nedlastingsmodus med Zadig."
"The file is damaged or a different version. Delete it and download again.": "Filen er skadet eller en annen versjon. Slett den og last den ned på nytt."
"The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal.": "Første oppstart kan ta 1 til 3 minutter og kan se ut til å henge på Anbernic-logoen. Det er normalt."
"The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal.": "Første oppstart tar 1 til 3 minutter, og skjermen kan se ut til å henge på oppstartslogoen. Det er normalt."
"The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off.": "Første oppstart tar noen minutter mens Thimsy setter opp emulatorene dine. Ikke slå den av."
"The free space on this drive couldn't be checked. Choose another folder for the workspace.": "Kunne ikke sjekke ledig plass på denne stasjonen. Velg en annen mappe for arbeidsområdet."
"The installer does a fresh install that erases your {device}, whatever it runs now.": "Installasjonsprogrammet gjør en ren installasjon som sletter {device}, uansett hva den kjører nå."
"The installer runs as root, so it can open the device": "Installasjonsprogrammet kjører som root, så det kan åpne enheten"
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button (the button on the right side of the screen) and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} låses opp én gang, på en Windows-PC: UnlockBootloader-verktøyet fra installasjonsveiledningen til GammaOS Next (Unisoc T820, trinn 1 og 2) kjører bare på Windows. Installer først Unisoc-USB-driveren fra UnisocTools i veiledningen. Slå deretter av {device} og koble fra kabelen, start UnlockBootloader.bat, og innen 30 sekunder holder du inne Tilbake-knappen (knappen på høyre side av skjermen) og kobler til USB-kabelen mens du fortsatt holder den. Slipp når det vises tekst på skjermen. Opplåsingen sletter {device}. Installasjonsprogrammet kjører ikke selv dette verktøyet. Følg veiledningen, og kom deretter tilbake og fortsett."
"The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue.": "{device} låses opp én gang, på en Windows-PC: UnlockBootloader-verktøyet fra installasjonsveiledningen til GammaOS Next (Unisoc T820, trinn 1 og 2) kjører bare på Windows. Installer først Unisoc-USB-driveren fra UnisocTools i veiledningen. Slå deretter av {device} og koble fra kabelen, start UnlockBootloader.bat, og innen 30 sekunder holder du inne Tilbake-knappen og kobler til USB-kabelen mens du fortsatt holder den. Slipp når det vises tekst på skjermen. Opplåsingen sletter {device}. Installasjonsprogrammet kjører ikke selv dette verktøyet. Følg veiledningen, og kom deretter tilbake og fortsett."
"The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue.": "{device} låses opp én gang, med nettverktøyet for opplåsing fra installasjonsveiledningen til GammaOS Next (Anbernic RG405M / RG405V / RG505, trinn 2). Ta ut microSD-kortet, slå på USB-feilsøking i Utvikleralternativer, og start {device} på nytt i fastboot-modus med adb reboot bootloader: skjermen viser fastboot mode ved siden av Anbernic-logoen. Åpne verktøyet i Google Chrome, klikk på «Connect», velg enheten, og klikk deretter på «Unlock». Ikke trykk på Volum ned på {device}: trykk på Hjem / Tilbake-knappen for å bekrefte. På Linux eller macOS gjør verktøyet unisoc-unlock fra veiledningen det samme. Opplåsingen sletter {device}. Installasjonsprogrammet kjører ikke selv disse verktøyene. Følg veiledningen, og kom deretter tilbake og fortsett."
"The {profile} profile isn't published yet. Choose a profile marked available.": "Profilen {profile} er ikke publisert ennå. Velg en profil som er merket som tilgjengelig."
"This device doesn't run a matching Thimsy or GammaOS build, so it can't be updated. Use a full install instead (it erases the device).": "Denne enheten kjører ikke et samsvarende Thimsy- eller GammaOS-bygg, så den kan ikke oppdateres. Bruk full installasjon i stedet (den sletter enheten)."
"This device's partition layout doesn't match this firmware: it's a different model, or it still runs stock firmware that needs repartitioning, which this version can't do yet.": "Partisjonsoppsettet på denne enheten passer ikke til denne fastvaren: det er en annen modell, eller den kjører fortsatt original fastvare som må partisjoneres på nytt, noe denne versjonen ikke kan ennå."
"This drive is formatted as FAT32, which can't hold files over 4 GB. Choose a workspace on another drive (NTFS, exFAT, APFS or ext4).": "Denne stasjonen er formatert som FAT32, som ikke kan lagre filer over 4 GB. Velg et arbeidsområde på en annen stasjon (NTFS, exFAT, APFS eller ext4)."
"This version of the installer expects a different build. Build again, then install.": "Denne versjonen av installasjonsprogrammet forventer et annet bygg. Bygg på nytt, og installer deretter."
"Turn it on": "Slå den på"
"Turn on OEM unlocking": "Slå på OEM-opplåsing"
"Turn the {device} off and unplug it. Hold the Back button and the Anbernic button next to it and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Slå av {device} og koble fra kabelen. Hold inne Tilbake-knappen og Anbernic-knappen ved siden av den, og koble USB-kabelen til denne datamaskinen mens du fortsatt holder begge. Fortsett å holde til installasjonen starter."
"Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Slå av {device} og koble fra kabelen. Hold inne Tilbake-knappen, og koble USB-kabelen til denne datamaskinen mens du fortsatt holder den. Fortsett å holde til installasjonen starter."
"Turn the {device} off and unplug it. Hold the Back button, the button on the right side of the screen, and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Slå av {device} og koble fra kabelen. Hold inne Tilbake-knappen, knappen på høyre side av skjermen, og koble USB-kabelen til denne datamaskinen mens du fortsatt holder den. Fortsett å holde til installasjonen starter."
"Turn the {device} off completely and unplug it. Hold Volume Down and Volume Up together and, still holding both, connect the USB cable to this computer. Keep holding until installation starts.": "Slå {device} helt av og koble fra kabelen. Hold inne Volum ned og Volum opp samtidig, og koble USB-kabelen til denne datamaskinen mens du fortsatt holder begge. Fortsett å holde til installasjonen starter."
"Turn the {device} off completely. When the installer asks, connect the USB cable to this computer, and leave it connected until installation finishes.": "Slå {device} helt av. Når installasjonsprogrammet ber om det, kobler du USB-kabelen til denne datamaskinen og lar den være tilkoblet til installasjonen er ferdig."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself, which takes a few minutes. Leave it alone until it turns off or restarts by itself, then take the card out.": "Slå av {device}, sett inn kortet og slå den på. Den installerer seg selv på den interne lagringen fra kortet, noe som tar noen minutter. La den være i fred til den slår seg av eller starter på nytt av seg selv, og ta deretter ut kortet."
"Turn the {device} off, put the card in and turn it on. It installs onto its internal storage from the card by itself. Leave it alone until it finishes, then turn it off and take the card out.": "Slå av {device}, sett inn kortet og slå den på. Den installerer seg selv på den interne lagringen fra kortet. La den være i fred til den er ferdig, og slå den deretter av og ta ut kortet."
"Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts.": "Slå av {device}, koble fra kabelen og ta ut alle SD-kort. Skyv den opp, hold deretter inne Tilbake-knappen midt på styrekorset, og koble USB-kabelen til denne datamaskinen mens du fortsatt holder den. Fortsett å holde til installasjonen starter."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts by itself and installation starts.": "Slå på {device} med USB-feilsøking fortsatt på i Utvikleralternativer, og koble den til denne datamaskinen. Den starter på nytt av seg selv, og installasjonen begynner."
"Turn the {device} on, with USB debugging still on in Developer options, and connect it to this computer. It restarts into fastboot mode for the installation.": "Slå på {device} med USB-feilsøking fortsatt på i Utvikleralternativer, og koble den til denne datamaskinen. Den starter på nytt i fastboot-modus for installasjonen."
"USB access for {ids} isn't set up yet. Setting it up asks for your password once.": "USB-tilgang for {ids} er ikke konfigurert ennå. Konfigureringen ber om passordet ditt én gang."
"USB access is set up for {ids}": "USB-tilgang er konfigurert for {ids}"
"Unlock before flashing": "Lås opp før flashing"
"Unlock with GammaOS's own steps": "Lås opp med GammaOS sine egne trinn"
"Unpacking the firmware": "Pakker ut fastvaren"
"Unpacking {file}": "Pakker ut {file}"
"Unplug it and turn it on": "Koble den fra og slå den på"
"Unplug the cable when it restarts": "Koble fra kabelen når den starter på nytt"
"Unplug the cable. Hold Power and Volume Down for at least 60 seconds, then, still holding them, connect the USB cable. Keep holding until installation starts; finding the {device} can take 30 seconds or more.": "Koble fra kabelen. Hold inne av/på-knappen og Volum ned i minst 60 sekunder, og koble deretter til USB-kabelen mens du fortsatt holder dem. Fortsett å holde til installasjonen starter; det kan ta 30 sekunder eller mer før {device} blir funnet."
"Updating checksums": "Oppdaterer kontrollsummer"
"Use a Windows PC": "Bruk en Windows-PC"
"Use the firmware version the catalog lists for this device.": "Bruk fastvareversjonen som katalogen oppgir for denne enheten."
"Use the volume keys to choose Unlock, then press Power.": "Velg «Unlock» med volumknappene, og trykk deretter på av/på-knappen."
"Virtual Boy": "Virtual Boy"
"Vita3K": "Vita3K"
"Wait for the first boot": "Vent på første oppstart"
"Wait on the Anbernic logo": "Vent på Anbernic-logoen"
"Wait through a blank screen": "Vent gjennom en tom skjerm"
"WatermelonDS": "WatermelonDS"
"When installation finishes, press the Power button once if the {device} hasn't restarted by itself.": "Når installasjonen er ferdig, trykker du én gang på av/på-knappen hvis {device} ikke har startet på nytt av seg selv."
"When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then.": "Når installasjonen er ferdig, starter {device} på nytt av seg selv og klargjør lagringen. Koble fra kabelen da."
"When installation finishes, unplug the cable and press Power to turn the {device} on.": "Når installasjonen er ferdig, kobler du fra kabelen og trykker på av/på-knappen for å slå på {device}."
"When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue.": "Når skjermen viser INFO: LOCK FLAG IS: UNLOCK!!!, er den låst opp. Koble fra kabelen og sørg for at {device} er av (hvis den starter på nytt, holder du inne av/på-knappen til den slår seg av), og fortsett deretter."
"When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock.": "Når skjermen viser Unlock bootloader success!, er den låst opp. Hvis {device} allerede viser INFO: LOCK FLAG IS : UNLOCK!!! en kort stund når den starter, er den låst opp fra før, og du kan hoppe over opplåsingen."
"When the {device} asks, press Volume Up within 3 seconds to confirm the unlock.": "Når {device} spør, trykker du på Volum opp innen 3 sekunder for å bekrefte opplåsingen."
"WinUSB is installed for {ids}": "WinUSB er installert for {ids}"
"WinUSB will be installed for {ids} the first time you flash": "WinUSB blir installert for {ids} første gang du flasher"
"Windows now gives the device the driver the installer needs. Unplug the cable and turn the device off, then repeat the download-mode steps with the same USB port.": "Windows gir nå enheten driveren installasjonsprogrammet trenger. Trekk ut kabelen og slå av enheten, og gjenta deretter trinnene for nedlastingsmodus med den samme USB-porten."
"WonderSwan": "WonderSwan"
"Writing {partition}": "Skriver {partition}"
"Wrote {partition}": "Skrev {partition}"
"Xbox": "Xbox"
"Your {device} already runs GammaOS or Thimsy. Choose how to install the new firmware.": "{device} kjører allerede GammaOS eller Thimsy. Velg hvordan du vil installere den nye fastvaren."
"Your {device} already runs custom firmware (it was unlocked before). Unlocking is skipped.": "{device} kjører allerede tilpasset fastvare (den har vært låst opp før). Opplåsing hoppes over."
"Your {device} still runs its original firmware. The installer walks you through unlocking it, then does a fresh install that erases the device.": "{device} kjører fortsatt den originale fastvaren. Installasjonsprogrammet veileder deg gjennom opplåsingen og gjør deretter en ren installasjon som sletter enheten."
"hakuX": "hakuX"
"needs Android API {n}": "krever Android API {n}"
"needs Vulkan": "krever Vulkan"
"needs an ARMv8.2 CPU": "krever en ARMv8.2-prosessor"
"needs {n} GB RAM": "krever {n} GB RAM"
"{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} kan ikke installeres fra {host}. Kjør Thimsy Installer på en Windows-PC for å installere den."
"{device} is installed with Allwinner's PhoenixSuit, which only runs on Windows. Run Thimsy Installer on a Windows PC to install it.": "{device} installeres med PhoenixSuit fra Allwinner, som bare kjører på Windows. Kjør Thimsy Installer på en Windows-PC for å installere den."
"{device} is installed with MediaTek's SP Flash Tool, which doesn't run on {host}. Run Thimsy Installer on a Windows PC to install it.": "{device} installeres med SP Flash Tool fra MediaTek, som ikke kjører på {host}. Kjør Thimsy Installer på en Windows-PC for å installere den."
"{device} isn't supported by this version of the installer yet.": "{device} støttes ikke av denne versjonen av installasjonsprogrammet ennå."
"{host} needs no driver": "{host} trenger ingen driver"
