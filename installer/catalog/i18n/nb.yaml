"GammaOS's guide warns that flashing a {device} that isn't unlocked bricks it. After the unlock, the {device} restarts into its original Android. Wait until Android has started, then continue.": "GammaOS-veiledningen advarer om at {device} blir ubrukelig hvis den flashes uten å være låst opp. Etter opplåsingen starter {device} på nytt i sin opprinnelige Android. Vent til Android har startet, og fortsett deretter."
