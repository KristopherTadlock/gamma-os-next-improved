id: anbernic-rg505
name: Anbernic RG505
maker: Anbernic
soc: Unisoc T618
display: "960×544"
status: candidate
hardware: { android_api: 34, armv82: true, vulkan: true, ram_gb: 4, gpu: "Mali-G52" }
support:
  build: candidate
  boot: candidate
  install: { windows: untested, linux: untested, macos: untested, android: none }
notes:
  - "Planned: fastboot install on every computer. Not buildable yet."
guides:
  unlock:
    route: guided
    steps:
      - title: "Unlock with GammaOS's own steps"
        body: "The {device} is unlocked once, with the web unlock tool from GammaOS Next's installation guide (Anbernic RG405M / RG405V / RG505, Step 2). Take the microSD card out, turn on USB debugging in Developer options and restart the {device} into fastboot mode with adb reboot bootloader: the screen shows fastboot mode next to the Anbernic logo. Open the tool in Google Chrome, click Connect, choose the device, then click Unlock. On the {device}, don't press Volume Down: press the Home / Back button to confirm. On Linux or macOS, the guide's unisoc-unlock tool does the same. Unlocking erases the {device}. The installer doesn't run these tools itself. Follow the guide, then come back and continue."
        link: "https://github.com/TheGammaSqueeze/GammaOSNext/wiki/GammaOS-Next-Installation#anbernic-rg405m--rg405v--rg505"
      - title: "Check it's unlocked"
        body: "When the screen shows Unlock bootloader success!, it's unlocked. If the {device} already shows INFO: LOCK FLAG IS : UNLOCK!!! briefly when it starts, it was unlocked before and you can skip the unlock."
  download_mode:
    - title: "Restart into fastbootd"
      body: "Take the microSD card out and turn on USB debugging in Developer options. Connect the {device} to this computer while it's on. It restarts into fastbootd: the screen shows fastbootd in large red text."
  first_boot:
    - title: "Restart with Power"
      body: "When installation finishes, press the Power button once if the {device} hasn't restarted by itself."
    - title: "Wait on the Anbernic logo"
      body: "The first boot can take 1 to 3 minutes and may seem stuck on the Anbernic logo. This is normal."
