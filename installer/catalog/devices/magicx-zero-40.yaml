id: magicx-zero-40
name: MagicX Zero 40
maker: MagicX
soc: Allwinner A133P
display: "480×800"
status: candidate
hardware: { android_api: 34, armv82: false, vulkan: true, ram_gb: 2, gpu: "PowerVR GE8300" }
support:
  build: candidate
  boot: candidate
  install: { windows: guided, linux: none, macos: none, android: none }
host_message: "{device} can't be installed from {host}. Run Thimsy Installer on a Windows PC to install it."
notes:
  - "Planned: Windows only. Not buildable yet."
guides:
  unlock:
    route: none
    steps: []
  download_mode:
    - title: "Start from the microSD card"
      body: "Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out."
  first_boot:
    - title: "Wait for the first boot"
      body: "The first boot takes 1 to 3 minutes, and the screen may seem stuck on the boot logo. This is normal."
    - title: "Copy games without a card reader"
      body: "Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead."
