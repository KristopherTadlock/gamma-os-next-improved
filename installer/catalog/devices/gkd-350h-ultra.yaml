id: gkd-350h-ultra
name: GKD 350H Ultra
maker: GKD
soc: Rockchip RK3576S
display: "1600×1440"
status: candidate
hardware: { android_api: 34, armv82: false, vulkan: true, ram_gb: 2, gpu: "Mali-G52" }
support:
  build: candidate
  boot: candidate
  install: { windows: guided, linux: guided, macos: guided, android: none }
notes:
  - "Planned: microSD card install on every computer. Not buildable yet."
guides:
  unlock:
    route: none
    steps: []
  download_mode:
    - title: "Start from the microSD card"
      body: "Put the card in the {device} and turn it on. Thimsy runs from the card and leaves the {device}'s internal storage untouched: to go back to the original system, turn it off and take the card out."
  first_boot:
    - title: "Copy games without a card reader"
      body: "Don't put the card back in a computer to copy games: it holds an encrypted Android layout, so the computer won't show your storage. Copy games over USB file transfer (MTP), with ADB Explorer or from a network share instead."
