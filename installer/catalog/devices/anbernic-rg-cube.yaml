flash:
  method: spd
  fdl: [FDL, FDL2]
  # Update mode (already unlocked, keeps data): only what Thimsy changes.
  update: [Super, VENDORBOOT, VENDORBOOT_B, BootLogo, Fastboot_Logo]
  # What an update relies on but doesn't write: the device must already hold
  # exactly these GammaOS Next 1.2 images (both slots). Read back and
  # compared before the first write; any difference means a full install.
  update_check: [BOOT, BOOT_B, INITBOOT, INITBOOT_B, DTB, DTB_B, DTBO, DTBO_B,
                 VBMETA, VBMETA_B, VBMETA_SYSTEM, VBMETA_SYSTEM_B, VBMETA_VENDOR, VBMETA_VENDOR_B,
                 VBMETA_SYSTEM_EXT, VBMETA_SYSTEM_EXT_B, VBMETA_PRODUCT, VBMETA_PRODUCT_B,
                 VBMETA_ODM, VBMETA_ODM_B]
  # The partitions each mode writes, as plans show them (flashing refuses
  # to start if the firmware would write anything else).
  writes_full: [misc, trustos_a, trustos_b, sml_a, sml_b, uboot_a, uboot_b, logo, fbootlogo,
                nr_modem_a, nr_modem_b, nr_deltanv_a, nr_deltanv_b, nr_phy_a, nr_phy_b,
                l_agdsp_a, l_agdsp_b, pm_sys_a, pm_sys_b, ch_sys_a, ch_sys_b, teecfg_a, teecfg_b,
                hypervsior_a, hypervsior_b, boot_a, boot_b, vendor_boot_a, vendor_boot_b,
                init_boot_a, init_boot_b, dtb_a, dtb_b, dtbo_a, dtbo_b, super, cache,
                vbmeta_a, vbmeta_b, vbmeta_system_a, vbmeta_system_b, vbmeta_vendor_a, vbmeta_vendor_b,
                vbmeta_system_ext_a, vbmeta_system_ext_b, vbmeta_product_a, vbmeta_product_b,
                vbmeta_odm_a, vbmeta_odm_b, avbmeta_rs_a, avbmeta_rs_b, common_rs1_a, common_rs1_b,
                common_rs2_a, common_rs2_b, ise_a, ise_b, splloader, splloader_bak]
  writes_update: [logo, fbootlogo, vendor_boot_a, vendor_boot_b, super]
  # Fresh install: erased like the vendor tool does; Android formats them on first boot.
  erase_full: [userdata, metadata]
  # Device-unique or diagnostic data: never written, even on a fresh install.
  never_write: [UserData, Persist, calinv, isedata, BLACKBOX, sysdumpdb]
  # The boot-area loaders (SPLLoader, SPLLoader_bak) live outside the PAC's
  # partition table, so the device's table can't confirm them; everything
  # else written or erased must match it first.
  unchecked_partitions: [splloader, splloader_bak]
  wait_seconds: 300
update_requires: "Keeps your data. Only when the RG Cube already runs GammaOS Next 1.2 or a Thimsy build."
guides:
  backup:
    - title: "Copy your games and saves"
      body: "A fresh install erases the internal storage. Copy ROMs, saves, screenshots and anything else you want to keep to your computer or the microSD card. Games on the microSD card are not touched."
    - title: "Charge the RG Cube"
      body: "Charge it to at least 50% before you start, and keep the cable it came with handy."
  unlock:
    route: guided
    steps:
      - title: "Unlock with GammaOS's own steps"
        body: "The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue."
        link: "https://github.com/TheGammaSqueeze/GammaOSNext/wiki/GammaOS-Next-Installation#anbernic-rg556--rg-cube--rg406h--rg406v--rg476h--rg-slide"
      - title: "Check it's unlocked"
        body: "When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue."
  download_mode:
    - title: "Hold Back and plug in the cable"
      body: "Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts."
  first_boot:
    - title: "Unplug the cable when it restarts"
      body: "When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then."
    - title: "Wait for the first boot"
      body: "The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off."
    - title: "Check the basics"
      body: "Check the buttons, touch screen, sound and Wi-Fi, and start a game."
