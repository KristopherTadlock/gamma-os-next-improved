id: anbernic-rg-rotate
name: Anbernic RG Rotate
maker: Anbernic
soc: Unisoc T618
display: "720×720"
status: candidate
hardware: { android_api: 34, armv82: true, vulkan: true, ram_gb: 3, gpu: "Mali-G52" }
support:
  build: candidate
  boot: candidate
  install: { windows: untested, linux: untested, macos: untested, android: none }
identify:
  usb:
    - { vid: 0x1782, pid: 0x4d00, mode: download, label: "Unisoc download mode" }
notes:
  - "Planned: same flashing route as the RG Cube. Not buildable yet."
guides:
  unlock:
    route: none
    steps: []
  download_mode:
    - title: "Slide it open, hold Back and plug in"
      body: "Turn the {device} off, unplug it and take out every SD card. Slide it open, then hold the Back button in the middle of the joypad and, still holding it, connect the USB cable to this computer. Keep holding until installation starts."
    - title: "If installation stalls"
      body: "Hold the Back button, Volume Down and Power together until installation starts again."
  first_boot:
    - title: "Unplug the cable when it restarts"
      body: "When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then."
    - title: "Wait through a blank screen"
      body: "On the very first boot the screen may stay blank for up to a minute. This is normal; wait for the boot screen to appear."
    - title: "If the screen stays black"
      body: "Take out any SD card, then hold Volume Down and Power until the {device} restarts."
