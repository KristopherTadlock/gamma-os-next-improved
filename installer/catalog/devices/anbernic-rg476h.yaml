id: anbernic-rg476h
name: Anbernic RG476H
maker: Anbernic
soc: Unisoc T820
display: "1280×960"
status: candidate
hardware: { android_api: 34, armv82: true, vulkan: true, ram_gb: 8, gpu: "Mali-G57" }
support:
  build: candidate
  boot: candidate
  install: { windows: untested, linux: untested, macos: untested, android: none }
identify:
  usb:
    - { vid: 0x1782, pid: 0x4d00, mode: download, label: "Unisoc download mode" }
notes:
  - "Planned: same flashing route as the RG Cube. Not buildable yet."
guides:
  unlock:
    route: guided
    steps:
      - title: "Unlock with GammaOS's own steps"
        body: "The {device} is unlocked once, on a Windows PC: the UnlockBootloader tool from GammaOS Next's installation guide (Unisoc T820, Steps 1 and 2) only runs on Windows. Install the Unisoc USB driver from the guide's UnisocTools first. Then turn the {device} off and unplug it, start UnlockBootloader.bat and, within 30 seconds, hold the Back button and, still holding it, connect the USB cable. Let go when text appears on the screen. Unlocking erases the {device}. The installer doesn't run that tool itself. Follow the guide, then come back and continue."
        link: "https://github.com/TheGammaSqueeze/GammaOSNext/wiki/GammaOS-Next-Installation#anbernic-rg556--rg-cube--rg406h--rg406v--rg476h--rg-slide"
      - title: "Check it's unlocked"
        body: "When the screen shows INFO: LOCK FLAG IS: UNLOCK!!!, it's unlocked. Unplug the cable and make sure the {device} is off (if it restarts, hold Power until it turns off), then continue."
  download_mode:
    - title: "Hold Back and plug in the cable"
      body: "Turn the {device} off and unplug it. Hold the Back button and, still holding it, connect the USB cable to this computer. Keep holding until installation starts."
  first_boot:
    - title: "Unplug the cable when it restarts"
      body: "When installation finishes, the {device} restarts by itself and sets up its storage. Unplug the cable then."
    - title: "Wait for the first boot"
      body: "The first start takes a few minutes while Thimsy sets up your emulators. Don't turn it off."
