[package]
name = "thimsy-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
fs4 = "1.1.0"
hex = "0.4.3"
minisign-verify = "0.3.0"
nusb = "0.2.9"
qbsdiff = "1.4.4"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sevenz-rust2 = { version = "0.25.0", features = ["aes256"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "gzip"] }
zstd = { version = "0.14.4", features = ["zstdmt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"
