[workspace]
resolver = "2"
members = ["crates/thimsy-engine", "crates/thimsy-installer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/KristopherTadlock/thimsy-os"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
# Offsets come from untrusted firmware and archives: overflow is a bug to
# stop at, never to wrap.
overflow-checks = true
