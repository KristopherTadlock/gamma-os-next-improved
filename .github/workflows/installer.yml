# Builds and tests the Thimsy universal installer (installer/): the Rust
# engine, the bundled flashing tools and the Flutter app, for Windows, macOS
# and Linux, and packages one download per platform.
name: Installer

on:
  push:
    paths: ["installer/**", ".github/workflows/installer.yml", "scripts/pactool.py", "scripts/lptool.py"]
  pull_request:
    paths: ["installer/**", ".github/workflows/installer.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SPD_DUMP_REPO: https://github.com/ilyakurdyukov/spreadtrum_flash
  SPD_DUMP_COMMIT: 3d0582579f3521f35a4937b2e871312e4dd6c308
  LIBWDI_REPO: https://github.com/pbatard/libwdi
  LIBWDI_COMMIT: 30df0c0e051b0132c4b9ebed8c054bc8eb3aaaec

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: installer/engine
    env:
      # Windows: link the C runtime statically, so the engine runs on a PC
      # without the Visual C++ Redistributable.
      RUSTFLAGS: ${{ startsWith(matrix.os, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer/engine
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ runner.os }}
          path: |
            installer/engine/target/release/thimsy-installer
            installer/engine/target/release/thimsy-installer.exe

  tools-unix:
    name: spd_dump (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    steps:
      - name: Dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev; else brew install libusb; fi
      - name: Build spd_dump
        run: |
          git clone "$SPD_DUMP_REPO" spd && cd spd && git checkout "$SPD_DUMP_COMMIT"
          if [ "$RUNNER_OS" = macOS ]; then
            P=$(brew --prefix libusb)
            make CFLAGS="-O2 -std=c99 -DUSE_LIBUSB=1 -I$P/include" LIBS="-L$P/lib -lusb-1.0"
            # Ship libusb next to the tool.
            cp "$P/lib/libusb-1.0.0.dylib" .
            install_name_tool -id @loader_path/libusb-1.0.0.dylib libusb-1.0.0.dylib
            install_name_tool -change "$(otool -L spd_dump | awk '/libusb/{print $1}')" @loader_path/libusb-1.0.0.dylib spd_dump
            codesign --force -s - libusb-1.0.0.dylib spd_dump
          else
            make
          fi
          mkdir -p ../out && cp spd_dump ../out/ && cp LICENSE ../out/spd_dump-LICENSE
          [ -f libusb-1.0.0.dylib ] && cp libusb-1.0.0.dylib ../out/ || true
      - name: Check spd_dump starts
        run: |
          # spd_dump has no --help: its option parser answers "unknown option"
          # with exit 1 (or "libusb_init failed" when there's no USB). A
          # missing library fails differently (127, or dyld's abort).
          rc=0; msg=$(out/spd_dump --help 2>&1) || rc=$?
          echo "exit $rc: $msg"
          [ "$rc" -eq 1 ] && printf '%s' "$msg" | grep -qE 'unknown option|libusb_init failed' || { echo "::error::spd_dump didn't start"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: tools-${{ runner.os }}
          path: out/*

  tools-windows:
    name: spd_dump + wdi-simple (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-libusb
            base-devel
            autotools
            git
            p7zip
      - name: Build spd_dump
        run: |
          git clone "$SPD_DUMP_REPO" spd && cd spd && git checkout "$SPD_DUMP_COMMIT"
          make LIBS="-Wl,-Bstatic -lusb-1.0 -Wl,-Bdynamic"
          mkdir -p ../out && cp spd_dump.exe ../out/ && cp LICENSE ../out/spd_dump-LICENSE
      - name: Build wdi-simple (WinUSB driver installer)
        run: |
          curl -L "https://go.microsoft.com/fwlink/p/?LinkID=253170" -o wdk-redist.msi
          msiexec //a wdk-redist.msi //qn TARGETDIR="$(cygpath -w "$PWD/wdk")"
          git clone "$LIBWDI_REPO" libwdi && cd libwdi && git checkout "$LIBWDI_COMMIT"
          ./bootstrap.sh
          ./configure --build=x86_64-w64-mingw32 --host=x86_64-w64-mingw32 --enable-examples-build --disable-debug --disable-shared --disable-32bit \
            --with-wdkdir="../wdk/Windows Kits/8.0" --with-wdfver=1011
          make
          cp examples/wdi-simple.exe ../out/ && cp COPYING ../out/libwdi-COPYING
      - name: Check the tools
        run: |
          test -x out/spd_dump.exe && test -x out/wdi-simple.exe
          rc=0; msg=$(out/spd_dump.exe --help 2>&1) || rc=$?
          echo "exit $rc: $msg"
          [ "$rc" -eq 1 ] && printf '%s' "$msg" | grep -qE 'unknown option|libusb_init failed' || { echo "::error::spd_dump.exe didn't start"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: tools-Windows
          path: out/*

  app:
    name: App (${{ matrix.os }})
    needs: [engine, tools-unix, tools-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: installer/app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build
        run: |
          case "$RUNNER_OS" in
            Linux) flutter build linux --release ;;
            Windows) flutter build windows --release ;;
            macOS) flutter build macos --release ;;
          esac
      - uses: actions/download-artifact@v4
        with:
          name: engine-${{ runner.os }}
          path: installer/app/dl/engine
      - uses: actions/download-artifact@v4
        with:
          name: tools-${{ runner.os }}
          path: installer/app/dl/tools
      - name: Package
        run: |
          VER=$(grep '^version' ../engine/Cargo.toml | head -1 | cut -d'"' -f2)
          case "$RUNNER_OS" in
            Linux) APP=build/linux/x64/release/bundle; OUT=ThimsyInstaller-$VER-linux-x64.tar.gz ;;
            Windows) APP=build/windows/x64/runner/Release; OUT=ThimsyInstaller-$VER-windows-x64.zip ;;
            macOS) APP=build/macos/Build/Products/Release/thimsy_installer.app; OUT=ThimsyInstaller-$VER-macos.zip ;;
          esac
          if [ "$RUNNER_OS" = macOS ]; then ENG="$APP/Contents/MacOS/engine"; else ENG="$APP/engine"; fi
          mkdir -p "$ENG/tools"
          cp dl/engine/* "$ENG/" && cp dl/tools/* "$ENG/tools/"
          chmod +x "$ENG"/thimsy-installer* "$ENG"/tools/* || true
          cp ../../LICENSE ../../NOTICE "$ENG/" 2>/dev/null || true
          # Everything the engine runs must be there and executable.
          X=""; [ "$RUNNER_OS" = Windows ] && X=.exe
          need=("$ENG/thimsy-installer$X" "$ENG/tools/spd_dump$X")
          [ "$RUNNER_OS" = Windows ] && need+=("$ENG/tools/wdi-simple.exe")
          [ "$RUNNER_OS" = macOS ] && need+=("$ENG/tools/libusb-1.0.0.dylib")
          for f in "${need[@]}"; do
            [ -f "$f" ] && { [ -x "$f" ] || [ "${f##*.}" = dylib ]; } || { echo "::error::missing or not executable: $f"; exit 1; }
          done
          # Smoke tests (to a file: piping into head would cut the output short).
          "$ENG/thimsy-installer$X" --json catalog > "$RUNNER_TEMP/catalog.json"
          head -c 300 "$RUNNER_TEMP/catalog.json"; echo
          # spd_dump answers --help with "unknown option" and exit 1 once it
          # has started; a missing DLL or dylib fails with another code.
          rc=0; msg=$("$ENG/tools/spd_dump$X" --help 2>&1) || rc=$?
          echo "spd_dump: exit $rc: $msg"
          [ "$rc" -eq 1 ] && printf '%s' "$msg" | grep -qE 'unknown option|libusb_init failed' || { echo "::error::the bundled spd_dump didn't start"; exit 1; }
          if [ "$RUNNER_OS" = Windows ]; then
            # The Flutter runner needs the Visual C++ runtime, which a clean
            # PC may not have: ship it next to the app (unless Flutter did).
            VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            VS=$("$VSWHERE" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')
            CRT=$(find "$(cygpath -u "$VS")/VC/Redist/MSVC" -type d -path '*/x64/Microsoft.VC14*.CRT' -not -path '*onecore*' 2>/dev/null | sort -V | tail -1 || true)
            echo "Visual C++ runtime: ${CRT:-not found, using System32}"
            for dll in vcruntime140.dll vcruntime140_1.dll msvcp140.dll; do
              if [ -f "$APP/$dll" ]; then echo "$dll: already in the build"
              elif [ -n "$CRT" ] && [ -f "$CRT/$dll" ]; then cp "$CRT/$dll" "$APP/"
              else cp "/c/Windows/System32/$dll" "$APP/"; fi
            done
          fi
          mkdir -p ../../dist
          case "$RUNNER_OS" in
            Linux) tar -C "$(dirname "$APP")" -czf "../../dist/$OUT" --transform "s,^bundle,ThimsyInstaller," bundle ;;
            Windows) (cd "$APP" && 7z a -tzip "$GITHUB_WORKSPACE/dist/$OUT" . >/dev/null) ;;
            macOS) codesign --force --deep -s - "$APP"; ditto -c -k --keepParent "$APP" "../../dist/$OUT" ;;
          esac
          if [ "$RUNNER_OS" = Windows ]; then
            # What's in the zip, and that nothing needed is missing.
            python - "$GITHUB_WORKSPACE/dist/$OUT" <<'PY'
          import sys, zipfile
          names = sorted(n.replace("\\", "/") for n in zipfile.ZipFile(sys.argv[1]).namelist())
          print("\n".join(names))
          need = ["thimsy_installer.exe", "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll",
                  "engine/thimsy-installer.exe", "engine/tools/spd_dump.exe", "engine/tools/wdi-simple.exe"]
          missing = [n for n in need if n not in names]
          sys.exit(f"missing from the zip: {missing}" if missing else 0)
          PY
          fi
          ls -la ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: dist/*
