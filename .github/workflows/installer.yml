# Builds and tests the Thimsy universal installer (installer/): the Rust
# engine, the bundled flashing tools and the Flutter app, for Windows, macOS
# and Linux, and packages one download per platform.
name: Installer

on:
  push:
    paths: ["installer/**", ".github/workflows/installer.yml", "scripts/pactool.py", "scripts/lptool.py"]
  pull_request:
    paths: ["installer/**", ".github/workflows/installer.yml"]
  workflow_dispatch:

# Read-only token: nothing here pushes, comments or releases.
permissions:
  contents: read

# Every action is pinned to a full commit SHA (its tag in the comment), so
# a moved tag can't change what runs; the "Pinned actions" job checks it.
# To update one: gh api repos/OWNER/REPO/commits/TAG -q .sha

env:
  CARGO_TERM_COLOR: always
  SPD_DUMP_REPO: https://github.com/ilyakurdyukov/spreadtrum_flash
  SPD_DUMP_COMMIT: 3d0582579f3521f35a4937b2e871312e4dd6c308
  LIBWDI_REPO: https://github.com/pbatard/libwdi
  LIBWDI_COMMIT: 30df0c0e051b0132c4b9ebed8c054bc8eb3aaaec
  # Windows Driver Kit 8.0 redistributable components (WinUSB co-installers
  # for wdi-simple), as served by the fwlink below on 2026-11-12.
  WDK_REDIST_URL: https://go.microsoft.com/fwlink/p/?LinkID=253170
  WDK_REDIST_SHA256: 29314207814ce9d5d73695f7e9239539cf37c79e750b9d5ea5a5ef5487a583d6
  # libusb for the macOS spd_dump, built from source for both Mac
  # architectures (Homebrew's is only the runner's own).
  LIBUSB_URL: https://github.com/libusb/libusb/releases/download/v1.0.29/libusb-1.0.29.tar.bz2
  LIBUSB_SHA256: 5977fc950f8d1395ccea9bd48c06b3f808fd3c2c961b44b0c2e6e29fc3a70a85
  # The oldest macOS the app supports (Runner.xcodeproj); the tools match.
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  pins:
    name: Pinned actions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Every uses is pinned to a commit SHA
        run: |
          # Remote actions only as OWNER/REPO[/PATH]@<40 hex digits>; local
          # ones (./path) are part of this checkout.
          bad=$(grep -nE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows/*.yml \
            | grep -vE 'uses:[[:space:]]*(\./[^[:space:]]*|[^@[:space:]]+@[0-9a-f]{40})([[:space:]]+#.*)?$' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::actions not pinned to a full commit SHA (see above)"
            exit 1
          fi
          grep -hE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows/*.yml | sed 's/^[[:space:]-]*//' | sort -u

  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: installer/engine
    env:
      # Windows: link the C runtime statically, so the engine runs on a PC
      # without the Visual C++ Redistributable.
      RUSTFLAGS: ${{ startsWith(matrix.os, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Pinned by SHA, the action can't read the toolchain from its ref:
      # it's named here.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: installer/engine
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: apply_pack tests
        if: runner.os == 'Linux'
        run: python3 -I ../tools/test_apply_pack.py
      - name: Test
        run: cargo test --workspace --locked
      - name: Test (with test hooks)
        run: cargo test --workspace --locked --features test-hooks
      - name: Build
        # The shipped engine: release, from Cargo.lock, and without the
        # test-hooks feature (only the tests above use it).
        run: cargo build --release --locked
      - name: Universal macOS engine (Apple Silicon + Intel)
        if: runner.os == 'macOS'
        run: |
          # The app is universal, so the engine is too: build the Intel half
          # and combine the two in place of the native build.
          rustup target add x86_64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create target/release/thimsy-installer target/x86_64-apple-darwin/release/thimsy-installer -output target/thimsy-installer-universal
          mv target/thimsy-installer-universal target/release/thimsy-installer
          lipo -archs target/release/thimsy-installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-${{ runner.os }}
          path: |
            installer/engine/target/release/thimsy-installer
            installer/engine/target/release/thimsy-installer.exe

  tools-unix:
    name: spd_dump (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    steps:
      - name: Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - name: libusb, universal (macOS)
        if: runner.os == 'macOS'
        run: |
          # Built for each Mac architecture from the pinned release, then
          # combined: the app (and so the tool) runs on Apple Silicon and Intel.
          curl -fsSL -o libusb.tar.bz2 "$LIBUSB_URL"
          echo "$LIBUSB_SHA256  libusb.tar.bz2" | shasum -a 256 -c -
          for arch in arm64 x86_64; do
            host=$([ "$arch" = arm64 ] && echo aarch64-apple-darwin || echo x86_64-apple-darwin)
            mkdir "libusb-$arch" && tar -xjf libusb.tar.bz2 -C "libusb-$arch" --strip-components=1
            (cd "libusb-$arch" && ./configure --host="$host" --prefix="$PWD/../usb-$arch" --disable-static \
               --disable-dependency-tracking CC="clang -arch $arch" && make -j3 && make install)
          done
          mkdir -p usb
          lipo -create usb-arm64/lib/libusb-1.0.0.dylib usb-x86_64/lib/libusb-1.0.0.dylib -output usb/libusb-1.0.0.dylib
          # Found next to the tool, wherever the app is.
          install_name_tool -id @loader_path/libusb-1.0.0.dylib usb/libusb-1.0.0.dylib
          codesign --force -s - usb/libusb-1.0.0.dylib
          lipo -archs usb/libusb-1.0.0.dylib
      - name: Build spd_dump
        run: |
          git clone "$SPD_DUMP_REPO" spd && cd spd && git checkout "$SPD_DUMP_COMMIT"
          mkdir -p ../out
          if [ "$RUNNER_OS" = macOS ]; then
            # One universal binary, linked against the universal libusb (whose
            # install name is already @loader_path/libusb-1.0.0.dylib).
            make CC="clang -arch arm64 -arch x86_64" CFLAGS="-O2 -std=c99 -DUSE_LIBUSB=1 -I$PWD/../usb-arm64/include" \
              LIBS="$PWD/../usb/libusb-1.0.0.dylib"
            codesign --force -s - spd_dump
            cp ../usb/libusb-1.0.0.dylib ../out/
          else
            make
          fi
          cp spd_dump ../out/ && cp LICENSE ../out/spd_dump-LICENSE
      - name: Check spd_dump starts
        run: |
          # spd_dump has no --help: its option parser answers "unknown option"
          # with exit 1 (or "libusb_init failed" when there's no USB). A
          # missing library fails differently (127, or dyld's abort).
          check() {
            rc=0; msg=$("$@" --help 2>&1) || rc=$?
            echo "$*: exit $rc: $msg"
            [ "$rc" -eq 1 ] && printf '%s' "$msg" | grep -qE 'unknown option|libusb_init failed' || { echo "::error::$* didn't start"; exit 1; }
          }
          check out/spd_dump
          if [ "$RUNNER_OS" = macOS ]; then
            otool -L out/spd_dump
            otool -L out/spd_dump | grep -q '@loader_path/libusb-1.0.0.dylib' || { echo "::error::spd_dump doesn't load the bundled libusb"; exit 1; }
            for f in out/spd_dump out/libusb-1.0.0.dylib; do
              archs=" $(lipo -archs "$f") "; echo "$f:$archs"
              for a in arm64 x86_64; do
                case "$archs" in *" $a "*) ;; *) echo "::error::$f has no $a code"; exit 1 ;; esac
              done
            done
            if arch -x86_64 /usr/bin/true 2>/dev/null; then check arch -x86_64 out/spd_dump
            else echo "Rosetta not available: the Intel half isn't run here"; fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tools-${{ runner.os }}
          path: out/*

  tools-windows:
    name: spd_dump + wdi-simple (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # For installer/tools/spd_dump-windows-driver.patch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: thimsy
          sparse-checkout: installer/tools
          persist-credentials: false
      # MSYS2 has no way to pin package versions here (its repository only
      # serves current ones): the versions used are printed below instead.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-libusb
            base-devel
            autotools
            git
            p7zip
      - name: MSYS2 package versions
        run: |
          pacman -Q
          gcc --version | head -1
      - name: Build spd_dump
        run: |
          git -c core.autocrlf=false clone "$SPD_DUMP_REPO" spd && cd spd && git checkout "$SPD_DUMP_COMMIT"
          # Windows only: says when Windows bound the device to another driver
          # than WinUSB (Unisoc's own, usbser, none), so the engine can switch
          # it to WinUSB, and logs what Windows has for Unisoc USB devices.
          # (The checkout may have turned its line ends into CRLF.)
          tr -d '\r' < ../thimsy/installer/tools/spd_dump-windows-driver.patch | git apply
          make LIBS="-Wl,-Bstatic -lusb-1.0 -Wl,-Bdynamic -lsetupapi -lcfgmgr32"
          mkdir -p ../out && cp spd_dump.exe ../out/ && cp LICENSE ../out/spd_dump-LICENSE
      - name: Build wdi-simple (WinUSB driver installer)
        run: |
          curl -fL "$WDK_REDIST_URL" -o wdk-redist.msi
          sha256sum wdk-redist.msi
          echo "$WDK_REDIST_SHA256  wdk-redist.msi" | sha256sum -c - || { echo "::error::the WDK redistributable changed; check it and update WDK_REDIST_SHA256"; exit 1; }
          msiexec //a wdk-redist.msi //qn TARGETDIR="$(cygpath -w "$PWD/wdk")"
          git clone "$LIBWDI_REPO" libwdi && cd libwdi && git checkout "$LIBWDI_COMMIT"
          ./bootstrap.sh
          ./configure --build=x86_64-w64-mingw32 --host=x86_64-w64-mingw32 --enable-examples-build --disable-debug --disable-shared --disable-32bit \
            --with-wdkdir="../wdk/Windows Kits/8.0" --with-wdfver=1011
          make
          cp examples/wdi-simple.exe ../out/ && cp COPYING ../out/libwdi-COPYING
      - name: Check the tools
        run: |
          test -x out/spd_dump.exe && test -x out/wdi-simple.exe
          grep -q 'download mode uses another driver' out/spd_dump.exe || { echo "::error::spd_dump.exe was built without the Windows driver patch"; exit 1; }
          # Only DLLs that come with Windows: anything from MSYS2 (libusb,
          # libgcc_s, libwinpthread, ...) isn't on a user's PC.
          allowed='^(kernel32|user32|gdi32|advapi32|shell32|ole32|oleaut32|comctl32|comdlg32|setupapi|cfgmgr32|newdev|version|shlwapi|ws2_32|crypt32|wintrust|bcrypt|ntdll|msvcrt|ucrtbase|rpcrt4|userenv|imagehlp|dbghelp|winmm|secur32|ncrypt|iphlpapi|winhttp|wininet|psapi|hid|winusb|uxtheme|dwmapi|imm32|mpr|netapi32|api-ms-win-[a-z0-9-]+)\.dll$'
          for exe in out/spd_dump.exe out/wdi-simple.exe; do
            dlls=$(objdump -p "$exe" | awk '/DLL Name:/ {print $3}' | tr 'A-Z' 'a-z' | tr -d '\r')
            echo "$exe imports:" $dlls
            bad=$(printf '%s\n' $dlls | grep -Ev "$allowed" || true)
            [ -z "$bad" ] || { echo "::error::$exe needs DLLs a clean PC doesn't have: $bad"; exit 1; }
          done
          # And they start with only Windows' folders on the PATH (no MSYS2).
          WINPATH=/c/Windows/System32:/c/Windows
          rc=0; msg=$(PATH=$WINPATH out/spd_dump.exe --help 2>&1) || rc=$?
          echo "spd_dump: exit $rc: $msg"
          [ "$rc" -eq 1 ] && printf '%s' "$msg" | grep -qE 'unknown option|libusb_init failed' || { echo "::error::spd_dump.exe didn't start"; exit 1; }
          # wdi-simple prints its usage for --help and exits 0.
          rc=0; msg=$(PATH=$WINPATH out/wdi-simple.exe --help 2>&1) || rc=$?
          echo "wdi-simple: exit $rc: $msg"
          [ "$rc" -eq 0 ] && printf '%s' "$msg" | grep -q -- '--help' || { echo "::error::wdi-simple.exe didn't start"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tools-Windows
          path: out/*

  app:
    name: App (${{ matrix.os }})
    needs: [engine, tools-unix, tools-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: installer/app
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      # Exactly the versions in pubspec.lock; nothing later resolves again.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build
        run: |
          case "$RUNNER_OS" in
            Linux) flutter build linux --release --no-pub ;;
            Windows) flutter build windows --release --no-pub ;;
            macOS) flutter build macos --release --no-pub ;;
          esac
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: engine-${{ runner.os }}
          path: installer/app/dl/engine
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tools-${{ runner.os }}
          path: installer/app/dl/tools
      - name: Package
        run: |
          VER=$(grep '^version' ../engine/Cargo.toml | head -1 | cut -d'"' -f2)
          case "$RUNNER_OS" in
            Linux) APP=build/linux/x64/release/bundle; OUT=ThimsyInstaller-$VER-linux-x64.tar.gz ;;
            Windows) APP=build/windows/x64/runner/Release; OUT=ThimsyInstaller-$VER-windows-x64.zip ;;
            # Universal: Apple Silicon and Intel (checked below with lipo).
            macOS) APP=build/macos/Build/Products/Release/thimsy_installer.app; OUT=ThimsyInstaller-$VER-macos.zip ;;
          esac
          if [ "$RUNNER_OS" = macOS ]; then ENG="$APP/Contents/MacOS/engine"; else ENG="$APP/engine"; fi
          mkdir -p "$ENG/tools"
          cp dl/engine/* "$ENG/" && cp dl/tools/* "$ENG/tools/"
          chmod +x "$ENG"/thimsy-installer* "$ENG"/tools/* || true
          cp ../../LICENSE ../../NOTICE "$ENG/" 2>/dev/null || true
          # Everything the engine runs must be there and executable.
          X=""; [ "$RUNNER_OS" = Windows ] && X=.exe
          need=("$ENG/thimsy-installer$X" "$ENG/tools/spd_dump$X")
          [ "$RUNNER_OS" = Windows ] && need+=("$ENG/tools/wdi-simple.exe")
          [ "$RUNNER_OS" = macOS ] && need+=("$ENG/tools/libusb-1.0.0.dylib")
          for f in "${need[@]}"; do
            [ -f "$f" ] && { [ -x "$f" ] || [ "${f##*.}" = dylib ]; } || { echo "::error::missing or not executable: $f"; exit 1; }
          done
          if [ "$RUNNER_OS" = macOS ]; then
            # Everything that runs is universal, like the app itself.
            BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
            for f in "$BIN" "$ENG/thimsy-installer" "$ENG/tools/spd_dump" "$ENG/tools/libusb-1.0.0.dylib"; do
              archs=" $(lipo -archs "$f") "; echo "$f:$archs"
              for a in arm64 x86_64; do
                case "$archs" in *" $a "*) ;; *) echo "::error::$f isn't universal: no $a code"; exit 1 ;; esac
              done
            done
          fi
          # On Windows, run the bundled programs with only Windows' folders on
          # the PATH, as on a user's PC: a DLL that's only on the runner fails.
          RUNPATH=$PATH; [ "$RUNNER_OS" = Windows ] && RUNPATH=/c/Windows/System32:/c/Windows
          # Smoke tests (to a file: piping into head would cut the output short).
          PATH=$RUNPATH "$ENG/thimsy-installer$X" --json catalog > "$RUNNER_TEMP/catalog.json"
          head -c 300 "$RUNNER_TEMP/catalog.json"; echo
          if [ "$RUNNER_OS" = macOS ]; then
            # The Intel half too, where Rosetta can run it.
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              arch -x86_64 "$ENG/thimsy-installer" --json catalog > /dev/null
              rc=0; msg=$(arch -x86_64 "$ENG/tools/spd_dump" --help 2>&1) || rc=$?
              echo "spd_dump (x86_64): exit $rc: $msg"
              [ "$rc" -eq 1 ] && printf '%s' "$msg" | grep -qE 'unknown option|libusb_init failed' || { echo "::error::the bundled spd_dump (x86_64) didn't start"; exit 1; }
            else
              echo "Rosetta isn't available here: the Intel half isn't run"
            fi
          fi
          # spd_dump answers --help with "unknown option" and exit 1 once it
          # has started; a missing DLL or dylib fails with another code.
          rc=0; msg=$(PATH=$RUNPATH "$ENG/tools/spd_dump$X" --help 2>&1) || rc=$?
          echo "spd_dump: exit $rc: $msg"
          [ "$rc" -eq 1 ] && printf '%s' "$msg" | grep -qE 'unknown option|libusb_init failed' || { echo "::error::the bundled spd_dump didn't start"; exit 1; }
          if [ "$RUNNER_OS" = Windows ]; then
            rc=0; msg=$(PATH=$RUNPATH "$ENG/tools/wdi-simple.exe" --help 2>&1) || rc=$?
            echo "wdi-simple: exit $rc: $msg"
            [ "$rc" -eq 0 ] && printf '%s' "$msg" | grep -q -- '--help' || { echo "::error::the bundled wdi-simple didn't start"; exit 1; }
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            # The Flutter runner needs the Visual C++ runtime, which a clean
            # PC may not have: ship it next to the app (unless Flutter did).
            VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            VS=$("$VSWHERE" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')
            CRT=$(find "$(cygpath -u "$VS")/VC/Redist/MSVC" -type d -path '*/x64/Microsoft.VC14*.CRT' -not -path '*onecore*' 2>/dev/null | sort -V | tail -1 || true)
            echo "Visual C++ runtime: ${CRT:-not found, using System32}"
            for dll in vcruntime140.dll vcruntime140_1.dll msvcp140.dll; do
              if [ -f "$APP/$dll" ]; then echo "$dll: already in the build"
              elif [ -n "$CRT" ] && [ -f "$CRT/$dll" ]; then cp "$CRT/$dll" "$APP/"
              else cp "/c/Windows/System32/$dll" "$APP/"; fi
            done
          fi
          mkdir -p ../../dist
          case "$RUNNER_OS" in
            Linux) tar -C "$(dirname "$APP")" -czf "../../dist/$OUT" --transform "s,^bundle,ThimsyInstaller," bundle ;;
            Windows) (cd "$APP" && 7z a -tzip "$GITHUB_WORKSPACE/dist/$OUT" . >/dev/null) ;;
            macOS) codesign --force --deep -s - "$APP"; ditto -c -k --keepParent "$APP" "../../dist/$OUT" ;;
          esac
          if [ "$RUNNER_OS" = Windows ]; then
            # What's in the zip, and that nothing needed is missing.
            python - "$GITHUB_WORKSPACE/dist/$OUT" <<'PY'
          import sys, zipfile
          names = sorted(n.replace("\\", "/") for n in zipfile.ZipFile(sys.argv[1]).namelist())
          print("\n".join(names))
          need = ["thimsy_installer.exe", "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll",
                  "engine/thimsy-installer.exe", "engine/tools/spd_dump.exe", "engine/tools/wdi-simple.exe"]
          missing = [n for n in need if n not in names]
          sys.exit(f"missing from the zip: {missing}" if missing else 0)
          PY
          fi
          ls -la ../../dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-${{ runner.os }}
          path: dist/*
